<title>KEPT</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Onest:wght@300;400;500;600&display=swap">
<style>
/* ============================================================
   KEPT — design tokens
   ============================================================ */
:root{
  --paper:#F1F0EA; --surface:#FBFAF7; --surface2:#E7E6DE; --sunken:#E2E1D8;
  --ink:#191C1A; --ink2:#4C534D; --ink3:#7E857E;
  --line:rgba(25,28,26,.11); --line2:rgba(25,28,26,.06);
  --accent:#5E8B6C; --accent-ink:#FBFAF7; --accent-soft:rgba(94,139,108,.13);
  --brass:#B0812F; --brass-soft:rgba(176,129,47,.13);
  --dusk:#5E77A2; --dusk-soft:rgba(94,119,162,.13);
  --clay:#B0644C; --clay-soft:rgba(176,100,76,.12);
  --shadow:0 1px 2px rgba(25,28,26,.05), 0 8px 24px -12px rgba(25,28,26,.16);
  --shadow-lift:0 2px 6px rgba(25,28,26,.06), 0 24px 48px -20px rgba(25,28,26,.28);
  --backdrop:#DCDBD2; --backdrop2:#CFCEC4;
  --r-lg:28px; --r-md:20px; --r-sm:13px;
  --f-display:"Familjen Grotesk","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101311; --surface:#171B18; --surface2:#1E2420; --sunken:#0B0E0C;
    --ink:#ECEFE9; --ink2:#A5ADA5; --ink3:#6F776F;
    --line:rgba(236,239,233,.11); --line2:rgba(236,239,233,.055);
    --accent:#8FBF9C; --accent-ink:#0D110E; --accent-soft:rgba(143,191,156,.14);
    --brass:#DDA85C; --brass-soft:rgba(221,168,92,.14);
    --dusk:#93A9D1; --dusk-soft:rgba(147,169,209,.14);
    --clay:#D68A72; --clay-soft:rgba(214,138,114,.13);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
    --shadow-lift:0 2px 8px rgba(0,0,0,.45), 0 30px 60px -24px rgba(0,0,0,.85);
    --backdrop:#080A09; --backdrop2:#050706;
  }
}
:root[data-theme="dark"]{
  --paper:#101311; --surface:#171B18; --surface2:#1E2420; --sunken:#0B0E0C;
  --ink:#ECEFE9; --ink2:#A5ADA5; --ink3:#6F776F;
  --line:rgba(236,239,233,.11); --line2:rgba(236,239,233,.055);
  --accent:#8FBF9C; --accent-ink:#0D110E; --accent-soft:rgba(143,191,156,.14);
  --brass:#DDA85C; --brass-soft:rgba(221,168,92,.14);
  --dusk:#93A9D1; --dusk-soft:rgba(147,169,209,.14);
  --clay:#D68A72; --clay-soft:rgba(214,138,114,.13);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  --shadow-lift:0 2px 8px rgba(0,0,0,.45), 0 30px 60px -24px rgba(0,0,0,.85);
  --backdrop:#080A09; --backdrop2:#050706;
}

*{box-sizing:border-box}
body{
  background:var(--backdrop); color:var(--ink);
  font-family:var(--f-body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
html{overflow-x:clip}
svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
svg:not([width]){width:20px;height:20px;flex:none}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.mono{font-family:var(--f-mono)}
.tnum{font-variant-numeric:tabular-nums}

/* ============================================================
   Studio chrome (outside the device)
   ============================================================ */
.studio{min-height:100vh;background:
   radial-gradient(120% 90% at 50% -10%, color-mix(in srgb,var(--backdrop) 82%, var(--accent)) 0%, var(--backdrop) 45%, var(--backdrop2) 100%);
   display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:16px;
  padding:14px 20px;border-bottom:1px solid var(--line2);
  background:color-mix(in srgb,var(--backdrop) 86%, transparent);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .wm{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.30em;text-transform:uppercase}
.brand .sub{font-family:var(--f-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);border-left:1px solid var(--line);padding-left:10px}
@media (max-width:700px){.brand .sub{display:none}}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{font-size:12.5px;font-weight:500;padding:6px 14px;border-radius:999px;color:var(--ink2);transition:.22s var(--ease)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.iconbtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);
  display:grid;place-items:center;color:var(--ink2);transition:.2s var(--ease)}
.iconbtn:hover{color:var(--ink);border-color:var(--ink3)}
.iconbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.stage{flex:1;display:grid;place-items:center;padding:34px 20px 46px}
.stagehint{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);text-align:center;margin-top:20px}
.stagehint b{color:var(--ink2);font-weight:500}

/* device */
.device{position:relative;width:390px;height:844px;border-radius:52px;padding:11px;
  background:linear-gradient(160deg,#3a3e3b,#17191a 40%,#26292a);
  box-shadow:var(--shadow-lift), 0 0 0 1px rgba(255,255,255,.06) inset;flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--paper);
  isolation:isolate;display:flex;flex-direction:column}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:112px;height:29px;border-radius:999px;background:#0b0d0c;z-index:50}
.statusbar{position:relative;z-index:40;flex:none;height:50px;display:flex;align-items:center;justify-content:space-between;
  padding:14px 26px 0;font-family:var(--f-mono);font-size:11.5px;font-weight:500;color:var(--ink);letter-spacing:.02em}
.statusbar .sbr{display:flex;align-items:center;gap:5px}
.statusbar svg{width:15px;height:11px;stroke:currentColor;fill:none;stroke-width:1.4}
@media (max-width:470px){
  .stage{padding:0}
  .device{width:100%;height:calc(100vh - 66px);border-radius:0;padding:0;box-shadow:none;background:var(--paper)}
  .screen{border-radius:0}
  .notch{display:none}
  .stagehint{display:none}
}

/* ============================================================
   App frame
   ============================================================ */
.viewport{position:relative;flex:1;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  padding:6px 22px 108px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.flush{padding:0}
.enter{animation:viewIn .42s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.enter-up{animation:upIn .5s var(--ease) both}
@keyframes upIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.stagger>*{animation:upIn .5s var(--ease) both}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.06s}
.stagger>*:nth-child(3){animation-delay:.10s}.stagger>*:nth-child(4){animation-delay:.14s}
.stagger>*:nth-child(5){animation-delay:.18s}.stagger>*:nth-child(6){animation-delay:.22s}
.stagger>*:nth-child(7){animation-delay:.26s}.stagger>*:nth-child(8){animation-delay:.30s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
<style>
/* ============================================================
   Component library
   ============================================================ */
.eyebrow{font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3)}
.h-xl{font-size:31px;line-height:1.1;letter-spacing:-.035em}
.h-lg{font-size:24px;line-height:1.15;letter-spacing:-.03em}
.h-md{font-size:18px;line-height:1.25;letter-spacing:-.02em}
.body{font-size:14.5px;color:var(--ink2);line-height:1.55}
.small{font-size:12.5px;color:var(--ink3)}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g16{gap:16px}.g20{gap:20px}.g24{gap:24px}
.grow{flex:1;min-width:0}

/* header */
.head{padding:12px 0 18px}
.head .back{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink2);margin-bottom:14px;font-weight:500}
.head .back svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--surface2);border-color:transparent}
.card.quiet{background:transparent;border-style:dashed;box-shadow:none}
.card.tap{transition:transform .18s var(--ease),border-color .18s}
.card.tap:active{transform:scale(.985)}

/* button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:52px;padding:0 22px;
  border-radius:16px;font-weight:600;font-size:15.5px;letter-spacing:-.01em;
  background:var(--accent);color:var(--accent-ink);transition:transform .16s var(--ease),filter .2s,opacity .2s;width:100%}
.btn:active{transform:scale(.972)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.lg{min-height:60px;font-size:16.5px;border-radius:19px}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.slim{min-height:42px;font-size:14px;border-radius:13px;width:auto;padding:0 16px}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-size:13.5px;font-weight:500;color:var(--ink2);transition:.2s var(--ease)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip:active{transform:scale(.95)}
.chips.equal{flex-wrap:nowrap;gap:7px}
.chips.equal .chip{flex:1;padding:9px 0;text-align:center;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:500;
  background:var(--surface2);color:var(--ink2);border:1px solid var(--line2);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.brass{background:var(--brass-soft);color:var(--brass);border-color:transparent}
.pill.dusk{background:var(--dusk-soft);color:var(--dusk);border-color:transparent}
.pill.clay{background:var(--clay-soft);color:var(--clay);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* progress */
.track{height:7px;border-radius:999px;background:var(--sunken);overflow:hidden}
.fill{height:100%;border-radius:999px;background:var(--accent);transition:width .9s var(--ease)}
.fill.brass{background:var(--brass)} .fill.dusk{background:var(--dusk)}
.bignum{font-family:var(--f-display);font-weight:600;letter-spacing:-.045em;font-variant-numeric:tabular-nums;line-height:.92}

/* list rows */
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow)}
.lrow{display:flex;align-items:center;gap:13px;padding:15px 17px;border-bottom:1px solid var(--line2);text-align:left;width:100%}
.lrow:last-child{border-bottom:0}
.lrow:active{background:var(--surface2)}
.lrow .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--surface2)}
.lrow .ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.chev{width:16px;height:16px;stroke:var(--ink3);stroke-width:1.9;flex:none}

/* toggle */
.tog{width:46px;height:28px;border-radius:999px;background:var(--sunken);position:relative;flex:none;transition:.25s var(--ease);border:1px solid var(--line2)}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--surface);
  box-shadow:0 1px 3px rgba(0,0,0,.28);transition:.3s var(--spring)}
.tog[aria-checked="true"]{background:var(--accent);border-color:transparent}
.tog[aria-checked="true"]::after{transform:translateX(18px);background:#fff}

/* input */
.field{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px 15px;font-size:15px;outline:none;transition:.2s}
.field:focus{border-color:var(--accent);background:var(--surface)}
.field::placeholder{color:var(--ink3)}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:45;height:88px;padding:0 14px 22px;
  display:flex;align-items:flex-start;gap:2px;
  background:linear-gradient(to top,var(--paper) 58%, color-mix(in srgb,var(--paper) 0%, transparent));
  backdrop-filter:blur(12px);border-top:1px solid var(--line2)}
.tabbar::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:var(--line2)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:11px;color:var(--ink3);transition:color .2s}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--spring)}
.tab span{font-size:9.5px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.tab[aria-current="true"]{color:var(--ink)}
.tab[aria-current="true"] svg{transform:translateY(-1px) scale(1.06)}
.tab.center{flex:none;width:66px}
.tab.center .orbtn{width:54px;height:54px;border-radius:19px;background:var(--ink);color:var(--paper);display:grid;place-items:center;
  margin-top:-8px;box-shadow:0 8px 20px -8px rgba(0,0,0,.5);transition:transform .3s var(--spring)}
.tab.center:active .orbtn{transform:scale(.92)}
.tab.center .orbtn svg{width:24px;height:24px;stroke-width:1.9}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:999px;background:var(--ink);opacity:.24;z-index:60;pointer-events:none}

/* sheets & modals */
.scrim{position:absolute;inset:0;z-index:70;background:rgba(6,8,7,.5);backdrop-filter:blur(3px);animation:fade .28s var(--ease) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:71;background:var(--surface);
  border-radius:30px 30px 42px 42px;padding:12px 22px 30px;box-shadow:0 -20px 60px -20px rgba(0,0,0,.5);
  animation:sheetIn .46s var(--ease) both;max-height:88%;overflow-y:auto;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
@keyframes sheetIn{from{transform:translateY(102%)}to{transform:none}}
.grab{width:38px;height:4px;border-radius:999px;background:var(--line);margin:0 auto 16px}
.modal{position:absolute;z-index:71;left:22px;right:22px;top:50%;transform:translateY(-50%);
  background:var(--surface);border-radius:26px;padding:26px 22px;box-shadow:var(--shadow-lift);animation:popIn .4s var(--spring) both}
@keyframes popIn{from{opacity:0;transform:translateY(-50%) scale(.9)}to{opacity:1;transform:translateY(-50%) scale(1)}}

/* toast */
.toast{position:absolute;z-index:90;left:22px;right:22px;bottom:104px;background:var(--ink);color:var(--paper);
  border-radius:16px;padding:13px 16px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:10px;
  box-shadow:var(--shadow-lift);animation:toastIn .45s var(--spring) both}
.toast svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes toastIn{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:none}}
.toast.out{animation:toastOut .3s var(--ease) both}
@keyframes toastOut{to{opacity:0;transform:translateY(12px) scale(.97)}}

/* avatar */
.av{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 55%, var(--dusk)));
  color:var(--accent-ink);font-family:var(--f-display);font-weight:600;font-size:15px}

/* empty state */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 18px}
.empty .glyph{width:72px;height:72px;border-radius:24px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--ink3);margin-bottom:6px}
.empty .glyph svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
</style>
<style>
/* ============================================================
   Focus Mode — a different environment, not a screen
   ============================================================ */
.env{position:absolute;inset:0;z-index:55;display:flex;flex-direction:column;
  background:#080B0A;color:#E9EDE8;animation:envIn .7s var(--ease) both;overflow:hidden}
@keyframes envIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
.env.leaving{animation:envOut .45s var(--ease) both}
@keyframes envOut{to{opacity:0;transform:scale(1.04)}}
.env .aura{position:absolute;left:50%;top:38%;width:520px;height:520px;transform:translate(-50%,-50%);
  border-radius:50%;pointer-events:none;filter:blur(46px);opacity:var(--auraO,.28);
  background:radial-gradient(circle, var(--auraC,#4E8F6B) 0%, transparent 66%);
  transition:opacity 1.6s linear, background 3s linear;animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.11)}}
.env .grain{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(110% 80% at 50% 108%, rgba(120,160,135,.14), transparent 62%)}
.env .envtop{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:16px 24px 0}
.env .envbody{position:relative;z-index:3;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 24px}
.env .envfoot{position:relative;z-index:3;padding:0 24px 40px;display:flex;flex-direction:column;gap:12px}
.timernum{font-family:var(--f-display);font-weight:500;font-size:88px;letter-spacing:-.055em;line-height:1;
  font-variant-numeric:tabular-nums;color:#F2F5F0}
.env .phase{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;color:rgba(233,237,232,.5);transition:.6s}
.ring{position:relative;width:274px;height:274px;margin:2px 0 4px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:rgba(233,237,232,.10);stroke-width:2}
.ring .pg{fill:none;stroke:var(--auraC,#7FBF97);stroke-width:2.5;stroke-linecap:round;
  transition:stroke-dashoffset 1s linear, stroke 3s linear;filter:drop-shadow(0 0 7px var(--auraC,#7FBF97))}
.ring .tick{stroke:rgba(233,237,232,.16);stroke-width:1}
.motes{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.mote{position:absolute;width:2.5px;height:2.5px;border-radius:50%;background:rgba(200,225,205,.55);
  animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:0}12%{opacity:.75}to{transform:translateY(-620px);opacity:0}}
.envbtn{min-height:52px;border-radius:16px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:9px;

<script>
/* ============================================================

   ============================================================ */
const MODES = [
  {id:"deep",   n:"Deep Focus",   d:"25–180 min, one unbroken block", def:45, icon:I.aperture},
  {id:"pomo",   n:"Pomodoro",     d:"25 on, 5 off, repeat",           def:25, icon:I.clockI},
  {id:"sprint", n:"Short Sprint", d:"10–15 min. For starting when starting is hard", def:15, icon:I.spark},
  {id:"exam",   n:"Exam Mode",    d:"Full paper length. No pause.",   def:90, icon:I.book},
  {id:"custom", n:"Custom",       d:"You choose",                     def:60, icon:I.gear},
  {id:"open",   n:"Open Focus",   d:"No timer. We just count how long you stay.", def:0, icon:I.wave}
];
const PHASES=[[0,"Beginning","#3E6E55",.22],[.25,"Settling in","#4E8F6B",.30],[.5,"Deep focus","#6FB489",.40],[.75,"Momentum","#8FD3A6",.52]];

function startSession(min, subId, topicIdx, mode){
  S.sess = {mode:mode||"deep", min, total:min*60, left:min*60, up:0, open:min===0,
    sub:subId||"math", topic:(topicIdx==null?0:topicIdx), paused:false, leaves:0, checked:[]};
  buzz(18); go("focus");
  clearInterval(S.sess.t);
  S._t = setInterval(tickSession, 1000);
}
function tickSession(){
  const s=S.sess; if(!s||s.paused) return;
  if(s.open){ s.up += S.speed; }
  else { s.left -= S.speed; if(s.left<=0){ s.left=0; return finishSession(true); } }
  if(S.screen==="focus") syncTimer();
}
function endSession(){ clearInterval(S._t); S._t=null; }
function finishSession(complete){
  endSession();
  const s=S.sess; const done = s.open ? Math.round(s.up/60) : Math.round((s.total-s.left)/60);
  S.lastSession = {min:done, planned:s.min, sub:s.sub, topic:s.topic, complete, leaves:s.leaves};
  if(complete && done>0){
    S.todayMin += done; S.lifetimeMin += done; S.sessionsDone++; S.weekMin += done;
    S.week[S.today].f += done;
    const sb=subj(s.sub); sb.minutes += done;
    if(sb.topics[s.topic]) sb.topics[s.topic].m = Math.min(sb.topics[s.topic].t, sb.topics[s.topic].m+done);
    S.recent.unshift({sub:s.sub, topic:sb.topics[s.topic]?sb.topics[s.topic].n:"General", m:done, ok:s.leaves===0, when:"Just now"});
    S.badges[4].p=Math.min(1,S.lifetimeMin/3000); S.badges[6].p=Math.min(1,S.sessionsDone/100);
    S.badges[4].sub=`${fmt(S.lifetimeMin)} / 50h`; S.badges[6].sub=`${S.sessionsDone} / 100`;
    buzz([14,60,26]);
  }
  S.sess=null; go("complete");
}
function phaseOf(p){ let cur=PHASES[0]; for(const ph of PHASES) if(p>=ph[0]) cur=ph; return cur; }

function syncTimer(){
  const s=S.sess; if(!s) return;
  const t=el("tnum"); if(!t) return;
  const secs = s.open ? s.up : s.left;
  t.textContent = clock(secs);
  const p = s.open ? Math.min(1, s.up/5400) : (s.total-s.left)/s.total;
  const ph = phaseOf(p);
  const pg=el("ringpg");
  if(pg){ const C=823.1; pg.style.strokeDashoffset = C*(1-p); pg.style.stroke=ph[2]; }
  const ap=el("aura"); if(ap){ ap.style.setProperty("--auraC",ph[2]); ap.style.setProperty("--auraO",ph[3]); }
  const phn=el("phase"); if(phn) phn.textContent = s.open ? "Open focus · no timer" : ph[1];
  const el2=el("sesspct"); if(el2) el2.textContent = `${Math.round(p*100)}%`;
}

function confetti(){
  const c=el("conf"); if(!c) return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const dpr=Math.min(2,devicePixelRatio||1); const w=c.clientWidth,h=c.clientHeight;
  c.width=w*dpr; c.height=h*dpr; const x=c.getContext("2d"); x.scale(dpr,dpr);
  const cols=["#9BD3AE","#7FBF97","#DDA85C","#E9EDE8"];
  const ps=Array.from({length:46},()=>({x:w/2,y:h*0.34,a:Math.random()*Math.PI*2,
    v:1.6+Math.random()*4.4,r:1+Math.random()*2.2,c:cols[(Math.random()*4)|0],l:1}));
  let f=0;
  (function loop(){ f++; x.clearRect(0,0,w,h);
    ps.forEach(p=>{ p.x+=Math.cos(p.a)*p.v; p.y+=Math.sin(p.a)*p.v+f*0.028; p.v*=0.965; p.l-=0.012;
      if(p.l>0){ x.globalAlpha=Math.max(0,p.l); x.fillStyle=p.c; x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill(); }});
    if(f<130 && el("conf")===c) requestAnimationFrame(loop); else x.clearRect(0,0,w,h);
  })();
}

function detoxCanvas(){
  const c=el("dcanvas"); if(!c) return;
  const dpr=Math.min(2,devicePixelRatio||1), w=c.clientWidth, h=c.clientHeight;
  c.width=w*dpr; c.height=h*dpr; const x=c.getContext("2d"); x.scale(dpr,dpr);
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let t=0;
  (function loop(){
    if(el("dcanvas")!==c) return;
    t+=still?0:0.0045;
    const g=x.createLinearGradient(0,0,0,h);
    g.addColorStop(0,"#070A0D"); g.addColorStop(1,"#0C1219"); x.fillStyle=g; x.fillRect(0,0,w,h);
    for(let i=0;i<3;i++){
      const cx=w*(0.5+0.30*Math.sin(t*(0.6+i*0.27)+i*2.1));
      const cy=h*(0.46+0.20*Math.cos(t*(0.5+i*0.19)+i));
      const r=h*(0.30+0.10*Math.sin(t*0.8+i));
      const rg=x.createRadialGradient(cx,cy,0,cx,cy,r);
      rg.addColorStop(0,["rgba(94,119,162,.30)","rgba(120,150,190,.20)","rgba(70,110,120,.20)"][i]);
      rg.addColorStop(1,"rgba(0,0,0,0)");
      x.fillStyle=rg; x.beginPath(); x.arc(cx,cy,r,0,7); x.fill();
    }
    if(!still) requestAnimationFrame(loop);
  })();
}
</script>

<script>
/* ============================================================
   9. THE KEEP — attention builds something
   ============================================================ */
function keepLevel(){ return Math.max(1, Math.floor(S.lifetimeMin/300)); }
function drawKeep(id, tall){
  const c=el(id); if(!c) return;
  const dpr=Math.min(2,devicePixelRatio||1), w=c.clientWidth, h=c.clientHeight;
  c.width=w*dpr; c.height=h*dpr; const x=c.getContext("2d"); x.scale(dpr,dpr);
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const tiers=Math.min(11,keepLevel()), lit=S.sessionsDone, trees=Math.min(14,Math.floor(S.sessionsDone/6));
  const stars=Array.from({length:70},()=>({x:rnd()*w,y:rnd()*h*0.62,r:rnd()*1.1+0.25,p:rnd()*6}));
  const tw=Array.from({length:trees},()=>({x:rnd()*w,s:0.6+rnd()*0.7,side:rnd()>.5?1:-1}));
  const gy=h*0.84, tx=w*0.5, tW=tall?54:40, th=tall?23:19;
  let t=0;
  (function loop(){
    if(el(id)!==c) return;
    t+=still?0:0.012;
    const g=x.createLinearGradient(0,0,0,h);
    g.addColorStop(0,"#070C10"); g.addColorStop(.55,"#0D1620"); g.addColorStop(1,"#101A16");
    x.fillStyle=g; x.fillRect(0,0,w,h);
    stars.forEach(s=>{ x.globalAlpha=0.28+0.42*Math.abs(Math.sin(t*0.6+s.p));
      x.fillStyle="#DCE7DE"; x.beginPath(); x.arc(s.x,s.y,s.r,0,7); x.fill(); });
    x.globalAlpha=1;
    /* moon */
    x.fillStyle="rgba(226,235,224,.16)"; x.beginPath(); x.arc(w*0.82,h*0.16,tall?20:15,0,7); x.fill();
    x.fillStyle="rgba(232,240,230,.62)"; x.beginPath(); x.arc(w*0.82,h*0.16,tall?13:10,0,7); x.fill();
    /* hills */
    x.fillStyle="#0A1219"; x.beginPath(); x.moveTo(0,h);
    for(let i=0;i<=w;i+=8) x.lineTo(i, gy-16-Math.sin(i/95)*15-Math.sin(i/33)*5);
    x.lineTo(w,h); x.fill();
    /* headland */
    x.fillStyle="#0C1712"; x.beginPath(); x.moveTo(0,h);
    for(let i=0;i<=w;i+=8) x.lineTo(i, gy+Math.sin(i/60+1.4)*6);
    x.lineTo(w,h); x.fill();
    /* glow */
    const gl=x.createRadialGradient(tx,gy-tiers*th-18,0,tx,gy-tiers*th-18, (tall?120:92)*(0.7+S.streak/40));
    gl.addColorStop(0,`rgba(226,176,96,${0.24+0.05*Math.sin(t*1.4)})`); gl.addColorStop(1,"rgba(226,176,96,0)");
    x.fillStyle=gl; x.beginPath(); x.arc(tx,gy-tiers*th-18,(tall?120:92)*(0.7+S.streak/40),0,7); x.fill();
    /* tower tiers */
    let remaining=lit;
    for(let i=0;i<tiers;i++){
      const wdt=tW-i*(tW*0.032), y=gy-(i+1)*th, xx=tx-wdt/2;
      x.fillStyle= i%2 ? "#1B2A24" : "#182520";
      x.beginPath(); x.roundRect(xx,y,wdt,th+1,2); x.fill();
      x.strokeStyle="rgba(200,220,205,.09)"; x.lineWidth=1; x.stroke();
      const slots=3;
      for(let k=0;k<slots;k++){
        const on=remaining>0; remaining-=2;
        const wx=xx+wdt*(0.22+k*0.28), wy=y+th*0.34;
        x.fillStyle= on ? `rgba(232,186,110,${0.55+0.30*Math.abs(Math.sin(t*0.9+i+k))})` : "rgba(210,225,215,.07)";
        x.beginPath(); x.roundRect(wx-2,wy-3.2,4,6.4,1.4); x.fill();
      }
    }
    /* lantern room */
    const ly=gy-tiers*th-14;
    x.fillStyle="#22322A"; x.beginPath(); x.roundRect(tx-tW*0.36,ly,tW*0.72,15,3); x.fill();
    x.fillStyle=`rgba(240,203,128,${0.72+0.2*Math.sin(t*1.6)})`; x.beginPath(); x.roundRect(tx-tW*0.24,ly+3.5,tW*0.48,8,2); x.fill();
    x.fillStyle="#1B2A24"; x.beginPath(); x.moveTo(tx-tW*0.42,ly); x.lineTo(tx,ly-13); x.lineTo(tx+tW*0.42,ly); x.closePath(); x.fill();
    /* beam */
    if(S.streak>0){ const a=(t*0.32)%(Math.PI*2);
      x.save(); x.globalAlpha=0.10+0.05*Math.sin(t*2); x.translate(tx,ly+7);
      const grd=x.createLinearGradient(0,0,Math.cos(a)*w,Math.sin(a)*0.25*h);
      grd.addColorStop(0,"rgba(240,205,135,.9)"); grd.addColorStop(1,"rgba(240,205,135,0)");
      x.fillStyle=grd; x.beginPath(); x.moveTo(0,0);
      x.lineTo(Math.cos(a-0.10)*w, Math.sin(a-0.10)*0.3*h); x.lineTo(Math.cos(a+0.10)*w, Math.sin(a+0.10)*0.3*h);
      x.closePath(); x.fill(); x.restore(); }
    /* trees */
    tw.forEach(tr=>{ const bx=tr.x, by=gy+Math.sin(bx/60+1.4)*6+4, s=tr.s*(tall?1:0.8);
      x.fillStyle="#0F1D17"; x.beginPath(); x.moveTo(bx,by-26*s); x.lineTo(bx-7*s,by); x.lineTo(bx+7*s,by); x.closePath(); x.fill(); });
    /* streak stones */
    for(let i=0;i<Math.min(S.streak,16);i++){
      const sx=6+i*(w-12)/16, sy=h-8-Math.sin(i/2)*2;
      x.fillStyle="rgba(226,176,96,.5)"; x.beginPath(); x.arc(sx,sy,1.8,0,7); x.fill(); }
    if(!still) requestAnimationFrame(loop);
  })();
}

  task:(a,b)=>{ const s=subj(a); s.tasks[+b].done=!s.tasks[+b].done; buzz(8); render();

  marktopic:(a,b)=>{ const s=subj(a); s.topics[+b].done=!s.topics[+b].done; buzz(12); render();
    toast(s.topics[+b].done?"Topic finished.":"Reopened.",I.check); },
  delsub:a=>{ S.subjects=S.subjects.filter(s=>s.id!==a); S.exams=S.exams.filter(e=>e.sub!==a);
    toast("Subject removed.",I.trash); go(S.subjects.length?"plan":"empty"); },
  addsub:()=>{ S.newSub={name:"",tone:"accent"}; open({type:"addsub"}); },
  settone:a=>{ S.newSub.tone=a; render(); },
  savesub:()=>{ const n=S.newSub.name.trim(); if(!n) return;

      topics:[{n:"First topic", m:0, t:180, done:false}], tasks:[{n:"Plan what to cover", done:false}]});

  addexam:()=>{ S.newExam={title:"",sub:S.subjects[0]?.id||"math",days:30}; open({type:"addexam"}); },
  setexsub:a=>{ S.newExam.sub=a; render(); },

    toast(e.title.trim()+" — "+e.days+" days out.",I.cal); },
  room:a=>{ const r=S.rooms.find(x=>x.n===a); open({type:"room",name:r.n,count:r.c}); },
  rooms:()=>go("together"),
  reflect:(a,b)=>{ S.reflect[RQ[+a].k]=b; render(); setTimeout(()=>ACT.reflectnext(a),260); },
  reflectnext:a=>{ const i=+a; if(i<RQ.length-1) return go("reflect",{i:i+1});
    toast("Logged. Sleep well.",I.moon); go("home"); },
  theme:a=>{ document.documentElement.dataset.theme=a; render(); },
  simtime:a=>{ S.simTime=a||null; render(); },
  setgoal:a=>{ S.goalMin=+a; render(); toast("Goal set to "+fmt(+a)+".",I.check); },
  tog:a=>{ S[a]=!S[a]; render(); },

  restart:()=>{ S.ob={}; go("splash"); },

  onboard:a=>go("onboard",{step:+a}),

    S.week=S.week.map(w=>({...w,f:0,x:0})); S.recent=[]; S.badges.forEach(b=>{b.got=false;b.p=0;});
    go("home"); open({type:"quick",min:25,sub:"math"}); }

function finishSessionSoft(){ endSession(); const s=S.sess; if(!s) return;
  const done=Math.round((s.total-s.left)/60); if(done>0){ S.todayMin+=done; S.week[S.today].f+=done; S.lifetimeMin+=done; }

  proud:v=>{ S.reflect.proud=v; },

};

  }
});
