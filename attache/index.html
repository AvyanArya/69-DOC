<meta charset="utf-8">
<title>Attaché</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,300..600;1,300..500&family=Albert+Sans:wght@300..600&display=swap">
<style>
/* Layout: an evening-light private briefing. A single champagne "presence" orb and greeting,
   one large frosted card for the lead story, then a calm list of story cards, a timeline and
   four small notes. Deliberately single-theme: midnight with warm ivory and champagne. */
:root {
  --night: #0b0d13;
  --night-2: #12151e;
  --card: rgba(255, 255, 255, 0.045);
  --card-hi: rgba(255, 255, 255, 0.07);
  --hair: rgba(243, 236, 222, 0.10);
  --ivory: #f4efe6;
  --muted: #aaa499;
  --faint: #77736c;
  --champagne: #d8b878;
  --champagne-soft: rgba(216, 184, 120, 0.14);
  --amber: #e6b866;
  --rose: #e79a8f;
  --sage: #a3cbaa;

  --serif: "Noto Serif Display", "Didot", "Bodoni 72", Georgia, serif;
  --sans: "Albert Sans", "Helvetica Neue", Arial, sans-serif;
  --radius: 18px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--night); }
body {
  margin: 0; min-height: 100%; background: var(--night); color: var(--ivory);
  font-family: var(--sans); font-size: 1.04rem; line-height: 1.6; font-weight: 400;
  -webkit-font-smoothing: antialiased;
}
/* Ambient light: three soft washes drifting very slowly behind everything */
body::before {
  content: ""; position: fixed; inset: -20%; z-index: 0; pointer-events: none;
  background:
    radial-gradient(34rem 26rem at 18% 12%, rgba(216, 184, 120, 0.20), transparent 70%),
    radial-gradient(40rem 30rem at 88% 22%, rgba(56, 96, 110, 0.28), transparent 70%),
    radial-gradient(38rem 30rem at 50% 95%, rgba(92, 56, 104, 0.22), transparent 70%);
  filter: blur(20px);
  animation: drift 48s ease-in-out infinite alternate;
}
@keyframes drift { to { transform: translate3d(3%, -2%, 0) scale(1.06); } }
header, main, footer { position: relative; z-index: 1; }
a { color: inherit; text-decoration-color: var(--hair); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--champagne); }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--champagne); outline-offset: 3px; }
h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
p { margin: 0; }

.wrap {
  max-width: 64rem; margin: 0 auto;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.label { font-family: var(--sans); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.gold { color: var(--champagne); }

/* Top bar */
.topbar .wrap { display: flex; align-items: center; gap: 1rem; padding-block: 1.3rem; }
.wordmark { font-family: var(--serif); font-style: italic; font-size: 1.5rem; letter-spacing: 0.01em; }
.edition-nav { margin-left: auto; display: flex; align-items: center; gap: 0.3rem; background: var(--card); border: 1px solid var(--hair); border-radius: 999px; padding: 0.2rem; }
.edition-nav button, .edition-nav select { background: transparent; border: 0; padding: 0.3rem 0.6rem; border-radius: 999px; cursor: pointer; font-size: 0.82rem; color: var(--muted); }
.edition-nav select { color: var(--ivory); }
.edition-nav select option { background: var(--night-2); }
.edition-nav button:disabled { opacity: 0.3; cursor: default; }

/* Greeting + presence */
.welcome { display: flex; align-items: center; gap: 1.4rem; padding-block: 1.4rem 1.8rem; }
.orb {
  flex: none; width: 74px; height: 74px; border-radius: 50%;
  background:
    radial-gradient(circle at 34% 30%, #fff6e0 0%, #f0d9a6 18%, #c9a35f 46%, #6d5326 78%, #2b2112 100%);
  box-shadow: 0 0 40px 4px rgba(216, 184, 120, 0.30), 0 0 90px 10px rgba(216, 184, 120, 0.10), inset -6px -8px 18px rgba(0, 0, 0, 0.35);
  animation: breathe 6s ease-in-out infinite;
}
.orb.speaking { animation: speak 1.1s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.04); box-shadow: 0 0 54px 8px rgba(216, 184, 120, 0.36), 0 0 110px 16px rgba(216, 184, 120, 0.12), inset -6px -8px 18px rgba(0, 0, 0, 0.35); } }
@keyframes speak { 50% { transform: scale(1.08); box-shadow: 0 0 64px 12px rgba(216, 184, 120, 0.5), 0 0 120px 20px rgba(216, 184, 120, 0.16), inset -6px -8px 18px rgba(0, 0, 0, 0.3); } }
.welcome h2 { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: clamp(1.8rem, 4.4vw, 2.6rem); line-height: 1.1; }
.welcome p { color: var(--muted); margin-top: 0.35rem; }

/* Lead card */
.card {
  background: linear-gradient(180deg, var(--card-hi), var(--card));
  border: 1px solid var(--hair); border-radius: var(--radius);
  box-shadow: 0 24px 60px -30px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.lead { padding: clamp(1.4rem, 4vw, 2.6rem); display: grid; gap: 1.1rem; }
.lead h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(2rem, 5.4vw, 3.5rem); line-height: 1.04; letter-spacing: -0.01em; max-width: 18ch; }
.lead .summary { font-size: 1.12rem; color: #d9d3c8; max-width: 38rem; }
.quote { display: grid; gap: 0.4rem; padding: 1rem 0 0; border-top: 1px solid var(--hair); max-width: 40rem; }
.quote-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.quote p { font-family: var(--serif); font-style: italic; font-size: 1.3rem; line-height: 1.35; font-weight: 300; }
.quote p::before { content: "“"; color: var(--champagne); margin-right: 0.08em; }
.quote p::after { content: "”"; color: var(--champagne); }
.copy { background: none; border: 0; cursor: pointer; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--champagne); padding: 0.2rem 0; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.7rem; padding-top: 0.3rem; }
.pill {
  display: inline-flex; align-items: center; gap: 0.55rem; cursor: pointer; border-radius: 999px;
  padding: 0.75rem 1.3rem; font-size: 0.92rem; font-weight: 500; letter-spacing: 0.02em;
  border: 1px solid transparent; transition: transform 0.2s, background 0.2s, border-color 0.2s;
}
.pill:active { transform: scale(0.98); }
.pill.solid { background: linear-gradient(180deg, #e7cc93, #c9a462); color: #1b150a; box-shadow: 0 10px 30px -12px rgba(216, 184, 120, 0.6); }
.pill.solid:hover { background: linear-gradient(180deg, #efd7a3, #d2ad6a); }
.pill.line { border-color: var(--hair); background: var(--card); }
.pill.line:hover { border-color: var(--champagne); }
.pill .ico { width: 0; height: 0; border-left: 9px solid currentColor; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
.pill.playing .ico { width: 10px; height: 10px; border: 0; border-radius: 2px; background: currentColor; }
.voice-pick { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; color: var(--faint); }
.voice-pick select { background: transparent; border: 0; border-bottom: 1px solid var(--hair); color: var(--muted); padding: 0.15rem 0; max-width: 13rem; cursor: pointer; }
.voice-pick select option { background: var(--night-2); }

/* Sections */
.section { padding-block: 2.6rem 0.4rem; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1.1rem; }
.section-head h2 { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 1.7rem; }

/* Stories */
.stories { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
@media (max-width: 760px) { .stories { grid-template-columns: minmax(0, 1fr); } }
.story { padding: 1.4rem 1.4rem 1.2rem; display: grid; gap: 0.65rem; align-content: start; transition: border-color 0.3s, box-shadow 0.3s; }
.story.speaking { border-color: rgba(216, 184, 120, 0.55); box-shadow: 0 0 0 1px rgba(216, 184, 120, 0.25), 0 24px 60px -30px rgba(216, 184, 120, 0.4); }
.s-top { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
.s-num { font-family: var(--serif); font-style: italic; font-size: 1.6rem; line-height: 1; color: var(--champagne); font-weight: 300; }
.status { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.72rem; letter-spacing: 0.06em; color: var(--muted); }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status.developing { color: var(--amber); }
.status.confirmed { color: var(--sage); }
.status.disputed { color: var(--rose); }
.status.scheduled { color: var(--muted); }
.story h3 { font-family: var(--serif); font-size: 1.42rem; line-height: 1.2; }
.story .brief { color: #d3cdc2; font-size: 1rem; }
.say { display: flex; gap: 0.8rem; align-items: baseline; justify-content: space-between; padding-left: 0.9rem; border-left: 1px solid var(--champagne); }
.say p { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 1.1rem; line-height: 1.4; }
.more { border-top: 1px solid var(--hair); padding-top: 0.6rem; margin-top: 0.2rem; }
.more summary { cursor: pointer; list-style: none; font-size: 0.8rem; color: var(--muted); display: inline-flex; gap: 0.45rem; align-items: center; }
.more summary:hover { color: var(--champagne); }
.more summary::-webkit-details-marker { display: none; }
.more summary::after { content: ""; width: 6px; height: 6px; border-right: 1px solid currentColor; border-bottom: 1px solid currentColor; transform: rotate(45deg) translateY(-2px); transition: transform 0.2s; }
.more[open] summary::after { transform: rotate(-135deg) translate(-2px, 0); }
.more-body { display: grid; gap: 0.75rem; padding-top: 0.8rem; font-size: 0.96rem; }
.d-block { display: grid; gap: 0.15rem; }
.d-block p { color: #d3cdc2; }
.sources { font-size: 0.8rem; color: var(--faint); }
.sources a { color: var(--muted); }
.ask-link { justify-self: start; background: none; border: 1px solid var(--hair); color: var(--ivory); border-radius: 999px; padding: 0.4rem 0.9rem; font-size: 0.82rem; cursor: pointer; }
.ask-link:hover { border-color: var(--champagne); color: var(--champagne); }

/* This week */
.week { list-style: none; margin: 0; padding: 0; display: grid; }
.week li { display: grid; grid-template-columns: 8rem minmax(0, 1fr); gap: 1rem; padding-block: 0.85rem; border-top: 1px solid var(--hair); align-items: baseline; }
.week li:first-child { border-top: 0; }
.week time { font-family: var(--serif); font-style: italic; color: var(--champagne); font-size: 1.1rem; }
@media (max-width: 480px) { .week li { grid-template-columns: 6.2rem minmax(0, 1fr); } }

/* Notes */
.notes { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
@media (max-width: 900px) { .notes { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .notes { grid-template-columns: minmax(0, 1fr); } }
.note { padding: 1.2rem; display: grid; gap: 0.45rem; align-content: start; }
.note .v { font-family: var(--serif); font-size: 2rem; line-height: 1.05; color: var(--champagne); font-variant-numeric: tabular-nums; }
.note .term { font-family: var(--serif); font-style: italic; font-size: 1.35rem; }
.note p { font-size: 0.95rem; color: #d3cdc2; }
.note .s { font-size: 0.74rem; color: var(--faint); }
.note .s a { color: var(--muted); }

.finally { display: grid; gap: 0.5rem; max-width: 40rem; }
.finally p.body { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 1.3rem; line-height: 1.4; }

footer { padding-block: 3rem 7.5rem; color: var(--faint); font-size: 0.84rem; }
footer .wrap { display: grid; gap: 0.3rem; border-top: 1px solid var(--hair); padding-top: 1.4rem; }

/* States */
.state { padding-block: 5rem; max-width: 34rem; display: grid; gap: 0.8rem; }
.state h2 { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 2.2rem; }
.state p { color: var(--muted); }

/* Concierge */
.ask-fab {
  position: fixed; z-index: 30;
  right: calc(1.1rem + env(safe-area-inset-right, 0px));
  bottom: calc(1.1rem + env(safe-area-inset-bottom, 0px));
  display: inline-flex; align-items: center; gap: 0.65rem; cursor: pointer;
  padding: 0.45rem 1.1rem 0.45rem 0.45rem; border-radius: 999px; border: 1px solid var(--hair);
  background: rgba(20, 22, 30, 0.82); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  box-shadow: 0 16px 40px -16px rgba(0, 0, 0, 0.8); font-size: 0.9rem;
}
.ask-fab .orb { width: 34px; height: 34px; }
.drawer {
  position: fixed; z-index: 40; top: 0; right: 0; bottom: 0; width: min(30rem, 100%);
  background: rgba(14, 16, 23, 0.97); border-left: 1px solid var(--hair);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
  transform: translateX(104%); transition: transform 0.4s cubic-bezier(.2,.7,.2,1);
  box-shadow: -30px 0 80px -30px rgba(0, 0, 0, 0.9);
}
.drawer.open { transform: none; }
.drawer-head { display: flex; align-items: center; gap: 0.8rem; padding: 1.1rem 1.25rem; border-bottom: 1px solid var(--hair); }
.drawer-head .orb { width: 30px; height: 30px; }
.drawer-head h2 { font-family: var(--serif); font-style: italic; font-size: 1.35rem; font-weight: 400; }
.drawer-head .close { margin-left: auto; background: none; border: 0; cursor: pointer; font-size: 1.6rem; line-height: 1; color: var(--muted); padding: 0.2rem 0.4rem; }
.thread { overflow-y: auto; padding: 1.25rem; display: grid; gap: 1.1rem; align-content: start; }
.msg { display: grid; gap: 0.4rem; }
.msg.you { justify-items: end; }
.msg.you .bubble { background: var(--card-hi); border: 1px solid var(--hair); border-radius: 16px 16px 4px 16px; padding: 0.6rem 0.9rem; max-width: 88%; font-size: 0.95rem; }
.msg.att .bubble { display: grid; gap: 0.7rem; color: #e3ddd2; }
.msg.note { color: var(--muted); font-size: 0.9rem; font-style: italic; }
.prompts { display: flex; flex-wrap: wrap; gap: 0.45rem; }
.prompt { font-size: 0.86rem; text-align: left; background: var(--card); border: 1px solid var(--hair); border-radius: 999px; padding: 0.45rem 0.9rem; cursor: pointer; }
.prompt:hover { border-color: var(--champagne); }
.composer { border-top: 1px solid var(--hair); padding: 0.9rem 1.25rem 1.1rem; display: grid; gap: 0.6rem; }
.composer textarea { width: 100%; resize: none; min-height: 3.2rem; max-height: 9rem; font: inherit; font-size: 1rem; background: var(--card); color: var(--ivory); border: 1px solid var(--hair); border-radius: 14px; padding: 0.65rem 0.85rem; }
.composer textarea:focus { outline: none; border-color: var(--champagne); }
.composer-row { display: flex; align-items: center; gap: 0.6rem; }
.composer-row .hint { font-size: 0.76rem; color: var(--faint); }
.send { margin-left: auto; padding: 0.55rem 1.2rem; }
.scrim { position: fixed; inset: 0; z-index: 35; background: rgba(4, 5, 8, 0.55); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.scrim.on { opacity: 1; pointer-events: auto; }

@media (prefers-reduced-motion: reduce) {
  body::before, .orb, .orb.speaking { animation: none; }
  .drawer, .scrim, .pill, .story { transition: none; }
}
</style>

<header class="topbar">
  <div class="wrap">
    <span class="wordmark">Attaché</span>
    <div class="edition-nav" id="editionNav" hidden>
      <button type="button" id="prevEd" aria-label="Earlier edition">‹</button>
      <select id="edSelect" aria-label="Choose an edition"></select>
      <button type="button" id="nextEd" aria-label="Later edition">›</button>
    </div>
  </div>
</header>

<main id="main">
  <div class="wrap">
    <section class="state">
      <span class="label">One moment</span>
      <h2>Preparing your briefing…</h2>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">
    <span class="label">About Attaché</span>
    <p>A new edition is prepared from public reporting every morning at 06:40, Dubai time. Figures are as reported in the linked sources, so check them before quoting.</p>
  </div>
</footer>

<button class="ask-fab" id="askFab" type="button" hidden><span class="orb" aria-hidden="true"></span>Ask Attaché</button>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Ask Attaché" aria-hidden="true">
  <div class="drawer-head">
    <span class="orb" aria-hidden="true"></span>
    <h2>Ask Attaché</h2>
    <button class="close" id="closeDrawer" type="button" aria-label="Close">×</button>
  </div>
  <div class="thread" id="thread"></div>
  <form class="composer" id="composer">
    <textarea id="askInput" rows="2" placeholder="Prepare me for dinner with a banker tonight…"></textarea>
    <div class="composer-row">
      <span class="hint" id="askHint">Answers draw on today's edition.</span>
      <button class="pill solid send" id="sendBtn" type="submit">Ask</button>
    </div>
  </form>
</aside>

<script>
(() => {
  "use strict";
  const $ = (q) => document.querySelector(q);
  const main = $("#main");

  /* Small DOM builder: every piece of data goes in as text, never as HTML. */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const str = (v) => (typeof v === "string" ? v : v == null ? "" : String(v));
  const arr = (v) => (Array.isArray(v) ? v : []);
  const safeUrl = (u) => (/^https?:\/\//i.test(str(u)) ? str(u) : null);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  function fmtLong(iso) {
    const d = new Date(str(iso) + "T12:00:00");
    return isNaN(d) ? str(iso) : d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  }
  function fmtShort(iso) {
    const d = new Date(str(iso) + "T12:00:00");
    return isNaN(d) ? str(iso) : d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
  }
  function dubaiHour() {
    try { return Number(new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Dubai", hour: "2-digit", hourCycle: "h23" }).format(new Date())); }
    catch { return new Date().getHours(); }
  }
  function greeting() { const hr = dubaiHour(); return hr < 12 ? "Good morning" : hr < 18 ? "Good afternoon" : "Good evening"; }

  async function copyText(text, btn) {
    const done = (msg) => { const o = btn.textContent; btn.textContent = msg; setTimeout(() => (btn.textContent = o), 1600); };
    try { await navigator.clipboard.writeText(text); done("Copied"); }
    catch {
      const host = btn.closest("[data-copy-host]");
      const target = host && host.querySelector("p");
      if (target) { const r = document.createRange(); r.selectNodeContents(target); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
      done("Selected");
    }
  }

  /* ---------- State ---------- */
  const state = { briefs: [], current: null };

  function setBriefs(list) {
    state.briefs = list.filter((b) => b && b.date).sort((a, b) => (a.date < b.date ? 1 : -1));
    if (!state.briefs.length) return renderEmpty();
    const want = decodeURIComponent(location.hash.slice(1));
    const pick = state.briefs.find((b) => b.date === want) || (state.current && state.briefs.find((b) => b.date === state.current.date)) || state.briefs[0];
    show(pick, false);
  }
  function show(brief, push = true) {
    const changed = !state.current || state.current.date !== brief.date;
    state.current = brief;
    if (push) { try { history.replaceState(null, "", "#" + brief.date); } catch {} }
    renderNav();
    voice.stop();
    renderBrief(brief);
    $("#askFab").hidden = !concierge.available;
    if (changed) concierge.reset();
  }
  function renderNav() {
    const list = state.briefs, i = list.indexOf(state.current);
    $("#editionNav").hidden = list.length < 2;
    $("#edSelect").replaceChildren(...list.map((b) => h("option", { value: b.date, selected: b === state.current }, fmtShort(b.date))));
    $("#prevEd").disabled = i >= list.length - 1;
    $("#nextEd").disabled = i <= 0;
  }
  $("#prevEd").addEventListener("click", () => { const i = state.briefs.indexOf(state.current); if (i < state.briefs.length - 1) { show(state.briefs[i + 1]); scrollTo({ top: 0 }); } });
  $("#nextEd").addEventListener("click", () => { const i = state.briefs.indexOf(state.current); if (i > 0) { show(state.briefs[i - 1]); scrollTo({ top: 0 }); } });
  $("#edSelect").addEventListener("change", (e) => { const b = state.briefs.find((x) => x.date === e.target.value); if (b) show(b); });
  window.addEventListener("hashchange", () => {
    const b = state.briefs.find((x) => x.date === decodeURIComponent(location.hash.slice(1)));
    if (b && b !== state.current) show(b, false);
  });

  /* ---------- Rendering ---------- */
  function renderEmpty() {
    main.replaceChildren(h("div", { class: "wrap" }, h("section", { class: "state" },
      h("span", { class: "label" }, "Coming shortly"),
      h("h2", null, "Your first briefing is on its way."),
      h("p", null, "A new edition arrives every morning at 06:40, Dubai time: five essential stories, a line to say about each, and the week ahead."))));
  }
  function renderUnreachable() {
    main.replaceChildren(h("div", { class: "wrap" }, h("section", { class: "state" },
      h("span", { class: "label" }, "Offline"),
      h("h2", null, "The briefing can't be reached yet."),
      h("p", null, "Check your connection, then reopen this page. Earlier editions are kept and will show when it reconnects."))));
  }
  function sourcesLine(list) {
    const items = arr(list).map((x) => {
      const url = safeUrl(x.url), label = str(x.outlet) || "Source";
      return url ? h("a", { href: url, target: "_blank", rel: "noopener", title: str(x.title) }, label) : label;
    });
    if (!items.length) return null;
    const out = [];
    items.forEach((it, i) => { if (i) out.push(" · "); out.push(it); });
    return h("p", { class: "sources" }, "Sources: ", ...out);
  }

  const STATUS = { confirmed: "Confirmed", developing: "Developing", disputed: "Disputed", scheduled: "Scheduled" };
  const words = (v) => str(v).split(/\s+/).filter(Boolean).length;
  function readMinutes(b) {
    const l = b.lede || {};
    let n = words(l.headline) + words(l.summary || arr(l.body)[0]) + words(l.oneBreath);
    for (const x of arr(b.stories)) n += words(x.headline) + words(x.brief || x.summary) + words(x.say || x.talkingPoint);
    for (const a of arr(b.ahead)) n += words(a.event);
    const w = b.word || {}, t = b.table || {}, num = b.number || {};
    n += words(w.term) + words(w.meaning) + words(t.opener) + words(t.careful) + words(num.value) + words(num.label) + words(b.coda && b.coda.body);
    return Math.max(1, Math.round(n / 200));
  }
  const block = (label, text) => h("div", { class: "d-block" }, h("span", { class: "label" }, label), h("p", null, text));

  function renderBrief(b) {
    const lede = b.lede || {};
    const ledeSummary = str(lede.summary) || str(arr(lede.body)[0]);
    const stories = arr(b.stories).slice(0, 6);
    const mins = readMinutes(b);

    const welcome = h("section", { class: "welcome" },
      h("span", { class: "orb", id: "heroOrb", "aria-hidden": "true" }),
      h("div", null,
        h("h2", null, greeting() + "."),
        h("p", null, fmtLong(b.date) + "  ·  " + mins + "-minute read" + (b.edition ? "  ·  No. " + b.edition : ""))));

    const lead = h("section", { class: "card lead", "aria-labelledby": "ledeHead" },
      h("span", { class: "label gold" }, str(lede.kicker) || "The one thing"),
      h("h1", { id: "ledeHead" }, str(lede.headline)),
      ledeSummary ? h("p", { class: "summary" }, ledeSummary) : null,
      lede.oneBreath ? h("div", { class: "quote", "data-copy-host": "" },
        h("div", { class: "quote-head" },
          h("span", { class: "label" }, "If it comes up"),
          h("button", { class: "copy", type: "button", onclick: (e) => copyText(str(lede.oneBreath), e.currentTarget) }, "Copy")),
        h("p", null, str(lede.oneBreath))) : null,
      h("div", { class: "actions" },
        voice.supported ? h("button", { class: "pill solid" + (voice.speaking ? " playing" : ""), id: "readBtn", type: "button", onclick: () => voice.toggle() },
          h("span", { class: "ico" }), h("span", null, voice.speaking ? "Stop" : "Listen")) : null,
        concierge.available ? h("button", { class: "pill line", type: "button", onclick: () => concierge.open() }, "Ask Attaché") : null,
        voice.supported ? voice.picker() : null));

    const storiesSec = stories.length ? h("section", { class: "section" },
      h("div", { class: "section-head" }, h("h2", null, "The essentials"), h("span", { class: "label" }, "In order of importance")),
      h("div", { class: "stories" }, stories.map(story))) : null;

    const ahead = arr(b.ahead).slice(0, 4);
    const weekSec = ahead.length ? h("section", { class: "section" },
      h("div", { class: "section-head" }, h("h2", null, "This week")),
      h("ul", { class: "week card", style: "padding: 0.4rem 1.4rem" }, ahead.map((a) => h("li", null,
        h("time", { datetime: str(a.date) }, fmtShort(a.date)),
        h("span", null, str(a.event)))))) : null;

    // Older long-form editions carry figures/lexicon/salon; read them as the short fields.
    const num = b.number || arr(b.figures)[0];
    const word = b.word || arr(b.lexicon)[0];
    const salon = b.salon || {};
    const care = arr(salon.careful)[0];
    const table = b.table || { opener: arr(salon.openers)[0], careful: care ? str(care.topic) + ": " + str(care.advice) : "" };
    const notes = [];
    if (num && num.value) {
      const url = safeUrl(num.source && num.source.url), outlet = str(num.source && num.source.outlet);
      notes.push(h("div", { class: "card note" }, h("span", { class: "label" }, "The number"),
        h("span", { class: "v" }, str(num.value)), h("p", null, str(num.label)),
        outlet ? h("span", { class: "s" }, "Source: ", url ? h("a", { href: url, target: "_blank", rel: "noopener" }, outlet) : outlet) : null));
    }
    if (word && word.term) notes.push(h("div", { class: "card note" }, h("span", { class: "label" }, "Word of the day"),
      h("span", { class: "term" }, str(word.term)), h("p", null, str(word.meaning))));
    if (table.opener) notes.push(h("div", { class: "card note" }, h("span", { class: "label" }, "An opener"), h("p", null, "“" + str(table.opener) + "”")));
    if (table.careful) notes.push(h("div", { class: "card note" }, h("span", { class: "label", style: "color: var(--rose)" }, "Tread carefully"), h("p", null, str(table.careful))));
    const notesSec = notes.length ? h("section", { class: "section" },
      h("div", { class: "section-head" }, h("h2", null, "Before you go")),
      h("div", { class: "notes" }, notes)) : null;

    const coda = b.coda && b.coda.body ? h("section", { class: "section" },
      h("div", { class: "finally" }, h("span", { class: "label gold" }, "And finally"), h("p", { class: "body" }, str(b.coda.body)), sourcesLine(b.coda.sources))) : null;

    main.replaceChildren(h("div", { class: "wrap" }, welcome, lead, storiesSec, weekSec, notesSec, coda));
  }

  function story(x, i) {
    const status = str(x.status).toLowerCase();
    const m = x.more || {};
    const brief = str(x.brief) || str(x.summary);
    const say = str(x.say) || str(x.talkingPoint);
    const background = str(m.background) || str(x.background);
    const ask = str(m.askThem) || str(x.askThem);
    const watch = str(m.watch) || str(x.watch);
    const names = arr(m.names || x.names).map((n) => str(n.name) + (n.who ? " (" + str(n.who) + ")" : "")).join("; ");
    return h("article", { class: "card story", id: "story-" + i },
      h("div", { class: "s-top" },
        h("span", { class: "s-num" }, String(i + 1)),
        h("span", { class: "label" }, str(x.desk)),
        STATUS[status] ? h("span", { class: "status " + status }, STATUS[status]) : null),
      h("h3", null, str(x.headline)),
      brief ? h("p", { class: "brief" }, brief) : null,
      say ? h("div", { class: "say", "data-copy-host": "" },
        h("p", null, say),
        h("button", { class: "copy", type: "button", onclick: (e) => copyText(say, e.currentTarget) }, "Copy")) : null,
      h("details", { class: "more" },
        h("summary", null, "More on this"),
        h("div", { class: "more-body" },
          background ? block("Background", background) : null,
          ask ? block("Ask them", ask) : null,
          names ? block("Names", names) : null,
          watch ? block("Watch next", watch) : null,
          sourcesLine(x.sources),
          concierge.available ? h("button", { class: "ask-link", type: "button", onclick: () => concierge.askAbout(x) }, "Go deeper with Attaché") : null)));
  }

  /* ---------- Listen: reads the front page in the most natural voice this device has ---------- */
  const voice = (() => {
    const synth = window.speechSynthesis;
    const api = { supported: !!(synth && window.SpeechSynthesisUtterance), speaking: false };
    let queue = [], voices = [];

    // Higher score = more natural. Premium/enhanced/neural voices sound far less robotic than defaults.
    function score(v) {
      const n = v.name.toLowerCase(), lang = (v.lang || "").toLowerCase();
      if (!lang.startsWith("en")) return -1;
      let s = 0;
      if (/premium/.test(n)) s += 60;
      if (/enhanced/.test(n)) s += 45;
      if (/natural|neural|online/.test(n)) s += 50;
      if (/siri/.test(n)) s += 40;
      if (/google uk english|google us english/.test(n)) s += 25;
      if (/daniel|serena|kate|oliver|arthur|libby|sonia|ryan|thomas|jamie|stephanie|malcolm|martha/.test(n)) s += 12;
      if (lang === "en-gb") s += 10;
      else if (lang === "en-us" || lang === "en-au" || lang === "en-ie") s += 4;
      if (/compact|espeak|zarvox|albert|bad news|bells|boing|bubbles|cellos|trinoids|whisper|wobble|jester|organ|superstar|novelty/.test(n)) s -= 80;
      if (v.localService === false && /google|natural|online/.test(n)) s += 5;
      return s;
    }
    function load() {
      if (!api.supported) return;
      voices = (synth.getVoices() || []).filter((v) => score(v) >= 0).sort((a, b) => score(b) - score(a));
      const sel = $("#voiceSel");
      if (sel) fillPicker(sel);
    }
    function chosen() {
      const saved = store.get("attache-voice");
      return voices.find((v) => v.voiceURI === saved) || voices[0] || null;
    }
    function fillPicker(sel) {
      const cur = chosen();
      sel.replaceChildren(...voices.slice(0, 12).map((v) => h("option", { value: v.voiceURI, selected: cur && v.voiceURI === cur.voiceURI }, v.name.replace(/\s*\(.*?\)\s*/g, " ").trim() + (score(v) >= 40 ? " ★" : ""))));
      sel.closest(".voice-pick").hidden = voices.length < 2;
    }
    api.picker = () => {
      const sel = h("select", { id: "voiceSel", "aria-label": "Voice" });
      sel.addEventListener("change", () => { store.set("attache-voice", sel.value); if (api.speaking) { api.stop(); api.toggle(); } });
      const wrap = h("label", { class: "voice-pick", hidden: true }, "Voice", sel);
      setTimeout(() => fillPicker(sel), 0);
      return wrap;
    };

    function setUi() {
      const btn = $("#readBtn");
      if (btn) { btn.classList.toggle("playing", api.speaking); btn.lastChild.textContent = api.speaking ? "Stop" : "Listen"; }
      const orb = $("#heroOrb");
      if (orb) orb.classList.toggle("speaking", api.speaking);
    }
    function mark(i) {
      document.querySelectorAll(".story.speaking").forEach((el) => el.classList.remove("speaking"));
      if (i == null) return;
      const el = document.getElementById("story-" + i);
      if (el) { el.classList.add("speaking"); el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
    }
    // Written to be heard: natural transitions, one sentence per utterance, short pauses between.
    function script(b) {
      const l = b.lede || {};
      const ord = ["First", "Next", "Then", "Also worth knowing", "And", "Finally"];
      const out = [];
      const add = (text, story, pause) => {
        str(text).split(/(?<=[.!?])\s+(?=[A-Z“"'(])/).forEach((sentence, i) => { if (sentence.trim()) out.push({ text: sentence.trim(), story, pause: i === 0 ? pause : 160 }); });
      };
      add(greeting() + ". Here's your briefing for " + fmtLong(b.date) + ".", null, 0);
      add("The main story today. " + str(l.headline) + ".", null, 500);
      add(str(l.summary) || str(arr(l.body)[0]), null, 250);
      arr(b.stories).slice(0, 6).forEach((x, i, all) => {
        const lead = i === all.length - 1 && all.length > 2 ? "And finally" : ord[Math.min(i, ord.length - 2)];
        add(lead + ", " + str(x.headline).replace(/[.:;]$/, "") + ".", i, 650);
        add(str(x.brief) || str(x.summary), i, 220);
        if (str(x.say)) add("If it comes up, you could say: " + str(x.say), i, 300);
      });
      const ahead = arr(b.ahead).slice(0, 3);
      if (ahead.length) add("Coming up this week. " + ahead.map((a) => fmtLong(a.date).split(" ")[0] + ": " + str(a.event)).join(". ") + ".", null, 650);
      add("That's everything. Have a good day.", null, 600);
      return out;
    }
    api.stop = () => {
      queue = [];
      if (api.supported) synth.cancel();
      api.speaking = false; mark(null); setUi();
    };
    api.toggle = () => {
      if (!api.supported || !state.current) return;
      if (api.speaking) return api.stop();
      synth.cancel();
      if (!voices.length) load();
      queue = script(state.current);
      api.speaking = true; setUi();
      const v = chosen();
      const next = () => {
        if (!api.speaking) return;
        const part = queue.shift();
        if (!part) return api.stop();
        setTimeout(() => {
          if (!api.speaking) return;
          const u = new SpeechSynthesisUtterance(part.text);
          if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-GB";
          u.rate = 0.96; u.pitch = 1;
          u.onstart = () => { if (part.story != null) mark(part.story); };
          u.onend = next;
          u.onerror = (e) => { if (e.error !== "interrupted" && e.error !== "canceled") api.stop(); };
          synth.speak(u);
        }, part.pause || 0);
      };
      next();
    };
    if (api.supported) {
      load();
      if (synth.addEventListener) synth.addEventListener("voiceschanged", load);
      else synth.onvoiceschanged = load;
    }
    return api;
  })();

  /* ---------- Concierge (asks Claude on the viewer's account) ---------- */
  const concierge = (() => {
    let sample = null, turns = [], ctl = null, busy = false;
    const thread = $("#thread"), input = $("#askInput"), send = $("#sendBtn"), hint = $("#askHint");
    const api = { available: false };

    function rules() {
      const b = state.current, json = JSON.stringify(b);
      return [
        "You are Attaché, a discreet, very well-read private briefer for one person who lives in Dubai, in the manner of a trusted chief of staff.",
        "Your job is to help them hold intelligent, gracious conversations about world affairs, geopolitics, markets and culture.",
        "Ground every answer in today's edition below (dated " + str(b && b.date) + "). You may add general background from your own knowledge,",
        "but you cannot browse, so say plainly when something may have moved on since the edition was written. Never invent figures, quotes or sources.",
        "Style: warm, composed, precise, with a light touch of dry wit. Plain text only, no markdown, no headings, no bullet symbols.",
        "The reader is busy and often on the move: keep answers under about 90 words unless asked for more. When useful, give one sentence they could say aloud.",
        "If asked about someone they will meet (a banker, a diplomat, an engineer), tailor which stories matter to that person and suggest a good question to ask them.",
        "",
        "TODAY'S EDITION (JSON):",
        json.length > 60000 ? json.slice(0, 60000) : json,
      ].join("\n");
    }
    function bubbleText(text) {
      const clean = str(text).replace(/\*\*(.+?)\*\*/g, "$1").replace(/^#+\s*/gm, "");
      return clean.split(/\n{2,}/).map((p) => h("p", null, p.trim())).filter((p) => p.textContent);
    }
    const scrollEnd = () => { thread.scrollTop = thread.scrollHeight; };
    function addAtt() {
      const body = h("div", { class: "bubble" }, h("p", { class: "msg note" }, "Thinking…"));
      thread.append(h("div", { class: "msg att" }, h("span", { class: "label gold" }, "Attaché"), body));
      return body;
    }
    function suggestions() {
      const first = arr(state.current && state.current.stories)[0];
      const list = ["Brief me in thirty seconds", "Prepare me for dinner with a banker", "What should I avoid saying today?",
        first ? "Background on “" + str(first.headline) + "”" : null].filter(Boolean);
      return h("div", { class: "prompts" }, list.map((p) => h("button", { class: "prompt", type: "button", onclick: () => ask(p) }, p)));
    }
    api.reset = () => {
      if (ctl) ctl.abort();
      turns = [];
      thread.replaceChildren(
        h("div", { class: "msg att" }, h("span", { class: "label gold" }, "Attaché"),
          h("div", { class: "bubble" }, h("p", null, "Good to see you. Ask me anything about today's briefing: the background, what to say, or how to read the room."))),
        suggestions());
    };
    function setBusy(on) { busy = on; send.textContent = on ? "Stop" : "Ask"; send.type = on ? "button" : "submit"; }
    async function ask(text) {
      text = str(text).trim();
      if (!text || busy || !sample) return;
      api.open();
      input.value = "";
      thread.append(h("div", { class: "msg you" }, h("div", { class: "bubble" }, text)));
      turns.push({ role: "user", content: text });
      while (turns.length > 16) turns.splice(0, 2);
      const body = addAtt();
      scrollEnd();
      ctl = new AbortController();
      setBusy(true);
      try {
        const { text: answer, truncated } = await sample([{ role: "user", content: rules() }, ...turns], {
          cache: false, signal: ctl.signal,
          onText: ({ text: t }) => { body.replaceChildren(...bubbleText(t)); scrollEnd(); },
        });
        turns.push({ role: "assistant", content: answer });
        if (truncated) body.append(h("p", { class: "msg note" }, "Cut short. Ask for less at a time."));
      } catch (e) {
        turns.pop();
        const partial = e && e.text, code = e && e.code;
        body.replaceChildren(...(partial ? bubbleText(partial) : []));
        const note = (t) => body.append(h("p", { class: "msg note" }, t));
        if (code === "cancelled") { if (!partial) note("Stopped."); }
        else if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) {
          note("Attaché needs your permission to answer. Allow it from this page's permissions menu, then ask again.");
          hint.textContent = "Permission needed to answer.";
        } else if (code === "rate_limited") note("Too many questions at once. Wait a minute, then ask again.");
        else if (code === "session_expired") note("Your session has expired. Sign in again, then ask.");
        else if (code === "refused") note("Attaché can't help with that one. Try asking it another way.");
        else note("The answer was interrupted. Ask again to retry.");
      } finally { setBusy(false); ctl = null; scrollEnd(); }
    }
    api.open = () => {
      $("#drawer").classList.add("open"); $("#drawer").setAttribute("aria-hidden", "false"); $("#scrim").classList.add("on");
      setTimeout(() => input.focus({ preventScroll: true }), 50);
    };
    function close() { $("#drawer").classList.remove("open"); $("#drawer").setAttribute("aria-hidden", "true"); $("#scrim").classList.remove("on"); }
    api.askAbout = (x) => ask("Go deeper on “" + str(x.headline) + "”. What's the fuller story, the strongest case on each side, and how should I bring it up?");
    api.init = async () => {
      try { sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch { sample = null; }
      api.available = !!sample;
      if (api.available && state.current) { $("#askFab").hidden = false; renderBrief(state.current); }
    };
    $("#askFab").addEventListener("click", api.open);
    $("#closeDrawer").addEventListener("click", close);
    $("#scrim").addEventListener("click", close);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
    $("#composer").addEventListener("submit", (e) => { e.preventDefault(); ask(input.value); });
    send.addEventListener("click", (e) => { if (busy) { e.preventDefault(); ctl && ctl.abort(); } });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); } });
    return api;
  })();

  /* ---------- Data: the artifact's shared store, or static files when self-hosted ---------- */
  async function loadStatic() {
    try {
      const idx = await (await fetch("briefs/index.json", { cache: "no-store" })).json();
      const list = await Promise.all(arr(idx.editions).slice(0, 30).map((d) =>
        fetch("briefs/" + d + ".json", { cache: "no-store" }).then((r) => r.json()).catch(() => null)));
      setBriefs(list.filter(Boolean));
    } catch { renderUnreachable(); }
  }
  async function boot() {
    concierge.init();
    if (!(window.claude && window.claude.use)) return loadStatic();
    let db = null;
    try { db = await window.claude.use("db"); } catch { db = null; }
    if (!db) return loadStatic();
    let settled = false;
    const timer = setTimeout(() => { if (!settled && !state.current) renderUnreachable(); }, 10000);
    db.collection("briefs").orderBy("date", "desc").limit(30).onSnapshot(
      (snap) => {
        if (!snap.metadata.fromCache) { settled = true; clearTimeout(timer); }
        const list = snap.docs.filter((d) => d.exists).map((d) => d.data());
        if (!list.length && !snap.metadata.fromCache) return renderEmpty();
        if (list.length) setBriefs(list);
      },
      () => { settled = true; clearTimeout(timer); if (!state.current) loadStatic(); });
  }
  boot();
})();
</script>
