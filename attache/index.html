<meta charset="utf-8">
<title>Attaché</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300..700&family=Hanken+Grotesk:ital,wght@0,300..700;1,300..500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a personal heads-up display. Arc-reactor core and greeting up top,
   holographic glass panels for each story, a timeline and four readout tiles below.
   Deliberately single-theme (dark): the HUD is the look. */
:root {
  --void: #04070c;          /* deep space behind the glass */
  --deck: #0a111b;          /* panel base */
  --glass: rgba(18, 34, 52, 0.55);
  --line: rgba(110, 200, 255, 0.16);
  --text: #e4f1fb;
  --dim: #8aa3b8;
  --faint: #56708a;
  --arc: #62e3ff;           /* arc-reactor cyan */
  --arc-soft: rgba(98, 227, 255, 0.14);
  --arc-glow: rgba(98, 227, 255, 0.45);
  --gold: #ffbe5c;          /* alert amber */
  --alert: #ff6b6b;
  --ok: #6ff0c0;

  --display: "Oxanium", "Eurostile", "Bank Gothic", "Arial Narrow", sans-serif;
  --body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--void); }
body {
  margin: 0; min-height: 100%; color: var(--text); font-family: var(--body); font-size: 1.04rem; line-height: 1.6;
  background:
    radial-gradient(60rem 40rem at 12% -8%, rgba(98, 227, 255, 0.13), transparent 60%),
    radial-gradient(50rem 36rem at 105% 30%, rgba(255, 190, 92, 0.05), transparent 60%),
    var(--void);
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(98, 227, 255, 0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(98, 227, 255, 0.045) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: radial-gradient(ellipse at 30% 10%, #000 0%, transparent 70%);
          mask-image: radial-gradient(ellipse at 30% 10%, #000 0%, transparent 70%);
}
header, main, footer { position: relative; z-index: 1; }
a { color: inherit; text-decoration-color: var(--line); text-underline-offset: 3px; }
a:hover { color: var(--arc); text-decoration-color: var(--arc); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--arc); outline-offset: 3px; box-shadow: 0 0 0 4px var(--arc-soft); }
h1, h2, h3 { margin: 0; font-weight: 500; text-wrap: balance; }
p { margin: 0; }

.wrap {
  max-width: 72rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.label { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
.glow { color: var(--arc); text-shadow: 0 0 14px var(--arc-glow); }

/* Top bar */
.topbar { padding-block: 1rem; border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 0.7rem; }
.brand-mark { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--arc); box-shadow: 0 0 12px var(--arc-glow), inset 0 0 8px var(--arc-glow); display: grid; place-items: center; }
.brand-mark::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--arc); box-shadow: 0 0 10px var(--arc); }
.brand-name { font-family: var(--display); font-weight: 600; letter-spacing: 0.42em; font-size: 0.95rem; }
.sys { margin-left: auto; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.clock { font-family: var(--mono); font-size: 0.78rem; color: var(--dim); font-variant-numeric: tabular-nums; letter-spacing: 0.08em; }
.clock b { color: var(--text); font-weight: 500; }
.online { display: inline-flex; align-items: center; gap: 0.45rem; }
.online::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: blink 2.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0.35; } }
.edition-nav { display: flex; align-items: center; gap: 0.35rem; }
.edition-nav button, .edition-nav select {
  font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.06em; color: var(--text);
  background: var(--glass); border: 1px solid var(--line); padding: 0.32rem 0.6rem; border-radius: 3px; cursor: pointer;
}
.edition-nav select { max-width: 10rem; }
.edition-nav button:disabled { opacity: 0.35; cursor: default; }
@media (max-width: 640px) { .brand-name { letter-spacing: 0.32em; } }

/* Hero */
.hero { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 2.5rem; align-items: center; padding-block: 2.6rem 2.2rem; }
.core { position: relative; width: 15rem; max-width: 100%; aspect-ratio: 1; }
.core svg { width: 100%; height: 100%; overflow: visible; }
.core .ring { transform-origin: 120px 120px; }
.core .r1 { animation: spin 26s linear infinite; }
.core .r2 { animation: spin 14s linear infinite reverse; }
.core .r3 { animation: spin 40s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.core-read { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 0.1rem; }
.core-read .big { font-family: var(--display); font-size: 2.6rem; font-weight: 300; line-height: 1; color: var(--arc); text-shadow: 0 0 22px var(--arc-glow); font-variant-numeric: tabular-nums; }
.hero-text { min-width: 0; display: grid; gap: 1rem; }
.greet { font-family: var(--display); font-size: clamp(1.05rem, 2.2vw, 1.25rem); font-weight: 300; color: var(--dim); letter-spacing: 0.02em; }
.greet b { color: var(--text); font-weight: 500; }
.kicker { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--gold); }
.kicker::before { content: ""; width: 18px; height: 1px; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.hero h1 { font-family: var(--display); font-size: clamp(1.9rem, 4.6vw, 3.1rem); line-height: 1.06; letter-spacing: -0.01em; }
.hero .summary { color: #c4d6e4; font-size: 1.1rem; max-width: 40rem; }
.stats { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.chip { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.28rem 0.6rem; border: 1px solid var(--line); border-radius: 3px; background: var(--glass); color: var(--dim); display: inline-flex; gap: 0.4rem; align-items: center; }
.chip b { color: var(--text); font-weight: 500; }
.chip.warn b { color: var(--gold); }
.chip.alert b { color: var(--alert); }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.btn {
  display: inline-flex; align-items: center; gap: 0.55rem; cursor: pointer;
  font-family: var(--display); font-size: 0.82rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
  padding: 0.7rem 1.1rem; border-radius: 3px; border: 1px solid var(--arc); color: var(--arc); background: var(--arc-soft);
  box-shadow: 0 0 0 0 var(--arc-glow), inset 0 0 18px rgba(98, 227, 255, 0.08); transition: box-shadow 0.25s, background 0.25s;
}
.btn:hover { background: rgba(98, 227, 255, 0.22); box-shadow: 0 0 22px -4px var(--arc-glow), inset 0 0 18px rgba(98, 227, 255, 0.12); }
.btn.ghost { border-color: var(--line); color: var(--text); background: transparent; }
.btn.ghost:hover { border-color: var(--arc); color: var(--arc); }
.btn .ico { width: 0; height: 0; border-left: 8px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.btn.playing .ico { width: 9px; height: 9px; border: 0; background: currentColor; }
@media (max-width: 760px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 1.4rem; padding-top: 1.6rem; }
  .core { width: 11rem; }
  .core-read .big { font-size: 2rem; }
}

/* Glass panel with HUD corner brackets */
.panel {
  position: relative; background: linear-gradient(180deg, rgba(20, 38, 58, 0.62), rgba(10, 18, 29, 0.62));
  border: 1px solid var(--line); border-radius: 4px; padding: 1.2rem 1.25rem;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  transition: border-color 0.25s, box-shadow 0.25s;
}
.panel::before, .panel::after { content: ""; position: absolute; width: 12px; height: 12px; pointer-events: none; }
.panel::before { top: -1px; left: -1px; border-top: 1px solid var(--arc); border-left: 1px solid var(--arc); }
.panel::after { bottom: -1px; right: -1px; border-bottom: 1px solid var(--arc); border-right: 1px solid var(--arc); }
.panel:hover { border-color: rgba(98, 227, 255, 0.32); box-shadow: 0 0 34px -18px var(--arc-glow); }

.breath { display: grid; gap: 0.45rem; max-width: 40rem; }
.breath-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.breath p { font-family: var(--display); font-size: 1.1rem; line-height: 1.4; }
.copy { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; background: none; border: 0; color: var(--arc); cursor: pointer; padding: 0.15rem 0; }

/* Sections */
.section { padding-block: 1.8rem; }
.section-head { display: flex; align-items: center; gap: 0.9rem; margin-bottom: 1rem; }
.section-head h2 { font-family: var(--display); font-size: 0.92rem; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; }
.section-head::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
.section-head .label { order: 2; }

/* Stories */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.grid > .story:first-child { grid-column: 1 / -1; }
@media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.story { display: grid; gap: 0.6rem; align-content: start; }
.story.speaking { border-color: var(--arc); box-shadow: 0 0 40px -14px var(--arc-glow); }
.s-meta { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
.s-num { font-family: var(--mono); font-size: 0.78rem; color: var(--arc); text-shadow: 0 0 10px var(--arc-glow); }
.story h3 { font-family: var(--display); font-size: 1.3rem; line-height: 1.22; }
.grid > .story:first-child h3 { font-size: clamp(1.35rem, 2.6vw, 1.7rem); }
.story .brief { color: #c4d6e4; }
.status { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.12em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 0.4rem; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
.status.developing { color: var(--gold); }
.status.confirmed { color: var(--ok); }
.status.disputed { color: var(--alert); }
.status.scheduled { color: var(--dim); }
.say { display: flex; gap: 0.75rem; align-items: baseline; justify-content: space-between; padding: 0.55rem 0.75rem; border-left: 2px solid var(--arc); background: var(--arc-soft); border-radius: 0 3px 3px 0; }
.say p { font-family: var(--display); font-size: 1rem; line-height: 1.4; }
.say .tag { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.14em; color: var(--arc); margin-right: 0.4rem; }
.more summary {
  cursor: pointer; list-style: none; display: inline-flex; gap: 0.45rem; align-items: center; padding-block: 0.15rem;
  font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim);
}
.more summary:hover { color: var(--arc); }
.more summary::-webkit-details-marker { display: none; }
.more summary::before { content: "+"; color: var(--arc); font-size: 0.95rem; line-height: 1; }
.more[open] summary::before { content: "−"; }
.more-body { display: grid; gap: 0.7rem; padding-top: 0.7rem; margin-top: 0.4rem; border-top: 1px dashed var(--line); font-size: 0.96rem; }
.d-block { display: grid; gap: 0.15rem; }
.d-block p { color: #c4d6e4; }
.sources { font-family: var(--mono); font-size: 0.72rem; color: var(--faint); line-height: 1.6; }
.sources a { color: var(--dim); }
.ask-link { justify-self: start; font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; background: transparent; color: var(--arc); border: 1px solid var(--line); border-radius: 3px; padding: 0.4rem 0.7rem; cursor: pointer; }
.ask-link:hover { border-color: var(--arc); }

/* Timeline */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 1px; background: linear-gradient(90deg, var(--arc), var(--line)); }
.timeline li { position: relative; padding: 1.6rem 1rem 0 0; display: grid; gap: 0.25rem; }
.timeline li::before { content: ""; position: absolute; top: 2px; left: 0; width: 11px; height: 11px; border-radius: 50%; background: var(--void); border: 1px solid var(--arc); box-shadow: 0 0 10px var(--arc-glow); }
.timeline li:first-child::before { background: var(--arc); }
.timeline time { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--arc); }
.timeline span { font-size: 0.96rem; }
@media (max-width: 640px) {
  .timeline { grid-auto-flow: row; gap: 1rem; padding-left: 1.4rem; }
  .timeline::before { left: 5px; right: auto; top: 0; bottom: 0; width: 1px; height: auto; background: linear-gradient(180deg, var(--arc), var(--line)); }
  .timeline li { padding: 0; }
  .timeline li::before { left: -1.4rem; top: 4px; }
}

/* Readout tiles */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
@media (max-width: 960px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
.tile { display: grid; gap: 0.45rem; align-content: start; }
.tile .v { font-family: var(--display); font-size: 1.9rem; font-weight: 400; line-height: 1.05; color: var(--arc); text-shadow: 0 0 18px var(--arc-glow); font-variant-numeric: tabular-nums; }
.tile .term { font-family: var(--display); font-size: 1.25rem; color: var(--gold); }
.tile p { font-size: 0.95rem; color: #c4d6e4; }
.tile .s { font-family: var(--mono); font-size: 0.68rem; color: var(--faint); }
.tile .s a { color: var(--dim); }

.finally { display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; color: var(--dim); }
.finally p { color: var(--text); flex: 1 1 20rem; min-width: 0; }

footer { padding-block: 2rem 7rem; color: var(--faint); font-size: 0.85rem; border-top: 1px solid var(--line); margin-top: 1rem; }
footer .wrap { display: grid; gap: 0.3rem; }

/* States */
.state { padding-block: 5rem; max-width: 34rem; display: grid; gap: 0.8rem; }
.state h2 { font-family: var(--display); font-size: 2rem; font-weight: 400; }
.state p { color: var(--dim); }
.scan { height: 2px; width: 100%; background: linear-gradient(90deg, transparent, var(--arc), transparent); background-size: 40% 100%; background-repeat: no-repeat; animation: scan 1.4s ease-in-out infinite; box-shadow: 0 0 10px var(--arc-glow); }
@keyframes scan { from { background-position: -40% 0; } to { background-position: 140% 0; } }

/* Concierge */
.ask-fab {
  position: fixed; z-index: 30;
  right: calc(1.1rem + env(safe-area-inset-right, 0px));
  bottom: calc(1.1rem + env(safe-area-inset-bottom, 0px));
  width: 62px; height: 62px; border-radius: 50%; cursor: pointer; border: 1px solid var(--arc);
  background: radial-gradient(circle, rgba(98, 227, 255, 0.35) 0%, rgba(98, 227, 255, 0.08) 45%, rgba(4, 7, 12, 0.9) 70%);
  box-shadow: 0 0 26px -2px var(--arc-glow), inset 0 0 14px var(--arc-glow);
  display: grid; place-items: center; color: var(--arc);
  font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.14em;
  animation: pulse 3.2s ease-in-out infinite;
}
@keyframes pulse { 50% { box-shadow: 0 0 40px 2px var(--arc-glow), inset 0 0 18px var(--arc-glow); } }
.drawer {
  position: fixed; z-index: 40; top: 0; right: 0; bottom: 0;
  width: min(30rem, 100%); background: rgba(6, 11, 18, 0.96); border-left: 1px solid var(--arc);
  box-shadow: -10px 0 60px -20px var(--arc-glow);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px);
  transform: translateX(104%); transition: transform 0.35s cubic-bezier(.2,.7,.2,1);
}
.drawer.open { transform: none; }
.drawer-head { display: flex; align-items: center; gap: 0.8rem; padding: 1rem 1.2rem; border-bottom: 1px solid var(--line); }
.drawer-head h2 { font-family: var(--display); font-size: 0.95rem; letter-spacing: 0.24em; text-transform: uppercase; }
.drawer-head .close { margin-left: auto; background: none; border: 0; cursor: pointer; font-size: 1.5rem; line-height: 1; color: var(--dim); padding: 0.2rem 0.4rem; }
.thread { overflow-y: auto; padding: 1.2rem; display: grid; gap: 1rem; align-content: start; }
.msg { display: grid; gap: 0.4rem; }
.msg.you { justify-items: end; }
.msg.you .bubble { background: var(--arc-soft); border: 1px solid var(--line); color: var(--text); border-radius: 4px; padding: 0.55rem 0.85rem; max-width: 88%; font-size: 0.95rem; }
.msg.att .bubble { display: grid; gap: 0.7rem; }
.msg.att .who { color: var(--arc); }
.msg.note { color: var(--dim); font-size: 0.9rem; font-style: italic; }
.prompts { display: flex; flex-wrap: wrap; gap: 0.45rem; }
.prompt { font-family: var(--body); font-size: 0.85rem; text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 3px; padding: 0.4rem 0.75rem; cursor: pointer; color: var(--text); }
.prompt:hover { border-color: var(--arc); color: var(--arc); }
.composer { border-top: 1px solid var(--line); padding: 0.9rem 1.2rem 1.1rem; display: grid; gap: 0.6rem; }
.composer textarea { width: 100%; resize: none; min-height: 3.2rem; max-height: 9rem; font: inherit; font-size: 1rem; background: var(--deck); color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 0.6rem 0.75rem; }
.composer textarea:focus { border-color: var(--arc); outline: none; box-shadow: 0 0 0 3px var(--arc-soft); }
.composer-row { display: flex; align-items: center; gap: 0.6rem; }
.composer-row .hint { font-family: var(--mono); font-size: 0.66rem; color: var(--faint); letter-spacing: 0.06em; }
.send { margin-left: auto; padding: 0.5rem 1rem; }
.scrim { position: fixed; inset: 0; z-index: 35; background: rgba(2, 4, 8, 0.6); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.scrim.on { opacity: 1; pointer-events: auto; }

@media (prefers-reduced-motion: reduce) {
  .core .ring, .online::before, .ask-fab, .scan { animation: none; }
  .drawer, .scrim, .panel, .btn { transition: none; }
}
</style>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">ATTACHÉ</span></div>
    <div class="sys">
      <span class="clock online" id="clock">DXB <b>--:--</b></span>
      <div class="edition-nav" id="editionNav" hidden>
        <button type="button" id="prevEd" aria-label="Earlier edition">‹</button>
        <select id="edSelect" aria-label="Choose an edition"></select>
        <button type="button" id="nextEd" aria-label="Later edition">›</button>
      </div>
    </div>
  </div>
</header>

<main id="main">
  <div class="wrap">
    <section class="state">
      <span class="label">Initialising</span>
      <h2>Compiling today's briefing…</h2>
      <div class="scan"></div>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">
    <span class="label">System note</span>
    <p>A new edition is compiled from public reporting every morning at 06:40 Dubai time. Figures are as reported in the linked sources, so check them before quoting.</p>
  </div>
</footer>

<button class="ask-fab" id="askFab" type="button" aria-label="Ask Attaché" hidden>ASK</button>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Ask Attaché" aria-hidden="true">
  <div class="drawer-head">
    <span class="brand-mark" aria-hidden="true"></span>
    <h2>Ask Attaché</h2>
    <button class="close" id="closeDrawer" type="button" aria-label="Close">×</button>
  </div>
  <div class="thread" id="thread"></div>
  <form class="composer" id="composer">
    <textarea id="askInput" rows="2" placeholder="Prepare me for dinner with a banker tonight…"></textarea>
    <div class="composer-row">
      <span class="hint" id="askHint">Answers draw on today's edition.</span>
      <button class="btn send" id="sendBtn" type="submit">Ask</button>
    </div>
  </form>
</aside>

<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const main = $("#main");
  const SVGNS = "http://www.w3.org/2000/svg";

  /* Small DOM builder: every piece of data goes in as text, never as HTML. */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);

  /* ---------- Voice: reads the front page aloud ---------- */
  const voice = (() => {
    const synth = window.speechSynthesis;
    const api = { supported: !!(synth && window.SpeechSynthesisUtterance), speaking: false };
    let queue = [];
    function pickVoice() {
      const vs = synth.getVoices() || [];
      return vs.find((v) => /en-GB/i.test(v.lang) && /daniel|arthur|male|george|oliver/i.test(v.name))
        || vs.find((v) => /en-GB/i.test(v.lang)) || vs.find((v) => /^en/i.test(v.lang)) || null;
    }
    function setButton() {
      const btn = $("#readBtn");
      if (!btn) return;
      btn.classList.toggle("playing", api.speaking);
      btn.lastChild.textContent = api.speaking ? "Stop" : "Brief me aloud";
    }
    function mark(i) {
      document.querySelectorAll(".story.speaking").forEach((el) => el.classList.remove("speaking"));
      if (i == null) return;
      const el = document.getElementById("story-" + i);
      if (el) { el.classList.add("speaking"); el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
    }
    function script(b) {
      const l = b.lede || {};
      const parts = [{ text: greeting() + ". Here is your briefing for " + fmtLong(b.date) + ". " + str(l.headline) + ". " + (str(l.summary) || str(arr(l.body)[0])) }];
      arr(b.stories).slice(0, 6).forEach((x, i) => parts.push({ story: i, text: "Number " + (i + 1) + ". " + str(x.headline) + ". " + (str(x.brief) || str(x.summary)) + (str(x.say) ? " If it comes up, you might say: " + str(x.say) : "") }));

    }

      queue = [];
      if (api.supported) synth.cancel();

    };

  /* ---------- Concierge (asks Claude on the viewer's account) ---------- */
  const concierge = (() => {
    let sample = null, turns = [], ctl = null, busy = false;
    const thread = $("#thread"), input = $("#askInput"), send = $("#sendBtn"), hint = $("#askHint");
    const api = { available: false };

    function rules() {
      const b = state.current;
      const json = JSON.stringify(b);
      return [
        "You are Attaché, a discreet, very well-read personal briefer, in the spirit of a calm and capable AI butler, for one person who lives in Dubai.",
        "Your job is to help them hold intelligent, gracious conversations about world affairs, geopolitics, markets and culture.",
        "Ground every answer in today's edition below (dated " + str(b && b.date) + "). You may add general background from your own knowledge,",
        "but you cannot browse, so say plainly when something may have moved on since the edition was written. Never invent figures, quotes or sources.",
        "Style: composed, precise, lightly dry wit. Plain text only, no markdown, no headings, no bullet symbols.",
        "The reader is busy and often on the move: keep answers under about 90 words unless asked for more. When useful, give one sentence they could say aloud.",
        "If asked about someone they will meet (a banker, a diplomat, an engineer), tailor which stories matter to that person and suggest a good question to ask them.",
        "",
        "TODAY'S EDITION (JSON):",
        json.length > 60000 ? json.slice(0, 60000) : json,
      ].join("\n");
    }
    function bubbleText(text) {
      const clean = str(text).replace(/\*\*(.+?)\*\*/g, "$1").replace(/^#+\s*/gm, "");
      return clean.split(/\n{2,}/).map((p) => h("p", null, p.trim())).filter((p) => p.textContent);
    }
    const scrollEnd = () => { thread.scrollTop = thread.scrollHeight; };
    function addAtt() {
      const body = h("div", { class: "bubble" }, h("p", { class: "msg note" }, "Processing…"));
      thread.append(h("div", { class: "msg att" }, h("span", { class: "label who" }, "Attaché"), body));
      return body;
    }
    function suggestions() {
      const first = arr(state.current && state.current.stories)[0];
      const list = ["Brief me in thirty seconds", "Prepare me for dinner with a banker", "What should I avoid saying today?",
        first ? "Background on “" + str(first.headline) + "”" : null].filter(Boolean);
      return h("div", { class: "prompts" }, list.map((p) => h("button", { class: "prompt", type: "button", onclick: () => ask(p) }, p)));
    }
    api.reset = () => {
      if (ctl) ctl.abort();
      turns = [];
      thread.replaceChildren(
        h("div", { class: "msg att" }, h("span", { class: "label who" }, "Attaché"),
          h("div", { class: "bubble" }, h("p", null, "At your service. Ask me anything about today's briefing: the background, what to say, or how to read the room."))),
        suggestions());
    };
    function setBusy(on) {
      busy = on; send.textContent = on ? "Stop" : "Ask"; send.type = on ? "button" : "submit";
    }
    async function ask(text) {
      text = str(text).trim();
      if (!text || busy || !sample) return;
      api.open();
      input.value = "";
      thread.append(h("div", { class: "msg you" }, h("div", { class: "bubble" }, text)));
      turns.push({ role: "user", content: text });
      while (turns.length > 16) turns.splice(0, 2);
      const body = addAtt();
      scrollEnd();
      ctl = new AbortController();
      setBusy(true);
      try {
        const { text: answer, truncated } = await sample([{ role: "user", content: rules() }, ...turns], {
          cache: false, signal: ctl.signal,
          onText: ({ text: t }) => { body.replaceChildren(...bubbleText(t)); scrollEnd(); },
        });
        turns.push({ role: "assistant", content: answer });
        if (truncated) body.append(h("p", { class: "msg note" }, "Cut short. Ask for less at a time."));
      } catch (e) {
        turns.pop();
        const partial = e && e.text, code = e && e.code;
        body.replaceChildren(...(partial ? bubbleText(partial) : []));
        const note = (t) => body.append(h("p", { class: "msg note" }, t));
        if (code === "cancelled") { if (!partial) note("Stopped."); }
        else if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) {
          note("Attaché needs your permission to answer. Allow it from this page's permissions menu, then ask again.");
          hint.textContent = "Permission needed to answer.";
        } else if (code === "rate_limited") note("Too many questions at once. Wait a minute, then ask again.");
        else if (code === "session_expired") note("Your session has expired. Sign in again, then ask.");
        else if (code === "refused") note("Attaché can't help with that one. Try asking it another way.");
        else note("The answer was interrupted. Ask again to retry.");

    }

      $("#drawer").classList.add("open"); $("#drawer").setAttribute("aria-hidden", "false"); $("#scrim").classList.add("on");
      setTimeout(() => input.focus({ preventScroll: true }), 50);
    };
    function close() { $("#drawer").classList.remove("open"); $("#drawer").setAttribute("aria-hidden", "true"); $("#scrim").classList.remove("on"); }
    api.askAbout = (x) => ask("Go deeper on “" + str(x.headline) + "”. What's the fuller story, the strongest case on each side, and how should I bring it up?");
    api.init = async () => {
      try { sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch { sample = null; }
      api.available = !!sample;
      if (api.available && state.current) { $("#askFab").hidden = false; renderBrief(state.current); }
    };
    $("#askFab").addEventListener("click", api.open);
    $("#closeDrawer").addEventListener("click", close);
    $("#scrim").addEventListener("click", close);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
    $("#composer").addEventListener("submit", (e) => { e.preventDefault(); ask(input.value); });
    send.addEventListener("click", (e) => { if (busy) { e.preventDefault(); ctl && ctl.abort(); } });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); } });
    return api;
  })();

  /* ---------- Data: the artifact's shared store, or static files when self-hosted ---------- */
  async function loadStatic() {
    try {
      const idx = await (await fetch("briefs/index.json", { cache: "no-store" })).json();
      const list = await Promise.all(arr(idx.editions).slice(0, 30).map((d) =>
        fetch("briefs/" + d + ".json", { cache: "no-store" }).then((r) => r.json()).catch(() => null)));
      setBriefs(list.filter(Boolean));
    } catch { renderUnreachable(); }
  }
  async function boot() {
    concierge.init();
    if (!(window.claude && window.claude.use)) return loadStatic();
    let db = null;
    try { db = await window.claude.use("db"); } catch { db = null; }
    if (!db) return loadStatic();
    let settled = false;
    const timer = setTimeout(() => { if (!settled && !state.current) renderUnreachable(); }, 10000);
    db.collection("briefs").orderBy("date", "desc").limit(30).onSnapshot(
      (snap) => {
        if (!snap.metadata.fromCache) { settled = true; clearTimeout(timer); }
        const list = snap.docs.filter((d) => d.exists).map((d) => d.data());
        if (!list.length && !snap.metadata.fromCache) return renderEmpty();
        if (list.length) setBriefs(list);
      },
      () => { settled = true; clearTimeout(timer); if (!state.current) loadStatic(); });
  }
  boot();
})();
</script>
