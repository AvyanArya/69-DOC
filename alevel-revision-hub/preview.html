      return '<button type="button" class="qchip' + (i === K.current ? ' on' : '') + (has ? ' done' : '') + '" data-action="mark-go" data-i="' + i + '"><b>Q' + esc(qq.n) + '</b><span class="num small">' + (has ? K.scores[i] : '–') + '/' + (qq.marks == null ? '?' : qq.marks) + '</span></button>';
    }).join('') + '</div>';
    const t = K.timeOn[K.current] || 0, sugg = q.marks ? q.marks * mpm * 60 : 0;
    html += '<div class="mark-cols"><section class="card"><div class="q-head"><h2>Question ' + esc(q.n) + '</h2><span class="muted small">You spent <b class="num">' + RH.timer.fmt(t) + '</b>' + (sugg ? ' (aim ' + RH.timer.fmt(sugg) + ')' + (t > sugg * 1.3 ? ' · <span class="pace-bad">too long</span>' : '') : '') + '</span></div>' +
      (q.choice ? '<p class="note choice-note">' + C.icon('flag') + esc(choiceNote(p, q)) + ' Only your better mark counts.</p>' : '') +
      '<div class="qcrop" data-qdraw="' + K.current + '" data-paper="' + p.id + '"></div>' +
      (K.notes[K.current] ? '<div class="tip"><span class="label">Your notes</span><p>' + esc(K.notes[K.current]) + '</p></div>' : '') +
      '<div class="score-row"><label for="mk-score"><b>Marks scored</b></label><input id="mk-score" type="number" min="0" max="' + (q.marks || 200) + '" data-mscore="' + K.current + '" value="' + (K.scores[K.current] != null ? esc(K.scores[K.current]) : '') + '" inputmode="numeric"><span class="num">/ ' + (q.marks == null ? '?' : q.marks) + '</span>' +
      '<button type="button" class="btn alt sm" data-action="mark-full" data-i="' + K.current + '">Full marks</button><button type="button" class="btn alt sm" data-action="mark-zero" data-i="' + K.current + '">0</button>' +
      '<button type="button" class="btn sm" data-action="mark-next">Next question' + C.icon('right') + '</button></div>' +
      '<div class="note ai-mark"><p>' + C.icon('spark') + '<b>Get this answer marked by Claude.</b> Photograph what you wrote; the question' + (p.msFile ? ' and mark scheme page are' : ' is') + ' added for you.</p><button type="button" class="btn alt sm" data-action="mark-ai" data-i="' + K.current + '">' + C.icon('check') + 'Check with AI</button></div>' +
      '<div class="field"><label for="mk-topic">Topic this question tests</label><select id="mk-topic" data-paper="' + p.id + '" data-qt="' + K.current + '"><option value="">–</option>' + topicOpts(p.subject, q.topic) + '</select></div></section>' +
      '<section class="card ms-pane"><div class="card-head"><h2>Mark scheme</h2>' + (p.msFile ? '<span class="row-actions"><button type="button" class="icon-btn" data-action="ms-page" data-v="-1" aria-label="Previous page">' + C.icon('left') + '</button><span class="num small">page ' + (msPage + 1) + (p.msPagesCount ? ' / ' + p.msPagesCount : '') + '</span><button type="button" class="icon-btn" data-action="ms-page" data-v="1" aria-label="Next page">' + C.icon('right') + '</button></span>' : '') + '</div>' +
      (p.msFile ? '<div class="qcrop" data-pagedraw="' + msPage + '" data-kind="ms" data-paper="' + p.id + '"></div>'
        : '<p class="muted">No mark scheme added for this paper.</p><label class="btn alt file-btn">' + C.icon('upload') + 'Add the mark scheme PDF<input type="file" accept="application/pdf,.pdf" data-paperfile="ms" data-paper="' + p.id + '"></label>') + '</section></div>';
    html += '<label class="toggle"><input type="checkbox" data-mlog="1"' + (K.logMistakes ? ' checked' : '') + '><span class="tg" aria-hidden="true"></span><span class="tg-t"><b>Add lost marks to topic mistakes logs</b><span class="help">For questions linked to a topic, a line goes into that topic\'s notes when you lose more than half the marks.</span></span></label>';
    return html;
  };

  function saveResult() {
    const s0 = st(), K = s0.portal.marking, p = s0.portal.papers[K.paper];
    const tt = totals(p, K.qs, K.scores), max = tt.max, score = tt.score;
    if (!max) { C.toast('Add the marks for each question on the paper page first.'); return; }
    const today = U.today();
    store.update(function (s) {
      const att = { id: 'a' + U.uid(), paper: p.id, title: p.title, subject: p.subject, single: K.single, date: today, score: score, max: max, used: K.used, dur: K.dur,
        per: K.qs.map((i) => [p.questions[i].n, Number(K.scores[i]) || 0, p.questions[i].marks || 0, Math.round(K.timeOn[i] || 0)]) };
      s.portal.attempts.push(att);
      if (!K.single && p.subject) s.papers.push({ id: 'p' + U.uid(), subject: p.subject, paper: p.code || p.title, series: p.series || '', score: score, max: max, date: today, notes: 'Sat in the exam portal' });
      if (K.logMistakes) K.qs.forEach(function (i) {
        const q = p.questions[i], got = Number(K.scores[i]) || 0;
        if (q.topic && q.marks && got < q.marks / 2) {
          const t = s.topics[q.topic] || (s.topics[q.topic] = { c: 0, p: [], notes: '', last: null, n: 0 });
          t.notes = (t.notes ? t.notes + '\n' : '') + '• ' + U.fmtShort(today) + ': lost marks on ' + p.title + ' Q' + q.n + ' (' + got + '/' + q.marks + ')';
        }
      });
      s.activity[today] = (s.activity[today] || 0) + 1;
      s.portal.marking = null;
    });
    RH.ui.tabs.portal = 'results';
    C.toast('Saved: ' + score + '/' + max + ' (' + U.pct(score / max) + ')');
    location.hash = 'papers';
    RH.render();
  }

  // Results tab: portal attempts plus papers logged by hand.
  function spark(points) {
    if (points.length < 2) return '';
    const w = 160, h = 40, pad = 4;
    const xs = (i) => pad + i * (w - 2 * pad) / (points.length - 1);
    const ys = (v) => h - pad - v * (h - 2 * pad);
    const d = points.map((v, i) => (i ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(v).toFixed(1)).join(' ');
    const last = points.length - 1;
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Score trend"><path class="sp-grid" d="M' + pad + ' ' + ys(0.5) + 'H' + (w - pad) + '"/><path class="sp-line" d="' + d + '"/><circle class="sp-end" cx="' + xs(last) + '" cy="' + ys(points[last]) + '" r="3"/></svg>';
  }
  RH.views.results = function () {
    const s = st(), today = U.today();
    let html = '<div class="trend-grid">' + M.subjects.map(function (sub) {
      const mine = s.papers.filter((p) => p.subject === sub.id).sort((a, b) => a.date.localeCompare(b.date));
      const pcts = mine.map((p) => p.score / p.max);
      const last3 = pcts.slice(-3);
      const avg = last3.length ? last3.reduce((a, x) => a + x, 0) / last3.length : null;
      return '<div class="trend" data-subj="' + sub.id + '">' + C.stag(sub.id) + '<span class="tr-n num">' + (avg == null ? '–' : U.pct(avg)) + '</span><span class="muted small">' + (mine.length ? 'average of last ' + last3.length : 'no papers yet') + '</span>' + spark(pcts) + '</div>';
    }).join('') + '</div>';
    if (s.portal.attempts.length) html += '<section class="card"><h2>Papers sat in the portal</h2>' + attemptTable(s.portal.attempts) + '</section>';
    const sid = RH.ui.paperSubj || 'physics', sub = M.subject[sid];
    html += '<section class="card"><h2>Log a paper you did on paper</h2><form id="paperForm" class="paper-form">' +
      '<div class="form-grid"><div class="field"><label for="p-subj">Subject</label><select id="p-subj" name="subject">' + M.subjects.map((x) => '<option value="' + x.id + '"' + (x.id === sid ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label for="p-paper">Paper</label><select id="p-paper" name="paper">' + sub.papers.map((p) => '<option value="' + esc(p.code) + '">' + esc(p.code + ' ' + p.name.replace(/^Paper \w+: /, '')) + '</option>').join('') + '<option value="Other">Other / practice paper</option></select></div>' +
      '<div class="field"><label for="p-series">Series</label><input id="p-series" name="series" placeholder="e.g. June 2023"></div></div>' +
      '<div class="form-grid"><div class="field"><label for="p-score">Score</label><input id="p-score" name="score" type="number" min="0" step="1" required></div>' +
      '<div class="field"><label for="p-max">Out of</label><input id="p-max" name="max" type="number" min="1" step="1" required value="' + (sub.papers[0] ? sub.papers[0].marks : 100) + '"></div>' +
      '<div class="field"><label for="p-date">Date</label><input id="p-date" name="date" type="date" value="' + today + '"></div></div>' +
      '<div class="field"><label for="p-notes">What went wrong?</label><input id="p-notes" name="notes" placeholder="Topics to fix"></div>' +
      '<button type="submit" class="btn">' + C.icon('plus') + 'Log paper</button></form></section>';
    const list = s.papers.slice().sort((a, b) => b.date.localeCompare(a.date));
    html += '<section class="card"><h2>All paper scores</h2>' + (list.length ? '<div class="table-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Subject</th><th>Paper</th><th class="num">Score</th><th class="num">%</th><th>Notes</th><th></th></tr></thead><tbody>' +
      list.map((p) => '<tr data-subj="' + p.subject + '"><td class="num">' + esc(U.fmtShort(p.date)) + '</td><td>' + C.stag(p.subject) + '</td><td>' + esc(p.paper) + (p.series ? ' <span class="muted">' + esc(p.series) + '</span>' : '') + '</td><td class="num num">' + p.score + '/' + p.max + '</td><td class="num num"><b>' + U.pct(p.score / p.max) + '</b></td><td class="small">' + esc(p.notes || '') + '</td>' +
        '<td><button type="button" class="icon-btn" data-action="paper-del" data-id="' + p.id + '" aria-label="Delete">' + C.icon('trash') + '</button></td></tr>').join('') + '</tbody></table></div>' : '<p class="muted">No scores yet. Sit a paper in the portal or log one above.</p>') + '</section>';
    return html;
  };

  // ---------- Actions ----------
  RH.onSubmit.uploadForm = async function (f) {
    const qp = f.querySelector('#up-qp').files[0], ms = f.querySelector('#up-ms').files[0];
    if (!qp) { C.toast('Choose the question paper PDF first.'); return; }
    const btn = $('#up-go'), status = $('#up-status');
    btn.disabled = true; btn.textContent = 'Reading the paper…';
    status.textContent = 'Loading the PDF reader and finding the questions. This takes a few seconds.';
    try {
      const paper = await P.analyse(qp, ms);
      C.toast('Found ' + U.plural(paper.questions.length, 'question') + (paper.marks ? ' (' + paper.marks + ' marks)' : ''));
      location.hash = 'paper-' + paper.id;
      RH.render();
    } catch (e) {
      btn.disabled = false; btn.innerHTML = C.icon('paper') + 'Read paper';
      status.textContent = 'That file could not be read: ' + (e && e.message ? e.message : 'unknown error') + '. Make sure it is a PDF, not a scan inside a ZIP.';
    }
  };
  RH.onChange.push(function (el) {
    if (el.id === 'up-qp' || el.id === 'up-ms') { const n = $('#' + el.id + '-name'); if (n) n.textContent = el.files[0] ? el.files[0].name : 'Choose or drop the file'; return true; }
    if (el.dataset.paperfile) {
      const id = el.dataset.paper, kind = el.dataset.paperfile, file = el.files && el.files[0];
      if (!file) return true;
      (async function () {
        try {
          const buf = await file.arrayBuffer();
          const read = await readPdf(buf.slice(0));
          await RH.files.put(id + ':' + kind, new Blob([buf], { type: 'application/pdf' }));
          delete (docs[id] || {})[kind];
          Object.keys(pageCache).forEach((k) => { if (k.indexOf(id + '|' + kind + '|') === 0) delete pageCache[k]; });
          store.update(function (s) {
            const p = s.portal.papers[id];
            if (kind === 'ms') { p.msFile = file.name; p.msPagesCount = read.pages.length; const map = msPages(read.pages, p.questions); p.questions.forEach((q) => { q.ms = map[q.n] != null ? map[q.n] : null; }); }
            else { p.file = file.name; p.pages = read.pages.length; }
          });
          C.toast(kind === 'ms' ? 'Mark scheme added' : 'Question paper replaced');
        } catch (e) { C.toast('That file could not be read as a PDF.'); }
      })();
      return true;
    }
    if (el.dataset.pf) {
      const id = el.dataset.paper, k = el.dataset.pf;
      store.update(function (s) { const p = s.portal.papers[id]; p[k] = k === 'dur' || k === 'marks' ? Number(el.value) || null : el.value; if (k === 'dur' && !p.dur) p.dur = 60; }, { silent: k === 'title' });
      return true;
    }
    if (el.dataset.qm != null && el.dataset.paper) {
      store.update(function (s) {
        const p = s.portal.papers[el.dataset.paper];
        p.questions[Number(el.dataset.qm)].marks = el.value === '' ? null : Number(el.value);
        const sum = p.questions.reduce((a, q) => a + (q.marks || 0), 0);
        if (sum) p.marks = sum;
      });
      return true;
    }
    if (el.dataset.qt != null && el.dataset.paper) {
      store.update(function (s) { s.portal.papers[el.dataset.paper].questions[Number(el.dataset.qt)].topic = el.value; }, { silent: true });
      return true;
    }
    if (el.dataset.mlog) { store.update(function (s) { s.portal.marking.logMistakes = el.checked; }, { silent: true }); return true; }
    return false;
  });
  RH.onInput.push(function (el) {
    if (el.dataset.exnote != null) { const L = live(); if (L) { L.notes[el.dataset.exnote] = el.value; store.update(() => {}, { silent: true }); } return true; }
    if (el.dataset.mscore != null) {
      store.update(function (s) { s.portal.marking.scores[el.dataset.mscore] = el.value; }, { silent: true });
      return true;
    }
    return false;
  });

  RH.actions['exam-start'] = function (el) {
    const id = el.dataset.id, single = el.dataset.q;
    const p = st().portal.papers[id];
    if (st().portal.live) {
      C.confirm('Start a new exam?', 'You have an exam in progress. Starting another ends it without saving.', 'Start new exam', () => openStart(p, single));
      return;
    }
    openStart(p, single);
  };
  function openStart(p, single) {
    const q = single != null ? p.questions[Number(single)] : null;
    C.openModal(single != null ? 'Practise question ' + esc(q.n) : 'Sit ' + esc(p.title),
      '<p>' + (single != null ? U.plural(q.marks || 0, 'mark') + '. The timer is set from the paper\'s minutes per mark.' : U.plural(p.questions.length, 'question') + (p.marks ? ', ' + p.marks + ' marks' : '') + ', ' + U.mins(p.dur) + '.') + '</p>' +
      '<div class="field"><label for="ex-extra">Extra time</label><select id="ex-extra"><option value="0">None</option><option value="10">10%</option><option value="25">25%</option><option value="50">50%</option></select></div>' +
      '<label class="toggle"><input type="checkbox" id="ex-strict"><span class="tg" aria-hidden="true"></span><span class="tg-t"><b>Exam conditions</b><span class="help">No pausing. Have paper, pen and calculator ready.</span></span></label>' +
      '<div class="row-actions"><button type="button" class="btn lg" data-action="exam-go-start" data-id="' + p.id + '"' + (single != null ? ' data-q="' + single + '"' : '') + '>' + C.icon('play') + 'Start the clock</button><button type="button" class="btn alt" data-action="modal-close">Cancel</button></div>');
  }
  RH.actions['exam-go-start'] = function (el) {
    const extra = Number(($('#ex-extra') || {}).value || 0), strict = !!($('#ex-strict') || {}).checked;
    C.closeModal(); C.primeAudio();
    P.start(el.dataset.id, el.dataset.q != null ? Number(el.dataset.q) : null, { extra: extra, strict: strict });
  };
  RH.actions['exam-go'] = (el) => { if (el.dataset.i !== '') switchTo(Number(el.dataset.i)); };
  RH.actions['exam-flag'] = () => { store.update(function (s) { const L = s.portal.live; L.flags[L.current] = !L.flags[L.current]; }, { silent: true }); RH.render({ keepScroll: true }); };
  RH.actions['exam-done'] = function () {
    const L = live();
    store.update(function (s) { const l = s.portal.live; l.done[l.current] = !l.done[l.current]; }, { silent: true });
    const pos = L.qs.indexOf(L.current);
    if (L.done[L.current] && pos < L.qs.length - 1) switchTo(L.qs[pos + 1]); else RH.render({ keepScroll: true });
  };
  RH.actions['exam-pause'] = function () {
    store.update(function (s) {
      const L = s.portal.live;
      if (L.strict) return;
      if (L.paused) { L.endsAt = Date.now() + L.pausedLeft * 1000; L.since = Date.now(); L.paused = false; }
      else { L.pausedLeft = Math.max(0, (L.endsAt - Date.now()) / 1000); L.timeOn[L.current] = (L.timeOn[L.current] || 0) + (Date.now() - L.since) / 1000; L.paused = true; }
    }, { silent: true });
    RH.render({ keepScroll: true });
  };
  RH.actions['exam-full'] = function () {
    const el = document.querySelector('.exam-mode');
    try { if (document.fullscreenElement) document.exitFullscreen(); else if (el && el.requestFullscreen) el.requestFullscreen().catch(() => C.toast('Full screen is not available here.')); } catch (e) { C.toast('Full screen is not available here.'); }
  };
  RH.actions['exam-finish'] = function () {
    const L = live();
    const left = leftSec(L);
    if (left > 60 && !L.over) C.confirm('Finish the exam?', U.plural(Math.round(left / 60), 'minute') + ' left. You will move on to marking.', 'Finish and mark', finish);
    else finish();
  };
  RH.actions['exam-quit'] = () => { store.update(function (s) { s.portal.live = null; }); location.hash = 'papers'; };
  RH.actions['mark-go'] = (el) => { store.update(function (s) { s.portal.marking.current = Number(el.dataset.i); s.portal.marking.msPage = null; }, { silent: true }); RH.render(); };
  RH.actions['mark-next'] = function () {
    const K = st().portal.marking, pos = K.qs.indexOf(K.current);
    if (pos < K.qs.length - 1) RH.actions['mark-go']({ dataset: { i: String(K.qs[pos + 1]) } });
    else C.toast('That was the last question. Press "Save result".');
  };
  RH.actions['mark-full'] = function (el) { const K = st().portal.marking, p = st().portal.papers[K.paper]; store.update(function (s) { s.portal.marking.scores[el.dataset.i] = String(p.questions[Number(el.dataset.i)].marks || 0); }, { silent: true }); RH.actions['mark-next'](); };
  RH.actions['mark-zero'] = function (el) { store.update(function (s) { s.portal.marking.scores[el.dataset.i] = '0'; }, { silent: true }); RH.actions['mark-next'](); };
  RH.actions['ms-page'] = function (el) {
    const K = st().portal.marking, p = st().portal.papers[K.paper], q = p.questions[K.current];
    const cur = K.msPage != null ? K.msPage : (q.ms != null ? q.ms : 0);
    const next = U.clamp(cur + Number(el.dataset.v), 0, Math.max(0, (p.msPagesCount || 1) - 1));
    store.update(function (s) { s.portal.marking.msPage = next; }, { silent: true });
    RH.render({ keepScroll: true });
  };
  RH.actions['mark-save'] = saveResult;
  RH.actions['mark-ai'] = function (el) {
    const K = st().portal.marking, p = st().portal.papers[K.paper], i = Number(el.dataset.i), q = p.questions[i];
    RH.ui.tabs['ck-src'] = 'paper';
    RH.checker.prefill({ subject: p.subject || 'maths', topic: q.topic || '', marks: q.marks ? String(q.marks) : '', answer: K.notes[i] || '', source: { kind: 'paper', paper: p.id, q: i, loading: true } });
    P.questionImages(p.id, i).then(async function (imgs) {
      const d = RH.ui.ck; d.qImgs = imgs;
      const ms = q.ms != null && p.msFile ? await P.msImage(p.id, q.ms) : null;
      d.msImgs = ms ? [ms] : []; d.source.loading = false; RH.ui.ckOpenMs = !!ms;
      RH.render({ keepScroll: true });
    }).catch((e) => C.toast(e.message));
  };
  RH.actions['q-preview'] = function (el) {
    const p = st().portal.papers[el.dataset.id], i = Number(el.dataset.i);
    C.openModal('Question ' + esc(p.questions[i].n), '<div class="qcrop" data-qdraw="' + i + '" data-paper="' + p.id + '"></div>', { wide: true });
    RH.afterRender.forEach((fn) => fn());
  };
  RH.actions['q-merge'] = function (el) {
    const i = Number(el.dataset.i);
    store.update(function (s) {
      const p = s.portal.papers[el.dataset.id], a = p.questions[i - 1], b = p.questions[i];
      a.r = a.r.concat(b.r); a.marks = (a.marks || 0) + (b.marks || 0) || null; a.n = a.n + '+' + b.n;
      p.questions.splice(i, 1);
    });
  };
  RH.actions['paper-remove'] = function (el) {
    const p = st().portal.papers[el.dataset.id];
    C.confirm('Delete "' + p.title + '"?', 'The PDF is removed from this device. Your saved results stay.', 'Delete paper', function () {
      RH.files.del(p.id + ':qp'); RH.files.del(p.id + ':ms');
      store.update(function (s) { delete s.portal.papers[p.id]; if (s.portal.live && s.portal.live.paper === p.id) s.portal.live = null; }, { silent: true });
      location.hash = 'papers';
      RH.render();
    });
  };
  RH.actions['attempt-del'] = function (el) {
    C.confirm('Delete this result?', 'It will be removed from your results.', 'Delete', () => store.update(function (s) { s.portal.attempts = s.portal.attempts.filter((a) => a.id !== el.dataset.id); }));
  };

  P.key = function (ev) {
    if (location.hash !== '#exam' || C.modalOpen() || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return false;
    const L = live(); if (!L || L.paused) return false;
    const pos = L.qs.indexOf(L.current);
    if (ev.key === 'ArrowRight' && pos < L.qs.length - 1) { switchTo(L.qs[pos + 1]); return true; }
    if (ev.key === 'ArrowLeft' && pos > 0) { switchTo(L.qs[pos - 1]); return true; }
    if (ev.key === 'f' || ev.key === 'F') { RH.actions['exam-flag'](); return true; }
    return false;
  };
  P.detect = detect; P.meta = meta; P.readPdf = readPdf;
})(window.RH = window.RH || {});
</script>
<script>
/* Check: an AI examiner for exam answers. Type or photograph a question, the mark scheme and your answer;
   Claude marks it the way an Edexcel examiner would, mark by mark with your own words as evidence, then shows
   exactly how to reach full marks, a model answer and an exam tip. Ask follow-up questions, improve the answer
   and resubmit, or get a similar practice question. */
(function (RH) {
  'use strict';
  const U = RH.util, M = RH.model, C = RH.c, esc = U.esc, $ = RH.$;
  const st = () => RH.store.state;
  const store = RH.store;
  const K = RH.checker = {};

  const GUIDE = {
    maths: '- Use Edexcel mark types: M (method), A (accuracy, dependent on the M before it), B (independent), dM (dependent method). Award follow-through (ft) only where the scheme allows. For "show that" questions every step must be shown. Check the final answer is in the form and accuracy asked for (exact value, 3 s.f., etc.).',
    further: '- Use Edexcel mark types: M (method), A (accuracy, dependent on the M before it), B (independent), dM (dependent method). Award follow-through (ft) only where the scheme allows. For proofs and "show that" questions the argument must be complete and clearly concluded. Check the final answer is in the form and accuracy asked for.',
    physics: '- Most marking points are worth 1 mark each. Final numerical answers need correct units and sensible significant figures; allow error carried forward (ecf) from an earlier part. For "explain" and "describe" questions each mark needs a separate, correct physics point in precise terms (no vague words like "it" or "energy goes up" without saying what). For 6-mark extended responses use the Edexcel levels: indicative content plus how well the answer is linked into a sustained line of reasoning.',
    economics: '- Edexcel Economics A uses levels for longer questions. Typical split (use the scheme given if it differs): 5 marks = knowledge 1, application 2, analysis 2; 8 = KAA 6 + evaluation 2; 10 = KAA 6 + evaluation 4; 12 = KAA 8 + evaluation 4; 15 = KAA 9 + evaluation 6; 25 = KAA 16 + evaluation 9. Reward precise definitions, accurate and fully labelled diagrams (described in words if handwritten), chains of reasoning that link cause to effect step by step, use of the extract or real-world data, and evaluation that weighs factors (magnitude, time period, assumptions, elasticities) and reaches a supported judgement.'
  };

  const resultTemplate = '{\n  "score": number, "max": number,\n  "verdict": "one sentence overall judgement, encouraging but honest",\n  "band": "short label, e.g. \\"M1 A1 M1 A0\\" or \\"KAA Level 2, Evaluation Level 1\\"",\n' +
    '  "points": [{"label": "e.g. M1, B1, Knowledge, Application, Evaluation", "criterion": "what earns this mark", "awarded": number, "available": number, "evidence": "the student\'s own words or working, quoted exactly, or empty", "comment": "why it was or was not awarded"}],\n' +
    '  "strengths": ["what the answer did well, specific"],\n  "improvements": [{"issue": "what cost marks", "fix": "exactly what to do next time", "example": "a rewritten sentence, line of working or labelled diagram description they could use"}],\n' +
    '  "modelAnswer": "a concise full-mark answer, with working where needed",\n  "examTip": "one tip about this command word or question type",\n  "transcript": "the handwritten answer as text if answer photos were given, else empty",\n' +
    '  "inferredScheme": true if you wrote the mark scheme yourself,\n  "topic": "the closest topic id from the list, or empty",\n  "nextStep": "one short thing to practise next"\n}';

  // ---------- Draft ----------
  function blank() { return { subject: 'economics', topic: '', marks: '', question: '', ms: '', answer: '', qImgs: [], msImgs: [], aImgs: [], source: null, parent: null }; }
  RH.ui.ck = RH.ui.ck || blank();
  RH.ui.ckRun = null;
  const draft = () => RH.ui.ck;
  K.removeImage = function (group, i) {
    const d = draft(), key = group === 'ck-q' ? 'qImgs' : group === 'ck-ms' ? 'msImgs' : 'aImgs';
    d[key].splice(i, 1);
    RH.render({ keepScroll: true });
  };
  K.prefill = function (o) {
    RH.ui.ck = Object.assign(blank(), o);
    if (location.hash !== '#check') location.hash = 'check'; else RH.render();
  };

  function topicLines(sid) {
    return M.subjectTopics(st(), M.subject[sid]).map((t) => t.gid + ' — ' + t.comp.name + ': ' + t.name).join('\n');
  }
  function imageGuide(d) {
    const parts = []; let n = 0;
    const add = (list, what) => { if (list.length) { parts.push('Photo' + (list.length > 1 ? 's ' : ' ') + (n + 1) + (list.length > 1 ? '–' + (n + list.length) : '') + ': ' + what); n += list.length; } };
    add(d.qImgs, 'the question'); add(d.msImgs, 'the mark scheme'); add(d.aImgs, 'the student\'s handwritten answer');
    return parts.length ? 'Attached photos, in order. ' + parts.join('. ') + '.' : '';
  }
  function markingPrompt(d) {
    const sub = M.subject[d.subject];
    const t = d.topic && M.topic[d.topic];
    return [
      'You are a senior Pearson Edexcel A-level ' + sub.name + ' (' + sub.spec + ') examiner and a supportive tutor. Mark the student\'s answer exactly as an Edexcel examiner would, then coach them to full marks.',
      '',
      'Rules:',
      '- Mark strictly against the mark scheme if one is given. If none is given, first work out the mark scheme an Edexcel examiner would use for this question, mark against it, and set "inferredScheme" to true. Never give marks for intent or for things the student did not write.',
      '- Accept correct alternative methods and equivalent wording.',
      GUIDE[d.subject],
      '- For every mark awarded or withheld, quote the student\'s own words or working as evidence.',
      '- Make the feedback specific to this answer: say exactly what to add, change or cut, and show it with an example.',
      '- The points must add up: the sum of "awarded" is "score" and the sum of "available" is "max".',
      '- If answer photos are attached, transcribe the handwriting faithfully, mistakes included, before marking.',
      '',
      (t ? 'Topic: ' + t.comp.name + ' – ' + t.name + '\n' : '') + 'Question' + (d.marks ? ' (' + d.marks + ' marks)' : '') + ':',
      d.question || '(see the question photo)',
      '',
      d.ms ? 'Mark scheme:\n' + d.ms : d.msImgs.length ? 'Mark scheme: see the photo.' : 'No mark scheme was provided.',
      '',
      'Student\'s answer:',
      d.answer || '(see the answer photos)',
      '',
      imageGuide(d),
      '',
      'Topic ids for ' + sub.name + ':',
      topicLines(d.subject),
      '',
      'Reply with only this JSON object:',
      resultTemplate
    ].join('\n');
  }

  function clean(r, d) {
    const num = (x) => Math.max(0, Number(x) || 0);
    const points = Array.isArray(r.points) ? r.points.map((p) => ({ label: String(p.label || ''), criterion: String(p.criterion || ''), awarded: num(p.awarded), available: Math.max(num(p.available), num(p.awarded)), evidence: String(p.evidence || ''), comment: String(p.comment || '') })) : [];
    let max = num(r.max) || Number(d.marks) || points.reduce((a, p) => a + p.available, 0);
    let score = Math.min(num(r.score), max || 999);
    return {
      score: score, max: max, verdict: String(r.verdict || ''), band: String(r.band || ''), points: points,
      strengths: (Array.isArray(r.strengths) ? r.strengths : []).map(String).slice(0, 6),
      improvements: (Array.isArray(r.improvements) ? r.improvements : []).map((x) => ({ issue: String(x.issue || ''), fix: String(x.fix || ''), example: String(x.example || '') })).slice(0, 6),
      modelAnswer: String(r.modelAnswer || ''), examTip: String(r.examTip || ''), transcript: String(r.transcript || ''),
      inferredScheme: !!r.inferredScheme, topic: M.topic[r.topic] && M.topic[r.topic].subject.id === d.subject ? r.topic : (d.topic || ''), nextStep: String(r.nextStep || '')
    };
  }

  // ---------- Running a check ----------
  async function runCheck() {
    const d = draft();
    if (!d.question.trim() && !d.qImgs.length) { C.toast('Add the question, as text or a photo.'); return; }
    if (!d.answer.trim() && !d.aImgs.length) { C.toast('Add your answer, typed or as photos.'); return; }
    const images = d.qImgs.concat(d.msImgs, d.aImgs);
    const maxImg = RH.ai.maxImages();
    if (images.length && !maxImg) { C.toast('Photos can’t be sent from this view. Type the question and answer instead.'); return; }
    if (images.length > maxImg) { C.toast('Too many photos: ' + images.length + ' attached, up to ' + maxImg + ' can be sent.'); return; }
    const id = 'k' + U.uid();
    const ctl = new AbortController();
    RH.ui.ckRun = { id: id, ctl: ctl, started: Date.now() };
    RH.render({ keepScroll: true });
    try {
      const raw = await RH.ai.ask(markingPrompt(d), { json: true, images: images, signal: ctl.signal, tier: 'complex' });
      const result = clean(raw, d);
      const rec = { id: id, date: U.today(), at: Date.now(), subject: d.subject, topic: result.topic, marks: Number(d.marks) || result.max, question: d.question.slice(0, 4000), ms: d.ms.slice(0, 4000), answer: d.answer.slice(0, 6000), imgs: { q: d.qImgs.length, ms: d.msImgs.length, a: d.aImgs.length }, source: d.source, parent: d.parent, result: result, chat: [] };
      for (const [list, tag] of [[d.qImgs, 'q'], [d.msImgs, 'ms'], [d.aImgs, 'a']]) for (let i = 0; i < list.length; i++) await RH.files.put('ck:' + id + ':' + tag + i, list[i]);
      store.update(function (s) {
        s.checks.unshift(rec);
        if (s.checks.length > 80) s.checks = s.checks.slice(0, 80);
        s.activity[rec.date] = (s.activity[rec.date] || 0) + 1;
        if (rec.topic && result.max && result.score / result.max < 0.5) {
          const ts = s.topics[rec.topic] || (s.topics[rec.topic] = { c: 0, p: [], notes: '', last: null, n: 0 });
          ts.notes = (ts.notes ? ts.notes + '\n' : '') + '• ' + U.fmtShort(rec.date) + ': ' + result.score + '/' + result.max + ' on a checked answer. ' + (result.improvements[0] ? result.improvements[0].fix : '');
        }
      }, { checks: true, silent: true });
      RH.ui.ckRun = null;
      RH.ui.ck = blank();
      RH.ui.ck.subject = rec.subject;
      location.hash = 'check-' + id;
      RH.render();
    } catch (e) {
      RH.ui.ckRun = null;
      RH.render({ keepScroll: true });
      if (e && e.code !== 'cancelled') C.toast(RH.ai.errorText(e));
    }
  }

  async function similar() {
    const d = draft();
    const t = d.topic && M.topic[d.topic];
    const sub = M.subject[d.subject];
    RH.ui.ckRun = { id: 'gen', ctl: new AbortController(), gen: true };
    RH.render({ keepScroll: true });
    try {
      const prompt = 'Write one new exam-style question for Pearson Edexcel A-level ' + sub.name + ' (' + sub.spec + ')' + (t ? ' on the topic "' + t.name + '" (' + t.comp.name + '). Specification points: ' + (t.pts || []).join('; ') : '') + '.\n' +
        (d.question ? 'Make it similar in style and difficulty to this question, but not the same:\n' + d.question + '\n' : 'Pick a typical mark tariff for this topic.\n') +
        (d.marks ? 'Make it worth ' + d.marks + ' marks.\n' : '') +
        'Use Edexcel command words and conventions. Include any data or context the question needs inside the question text.\nReply with only JSON: {"question": "the full question text", "marks": number, "markScheme": "the mark scheme in Edexcel style, one marking point per line"}';
      const r = await RH.ai.ask(prompt, { json: true, signal: RH.ui.ckRun.ctl.signal, tier: 'default' });
      Object.assign(d, { question: String(r.question || ''), marks: String(r.marks || d.marks || ''), ms: String(r.markScheme || ''), answer: '', qImgs: [], msImgs: [], aImgs: [], source: { kind: 'practice' }, parent: null });
      RH.ui.ckOpenMs = false;
      C.toast('New practice question ready. The mark scheme is hidden until it’s marked.');
    } catch (e) { if (e && e.code !== 'cancelled') C.toast(RH.ai.errorText(e)); }
    RH.ui.ckRun = null;
    RH.render({ keepScroll: true });
  }

  async function ask(id, text) {
    const rec = st().checks.find((c) => c.id === id);
    if (!rec || !text.trim()) return;
    store.update(function (s) { s.checks.find((c) => c.id === id).chat.push({ role: 'user', content: text.trim().slice(0, 2000) }); }, { checks: true, silent: true });
    RH.ui.ckChat = { id: id, text: '', ctl: new AbortController() };
    RH.render({ keepScroll: true });
    const now = st().checks.find((c) => c.id === id);
    const context = 'You are a supportive Pearson Edexcel A-level ' + M.subject[now.subject].name + ' tutor. You just marked this answer; the student is asking about the feedback. Answer in plain English, briefly (under 180 words unless they ask for more), refer to the mark scheme and their own words, and never just hand over a full answer to a different question. Use short paragraphs or a few bullets; no headings.\n\n' +
      'Question (' + now.marks + ' marks):\n' + (now.question || '(from a photo)') + '\n\nMark scheme:\n' + (now.ms || '(from a photo or written by you)') + '\n\nStudent answer:\n' + (now.answer || now.result.transcript || '(from photos)') + '\n\nYour marking:\n' + JSON.stringify({ score: now.result.score, max: now.result.max, points: now.result.points, improvements: now.result.improvements });
    const turns = [{ role: 'user', content: context }].concat(now.chat.slice(-12));
    try {
      const out = await RH.ai.ask(turns, { signal: RH.ui.ckChat.ctl.signal, tier: 'default', onText: function (u) { RH.ui.ckChat.text = u.text; const b = $('#ck-live'); if (b) b.textContent = u.text; } });
      store.update(function (s) { s.checks.find((c) => c.id === id).chat.push({ role: 'assistant', content: String(out) }); }, { checks: true, silent: true });
    } catch (e) {
      if (e && e.code !== 'cancelled') C.toast(RH.ai.errorText(e));
      store.update(function (s) { const c = s.checks.find((x) => x.id === id); if (c.chat.length && c.chat[c.chat.length - 1].role === 'user') c.chat.pop(); }, { checks: true, silent: true });
    }
    RH.ui.ckChat = null;
    RH.render({ keepScroll: true });
    const t = $('#ck-ask'); if (t) t.focus();
  }

  // ---------- Pieces of the page ----------
  function aiBanner() {
    const s = RH.ai.status();
    if (s === 'claude' || s === 'api') return '<p class="ai-line">' + C.icon('spark') + esc(RH.ai.label()) + '</p>';
    if (s === 'pending') return '<p class="ai-line muted">' + C.icon('spark') + 'Connecting to Claude…</p>';
    return '<div class="note"><b>Connect Claude to mark answers.</b> ' + (RH.ai.inClaude ? 'Claude was not allowed for this page. Allow it from the page’s Permissions menu, then reload.' : 'Open the hub on claude.ai, or add an Anthropic API key in <a href="#preferences">Settings</a>.') + '</div>';
  }
  function imgField(group, list, label, capture) {
    return '<div class="img-field"><label class="btn alt sm file-btn">' + C.icon(capture ? 'camera' : 'image') + label + '<input type="file" accept="image/*"' + (capture ? ' capture="environment"' : '') + ' multiple data-ckimg="' + group + '"></label>' + C.thumbs(list, 'ck-' + group, true) + '</div>';
  }
  function paperPicker() {
    const papers = Object.keys(st().portal.papers).map((k) => st().portal.papers[k]);
    if (!papers.length) return '<p class="muted small">No past papers uploaded yet. Add one in <a href="#papers">Past papers</a> and its questions show up here.</p>';
    const d = draft(), src = d.source && d.source.kind === 'paper' ? d.source : {};
    const p = src.paper && st().portal.papers[src.paper];
    return '<div class="form-grid"><label class="field"><span>Paper</span><select data-ckpick="paper"><option value="">Choose a paper</option>' + C.opts(papers.map((x) => [x.id, x.title]), src.paper || '') + '</select></label>' +
      (p ? '<label class="field"><span>Question</span><select data-ckpick="q"><option value="">Choose</option>' + C.opts(p.questions.map((q, i) => [i, 'Q' + q.n + (q.marks ? ' (' + q.marks + ' marks)' : '')]), src.q != null ? src.q : '') + '</select></label>' : '') + '</div>' +
      (src.loading ? '<p class="muted small">Cutting the question out of the PDF…</p>' : '');
  }

  function form() {
    const d = draft(), run = RH.ui.ckRun, s = RH.ai.status();
    const srcTab = C.tab('ck-src', 'type');
    const topics = M.subjectTopics(st(), M.subject[d.subject]);
    const ready = s === 'claude' || s === 'api';
    const practice = d.source && d.source.kind === 'practice';
    let html = '<form id="ckForm" class="card ck-form" onsubmit="return false">' +
      '<div class="ck-step"><span class="step-n">1</span><h2>The question</h2></div>' +
      '<div class="ck-subjects">' + M.subjects.map((x) => '<button type="button" class="pick-subj' + (d.subject === x.id ? ' on' : '') + '" data-subj="' + x.id + '" data-action="ck-subj" data-v="' + x.id + '" aria-pressed="' + (d.subject === x.id) + '">' + esc(x.name) + '</button>').join('') + '</div>' +
      C.tabs('ck-src', [['type', 'Type or photo', 'pen'], ['paper', 'From my past papers', 'paper'], ['practice', 'Practice question', 'spark']], srcTab);
    if (srcTab === 'paper') html += paperPicker();
    if (srcTab === 'practice') html += '<p class="muted small">Claude writes a new exam-style question for the topic you pick, with a hidden mark scheme.</p><div class="row-actions"><button type="button" class="btn alt" data-action="ck-similar"' + (ready && !run ? '' : ' disabled') + '>' + C.icon('spark') + (d.question ? 'Write a similar question' : 'Write a practice question') + '</button></div>';
    html += '<div class="form-grid"><label class="field"><span>Topic (optional)</span><select data-ck="topic"><option value="">Let Claude work it out</option>' + M.compsFor(st(), M.subject[d.subject], true).map((c) => '<optgroup label="' + esc(c.name) + '">' + c.topics.filter((t) => topics.indexOf(t) !== -1).map((t) => '<option value="' + t.gid + '"' + (d.topic === t.gid ? ' selected' : '') + '>' + esc(t.name) + '</option>').join('') + '</optgroup>').join('') + '</select></label>' +
      '<label class="field"><span>Marks</span><input type="number" min="1" max="50" inputmode="numeric" data-ck="marks" value="' + esc(d.marks) + '" placeholder="e.g. 8"></label></div>' +
      '<label class="field"><span>Question</span><textarea data-ck="question" rows="4" placeholder="Paste or type the question, including any extract or data it refers to">' + esc(d.question) + '</textarea></label>' +
      imgField('q', d.qImgs, 'Photo of the question', false) +
      (practice ? '<p class="help">' + C.icon('lock', 'i-sm') + ' The mark scheme for this practice question is hidden until your answer is marked.</p>'
        : '<details class="fold-lite"' + (d.ms || d.msImgs.length || RH.ui.ckOpenMs ? ' open' : '') + '><summary>Mark scheme <span class="muted">(recommended)</span></summary><textarea data-ck="ms" rows="4" placeholder="Paste the mark scheme for this question. Without one, Claude writes the scheme an Edexcel examiner would use.">' + esc(d.ms) + '</textarea>' + imgField('ms', d.msImgs, 'Photo of the mark scheme', false) + '</details>') +
      '<div class="ck-step"><span class="step-n">2</span><h2>Your answer</h2></div>' +
      '<label class="field"><span class="sr">Your answer</span><textarea data-ck="answer" rows="9" placeholder="Type your full answer as you would in the exam, or photograph your handwritten answer below">' + esc(d.answer) + '</textarea></label>' +
      imgField('a', d.aImgs, 'Photos of my written answer', true) +
      (d.parent ? '<p class="note">' + C.icon('rebuild', 'i-sm') + ' Improving an earlier answer. The new mark will be compared with the last one.</p>' : '') +
      '<div class="ck-go"><button type="button" class="btn lg" data-action="ck-mark"' + (ready && !run ? '' : ' disabled') + '>' + C.icon('check') + 'Mark my answer</button>' + aiBanner() + '</div></form>';
    return html;
  }

  function running() {
    const run = RH.ui.ckRun;
    if (!run || run.gen) return '';
    const secs = Math.floor((Date.now() - run.started) / 1000);
    const steps = ['Reading the question and mark scheme', 'Reading your answer', 'Marking point by point', 'Writing your feedback'];
    const at = Math.min(3, Math.floor(secs / 9));
    return '<section class="card ck-running" aria-live="polite"><div class="spinner" aria-hidden="true"></div><h2>Marking your answer</h2><ol class="ck-steps">' + steps.map((x, i) => '<li class="' + (i < at ? 'done' : i === at ? 'now' : '') + '">' + x + '</li>').join('') + '</ol><p class="muted small">This usually takes 20 to 60 seconds.</p><button type="button" class="btn ghost sm" data-action="ck-stop">Stop</button></section>';
  }

  function resultView(rec) {
    const r = rec.result, frac = r.max ? r.score / r.max : 0;
    const tone = frac >= 0.8 ? 'ok' : frac >= 0.5 ? 'warn' : 'bad';
    const parent = rec.parent && st().checks.find((c) => c.id === rec.parent);
    const t = rec.topic && M.topic[rec.topic];
    let html = '<section class="card ck-score" data-subj="' + rec.subject + '">' + C.ring(frac, '<b class="num">' + r.score + '</b><span class="num">/' + r.max + '</span>', 108, tone) +
      '<div class="ck-score-t"><p class="eyebrow">' + C.stag(rec.subject) + (t ? esc(t.name) : esc(M.subject[rec.subject].name)) + '</p><h2>' + esc(r.verdict || 'Marked') + '</h2>' +
      (r.band ? '<p class="num small muted">' + esc(r.band) + '</p>' : '') +
      (parent ? '<p class="delta ' + (r.score > parent.result.score ? 'ok-t' : '') + '">' + (r.score > parent.result.score ? 'Up from ' : r.score === parent.result.score ? 'Same as ' : 'Down from ') + parent.result.score + '/' + parent.result.max + ' last time</p>' : '') +
      (r.inferredScheme ? '<p class="help">No mark scheme was given, so Claude wrote one first. Check it against the official scheme when you can.</p>' : '') + '</div></section>';

    if (r.points.length) html += '<section class="card"><div class="card-head"><h2>Mark by mark</h2><span class="muted small">' + r.points.filter((p) => p.awarded >= p.available).length + ' of ' + r.points.length + ' points earned</span></div><ol class="marks">' + r.points.map(function (p) {
      const st2 = p.awarded >= p.available ? 'got' : p.awarded > 0 ? 'part' : 'miss';
      return '<li class="mk ' + st2 + '"><span class="mk-ic">' + C.icon(st2 === 'miss' ? 'x' : st2 === 'part' ? 'minus' : 'tick') + '</span><div class="mk-main"><p><span class="mk-label">' + esc(p.label) + '</span><span class="num mk-n">' + p.awarded + '/' + p.available + '</span> ' + esc(p.criterion) + '</p>' +
        (p.evidence ? '<blockquote>' + esc(p.evidence) + '</blockquote>' : '') + (p.comment ? '<p class="muted small">' + esc(p.comment) + '</p>' : '') + '</div></li>';
    }).join('') + '</ol></section>';

    if (r.improvements.length) html += '<section class="card"><div class="card-head"><h2>How to get full marks</h2></div><ol class="improve">' + r.improvements.map((x) => '<li><p class="imp-issue">' + esc(x.issue) + '</p><p>' + esc(x.fix) + '</p>' + (x.example ? '<div class="imp-eg"><span class="label">Try</span><p>' + esc(x.example) + '</p></div>' : '') + '</li>').join('') + '</ol></section>';
    html += '<div class="grid-2">';
    if (r.strengths.length) html += '<section class="card"><div class="card-head"><h2>What you did well</h2></div><ul class="bullets">' + r.strengths.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul></section>';
    if (r.examTip || r.nextStep) html += '<section class="card tip-card"><div class="card-head"><h2>' + C.icon('bulb') + 'Exam tip</h2></div>' + (r.examTip ? '<p>' + esc(r.examTip) + '</p>' : '') + (r.nextStep ? '<p class="muted small"><b>Practise next:</b> ' + esc(r.nextStep) + '</p>' : '') + '</section>';
    html += '</div>';
    if (r.modelAnswer) html += '<details class="card fold"><summary><h2>Show a full-mark answer</h2><span class="muted small">Try improving your own first</span></summary><div class="fold-body prose">' + esc(r.modelAnswer).replace(/\n/g, '<br>') + '</div></details>';
    html += '<details class="card fold"><summary><h2>The question and your answer</h2></summary><div class="fold-body"><p class="label">Question' + (rec.marks ? ' · ' + rec.marks + ' marks' : '') + '</p><p class="prose">' + (esc(rec.question) || '<i>From a photo</i>').replace(/\n/g, '<br>') + '</p>' + storedImgs(rec, 'q') +
      (rec.ms ? '<p class="label">Mark scheme</p><p class="prose">' + esc(rec.ms).replace(/\n/g, '<br>') + '</p>' : '') + storedImgs(rec, 'ms') +
      '<p class="label">Your answer</p><p class="prose">' + (esc(rec.answer) || esc(r.transcript) || '<i>From photos</i>').replace(/\n/g, '<br>') + '</p>' + storedImgs(rec, 'a') +
      (r.transcript && rec.answer ? '' : r.transcript ? '<p class="help">Read from your photos. If something was misread, edit it and resubmit.</p>' : '') + '</div></details>';

    html += '<div class="row-actions ck-actions"><button type="button" class="btn" data-action="ck-improve" data-id="' + rec.id + '">' + C.icon('rebuild') + 'Improve and resubmit</button>' +
      '<button type="button" class="btn alt" data-action="ck-again" data-id="' + rec.id + '">' + C.icon('spark') + 'Similar question</button>' +
      (t ? '<a class="btn ghost" href="#t-' + t.gid + '">Open ' + esc(t.name) + '</a>' : '') + '</div>';

    // Follow-up chat
    const live = RH.ui.ckChat && RH.ui.ckChat.id === rec.id;
    html += '<section class="card chat"><div class="card-head"><h2>' + C.icon('chat') + 'Ask about your feedback</h2></div><div class="chat-log">' +
      (rec.chat.length || live ? '' : '<p class="muted small">For example: “Why didn’t I get the second application mark?” or “Show me how to evaluate this.”</p>') +
      rec.chat.map((m) => '<div class="msg ' + m.role + '">' + esc(m.content).replace(/\n/g, '<br>') + '</div>').join('') +
      (live ? '<div class="msg assistant" id="ck-live">' + (esc(RH.ui.ckChat.text) || '<span class="muted">Thinking…</span>') + '</div>' : '') + '</div>' +
      '<form id="ckChatForm" class="chat-form" data-id="' + rec.id + '"><textarea id="ck-ask" name="q" rows="2" placeholder="Ask a follow-up question" aria-label="Ask a follow-up question"' + (live ? ' disabled' : '') + '></textarea><button type="submit" class="btn" aria-label="Send"' + (live ? ' disabled' : '') + '>' + C.icon('send') + '</button></form></section>';
    return html;
  }
  function storedImgs(rec, tag) {
    const n = rec.imgs && rec.imgs[tag];
    if (!n) return '';
    let h = '<div class="thumbs">';
    for (let i = 0; i < n; i++) h += '<figure class="thumb"><img data-dvimg="ck:' + rec.id + ':' + tag + i + '" alt="Photo ' + (i + 1) + '"></figure>';
    return h + '</div>';
  }

  // ---------- Pages ----------
  RH.views.check = function () {
    let html = C.subnav('check', 'check');
    html += C.page({ eyebrow: 'Practise', title: 'Check an answer', lede: 'Get an exam answer marked like an Edexcel examiner would, then see exactly how to reach full marks.' });
    html += '<div class="ck">' + form() + '<div class="ck-side">' + running() + recentList(4) + howItWorks() + '</div></div>';
    return html;
  };
  function howItWorks() {
    return '<section class="card soft"><h2>How it marks</h2><ul class="bullets small"><li>Each mark is matched to your own words, so you can see where it was earned or lost.</li><li>Maths uses M, A and B marks; Physics checks units, significant figures and error carried forward; Economics uses the KAA and evaluation levels.</li><li>Add the mark scheme for the most accurate marking. Photos of handwritten work are fine.</li><li>Answers you lose marks on go into that topic’s mistakes log.</li></ul></section>';
  }
  function recentList(n) {
    const list = st().checks.slice(0, n);
    if (!list.length) return '';
    return '<section class="card"><div class="card-head"><h2>Recent</h2><a class="small" href="#checks">All</a></div><ul class="list compact">' + list.map(checkRow).join('') + '</ul></section>';
  }
  function checkRow(c) {
    const r = c.result, t = c.topic && M.topic[c.topic];
    const frac = r && r.max ? r.score / r.max : 0;
    return '<li><a class="row link" href="#check-' + c.id + '" data-subj="' + c.subject + '">' + C.stag(c.subject) + '<span class="row-main"><b>' + esc((c.question || 'Question from a photo').slice(0, 80)) + '</b><span class="muted small">' + esc(U.fmtShort(c.date)) + (t ? ' · ' + esc(t.name) : '') + '</span></span><span class="score-pill ' + (frac >= 0.8 ? 'ok' : frac >= 0.5 ? 'warn' : 'bad') + ' num">' + (r ? r.score + '/' + r.max : '–') + '</span></a></li>';
  }
  RH.views.checks = function () {
    const list = st().checks;
    let html = C.subnav('check', 'checks') + C.page({ eyebrow: 'Practise', title: 'Marked answers', lede: list.length ? U.plural(list.length, 'answer') + ' checked' : '' });
    if (!list.length) return html + C.empty('No answers checked yet.', 'Mark your first answer and it appears here.', '<a class="btn" href="#check">Check an answer</a>');
    const bySubj = {};
    list.forEach((c) => { (bySubj[c.subject] = bySubj[c.subject] || []).push(c); });
    html += '<div class="grid-4 stat-tiles">' + M.subjects.map(function (s) {
      const l = bySubj[s.id] || [];
      const avg = l.length ? l.reduce((a, c) => a + (c.result.max ? c.result.score / c.result.max : 0), 0) / l.length : null;
      return '<div class="card tile" data-subj="' + s.id + '">' + C.stag(s.id) + '<span class="stat-n num">' + (avg == null ? '–' : U.pct(avg)) + '</span><span class="stat-l">average over ' + U.plural(l.length, 'answer') + '</span></div>';
    }).join('') + '</div>';
    return html + '<section class="card"><ul class="list">' + list.map(checkRow).join('') + '</ul></section>';
  };
  RH.views.checkOne = function (id) {
    const rec = st().checks.find((c) => c.id === id);
    if (!rec) return C.subnav('check', '') + C.empty('That check isn’t here.', 'It may have been deleted, or made on another device before syncing.', '<a class="btn" href="#check">Check an answer</a>');
    return C.subnav('check', '') + C.crumbs([['Check', 'check'], ['Marked answers', 'checks'], ['Feedback']]) + '<div class="ck-result">' + resultView(rec) + '</div>' +
      '<div class="row-actions"><button type="button" class="btn ghost danger-t sm" data-action="ck-del" data-id="' + rec.id + '">' + C.icon('trash') + 'Delete this check</button></div>';
  };

  // ---------- Events ----------
  RH.onInput.push(function (el) {
    if (!el.dataset.ck) return false;
    draft()[el.dataset.ck] = el.value;
    return true;
  });
  RH.onChange.push(function (el) {
    if (el.dataset.ck) { draft()[el.dataset.ck] = el.value; return true; }
    if (el.dataset.ckimg) {
      const d = draft(), key = el.dataset.ckimg === 'q' ? 'qImgs' : el.dataset.ckimg === 'ms' ? 'msImgs' : 'aImgs';
      d[key] = d[key].concat(C.imageFiles(el)).slice(0, 6);
      if (el.dataset.ckimg === 'ms') RH.ui.ckOpenMs = true;
      RH.render({ keepScroll: true });
      return true;
    }
    if (el.dataset.ckpick) { pickFromPaper(el); return true; }
    return false;
  });
  async function pickFromPaper(el) {
    const d = draft();
    const src = d.source && d.source.kind === 'paper' ? d.source : { kind: 'paper' };
    if (el.dataset.ckpick === 'paper') { d.source = { kind: 'paper', paper: el.value || null }; RH.render({ keepScroll: true }); return; }
    const p = st().portal.papers[src.paper];
    const qi = Number(el.value);
    if (!p || el.value === '') return;
    const q = p.questions[qi];
    d.source = { kind: 'paper', paper: p.id, q: qi, loading: true };
    if (p.subject) d.subject = p.subject;
    d.marks = q.marks ? String(q.marks) : d.marks;
    d.topic = q.topic || d.topic;
    d.question = d.question && d.source.q === qi ? d.question : '';
    RH.render({ keepScroll: true });
    try {
      d.qImgs = await RH.portal.questionImages(p.id, qi);
      const ms = q.ms != null && p.msFile ? await RH.portal.msImage(p.id, q.ms) : null;
      d.msImgs = ms ? [ms] : [];
      if (ms) RH.ui.ckOpenMs = true;
    } catch (e) { C.toast(e.message || 'Could not read that question from the PDF.'); }
    d.source.loading = false;
    RH.render({ keepScroll: true });
  }
  RH.actions['ck-subj'] = (el) => { const d = draft(); if (d.subject !== el.dataset.v) { d.subject = el.dataset.v; d.topic = ''; } RH.render({ keepScroll: true }); };
  RH.actions['ck-mark'] = () => runCheck();
  RH.actions['ck-stop'] = () => { if (RH.ui.ckRun) RH.ui.ckRun.ctl.abort(); };
  RH.actions['ck-similar'] = () => similar();
  RH.actions['ck-improve'] = function (el) {
    const rec = st().checks.find((c) => c.id === el.dataset.id);
    RH.ui.ck = Object.assign(blank(), { subject: rec.subject, topic: rec.topic, marks: String(rec.marks || ''), question: rec.question, ms: rec.ms, answer: rec.answer || rec.result.transcript, parent: rec.id, source: rec.source });
    Promise.all(['q', 'ms'].map(async function (tag) {
      const out = [];
      for (let i = 0; i < ((rec.imgs || {})[tag] || 0); i++) { const b = await RH.files.get('ck:' + rec.id + ':' + tag + i); if (b) out.push(b); }
      return out;
    })).then(function (res) { RH.ui.ck.qImgs = res[0]; RH.ui.ck.msImgs = res[1]; location.hash = 'check'; RH.render(); });
  };
  RH.actions['ck-again'] = function (el) {
    const rec = st().checks.find((c) => c.id === el.dataset.id);
    RH.ui.ck = Object.assign(blank(), { subject: rec.subject, topic: rec.topic, marks: String(rec.marks || ''), question: rec.question });
    RH.ui.tabs['ck-src'] = 'practice';
    location.hash = 'check';
    setTimeout(similar, 0);
  };
  RH.actions['ck-del'] = function (el) {
    C.confirm('Delete this check?', 'The marking, feedback and chat will be removed.', 'Delete', function () {
      store.update(function (s) { s.checks = s.checks.filter((c) => c.id !== el.dataset.id); }, { checks: true, silent: true });
      location.hash = 'checks';
    });
  };
  RH.onSubmit.ckChatForm = function (f) { const q = String(new FormData(f).get('q') || ''); if (q.trim()) ask(f.dataset.id, q); };
  // Enter sends, Shift+Enter makes a new line.
  document.addEventListener('keydown', function (ev) {
    if (ev.target.id === 'ck-ask' && ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); const f = ev.target.form; if (f.requestSubmit) f.requestSubmit(); }
  });
  // Keep the "Marking" steps moving.
  setInterval(function () { if (RH.ui.ckRun && !RH.ui.ckRun.gen && location.hash === '#check') { const el = document.querySelector('.ck-running'); if (el) el.outerHTML = running(); } }, 3000);
})(window.RH = window.RH || {});
</script>

<script>
/* Router, event wiring, the core actions (ratings, sessions, planner, settings) and calendar exports.
   Feature modules (portal, cards, timers) register their own pages and actions through RH.views / RH.actions. */
(function (RH) {
  'use strict';
  const U = RH.util, M = RH.model, V = RH.views, C = RH.c, esc = U.esc;
  const store = RH.store;
  const st = () => store.state;
  const $ = RH.$;
  const ui = RH.ui;
  const A = RH.actions;

  // ---------- Routing ----------
  // Some names are reserved by the claude.ai viewer, so they map to other pages.
  const RESERVED = { settings: 'preferences', sidebar: 'home', customize: 'preferences', upgrade: 'home', downloads: 'preferences' };
  // Old links that are now tabs inside another page.
  const ALIAS = { today: ['home'], planner: ['plan'], subjects: ['study'], portal: ['papers'], results: ['papers', 'portal', 'results'], timers: ['focus'], practise: ['papers'], more: ['home'] };
  function route() {
    let h = (location.hash || '').replace(/^#/, '');
    h = RESERVED[h] || h || 'home';
    if (ALIAS[h]) {
      const a = ALIAS[h];
      if (a[1]) ui.tabs[a[1]] = a[2];
      try { history.replaceState(null, '', '#' + a[0]); } catch (e) { /* file:// in some browsers */ }
      h = a[0];
    }
    return h;
  }
  RH.route = route;

  function pageFor(r) {
    const pre = (p) => r.indexOf(p) === 0 ? r.slice(p.length) : null;
    const simple = { home: V.home, study: V.study, plan: V.plan, deliverables: V.deliverables, routine: V.routine, exams: V.exams, strategy: V.strategy, check: V.check, checks: V.checks, focus: V.focus, cards: V.cards, review: V.review, papers: V.papers, exam: V.exam, mark: V.mark, library: V.library, guide: V.guide, preferences: V.prefs };
    if (simple[r]) return simple[r]();
    let x;
    if ((x = pre('s-')) !== null) return V.subject(x);
    if ((x = pre('c-')) !== null) return V.section(x);
    if ((x = pre('t-')) !== null) return V.topic(x);
    if ((x = pre('paper-')) !== null) return V.paper(x);
    if ((x = pre('deck-')) !== null) return V.deck(x);
    if ((x = pre('check-')) !== null) return V.checkOne(x);
    return V.notFound();
  }

  function titleFor(r) {
    const t = r.indexOf('t-') === 0 && M.topic[r.slice(2)];
    const c = r.indexOf('c-') === 0 && M.comp[r.slice(2)];
    const s = r.indexOf('s-') === 0 && M.subject[r.slice(2)];
    const names = { study: 'Your courses', plan: 'This week', deliverables: 'Deliverables', routine: 'Routine', exams: 'Exams', strategy: 'Strategy', check: 'Check an answer', checks: 'Checked answers', focus: 'Focus', papers: 'Past papers', exam: 'Exam in progress', mark: 'Marking', cards: 'Flashcards', review: 'Reviewing cards', library: 'Resources', guide: 'How to revise', preferences: 'Settings' };
    const name = t ? t.name : c ? c.name : s ? s.name : names[r];
    return (name ? name + ' · ' : '') + 'A-Level Revision Hub';
  }

  let lastRoute = null;
  function render(opts) {
    const r = route();
    const view = $('#view');
    let html;
    try { html = pageFor(r); }
    catch (e) {
      console.error(e);
      html = C.head('', 'Something went wrong', 'This page hit an error. Your saved data is safe.') + '<p class="num small">' + esc(e && e.message) + '</p><a class="btn" href="#home">Go home</a>';
    }
    const keepScroll = opts && opts.keepScroll && r === lastRoute;
    const y = window.scrollY;
    const active = document.activeElement;
    const focusId = active && active.id && view.contains(active) ? active.id : null;
    view.innerHTML = html;
    $('#nav').innerHTML = V.nav(r);
    const sub = V.subbar(r);
    $('#subbar').innerHTML = sub;
    $('#subbar').hidden = !sub;
    $('#foot').innerHTML = V.foot();
    $('#tabbar').innerHTML = V.tabbar(r);
    document.body.classList.toggle('in-exam', r === 'exam' || r === 'review');
    document.title = titleFor(r);
    document.body.dataset.route = r.replace(/-.*/, '');
    if (keepScroll) {
      window.scrollTo(0, y);
      if (focusId) { const el = document.getElementById(focusId); if (el && el.focus) el.focus({ preventScroll: true }); }
    } else if (r !== lastRoute) {
      window.scrollTo(0, 0);
      if (lastRoute !== null) view.focus({ preventScroll: true });
    }
    lastRoute = r;
    RH.afterRender.forEach((fn) => { try { fn(r); } catch (e) { console.error(e); } });
    if (RH.timer) RH.timer.paint();
    if (RH.face) RH.face.paint();
  }
  RH.render = render;

  // ---------- State helpers ----------
  function topicState(s, gid) {
    if (!s.topics[gid]) s.topics[gid] = { c: 0, p: [], notes: '', last: null, n: 0 };

    if (!Array.isArray(t.p)) t.p = [];
    return t;
  }
  RH.topicState = topicState;
  function logActivity(s, d) { s.activity = s.activity || {}; s.activity[d] = (s.activity[d] || 0) + 1; }
  RH.logActivity = logActivity;

  function buildPlan(quiet) {
    store.update(function (s) {
      s.plan.sessions = RH.planner.generate(s);
      s.plan.builtAt = Date.now();
    }, { plan: true });
    if (!quiet) C.toast('Plan rebuilt: ' + RH.planner.summary(st()).sessions + ' sessions to go');
  }

  const findSession = (id) => st().plan.sessions.find((x) => x.id === id);
  RH.findSession = findSession;

  function sessionModal(id) {
    const x = findSession(id);
    if (!x) return;
    const t = x.t && M.topic[x.t];
    const kind = RH.KIND[x.k];
    let body = '<p class="meta-line">' + C.stag(x.s) + C.chip(esc(kind.label)) + '<span class="num muted">' + esc(U.fmt(x.d)) + ' · ' + V.when(x) + ' · ' + U.mins(x.m) + '</span></p>' +
      (t ? '<p class="muted small">' + esc(t.comp.name) + '</p>' : '') + (x.why ? '<p class="small">' + esc(x.why) + '</p>' : '') +
      '<p>' + esc(kind.how) + '</p>';
    if (t) {
      const vids = M.videos(t).slice(0, 4);
      body += '<p class="label">Confidence</p>' + C.ragFull(t.gid, M.conf(st(), t.gid)) +
        (vids.length ? '<p class="label">Videos</p>' + C.videoGrid(vids, t.subject.id) : '') +
        '<div class="res-cols">' + C.resGroups(M.resources(t, st()).filter((r) => r.k !== 'other').slice(0, 8)) + '</div>';
    } else if (x.e) {
      body += '<p class="small">Sit it in <a href="#papers">Past papers</a> to time it question by question, or download a paper:</p><div class="res-cols">' + C.resGroups(M.subject[x.s].res.filter((r) => r.k === 'papers')) + '</div>';
    }
    body += '<div class="row-actions">' +
      '<button type="button" class="btn" data-action="sess-done" data-id="' + x.id + '" data-close="1">' + C.icon('tick') + (x.done ? 'Mark not done' : 'Mark done') + '</button>' +
      (x.done ? '' : '<button type="button" class="btn alt" data-action="timer-open" data-id="' + x.id + '">' + C.icon('timer') + 'Start a timer</button><button type="button" class="btn alt" data-action="sess-later" data-id="' + x.id + '" data-close="1">' + C.icon('later') + 'Move to next day</button>') +
      (t ? '<a class="btn alt" href="#t-' + t.gid + '">Open sub-topic</a>' : '') +
      '<button type="button" class="btn ghost danger-t" data-action="sess-del" data-id="' + x.id + '">' + C.icon('trash') + 'Delete</button></div>';
    C.openModal(esc(V.sessTitle(x)), body, { subj: x.s, wide: true });
  }

  // ---------- Calendar exports ----------
  function calendarItems() {
    const s = st(), today = U.today();
    const items = [];
    M.upcomingExams(s).forEach(function (e) {
      items.push({ kind: 'exam', date: e.date, time: e.time || '09:00', mins: e.dur, title: (e.official ? e.code + ' ' : '') + e.full.replace(/^Paper/, e.title.split(' Paper')[0] + ' Paper'), desc: e.official ? 'Pearson Edexcel. Check your centre for the room.' : 'Mock / test' });
    });
    s.plan.sessions.filter((x) => x.d >= today && !x.done).forEach(function (x) {
      const desc = M.subject[x.s].name + ' · ' + RH.KIND[x.k].label + '. ' + RH.KIND[x.k].how;
      if (x.t0 != null) items.push({ kind: 'exam', date: x.d, time: U.hm(x.t0), mins: x.m, title: C.TAG[x.s] + ': ' + V.sessTitle(x), desc: desc });
      else items.push({ kind: 'day', date: x.d, title: C.TAG[x.s] + ': ' + V.sessTitle(x) + ' (' + U.mins(x.m) + ')', desc: desc });
    });
    return items;
  }
  function exportICS() {
    const pad = (n) => String(n).padStart(2, '0');
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const escI = (t) => String(t).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//A-Level Revision Hub//EN', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:A-Level revision'];
    calendarItems().forEach(function (it, i) {
      const d = it.date.replace(/-/g, '');
      lines.push('BEGIN:VEVENT', 'UID:alh-' + d + '-' + i + '@revision-hub', 'DTSTAMP:' + stamp);
      if (it.kind === 'exam') {
        const p = it.time.split(':').map(Number);
        const end = new Date(2000, 0, 1, p[0], p[1] + it.mins);
        lines.push('DTSTART;TZID=Europe/London:' + d + 'T' + pad(p[0]) + pad(p[1]) + '00', 'DTEND;TZID=Europe/London:' + d + 'T' + pad(end.getHours()) + pad(end.getMinutes()) + '00');
      } else {
        lines.push('DTSTART;VALUE=DATE:' + d, 'DTEND;VALUE=DATE:' + U.addDays(it.date, 1).replace(/-/g, ''), 'TRANSP:TRANSPARENT');
      }
      lines.push('SUMMARY:' + escI(it.title), 'DESCRIPTION:' + escI(it.desc), 'END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    C.saveFile('a-level-revision.ics', lines.join('\r\n'), 'text/calendar');
  }
  function exportCSV() {
    const q = (t) => '"' + String(t).replace(/"/g, '""') + '"';
    const us = (d) => { const p = d.split('-'); return p[1] + '/' + p[2] + '/' + p[0]; };
    const rows = [['Subject', 'Start Date', 'Start Time', 'End Date', 'End Time', 'All Day Event', 'Description'].join(',')];
    calendarItems().forEach(function (it) {
      if (it.kind === 'exam') {
        const p = it.time.split(':').map(Number);
        const end = new Date(2000, 0, 1, p[0], p[1] + it.mins);
        const t12 = (h, m) => ((h % 12) || 12) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' AM' : ' PM');
        rows.push([q(it.title), us(it.date), t12(p[0], p[1]), us(it.date), t12(end.getHours(), end.getMinutes()), 'False', q(it.desc)].join(','));
      } else {
        rows.push([q(it.title), us(it.date), '', us(it.date), '', 'True', q(it.desc)].join(','));
      }
    });
    C.saveFile('a-level-revision.csv', rows.join('\r\n'), 'text/csv');
  }

    const el = ev.target.closest('[data-action]');
    if (!el) {
      if (!ev.target.closest('.search')) searchClose();
      return;
    }
    const fn = A[el.dataset.action];
    if (!fn) return;
    if (el.tagName === 'INPUT' || el.tagName === 'SELECT') return; // handled on change
    if (el.disabled) return;
    let allowDefault = false;
    try { allowDefault = fn(el, ev); }
    catch (e) { console.error(e); C.toast('That did not work: ' + (e && e.message || 'unknown error')); }
    if (allowDefault !== true && el.tagName === 'A') ev.preventDefault();
  });

  document.addEventListener('change', function (ev) {
    const el = ev.target;
    for (let i = 0; i < RH.onChange.length; i++) { if (RH.onChange[i](el, ev)) return; }
    if (el.matches('input[data-action]')) { const fn = A[el.dataset.action]; if (fn) fn(el, ev); return; }
    if (el.dataset.set) {
      const key = el.dataset.set;
      const val = el.type === 'checkbox' ? el.checked : el.dataset.num ? Number(el.value) : el.value;

      const t = String(d.get('t') || '').trim().slice(0, 120);
      let u = String(d.get('u') || '').trim();
      if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
      if (!t || u.length < 12) { C.toast('Give the link a name and an address.'); return; }
      store.update(function (s) { const ts = topicState(s, gid); ts.links = ts.links || []; ts.links.push({ t: t, u: u }); });
      C.toast('Link added');
    }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { if (C.modalOpen()) C.closeModal(); else searchClose(); return; }
    if (ev.target.id === 'q') {
      const hits = document.querySelectorAll('#qres .qr');
      if (!hits.length) return;
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
        ev.preventDefault();
        searchSel = (searchSel + (ev.key === 'ArrowDown' ? 1 : hits.length - 1)) % hits.length;
        hits.forEach((h, i) => h.classList.toggle('sel', i === searchSel));
      } else if (ev.key === 'Enter' && searchSel >= 0) {
        ev.preventDefault();
        location.hash = hits[searchSel].getAttribute('href');
        ev.target.value = ''; searchClose(); ev.target.blur();
      }
      return;
    }
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (RH.cards && RH.cards.key(ev)) return;
    if (RH.portal && RH.portal.key(ev)) return;
    if (ev.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { ev.preventDefault(); $('#q').focus(); }
  });
  document.addEventListener('focusin', function (ev) { if (ev.target.id === 'q' && ev.target.value) searchPaint(); });
  $('#qres').addEventListener('click', function (ev) { if (ev.target.closest('.qr')) { $('#q').value = ''; searchClose(); } });

  window.addEventListener('hashchange', function () { C.closeModal(); searchClose(); ui.justDone = null; if (!/^#plan$/.test(location.hash)) ui.day = null; render(); });

  store.on(function (why) {
    if (why === 'sync') { if (route() === 'preferences') render({ keepScroll: true }); return; }
    if (why === 'remote') applyTheme();
    render({ keepScroll: true });
  });

  // ---------- Boot ----------
  store.load();
  applyTheme();
  // Plans made before the routine existed have no start times yet.
  if (st().plan.sessions.some((x) => x.d >= U.today() && !x.done && x.t0 === undefined)) RH.routine.placeAll(st());
  // A first visit opens with a starter plan, so Today shows real sessions straight away.
  if (!st().plan.builtAt) {
    st().plan.sessions = RH.planner.generate(st());
    st().plan.builtAt = Date.now();
  }
  render();
  store.connect().then(function () {
    if (!st().plan.builtAt) buildPlan(true);
  });
})(window.RH = window.RH || {});
</script>
<!-- page:end -->
