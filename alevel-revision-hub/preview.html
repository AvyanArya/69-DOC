    if (it.files && it.files.length) body += '<p class="label">Handed in</p>' + storedThumbs(it.files);
    if (it.verdict) body += '<p class="dv-verdict ' + (it.verdict.verdict === 'reject' ? 'bad' : it.verdict.verdict === 'partial' ? 'warn' : 'ok') + '">' + C.icon('spark') + esc(it.verdict.comment) + '</p>' + (it.verdict.missing && it.verdict.missing.length ? '<ul class="bullets small">' + it.verdict.missing.map((m) => '<li>' + esc(m) + '</li>').join('') + '</ul>' : '');
    body += '<form id="dvForm" class="stack-form" data-id="' + id + '">';
    if (ev.indexOf('photo') !== -1) body += '<div class="field"><span>Photos of your work</span><label class="drop small-drop">' + C.icon('camera') + '<b>Take or choose photos</b><span class="muted small">JPEG or PNG, up to 6</span><input type="file" id="dv-photos" accept="image/*" capture="environment" multiple></label><div id="dv-thumbs">' + C.thumbs(draft.photos, 'dv', true) + '</div></div>';
    if (ev.indexOf('score') !== -1) body += '<div class="field"><span>Your marked score</span><div class="score-in"><input type="number" name="got" min="0" inputmode="numeric" value="' + (it.score != null ? it.score : '') + '" aria-label="Marks scored"><span>out of</span><input type="number" name="of" min="1" inputmode="numeric" value="' + (it.of || it.target || '') + '" aria-label="Marks available"></div></div>';
    if (ev.indexOf('text') !== -1) body += '<label class="field"><span>' + (it.kind === 'blurt' ? 'What you wrote from memory' : 'Notes or a link') + '</span><textarea name="text" rows="' + (it.kind === 'blurt' ? 9 : 4) + '">' + esc(it.text || '') + '</textarea></label>';
    body += '<div class="row-actions"><button type="submit" class="btn" name="mode" value="plain">' + C.icon('upload') + 'Hand in</button>' +
      ((ai === 'claude' || ai === 'api') ? '<button type="submit" class="btn alt" name="mode" value="ai">' + C.icon('spark') + 'Hand in and verify with AI</button>' : '') + '</div>' +
      '<p class="help">' + (ai === 'claude' || ai === 'api' ? 'AI verification checks your photo or text really does what the deliverable asks, and sends it back if it doesn’t.' : 'Connect Claude in Settings to have hand-ins checked.') + ' Photos stay on this device.</p></form>';
    C.openModal(esc(it.title), body, { wide: true, subj: it.subject || null, onClose: () => { RH.ui.dvDraft = null; } });
    RH.afterRender.forEach((fn) => fn());
  }
  D.openSubmit = openSubmit;

  RH.onChange.push(function (el) {
    if (el.id !== 'dv-photos') return false;
    const d = RH.ui.dvDraft;
    d.photos = d.photos.concat(C.imageFiles(el)).slice(0, 6);
    el.value = '';
    $('#dv-thumbs').innerHTML = C.thumbs(d.photos, 'dv', true);
    return true;
  });

  async function verify(it, photos, text) {
    const t = it.topic && M.topic[it.topic];
    const prompt = 'A student revising for Pearson Edexcel A-levels has handed in evidence for a weekly revision deliverable. Decide whether the evidence genuinely completes it. Be fair but firm: blank, off-topic, copied-looking or clearly unfinished work should be sent back.\n\n' +
      'Deliverable: ' + it.title + '\nWhat was asked: ' + (it.detail || '') + '\n' +
      (t ? 'Topic: ' + t.subject.name + ' – ' + t.name + '\nSpecification points for this topic:\n' + (t.pts || []).map((p) => '- ' + p).join('\n') + '\n' : '') +
      (it.target && it.kind !== 'summary' ? 'Target: ' + it.target + ' marks\n' : '') +
      (photos.length ? 'The student attached ' + photos.length + ' photo(s) of their work.\n' : 'No photos were attached.\n') +
      (text ? 'The student wrote:\n"""\n' + text.slice(0, 6000) + '\n"""\n' : '') +
      '\nReply with only JSON: {"verdict": "accept" | "partial" | "reject", "comment": "one or two sentences to the student, plain and specific", "missing": ["specification points or parts that are missing, at most 5"]}';
    return RH.ai.ask(prompt, { json: true, images: photos.length ? photos : null });
  }

  RH.onSubmit.dvForm = async function (f, ev) {
    const id = f.dataset.id, found = findItem(id);
    if (!found) return;
    const it = found.item, k = D.KINDS[it.kind] || D.KINDS.custom;
    const ev2 = it.kind === 'custom' ? (it.ev || ['photo', 'text']) : k.ev;
    const mode = ev && ev.submitter && ev.submitter.value === 'ai' ? 'ai' : 'plain';
    const d = new FormData(f);
    const photos = (RH.ui.dvDraft && RH.ui.dvDraft.photos) || [];
    const text = String(d.get('text') || '').trim();
    const got = d.get('got'), of = d.get('of');
    const hasPhoto = photos.length || (it.files && it.files.length);
    if (ev2[0] === 'photo' && !hasPhoto) { C.toast('Add at least one photo of your work.'); return; }
    if (ev2[0] === 'score' && (got === '' || got == null)) { C.toast('Enter your marked score.'); return; }
    if (ev2[0] === 'text' && text.length < 40) { C.toast('Write a bit more: this needs to show the work you did.'); return; }
    const btns = f.querySelectorAll('button'); btns.forEach((b) => { b.disabled = true; });
    const files = (it.files || []).slice();
    for (const p of photos) {
      const key = 'dv:' + id + ':' + U.uid();
      await RH.files.put(key, p);
      blobCache[key] = p;
      files.push({ key: key, name: p.name || 'photo.jpg' });
    }
    let verdict = null;
    if (mode === 'ai') {
      const note = f.querySelector('.help');
      if (note) note.textContent = 'Checking your hand-in…';
      try { verdict = await verify(it, photos, text); }
      catch (e) { C.toast(RH.ai.errorText(e)); btns.forEach((b) => { b.disabled = false; }); if (note) note.textContent = ''; return; }
    }
    const late = D.passed(found.ws);
    updateItem(id, function (x) {
      x.files = files; x.text = text;
      if (got !== null && got !== '') { x.score = Number(got); x.of = Number(of) || x.target || null; }
      x.submittedAt = Date.now(); x.late = late;
      if (verdict) {
        x.verdict = { verdict: verdict.verdict, comment: String(verdict.comment || ''), missing: Array.isArray(verdict.missing) ? verdict.missing.slice(0, 5).map(String) : [] };
        x.status = verdict.verdict === 'accept' ? 'verified' : verdict.verdict === 'reject' ? 'returned' : 'submitted';
      } else x.status = 'submitted';
    });
    RH.ui.dvDraft = null;
    C.closeModal();
    const now = findItem(id).item;
    C.toast(now.status === 'returned' ? 'Sent back: ' + (now.verdict.comment || 'it does not meet the deliverable yet.') : now.status === 'verified' ? 'Verified and handed in' : 'Handed in');
  };

  RH.onSubmit.commitForm = function (f) {
    const sig = String(new FormData(f).get('sig') || '').trim();
    if (!sig) { C.toast('Type your name to sign.'); return; }
    const ws = D.currentWs();
    store.update(function (s) { const w = s.deliv.weeks[ws]; w.committedAt = Date.now(); w.signature = sig.slice(0, 60); if (!s.profile.name) s.profile.name = sig.split(' ')[0].slice(0, 40); });
    C.toast('Committed. Deadline ' + U.fmt(D.deadline(ws).date, { weekday: 'long' }) + ' ' + st().deliv.settings.time);
  };
  RH.onSubmit.dvAddForm = function (f) {
    const d = new FormData(f), title = String(d.get('title') || '').trim();
    if (!title) { C.toast('Give it a name.'); return; }
    const ws = D.currentWs();
    store.update(function (s) { s.deliv.weeks[ws].items.push({ id: 'v' + U.uid(), kind: 'custom', status: 'open', files: [], title: title.slice(0, 120), detail: String(d.get('detail') || '').slice(0, 400), subject: String(d.get('subject') || ''), ev: String(d.get('ev')) === 'text' ? ['text', 'photo'] : ['photo', 'text'] }); });
    C.closeModal();
  };

  D.report = function (ws) {
    const s = st(), w = s.deliv.weeks[ws];
    if (!w) return '';
    const lines = [(s.profile.name || 'My') + (s.profile.name ? "'s" : '') + ' revision deliverables, week of ' + U.fmtShort(ws) + (s.deliv.settings.partner ? ' (for ' + s.deliv.settings.partner + ')' : '')];
    if (w.committedAt) lines.push('Committed: ' + new Date(w.committedAt).toLocaleString('en-GB') + ' (signed ' + w.signature + ')');
    lines.push('Deadline: ' + U.fmt(D.deadline(ws).date, { weekday: 'long', day: 'numeric', month: 'short' }) + ' ' + s.deliv.settings.time, '');
    w.items.forEach(function (it) {
      const status = D.statusOf(it, ws), p = D.KINDS[it.kind] && D.KINDS[it.kind].auto ? D.progress(it, ws) : null;
      lines.push((D.isDone(status) ? '[x] ' : '[ ] ') + it.title + ' — ' + STATUS[status][0] + (p ? ' (' + (it.kind === 'focus' ? U.dur(p.val) + ' of ' + U.dur(p.target) : p.val + ' of ' + p.target) + ')' : '') + (it.score != null ? ' — score ' + it.score + (it.of ? '/' + it.of : '') : '') + (it.verdict ? ' — AI: ' + it.verdict.verdict : ''));
    });
    const sum = w.items.filter((it) => D.isDone(D.statusOf(it, ws))).length;
    lines.push('', sum + ' of ' + w.items.length + ' delivered.');
    return lines.join('\n');
  };

  // ---------- Actions ----------
  RH.actions['dv-submit'] = (el) => openSubmit(el.dataset.id);
  RH.actions['dv-week'] = function (el) {
    const ws = U.addDays(RH.ui.dvWeek || D.currentWs(), Number(el.dataset.v));
    RH.ui.dvWeek = ws > D.currentWs() ? null : ws;
    RH.render({ keepScroll: true });
  };
  RH.actions['dv-show'] = (el) => { RH.ui.dvWeek = el.dataset.ws; RH.render(); window.scrollTo(0, 0); };
  RH.actions['dv-report'] = (el) => C.copyText(D.report(el.dataset.ws), 'Weekly report copied. Paste it into a message.');
  RH.actions['dv-regen'] = function () {
    const ws = D.currentWs();
    store.update(function (s) { const old = s.deliv.weeks[ws]; const rec = D.generate(s, ws); rec.items = old.items.filter((x) => x.carried || x.kind === 'custom' || x.kind === 'catchup').concat(rec.items).slice(0, 10); s.deliv.weeks[ws] = rec; });
    C.toast('List rebuilt from this week’s plan');
  };
  RH.actions['dv-add'] = function () {
    C.openModal('Add your own deliverable', '<form id="dvAddForm" class="stack-form"><label class="field"><span>What you will hand in</span><input name="title" required placeholder="e.g. Maths homework: integration worksheet"></label>' +
      '<label class="field"><span>Details (optional)</span><textarea name="detail" rows="3"></textarea></label><div class="form-grid">' +
      '<label class="field"><span>Subject</span><select name="subject"><option value="">None</option>' + M.subjects.map((x) => '<option value="' + x.id + '">' + esc(x.name) + '</option>').join('') + '</select></label>' +
      '<label class="field"><span>Proof</span><select name="ev"><option value="photo">A photo</option><option value="text">Writing</option></select></label></div>' +
      '<div class="row-actions"><button type="submit" class="btn">Add</button></div></form>');
  };
  RH.actions['dv-miss'] = (el) => updateItem(el.dataset.id, (x) => { x.status = 'missed'; });
  RH.actions['dv-excuse'] = function (el) {
    C.openModal('Excuse this deliverable', '<form id="dvExcuseForm" class="stack-form" data-id="' + el.dataset.id + '"><label class="field"><span>Why couldn’t you do it?</span><textarea name="why" rows="3" required placeholder="e.g. Ill on Thursday and Friday"></textarea></label><p class="help">Excused work does not carry over and does not break your streak. Keep it honest: the reason goes on your weekly report.</p><div class="row-actions"><button type="submit" class="btn">Excuse it</button></div></form>');
  };
  RH.onSubmit.dvExcuseForm = function (f) {
    const why = String(new FormData(f).get('why') || '').trim();
    if (why.length < 8) { C.toast('Give a real reason.'); return; }
    updateItem(f.dataset.id, (x) => { x.status = 'excused'; x.excuse = why.slice(0, 300); });
    C.closeModal();
  };
  RH.actions['dv-close'] = function (el) {
    const ws = el.dataset.ws, cur = D.currentWs();
    D.week(cur);
    store.update(function (s) {
      const w = s.deliv.weeks[ws];
      w.items.forEach((it) => { const stt = D.statusOf(it, ws); if (!D.isDone(stt) && it.status !== 'excused') it.status = 'missed'; });
      const counted = w.items.filter((it) => it.status !== 'excused');
      w.score = counted.length ? counted.filter((it) => D.isDone(D.statusOf(it, ws))).length / counted.length : 1;
      w.reviewedAt = Date.now();
      const missed = w.items.filter((it) => it.status === 'missed');
      const next = s.deliv.weeks[cur];
      if (missed.length && next) {
        if (s.deliv.settings.carry) missed.filter((it) => !(D.KINDS[it.kind] || {}).auto && !it.carried).forEach(function (it) {
          next.items.unshift({ id: 'v' + U.uid(), kind: it.kind, subject: it.subject, topic: it.topic, exam: it.exam, target: it.target, ev: it.ev, title: it.title, detail: it.detail, status: 'open', files: [], carried: ws });
        });
        if (s.deliv.settings.strict) next.items.push({ id: 'v' + U.uid(), kind: 'catchup', status: 'open', files: [], target: 15, title: 'Catch-up: 15 extra marks of exam questions', detail: 'You missed work last week. Do 15 marks of exam questions in your weakest subject, mark them, and upload a photo with your score.' });
      }
    });
    C.toast('Week closed');
  };

  RH.onChange.push(function (el) {
    if (!el.dataset.dvset) return false;
    const k = el.dataset.dvset;
    store.update(function (s) { s.deliv.settings[k] = el.type === 'checkbox' ? el.checked : (k === 'day' || k === 'count') ? Number(el.value) : el.value; });
    return true;
  });
  RH.actions['img-del'] = function (el) {
    const g = el.dataset.group, i = Number(el.dataset.i);
    if (g === 'dv' && RH.ui.dvDraft) { RH.ui.dvDraft.photos.splice(i, 1); $('#dv-thumbs').innerHTML = C.thumbs(RH.ui.dvDraft.photos, 'dv', true); return; }
    if (RH.checker && RH.checker.removeImage) RH.checker.removeImage(g, i);
  };
})(window.RH = window.RH || {});
</script>
<script>
/* Shared page pieces: navigation, session titles, the day timeline and small cards used on several pages. */
(function (RH) {
  'use strict';
  const U = RH.util, M = RH.model, C = RH.c, esc = U.esc;
  const st = () => RH.store.state;
  const V = RH.views;

  // ---------- Areas and navigation ----------
  V.areaOf = function (r) {
    if (r === 'home') return 'home';
    if (/^(study|s-|c-|t-|library|guide)/.test(r)) return 'learn';
    if (/^(papers|paper-|exam$|mark$|check|checks|cards|deck-|review)/.test(r)) return 'practise';
    if (/^(plan|deliverables|routine|exams|strategy)$/.test(r)) return 'plan';
    if (r === 'focus') return 'focus';
    return 'settings';
  };
  // Which entry in the bar under the menu is the current page.
  function currentPage(r) {
    const subj = (x) => (M.subject[x] ? x : M.comp[x] ? M.comp[x].subject.id : M.topic[x] ? M.topic[x].subject.id : '');
    let m;
    if ((m = /^[sct]-(.+)$/.exec(r))) return 's-' + subj(m[1]);
    if (/^(paper-|exam$|mark$)/.test(r)) return 'papers';
    if (/^check-/.test(r)) return 'checks';
    if (/^(deck-|review)/.test(r)) return 'cards';
    return r;
  }
  function badges() {
    const s = st(), sum = RH.deliv.summary();
    const todayLeft = s.plan.sessions.filter((x) => x.d === U.today() && !x.done).length;
    return { home: todayLeft ? '<span class="count">' + todayLeft + '</span>' : '', plan: sum && sum.overdue ? '<span class="count bad">' + sum.overdue + '</span>' : '', focus: RH.face.on ? '<span class="live-dot" title="Tracker on"></span>' : '' };
  }
  V.nav = function (r) {
    const area = V.areaOf(r), b = badges();
    return Object.keys(RH.AREAS).map(function (k) {
      const a = RH.AREAS[k], on = area === k;
      return '<a href="#' + a.href + '" class="nav-item' + (on ? ' on' : '') + '"' + (on ? ' aria-current="page"' : '') + '>' + a.label + (b[k] || '') + '</a>';
    }).join('');
  };
  V.subbar = function (r) {
    const a = RH.AREAS[V.areaOf(r)];
    if (!a || !a.pages.length) return '';
    const cur = currentPage(r);
    return '<div class="subbar-in">' + a.pages.map((p) => '<a href="#' + p[0] + '"' + (p[2] ? ' data-subj="' + p[2] + '"' : '') + (p[0] === cur ? ' class="on" aria-current="page"' : '') + '>' + (p[2] ? '<i class="sdot"></i>' : '') + p[1] + '</a>').join('') + '</div>';
  };
  V.foot = function () {
    const sync = RH.store.sync;
    return '<span>' + (sync === 'cloud' ? 'Synced to your account' : sync === 'cloud-error' ? 'Sync failed, saved on this device' : 'Saved on this device') + '</span><span>Pearson Edexcel · Summer 2027</span><a href="#preferences">Settings &amp; backup</a>';
  };
  V.tabbar = function (r) {
    const area = V.areaOf(r);
    return Object.keys(RH.AREAS).map(function (k) {
      const a = RH.AREAS[k], on = area === k;
      return '<a href="#' + a.href + '" class="tab-i' + (on ? ' on' : '') + '"' + (on ? ' aria-current="page"' : '') + '>' + C.icon(a.icon) + '<span>' + a.label + '</span></a>';
    }).join('');
  };

  // ---------- Sessions ----------
  V.sessTitle = function (s) {
    const t = s.t && M.topic[s.t];
    if (t) return t.name;
    const e = s.e && M.examById(st(), s.e);
    if (e) return (s.k === 'pp' ? 'Past paper: ' : 'Review for ') + e.title;
    return RH.KIND[s.k] ? RH.KIND[s.k].label : 'Session';
  };
  V.when = (x) => x.t0 != null ? U.hm(x.t0) + '–' + U.hm(x.t0 + x.m) : 'No slot';

  V.staleBanner = function () {
    const p = st().plan;
    const stale = p.builtAt && (p.settingsAt > p.builtAt || st().ratedAt > p.builtAt);
    const missed = p.sessions.filter((s) => !s.done && s.d < U.today()).length;
    if (!stale && !missed) return '';
    const why = [];
    if (missed) why.push(U.plural(missed, 'past session') + ' not done');
    if (stale) why.push(p.settingsAt > p.builtAt ? 'your routine or strategy changed' : 'your ratings changed');
    return '<div class="note row-note"><p><b>Your plan can be updated:</b> ' + esc(why.join(', ')) + '.</p><button type="button" class="btn sm" data-action="plan-build">' + C.icon('rebuild') + 'Rebuild from today</button></div>';
  };

  // One day as a list of times: school, activities, revision sessions and free time.
  V.timeline = function (d, opts) {
    const tl = RH.routine.timeline(st(), d);
    const now = new Date(), nowM = now.getHours() * 60 + now.getMinutes(), isToday = d === U.today();
    const skip = { morning: 1, winddown: 1, travel: opts && opts.compact ? 1 : 0, rest: opts && opts.compact ? 1 : 0 };
    let marked = false;
    let html = '<ol class="tl">';
    tl.items.forEach(function (it) {
      if (it.type === 'block' && skip[it.kind]) return;
      if (isToday && !marked && it.start > nowM) { html += '<li class="tl-now" aria-label="Now"><span>' + U.hm(nowM) + '</span></li>'; marked = true; }
      const past = isToday && it.end <= nowM;
      if (it.type === 'session') {
        const x = it.sess, t = x.t && M.topic[x.t];
        html += '<li class="tl-i kind-study' + (x.done ? ' done' : '') + (past && !x.done ? ' late' : '') + '" data-subj="' + x.s + '"><span class="tl-t num">' + U.hm(it.start) + '<span>' + U.hm(it.end) + '</span></span>' +
          '<span class="tl-bar"></span><div class="tl-body"><button type="button" class="tl-title" data-action="sess-open" data-id="' + x.id + '">' + C.stag(x.s) + esc(V.sessTitle(x)) + '</button><span class="muted small">' + esc(RH.KIND[x.k].label) + (t ? ' · ' + esc(t.comp.name) : '') + '</span></div>' +
          '<div class="tl-act"><button type="button" class="check-b' + (x.done ? ' on' : '') + '" data-action="sess-done" data-id="' + x.id + '" aria-pressed="' + !!x.done + '" aria-label="' + (x.done ? 'Done' : 'Mark done') + '">' + C.icon('tick') + '</button>' +
          (x.done ? '' : '<button type="button" class="icon-btn" data-action="timer-open" data-id="' + x.id + '" aria-label="Start a timer">' + C.icon('timer') + '</button>') + '</div></li>';
      } else {
        const label = it.type === 'free' ? 'Free time' : it.label;
        html += '<li class="tl-i kind-' + it.kind + (past ? ' past' : '') + '"' + (it.subj ? ' data-subj="' + it.subj + '"' : '') + '><span class="tl-t num">' + U.hm(it.start) + '<span>' + U.hm(it.end) + '</span></span><span class="tl-bar"></span><div class="tl-body"><span class="tl-title plain">' + esc(label) + '</span><span class="muted small">' + U.dur(it.end - it.start) + '</span></div></li>';
      }
    });
    if (isToday && !marked) html += '<li class="tl-now" aria-label="Now"><span>' + U.hm(nowM) + '</span></li>';
    html += '</ol>';
    if (tl.unplaced.length) html += '<p class="note small">' + U.plural(tl.unplaced.length, 'session') + ' didn’t fit into this day’s free time: ' + tl.unplaced.map((x) => esc(V.sessTitle(x))).join(', ') + '. Rebuild the plan, or loosen your routine.</p>';
    if (!tl.items.some((i) => i.type === 'session') && !tl.unplaced.length) html += '<p class="muted small tl-empty">No revision planned for this day.</p>';
    return html;
  };

  // ---------- Further Maths options ----------
  V.fmOptionsCard = function () {
    const chosen = st().profile.fmOptions || RH.ui.fmDraft || ['fs1', 'fm1'];
    return '<section class="card" id="fmopts" data-subj="further"><div class="card-head"><h2>Further Maths options</h2></div><p class="muted">Pick the two options you sit for Papers 3 and 4. Mr Gale’s resources cover Further Statistics 1 and Further Mechanics 1, so those are ticked to start with.</p>' +
      '<div class="opt-grid">' + RH.FM_OPTIONS.map((o) => {
        const p = M.subject.further.paper[o.paper];
        return '<label class="opt"><input type="checkbox" data-fmopt="' + o.id + '"' + (chosen.indexOf(o.id) !== -1 ? ' checked' : '') + '><span><b>' + esc(o.name) + '</b><span class="muted small num">' + esc(p.code) + '</span></span></label>';
      }).join('') + '</div><div class="row-actions"><button type="button" class="btn" data-action="fm-save">Save options</button></div></section>';
  };

  V.compPicks = function (sid) {
    return M.compsFor(st(), M.subject[sid]).map((c) => '<label class="pick"><input type="checkbox" name="comps" value="' + c.id + '"><span>' + esc(c.name) + '</span></label>').join('');
  };

  V.notFound = () => C.page({ title: 'Page not found', lede: 'That link does not match a page in the hub.' }) + '<a class="btn" href="#home">Go home</a>';
})(window.RH = window.RH || {});
</script>
<script>
/* Home: this week's deliverables, today's timeline, what to do next. */
(function (RH) {
  'use strict';
  const U = RH.util, M = RH.model, C = RH.c, esc = U.esc;
  const st = () => RH.store.state;
  const V = RH.views, D = RH.deliv;

  function nextSession(s) {
    const today = U.today(), now = new Date(), nowM = now.getHours() * 60 + now.getMinutes();
    const todays = s.plan.sessions.filter((x) => x.d === today && !x.done).sort((a, b) => (a.t0 == null ? 9999 : a.t0) - (b.t0 == null ? 9999 : b.t0));
    return todays.find((x) => x.t0 != null && x.t0 + x.m > nowM) || todays[0] || s.plan.sessions.find((x) => x.d > today && !x.done) || null;
  }
  function streakDays() {
    const act = st().activity || {};
    let d = U.today(), n = 0;
    if (!act[d]) d = U.addDays(d, -1);
    while (act[d]) { n++; d = U.addDays(d, -1); }
    return n;
  }
  function weekFocus() {
    const ws = U.weekStart(U.today()), we = U.addDays(ws, 6);
    return st().focus.log.filter((x) => x.date >= ws && x.date <= we).reduce((a, x) => a + (x.focused || 0), 0);
  }

  function setupCard(s) {
    const steps = [
      [!!s.routine.setupAt, 'Set your routine', 'School times, sleep, activities and how many hours you want to revise.', '#routine', 'Set routine'],
      [!!s.profile.fmOptions, 'Pick your Further Maths options', s.profile.fmOptions ? 'Saved' : 'So your exams and topics match your papers.', '#preferences', 'Choose'],
      [M.activeTopics(s).filter((t) => (s.topics[t.gid] || {}).c).length >= 20, 'Rate 20 topics', 'Red, amber or green, so the plan knows your weak spots.', '#study', 'Open courses'],
      [!!(D.week() || {}).committedAt, 'Commit to this week', 'Sign up to your deliverables.', '#deliverables', 'See deliverables']
    ];
    const done = steps.filter((x) => x[0]).length;
    if (done === steps.length || s.profile.welcomed) return '';
    return '<section class="card setup"><div class="card-head"><h2>Get set up</h2><span class="muted small">' + done + ' of ' + steps.length + ' done</span><button type="button" class="btn ghost sm" data-action="welcome-dismiss">Hide</button></div><ol class="steps">' +
      steps.map((x, i) => '<li class="step' + (x[0] ? ' ok' : '') + '"><span class="step-n">' + (x[0] ? C.icon('tick') : i + 1) + '</span><span class="step-t"><b>' + x[1] + '</b><span class="muted small">' + x[2] + '</span></span>' + (x[0] ? '' : '<a class="btn alt sm" href="' + x[3] + '">' + x[4] + '</a>') + '</li>').join('') + '</ol></section>';
  }

  // The lesson to open from Home: the next planned session's topic, else the next lesson in the course studied most recently.
  function resumeLesson(s, nx) {
    if (nx && nx.t && M.topic[nx.t]) return { t: M.topic[nx.t], why: nx.d === U.today() ? 'In today’s plan' : 'Next in your plan' };
    const last = Object.keys(s.topics).filter((g) => M.topic[g] && s.topics[g].last).sort((x, y) => s.topics[y].last.localeCompare(s.topics[x].last))[0];
    const sub = last ? M.topic[last].subject : M.subjects[0];
    const t = M.nextLesson(s, sub);
    return t ? { t: t, why: last ? 'Next in ' + sub.name : 'Start here' } : null;
  }

  V.home = function () {
    const s = st(), today = U.today();
    const h = new Date().getHours();
    const greet = (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + (s.profile.name ? ', ' + esc(s.profile.name) : '');
    const exams = M.upcomingExams(s), next = exams[0];
    const nx = nextSession(s), resume = resumeLesson(s, nx);
    let html = '<header class="home-hero"><div class="hh-text"><p class="eyebrow">' + esc(U.fmtLong(today)) + '</p><h1>' + greet + '</h1><p class="lede">' + (next ? esc(next.title) + ' is ' + U.countdown(C.daysTo(next.date)) + '. ' + U.plural(exams.length, 'paper') + ' to go.' : 'No exams coming up.') + '</p></div>';
    if (resume) {
      const t = resume.t, steps = M.lessonSteps(s, t.gid);
      html += '<a class="resume" href="#t-' + t.gid + '" data-subj="' + t.subject.id + '"><span class="label">' + esc(resume.why) + '</span><span class="rs-sub">' + C.stag(t.subject.id, true) + '<span class="num muted small">Lesson ' + M.lessonNum(s, t) + '</span></span><b>' + esc(M.title(t.name)) + '</b>' +
        '<span class="rs-foot"><span class="mini-bar"><span style="width:' + (steps * 20) + '%"></span></span><span class="small muted">' + steps + ' of 5 steps</span><span class="rs-go">' + (steps ? 'Continue' : 'Start') + C.icon('right') + '</span></span></a>';
    }
    html += '</header>';

    const review = D.needsReview();
    if (review && s.deliv.settings.strict) {
      const w = s.deliv.weeks[review];
      const left = w.items.filter((it) => !D.isDone(D.statusOf(it, review)) && it.status !== 'missed' && it.status !== 'excused').length;
      return html + '<section class="card gate">' + C.icon('lock', 'gate-ic') + '<div><h2>Close last week first</h2><p>The deadline for the week of ' + esc(U.fmtShort(review)) + ' has passed and ' + U.plural(left, 'deliverable is', 'deliverables are') + ' still open. Hand them in late or mark them missed, then this week opens up.</p>' +
        '<div class="row-actions"><a class="btn" href="#deliverables">Close the week</a><span class="muted small">Strict mode is on. You can turn it off in Deliverables → Rules.</span></div></div></section>' +
        '<section class="card"><div class="card-head"><h2>Today</h2></div>' + V.timeline(today, { compact: true }) + '</section>';
    }
    html += setupCard(s) + V.staleBanner();

    // Three numbers for the week
    const sum = D.summary();
    const todays = s.plan.sessions.filter((x) => x.d === today);
    const planned = todays.reduce((a, x) => a + x.m, 0), done = todays.filter((x) => x.done).reduce((a, x) => a + x.m, 0);
    const fItem = (D.week() || { items: [] }).items.find((it) => it.kind === 'focus');
    const wf = weekFocus();
    const dl = D.deadline(D.currentWs());
    html += '<div class="summary">' +
      '<a class="tile" href="#plan">' + C.ring(planned ? done / planned : 0, '<b class="num">' + U.dur(planned - done) + '</b>', 58) +
      '<span class="tile-t"><span class="label">Today</span><b>' + (planned ? U.dur(done) + ' of ' + U.dur(planned) + ' done' : 'Nothing planned') + '</b><span class="muted small">' + C.icon('flame', 'i-sm') + ' ' + U.plural(streakDays(), 'day') + ' streak</span></span></a>' +
      '<a class="tile" href="#deliverables">' + C.ring(sum ? sum.done / (sum.total || 1) : 0, '<b class="num">' + (sum ? sum.done + '/' + sum.total : '–') + '</b>', 58, sum && sum.overdue ? 'bad' : '') +
      '<span class="tile-t"><span class="label">Due this week</span><b>' + (sum ? (sum.done === sum.total ? 'All handed in' : U.plural(sum.total - sum.done, 'deliverable') + ' left') : '') + '</b><span class="muted small">' + esc(U.fmt(dl.date, { weekday: 'short' })) + ' ' + esc(dl.time) + ' · ' + esc(sum ? sum.left : '') + '</span></span></a>' +
      '<a class="tile" href="#focus">' + C.ring(fItem ? wf / fItem.target : 0, '<b class="num">' + U.dur(wf) + '</b>', 58, fItem && wf >= fItem.target ? 'ok' : '') +
      '<span class="tile-t"><span class="label">Focus this week</span><b>' + (fItem ? U.dur(Math.max(0, fItem.target - wf)) + ' to go' : U.dur(wf)) + '</b><span class="muted small">' + (RH.face.on ? 'Tracker on' : 'Tracker off') + '</span></span></a></div>';

    html += '<div class="cols"><div class="col-main">';
    // Next session
    if (nx) {
      const t = nx.t && M.topic[nx.t], k = RH.KIND[nx.k];
      html += '<section class="card next" data-subj="' + nx.s + '"><div class="card-head"><h2>' + (nx.d === today ? 'Next up' : 'Next session · ' + esc(U.fmt(nx.d))) + '</h2><a class="small" href="#plan">Week view</a></div>' +
        '<div class="next-row"><span class="next-time num">' + (nx.t0 != null ? U.hm(nx.t0) : '--:--') + '<span>' + U.mins(nx.m) + '</span></span><div class="next-main">' +
        '<p class="next-tags">' + C.stag(nx.s, true) + C.chip(esc(k.label)) + '</p><h3>' + esc(V.sessTitle(nx)) + '</h3>' +
        '<p class="muted small">' + esc(k.how) + '</p></div></div>' +
        '<div class="row-actions">' + (t ? '<a class="btn" href="#t-' + t.gid + '">' + C.icon('study') + 'Open the lesson</a>' : '') + '<button type="button" class="btn ' + (t ? 'alt' : '') + '" data-action="timer-open" data-id="' + nx.id + '">' + C.icon('play') + 'Start focus timer</button>' +
        '<button type="button" class="btn ghost" data-action="sess-done" data-id="' + nx.id + '">' + C.icon('tick') + 'Mark done</button></div></section>';
    }
    html += '<section class="card"><div class="card-head"><h2>Today</h2></div>' + V.timeline(today) + '</section>';
    // Courses
    html += '<section class="card"><div class="card-head"><h2>Your courses</h2><a class="small" href="#study">All courses</a></div><ul class="course-mini">' + M.subjects.map(function (sub) {
      const topics = M.subjectTopics(s, sub), p = M.courseProgress(s, topics), t = M.nextLesson(s, sub, topics);
      return '<li data-subj="' + sub.id + '"><a href="#s-' + sub.id + '" class="cm-name"><i class="sdot"></i><b>' + esc(sub.name) + '</b><span class="num small muted">' + p.done + '/' + p.total + '</span></a><span class="mini-bar"><span style="width:' + Math.round(100 * p.frac) + '%"></span></span>' +
        (t ? '<a class="cm-next small" href="#t-' + t.gid + '">Next: <span class="num">' + M.lessonNum(s, t) + '</span> ' + esc(M.title(t.name)) + '</a>' : '<span class="small muted">Course complete</span>') + '</li>';
    }).join('') + '</ul></section>';
    html += '</div><aside class="col-side">';

    // Deliverables
    const w = D.week();
    if (w) html += '<section class="card"><div class="card-head"><h2>This week’s deliverables</h2><a class="small" href="#deliverables">All</a></div>' +
      (!w.committedAt ? '<p class="note small">' + C.icon('pen', 'i-sm') + ' You haven’t committed to this week yet. <a href="#deliverables">Sign up</a></p>' : '') +
      '<ul class="dv-list compact">' + w.items.map((it) => D.itemRow(it, w.ws, { compact: true })).join('') + '</ul></section>';
    // Flashcards
    const due = RH.cards.totalDue(), deckN = Object.keys(s.decks).length;
    html += '<section class="card"><div class="card-head"><h2>Flashcards</h2><a class="small" href="#cards">Decks</a></div>' +
      (deckN ? '<p class="big-line"><b class="num">' + due + '</b> cards due today</p>' + (due ? '<button type="button" class="btn block" data-action="study" data-deck="all" data-mode="leitner">' + C.icon('cards') + 'Review due cards</button>' : '<p class="muted small">All caught up.</p>')
        : '<p class="muted small">No decks yet. Import from Quizlet or Gizmo, or add a starter deck.</p><a class="btn alt block" href="#cards">Set up flashcards</a>') + '</section>';
    // Countdown
    html += '<section class="card"><div class="card-head"><h2>Exams</h2><a class="small" href="#exams">Timetable</a></div><ul class="list compact">' +
      exams.slice(0, 5).map((e) => '<li class="row" data-subj="' + e.subject + '">' + C.stag(e.subject) + '<span class="row-main"><b>' + esc(e.title) + '</b><span class="muted small">' + esc(U.fmt(e.date)) + (e.time ? ' · ' + e.time : '') + '</span></span>' + C.countdownChip(e.date) + '</li>').join('') +
      (exams.length ? '' : '<li class="muted">No upcoming exams.</li>') + '</ul></section>';
    html += '</aside></div>';
    return html;
  };
})(window.RH = window.RH || {});
</script>
<script>
/* Learn: each subject is a course of numbered lessons. A lesson is one page you work down in order:
   watch, learn the key points, test yourself, exam questions, finish. Plus the resource library and the revision guide. */
(function (RH) {
  'use strict';
  const U = RH.util, M = RH.model, C = RH.c, esc = U.esc;
  const st = () => RH.store.state;
  const V = RH.views;

  // ---------- Small pieces ----------
  function statusIcon(s, t) {
    const ts = s.topics[t.gid] || {};
    if (M.lessonDone(s, t.gid)) return '<span class="ls-ic done" title="Done">' + C.icon('tick') + '</span>';
    if (M.lessonStarted(s, t.gid)) return '<span class="ls-ic part" title="Started"></span>';
    return '<span class="ls-ic' + (ts.nt ? ' nt' : '') + '" title="' + (ts.nt ? 'Not taught yet' : 'Not started') + '"></span>';
  }
  const confMark = (c) => c ? '<span class="ls-conf c' + c + '" title="' + M.CONF[c].label + '"><span class="sr">' + M.CONF[c].label + '</span></span>' : '';
  function lessonRow(s, l, cur, liAttr) {
    const t = l.t, ts = s.topics[t.gid] || {}, vids = M.videos(t).length, pts = (t.pts || []).length;
    return '<li' + (liAttr || '') + '><a class="lesson-row' + (t.gid === cur ? ' cur' : '') + (M.lessonDone(s, t.gid) ? ' is-done' : '') + '" href="#t-' + t.gid + '"' + (t.gid === cur ? ' aria-current="page"' : '') + '>' + statusIcon(s, t) +
      '<span class="ls-num num">' + l.num + '</span><span class="ls-main"><span class="ls-name">' + esc(M.title(t.name)) + '</span><span class="ls-meta">' +
      (vids ? C.icon('video') + U.plural(vids, 'video') : 'Notes only') + (pts ? ' · ' + U.plural(pts, 'key point') : '') + (ts.nt ? ' · <span class="warn-t">Not taught yet</span>' : '') + '</span></span>' + confMark(ts.c) + '</a></li>';
  }
  const progressLine = (p, what) => '<div class="prog"><div class="prog-bar"><span style="width:' + Math.round(100 * p.frac) + '%"></span></div><span class="small"><b class="num">' + p.done + '</b> of <span class="num">' + p.total + '</span> ' + (what || 'lessons') + ' done</span></div>';
  function pager(prev, next) {
    return '<nav class="pager" aria-label="Previous and next">' + (prev ? '<a href="#' + prev[0] + '" class="pg">' + C.icon('left') + '<span><span class="muted small">' + prev[1] + '</span><b>' + esc(prev[2]) + '</b></span></a>' : '<span></span>') +
      (next ? '<a href="#' + next[0] + '" class="pg next"><span><span class="muted small">' + next[1] + '</span><b>' + esc(next[2]) + '</b></span>' + C.icon('right') + '</a>' : '<span></span>') + '</nav>';
  }
  function examLine(s, sid) {
    const ex = M.upcomingExams(s).filter((e) => e.subject === sid);
    return ex.length ? 'First paper ' + esc(U.fmt(ex[0].date)) + ' · ' + U.countdown(C.daysTo(ex[0].date)) : 'No papers on your timetable';
  }

  // ---------- All courses ----------
  V.study = function () {
    const s = st();
    let html = C.page({ eyebrow: 'Learn', title: 'Your courses', lede: 'Pick a subject and work through it lesson by lesson. Every lesson goes in the same order: watch the video, learn the key points, test yourself, then try exam questions.' });
    html += '<div class="course-grid">' + M.subjects.map(function (sub) {
      const topics = M.subjectTopics(s, sub), p = M.courseProgress(s, topics), nx = M.nextLesson(s, sub, topics);
      return '<article class="course-card" data-subj="' + sub.id + '"><a class="cc-band" href="#s-' + sub.id + '"><span class="cc-code num">' + esc(sub.spec) + '</span><h2>' + esc(sub.name) + '</h2><span class="cc-sub">' + esc(sub.board) + ' · ' + U.plural(M.compsFor(s, sub).length, 'section') + ' · ' + U.plural(topics.length, 'lesson') + '</span></a>' +
        '<div class="cc-body">' + progressLine(p) +
        (nx ? '<p class="cc-next"><span class="label">Up next</span><a href="#t-' + nx.gid + '"><span class="num">' + M.lessonNum(s, nx) + '</span> ' + esc(M.title(nx.name)) + '</a></p>' : '<p class="cc-next"><span class="label">Course complete</span>Every lesson is done. Keep revising from the plan.</p>') +
        '<p class="muted small">' + examLine(s, sub.id) + '</p>' +
        '<div class="row-actions">' + (nx ? '<a class="btn" href="#t-' + nx.gid + '">' + (p.done ? 'Continue' : 'Start course') + C.icon('right') + '</a>' : '') + '<a class="btn alt" href="#s-' + sub.id + '">Contents</a></div></div></article>';
    }).join('') + '</div>';
    const recent = Object.keys(s.topics).filter((g) => M.topic[g] && s.topics[g].last).sort((a, b) => s.topics[b].last.localeCompare(s.topics[a].last)).slice(0, 6);
    if (recent.length) html += '<section class="card"><div class="card-head"><h2>Recently studied</h2></div><ul class="lessons">' + recent.map((g) => { const t = M.topic[g]; return lessonRow(s, { t: t, num: M.lessonNum(s, t) }, null, ' data-subj="' + t.subject.id + '"'); }).join('') + '</ul></section>';
    return html;
  };

  // ---------- One course: its contents ----------
  V.subject = function (sid) {
    const s = st(), sub = M.subject[sid];
    if (!sub) return V.notFound();
    const topics = M.subjectTopics(s, sub), p = M.courseProgress(s, topics), nx = M.nextLesson(s, sub, topics);
    const exams = M.upcomingExams(s).filter((e) => e.subject === sid);
    const papers = sub.papers.filter((x) => !x.option || (s.profile.fmOptions && RH.FM_OPTIONS.some((o) => o.paper === x.id && s.profile.fmOptions.indexOf(o.id) !== -1)));
    const course = M.course(s, sub);
    const openUnit = nx ? nx.comp : null;
    let html = '<div data-subj="' + sid + '">' + C.crumbs([['Learn', 'study'], [sub.name]]);
    html += '<header class="course-hero"><div class="ch-text"><p class="eyebrow"><span class="num">' + esc(sub.spec) + '</span> · ' + esc(sub.board) + '</p><h1>' + esc(sub.name) + '</h1>' +
      '<p class="lede">' + U.plural(course.length, 'section') + ', ' + U.plural(topics.length, 'lesson') + '. Work down the list in order, or jump to whatever you need.</p>' + progressLine(p) + '</div>' +
      (nx ? '<a class="up-next" href="#t-' + nx.gid + '"><span class="label">' + (p.done ? 'Continue where you left off' : 'Start here') + '</span><span class="un-num num">Lesson ' + M.lessonNum(s, nx) + '</span><b>' + esc(M.title(nx.name)) + '</b><span class="un-go">' + (p.done ? 'Continue' : 'Start') + C.icon('right') + '</span></a>'
        : '<div class="up-next done"><span class="label">Course complete</span><b>All ' + topics.length + ' lessons done</b><span class="muted small">Your plan keeps bringing topics back for review.</span></div>') + '</header>';
    html += '<div class="papers-row">' + papers.map(function (x) {
      const e = exams.find((y) => y.code === x.code);
      return '<div class="paper-chip"><span class="num small muted">' + esc(x.code) + '</span><b>' + esc(x.name.replace(/^Paper \w+: /, '')) + '</b><span class="muted small">' + (e ? esc(U.fmt(e.date)) + ' · ' + U.countdown(C.daysTo(e.date)) : 'Not on your timetable') + ' · ' + U.mins(x.dur) + '</span></div>';
    }).join('') + '</div>';
    if (sid === 'further' && !s.profile.fmOptions) html += V.fmOptionsCard();

    html += '<div class="contents-head"><h2>Course contents</h2><button type="button" class="btn ghost sm" data-action="units-all">' + C.icon('expand') + 'Open all</button></div><div class="units">';
    let group = '';
    course.forEach(function (u) {
      const c = u.c;
      if (c.group && c.group !== group) { html += '<h3 class="unit-group">' + esc(c.group) + '</h3>'; group = c.group; }
      const up = M.courseProgress(s, c.topics);
      const chosen = !c.option || (s.profile.fmOptions || []).indexOf(c.option) !== -1;
      html += '<details class="unit' + (up.done === up.total ? ' all-done' : '') + '"' + (c === openUnit ? ' open' : '') + '><summary><span class="unit-n num">' + u.n + '</span><span class="unit-t"><b>' + esc(M.title(c.name)) + '</b><span class="muted small">' + U.plural(c.topics.length, 'lesson') + ' · ' + c.papers.map((x) => esc(sub.paper[x].code)).join(', ') + (c.option && !chosen ? ' · option' : '') + '</span></span>' +
        '<span class="unit-p"><span class="num small">' + up.done + '/' + up.total + '</span><span class="mini-bar"><span style="width:' + Math.round(100 * up.frac) + '%"></span></span></span></summary>' +
        '<ol class="lessons">' + u.lessons.map((l) => lessonRow(s, l)).join('') + '</ol><p class="unit-foot"><a href="#c-' + c.gid + '">Section overview and resources' + C.icon('right', 'i-sm') + '</a></p></details>';
    });
    html += '</div>';

    // Whole-course extras, one after another.
    const extra = RH.SUBJECT_VIDEOS[sid] || [];
    const decks = Object.keys(s.decks).map((k) => s.decks[k]).filter((d) => d.subject === sid);
    html += '<h2 class="after-h">More for the whole course</h2>';
    if (extra.length) html += '<details class="card fold"><summary>' + C.icon('video') + '<h3>' + (sid === 'economics' ? 'Exam technique videos' : 'Whole-course videos') + '</h3><span class="muted small">' + extra.length + '</span></summary><div class="fold-body">' +
      (sid === 'economics' ? '<p class="muted small">EconplusDal on each Edexcel question type, and how to write analysis, evaluation and a judgement.</p>' : '') + C.videoGrid(extra.map((v) => ({ ch: v[0], id: v[1], title: v[2] })), sid) + '</div></details>';
    html += '<details class="card fold"><summary>' + C.icon('cards') + '<h3>Flashcard decks</h3><span class="muted small">' + decks.length + '</span></summary><div class="fold-body">' +
      (decks.length ? '<ul class="deck-list">' + decks.map(RH.cards.deckRow).join('') + '</ul>' : '<p class="muted small">No ' + esc(sub.name) + ' decks yet.</p>') +
      '<div class="row-actions"><button type="button" class="btn alt sm" data-action="cards-import">' + C.icon('upload') + 'Import from Quizlet or Gizmo</button>' +
      RH.STARTER_DECKS.filter((d) => d.subject === sid && !decks.some((x) => x.starter === d.id)).map((d) => '<button type="button" class="btn alt sm" data-action="starter-add" data-id="' + d.id + '">' + C.icon('plus') + esc(d.name) + '</button>').join('') + '</div></div></details>';
    html += '<details class="card fold"><summary>' + C.icon('paper') + '<h3>Past papers and course resources</h3><span class="muted small">' + sub.res.length + '</span></summary><div class="fold-body res-cols">' + C.resGroups(sub.res) + '</div></details>';
    return html + '</div>';
  };

  // ---------- One section ----------
  V.section = function (cgid) {
    const s = st(), c = M.comp[cgid];
    if (!c) return V.notFound();
    const sub = c.subject, n = M.sectionNum(s, c);
    const comps = M.compsFor(s, sub, true), idx = comps.indexOf(c);
    const p = M.courseProgress(s, c.topics), nx = M.nextLesson(s, sub, c.topics);
    const anyTaught = c.topics.some((t) => !(s.topics[t.gid] || {}).nt);
    const res = M.compResources(c);
    let html = '<div data-subj="' + sub.id + '">' + C.crumbs([['Learn', 'study'], [sub.name, 's-' + sub.id], [n + '. ' + M.title(c.name)]]);
    html += C.page({ eyebrow: 'Section ' + n + (c.group ? ' · ' + esc(c.group) : '') + ' · ' + c.papers.map((x) => esc(sub.paper[x].code)).join(', '), title: esc(M.title(c.name)),
      actions: nx ? '<a class="btn" href="#t-' + nx.gid + '">' + (p.done ? 'Continue: ' : 'Start: ') + M.lessonNum(s, nx) + C.icon('right') + '</a>' : '' });
    html += progressLine(p);
    html += '<section class="card flush"><ol class="lessons">' + c.topics.map((t) => lessonRow(s, { t: t, num: M.lessonNum(s, t) })).join('') + '</ol></section>';
    html += '<div class="bar-tools"><span class="muted small">Not covered this in class yet? Mark it so the planner leaves it until later.</span><button type="button" class="btn ghost sm" data-action="comp-nt" data-comp="' + c.gid + '" data-v="' + (anyTaught ? 1 : 0) + '">' + (anyTaught ? 'Mark the whole section as not taught yet' : 'Mark the whole section as taught') + '</button></div>';
    const groups = [[['notes'], 'Notes for the whole section'], [['qs', 'papers'], 'Questions and papers'], [['cards', 'other'], 'More']];
    groups.forEach(function (g) {
      const list = res.filter((r) => g[0].indexOf(r.k) !== -1);
      if (list.length) html += '<section class="card"><h2>' + g[1] + '</h2>' + C.resList(list) + '</section>';
    });
    html += pager(comps[idx - 1] && ['c-' + comps[idx - 1].gid, 'Previous section', M.sectionNum(s, comps[idx - 1]) + '. ' + M.title(comps[idx - 1].name)], comps[idx + 1] && ['c-' + comps[idx + 1].gid, 'Next section', M.sectionNum(s, comps[idx + 1]) + '. ' + M.title(comps[idx + 1].name)]);
    return html + '</div>';
  };

  // ---------- One lesson ----------
  function toc(s, t) {
    const sub = t.subject, p = M.courseProgress(s, M.subjectTopics(s, sub));
    const wide = window.innerWidth >= 1080;
    return '<details class="toc"' + (wide ? ' open' : '') + '><summary><span class="toc-t"><span class="label">Course contents</span><b>' + esc(sub.name) + '</b></span><span class="num small muted">' + p.done + '/' + p.total + '</span></summary><div class="toc-body">' +
      M.course(s, sub).map(function (u) {
        const here = u.c === t.comp, up = M.courseProgress(s, u.c.topics);
        return '<details class="toc-u"' + (here ? ' open' : '') + '><summary><span class="num">' + u.n + '</span><span class="toc-un">' + esc(M.title(u.c.name)) + '</span><span class="num small muted">' + up.done + '/' + up.total + '</span></summary><ol>' +
          u.lessons.map((l) => '<li><a href="#t-' + l.t.gid + '"' + (l.t === t ? ' class="cur" aria-current="page"' : '') + '>' + statusIcon(s, l.t) + '<span class="num">' + l.num + '</span><span>' + esc(M.title(l.t.name)) + '</span></a></li>').join('') + '</ol></details>';
      }).join('') + '</div></details>';
  }

  function step(key, n, title, why, body, done, gid, nextLabel) {
    return '<li class="fstep' + (done ? ' done' : '') + '" id="step-' + key + '"><div class="fs-rail"><span class="fs-n">' + (done ? C.icon('tick') : n) + '</span></div><div class="fs-main">' +
      '<header class="fs-head"><h2>' + title + '</h2>' + (why ? '<p class="muted">' + why + '</p>' : '') + '</header><div class="fs-body">' + body + '</div>' +
      (key === 'finish' ? '' : '<div class="fs-foot"><button type="button" class="btn ' + (done ? 'alt' : 'go') + '" data-action="lesson-step" data-id="' + gid + '" data-k="' + key + '" aria-pressed="' + done + '">' + (done ? C.icon('tick') + 'Done' : 'Done, next: ' + nextLabel + C.icon('down')) + '</button></div>') + '</div></li>';
  }
  function videoBlock(t) {
    const vids = M.videos(t), sid = t.subject.id;
    const more = '<details class="fold-lite"><summary>Find more videos on this</summary><div class="chip-row">' + M.videoSearches(t).map((r) => '<a class="chip-link" href="' + esc(r.u) + '" target="_blank" rel="noopener">' + C.icon('search') + esc(r.t) + '</a>').join('') + '</div></details>';
    if (!vids.length) return '<p class="note">No hand-picked video for this lesson. Search one of these channels, or go straight to the key points.</p><div class="chip-row">' + M.videoSearches(t).map((r) => '<a class="chip-link" href="' + esc(r.u) + '" target="_blank" rel="noopener">' + C.icon('search') + esc(r.t) + '</a>').join('') + '</div>';
    const v = vids[0];
    let html = '<a class="vfeat" href="https://www.youtube.com/watch?v=' + v.id + '" target="_blank" rel="noopener" data-subj="' + sid + '"><span class="vthumb">' + (C.canThumb ? '<img loading="lazy" alt="" src="https://i.ytimg.com/vi/' + v.id + '/hqdefault.jpg" onerror="this.remove()">' : '') + '<span class="vplay">' + C.icon('play') + '</span></span>' +
      '<span class="vf-meta"><span class="vch">' + esc(C.channel(v.ch)) + '</span><b>' + esc(v.title) + '</b><span class="muted small">Opens on YouTube</span></span></a>';
    if (vids.length > 1) html += '<p class="label">Also worth watching</p><ul class="vrows">' + vids.slice(1).map((x) => '<li><a href="https://www.youtube.com/watch?v=' + x.id + '" target="_blank" rel="noopener">' + C.icon('pcircle') + '<span><b>' + esc(x.title) + '</b><span class="muted small">' + esc(C.channel(x.ch)) + '</span></span></a></li>').join('') + '</ul>';
    return html + more;
  }
  function resRows(list, show) {
    if (!list.length) return '';
    const head = list.slice(0, show), rest = list.slice(show);
    return C.resList(head) + (rest.length ? '<details class="fold-lite"><summary>' + U.plural(rest.length, 'more link') + '</summary>' + C.resList(rest) + '</details>' : '');
  }

  V.topic = function (gid) {
    const s = st(), t = M.topic[gid];
    if (!t) return V.notFound();
    const ts = M.ts(s, gid), sub = t.subject, c = t.comp, sd = ts.sd || {};
    const num = M.lessonNum(s, t), sn = M.sectionNum(s, c);
    const prev = M.lessonAfter(s, t, -1), next = M.lessonAfter(s, t, 1);
    const ticks = ts.p || [], pts = t.pts || [];
    const res = M.resources(t, s);
    const notes = res.filter((r) => r.k === 'notes' || r.k === 'mine'), practice = res.filter((r) => r.k === 'qs' || r.k === 'papers'), cardRes = res.filter((r) => r.k === 'cards'), other = res.filter((r) => r.k === 'other');
    const decks = RH.cards.forTopic(gid);
    const checks = s.checks.filter((x) => x.topic === gid);
    const done = M.lessonDone(s, gid), steps = M.lessonSteps(s, gid);

    let html = '<div class="lesson" data-subj="' + sub.id + '"><aside class="lesson-side">' + toc(s, t) + '</aside><article class="lesson-main">';
    html += C.crumbs([['Learn', 'study'], [sub.name, 's-' + sub.id], [sn + '. ' + M.title(c.name), 'c-' + c.gid]]);
    html += '<header class="lesson-head"><p class="eyebrow"><span class="lesson-num num">Lesson ' + num + '</span>' + c.papers.map((x) => '<span class="num">' + esc(sub.paper[x].code) + '</span>').join('') + (ts.nt ? C.chip('Not taught yet', 'warn') : '') + (done ? C.chip('Done', 'ok', 'tick') : '') + '</p>' +
      '<h1>' + esc(M.title(t.name)) + '</h1>' +
      '<div class="lesson-prog"><ol class="pips" aria-label="' + steps + ' of 5 steps done">' + M.STEPS.map((x, i) => '<li class="' + ((x[0] === 'finish' ? done : sd[x[0]]) ? 'on' : '') + '"><a href="#step-' + x[0] + '" data-action="to-step" data-k="' + x[0] + '" title="' + x[1] + '">' + (i + 1) + '</a></li>').join('') + '</ol><span class="small muted"><b class="num">' + steps + '</b> of 5 steps</span>' +
      '<span class="lesson-acts"><button type="button" class="btn ghost sm" data-action="add-today" data-id="' + gid + '">' + C.icon('plus') + 'Add to today</button></span></div></header>';

    html += '<ol class="flow">';
    // 1. Watch
    html += step('watch', 1, 'Watch', 'Start with a video. It makes the notes much easier to follow.', videoBlock(t), sd.watch, gid, 'key points');
    // 2. Learn the key points
    let learn = '';
    if (pts.length) learn += '<div class="kp"><p class="kp-h"><b>What you need to know</b><span class="num small muted" id="kp-n">' + ticks.length + '/' + pts.length + '</span></p><p class="muted small">From the specification. Tick a point once you could explain it without notes.</p><ul class="checklist">' +
      pts.map((x, i) => '<li><label><input type="checkbox" data-action="pt-toggle" data-id="' + gid + '" data-i="' + i + '"' + (ticks.indexOf(i) !== -1 ? ' checked' : '') + '><span>' + esc(x) + '</span></label></li>').join('') + '</ul></div>';
    if (t.tip) learn += '<aside class="tip-box"><p class="label">' + C.icon('bulb') + 'Exam tip</p><p>' + esc(t.tip) + '</p></aside>';
    if (notes.length) learn += '<p class="label">Read the notes</p>' + resRows(notes, 4);
    learn += '<details class="fold-lite"' + (ts.notes ? ' open' : '') + '><summary>Your own notes</summary><textarea id="notes-' + gid + '" class="notes" data-notes="' + gid + '" rows="6" placeholder="Key formulae, things you keep getting wrong, questions for your teacher…" aria-label="Your notes">' + esc(ts.notes || '') + '</textarea><span class="muted small" id="notes-saved">Saves as you type</span>' + myLinks(gid) + '</details>';
    html += step('learn', 2, 'Learn the key points', 'Read the notes and make sure you can do each point on the list.', learn, sd.learn, gid, 'test yourself');
    // 3. Test yourself
    let recall = '<div class="try-grid"><div class="try"><h3>' + C.icon('pen') + 'Blurt it</h3><p class="muted small">Close your notes. Write down everything you remember in 10 minutes, then check it against the key points.</p><button type="button" class="btn alt sm" data-action="blurt" data-id="' + gid + '">Start a blurt</button></div>' +
      '<div class="try"><h3>' + C.icon('cards') + 'Flashcards</h3>' + (decks.length ? '<ul class="deck-list">' + decks.map(RH.cards.deckRow).join('') + '</ul>' : '<p class="muted small">Make cards for the things you keep forgetting, or use the ready-made ones below.</p>') +
      '<div class="row-actions"><button type="button" class="btn alt sm" data-action="deck-new" data-topic="' + gid + '">' + C.icon('plus') + 'New deck</button><button type="button" class="btn ghost sm" data-action="cards-import" data-topic="' + gid + '">' + C.icon('upload') + 'Import</button></div>' +
      (cardRes.length ? C.resList(cardRes) : '') + '</div></div>';
    html += step('recall', 3, 'Test yourself', 'Pull it back out of your memory. That is what makes it stick.', recall, sd.recall, gid, 'exam questions');
    // 4. Exam questions
    let exam = practice.length ? '<p class="label">Questions with mark schemes</p>' + resRows(practice, 4) : '<p class="muted">No question pack linked for this lesson. Use a past paper from the course page.</p>';
    exam += '<div class="ai-cta"><span class="ai-ic">' + C.icon('spark') + '</span><div><b>Get your answer marked</b><p class="muted small">Type or photograph a question and your answer. Claude marks it like an Edexcel examiner and shows how to get full marks.</p></div><button type="button" class="btn" data-action="check-topic" data-id="' + gid + '">Check an answer</button></div>';
    if (checks.length) exam += '<p class="label">Your marked answers</p><ul class="list compact">' + checks.slice(0, 5).map((x) => '<li><a class="row link" href="#check-' + x.id + '"><span class="row-main"><b>' + esc((x.question || 'Question from a photo').slice(0, 80)) + '</b><span class="muted small">' + esc(U.fmtShort(x.date)) + '</span></span><span class="score-pill num">' + x.result.score + '/' + x.result.max + '</span></a></li>').join('') + '</ul>';
    html += step('exam', 4, 'Exam questions', 'Do a few real questions, then mark them against the mark scheme.', exam, sd.exam, gid, 'finish');
    // 5. Finish
    let fin = '<p class="label">How confident are you now?</p>' + C.ragFull(gid, ts.c || 0) +
      '<div class="fin-row">' + C.toggle('data-action="toggle-nt" data-id="' + gid + '"', 'Not taught yet', ts.nt, 'The planner leaves it until later.') + '</div>';
    if (other.length) fin += '<details class="fold-lite"><summary>Other links for this lesson</summary>' + C.resList(other) + '</details>';
    fin += done ? '<div class="fin-done"><p>' + C.icon('tick') + '<b>Lesson done</b>' + (ts.last ? ' · last revised ' + esc(U.fmtShort(ts.last)) : '') + '</p>' + (next ? '<a class="btn go lg" href="#t-' + next.gid + '">Next lesson: ' + M.lessonNum(s, next) + ' ' + esc(M.title(next.name)) + C.icon('right') + '</a>' : '<a class="btn lg" href="#s-' + sub.id + '">Back to the course</a>') + '</div>'
      : '<button type="button" class="btn go lg block" data-action="lesson-done" data-id="' + gid + '">' + C.icon('tick') + 'Complete lesson' + (next ? ' and go to ' + M.lessonNum(s, next) : '') + '</button>';
    html += step('finish', 5, 'Finish the lesson', 'Rate yourself honestly. The planner brings weaker lessons back sooner.', fin, done, gid);
    html += '</ol>';
    html += pager(prev && ['t-' + prev.gid, 'Previous lesson', M.lessonNum(s, prev) + ' ' + M.title(prev.name)], next && ['t-' + next.gid, 'Next lesson', M.lessonNum(s, next) + ' ' + M.title(next.name)]);
    return html + '</article></div>';
  };
  function myLinks(gid) {
    const links = (st().topics[gid] || {}).links || [];
    return '<div class="my-links"><p class="label">Your links</p>' +
      (links.length ? '<ul class="res-list">' + links.map((l, i) => '<li class="my-link"><a class="res" href="' + esc(l.u) + '" target="_blank" rel="noopener"><span class="res-t">' + esc(l.t) + '</span><span class="site">Mine</span>' + C.icon('ext', 'i-ext') + '</a><button type="button" class="icon-btn" data-action="link-del" data-id="' + gid + '" data-i="' + i + '" aria-label="Remove link">' + C.icon('x') + '</button></li>').join('') + '</ul>' : '') +
      '<form id="linkForm" class="inline-form" data-topic="' + gid + '"><input name="t" placeholder="Name, e.g. teacher worksheet" aria-label="Link name" required><input name="u" type="url" placeholder="https://…" aria-label="Link address" required><button type="submit" class="btn alt">' + C.icon('plus') + 'Add</button></form></div>';
  }

  V.blurt = function (gid) {
    const t = M.topic[gid];
    C.openModal('Blurt: ' + esc(M.title(t.name)), '<p class="muted">Write everything you remember about this topic without looking. Then reveal the key points and see what you missed.</p>' +
      '<textarea id="blurt-text" rows="9" placeholder="Start writing…"></textarea>' +
      '<div class="row-actions"><button type="button" class="btn" data-action="blurt-reveal">Reveal the key points</button><span class="num muted" id="blurt-clock">10:00</span></div><ul class="checklist plain" id="blurt-list" hidden>' + (t.pts || []).map((p) => '<li>' + esc(p) + '</li>').join('') + '</ul>', { wide: true, subj: t.subject.id });
    const end = Date.now() + 600000;
    const iv = setInterval(function () { const el = document.getElementById('blurt-clock'); if (!el) { clearInterval(iv); return; } el.textContent = RH.timer.fmt((end - Date.now()) / 1000); if (Date.now() > end) { clearInterval(iv); el.textContent = 'Time is up'; } }, 500);
  };

  // ---------- Library & guide ----------
  V.library = function () {
    let html = C.page({ eyebrow: 'Learn', title: 'Resources', lede: 'Every site the hub links to, and each subject’s whole-course resources. Each lesson has the links for that topic.' });
    html += M.subjects.map((sub) => '<details class="card fold" data-subj="' + sub.id + '"><summary>' + C.stag(sub.id) + '<h2>' + esc(sub.name) + '</h2><span class="muted small">' + sub.res.length + ' links</span></summary><div class="fold-body res-cols">' + C.resGroups(sub.res) + '</div></details>').join('');
    html += '<h2 class="after-h">Sites</h2><div class="site-grid">' + Object.keys(RH.SITES).map(function (k) {
      const x = RH.SITES[k];
      return '<a class="card site-card link" href="' + esc(x.url) + '" target="_blank" rel="noopener"><span class="site">' + esc(x.short) + '</span><b>' + esc(x.name) + '</b><span class="muted small">' + esc(x.blurb) + '</span></a>';
    }).join('') + '</div>';
    return html;
  };
  V.guide = function () {
    const today = U.today();
    let html = C.page({ eyebrow: 'Learn', title: 'How to revise', lede: 'What works, how to revise each subject, and a plan for the year.' });
    html += '<section class="card"><div class="card-head"><h2>Your year, phase by phase</h2></div><ol class="phases">' + RH.GUIDE.phases.map(function (p) {
      const now = today >= p.from && today <= p.to, done = today > p.to;
      return '<li class="phase' + (now ? ' now' : '') + (done ? ' done' : '') + '"><span class="num small muted">' + esc(U.fmtShort(p.from)) + ' – ' + esc(U.fmtShort(p.to)) + '</span><b>' + esc(p.title) + (now ? ' ' + C.chip('You are here', 'info') : '') + '</b><p>' + esc(p.body) + '</p></li>';
    }).join('') + '</ol></section>';
    html += '<h2 class="after-h">Study skills that work</h2><div class="tech-grid">' + RH.GUIDE.techniques.map((x) => '<section class="card"><h3>' + esc(x.title) + '</h3><p class="muted">' + esc(x.body) + '</p><ul class="bullets small">' + x.how.map((h) => '<li>' + esc(h) + '</li>').join('') + '</ul></section>').join('') + '</div>';
    html += '<h2 class="after-h">Subject by subject</h2><div class="tech-grid">' + M.subjects.map((sub) => '<section class="card" data-subj="' + sub.id + '"><h3>' + C.stag(sub.id) + ' ' + esc(sub.name) + '</h3><ul class="bullets small">' + RH.GUIDE.subjects[sub.id].map((h) => '<li>' + esc(h) + '</li>').join('') + '</ul></section>').join('') + '</div>';

  };
})(window.RH = window.RH || {});
</script>
<script>
/* Plan: the week on a clock, your routine (school, sleep, activities, free time), exams and strategy. */
(function (RH) {
  'use strict';
  const U = RH.util, M = RH.model, C = RH.c, esc = U.esc, R = RH.routine;
  const st = () => RH.store.state;
  const store = RH.store;
  const V = RH.views;
  const DAYNAMES = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

  // ---------- This week ----------
  const PPM = 0.8; // pixels per minute on the week grid
  V.plan = function () {
    const s = st(), today = U.today();
    const ws = RH.ui.week || U.weekStart(today);
    const days = []; for (let i = 0; i < 7; i++) days.push(U.addDays(ws, i));
    const tls = days.map((d) => R.timeline(s, d));
    const h0 = Math.max(0, Math.floor(Math.min.apply(null, tls.map((t) => t.info.wake)) / 60));
    const h1 = Math.min(24, Math.ceil(Math.max.apply(null, tls.map((t) => Math.min(1440, t.info.bed))) / 60));
    const sess = s.plan.sessions.filter((x) => x.d >= ws && x.d <= days[6]);
    const planned = sess.reduce((a, x) => a + x.m, 0), target = tls.reduce((a, t) => a + t.info.target, 0);
    const free = tls.reduce((a, t) => a + t.items.filter((i) => i.type === 'free').reduce((b, i) => b + i.end - i.start, 0), 0);
    const doneM = sess.filter((x) => x.done).reduce((a, x) => a + x.m, 0);
    const exams = M.exams(s);
    const sum = RH.planner.summary(s);
    let html = C.subnav('plan', 'plan');
    html += C.page({ eyebrow: 'Plan', title: esc(U.fmtShort(ws)) + ' – ' + esc(U.fmtShort(days[6])), lede: U.dur(planned) + ' of revision planned (' + U.dur(doneM) + ' done) · ' + U.dur(free) + ' free time kept · ' + U.plural(sum.sessions, 'session') + ' left until your exams',
      actions: '<button type="button" class="icon-btn" data-action="week-prev" aria-label="Previous week">' + C.icon('left') + '</button><button type="button" class="btn alt sm" data-action="week-today">This week</button><button type="button" class="icon-btn" data-action="week-next" aria-label="Next week">' + C.icon('right') + '</button><button type="button" class="btn sm" data-action="plan-build">' + C.icon('rebuild') + 'Rebuild plan</button>' });
    html += V.staleBanner();
    if (!s.routine.setupAt) html += '<div class="note row-note"><p><b>This plan uses a sample routine.</b> Put in your school times, activities and how much you want to revise so the times fit your real week.</p><a class="btn sm" href="#routine">Set my routine</a></div>';
    if (!s.profile.fmOptions) html += '<div class="note row-note"><p><b>Further Maths options aren’t in the plan yet.</b></p><a class="btn alt sm" href="#preferences">Choose options</a></div>';
    if (target > planned + 60) html += '<p class="muted small">Your targets add up to ' + U.dur(target) + ' this week; ' + U.dur(planned) + ' fits around school, activities and the free time you asked for. <a href="#routine">Adjust your routine</a></p>';

    // Desktop grid
    const hgt = (h1 - h0) * 60 * PPM;
    const pos = (a, b) => 'top:' + Math.max(0, (a - h0 * 60) * PPM).toFixed(1) + 'px;height:' + Math.max(8, (Math.min(b, h1 * 60) - Math.max(a, h0 * 60)) * PPM - 2).toFixed(1) + 'px';
    html += '<section class="card wk-card"><div class="wk" style="--wk-h:' + hgt + 'px"><div class="wk-head"><span></span>' + days.map(function (d, i) {
      const t = tls[i];
      return '<div class="wk-day' + (d === today ? ' today' : '') + '"><span class="label">' + U.DAYS[i] + '</span><b class="num">' + U.parse(d).getDate() + '</b><span class="muted small num">' + U.dur(s.plan.sessions.filter((x) => x.d === d).reduce((a, x) => a + x.m, 0)) + '</span>' + (t.info.hol ? '<span class="chip info">' + esc(t.info.hol.name.split(' ')[0]) + '</span>' : '') + '</div>';
    }).join('') + '</div><div class="wk-body"><div class="wk-hours">';
    for (let h = h0; h < h1; h++) html += '<span style="top:' + ((h - h0) * 60 * PPM) + 'px">' + String(h).padStart(2, '0') + ':00</span>';
    html += '</div>' + days.map(function (d, i) {
      const t = tls[i];
      let col = '<div class="wk-col' + (d === today ? ' today' : '') + (d < today ? ' past' : '') + '">';
      col += '<span class="wb kind-sleep" style="' + pos(h0 * 60, t.info.wake) + '"></span><span class="wb kind-sleep" style="' + pos(t.info.bed, h1 * 60 + 60) + '"></span>';
      t.items.forEach(function (it) {
        if (it.type === 'block' && (it.kind === 'morning' || it.kind === 'winddown')) return;
        const tall = (it.end - it.start) * PPM >= 30;
        if (it.type === 'session') {
          const x = it.sess;
          col += '<button type="button" class="wb kind-study' + (x.done ? ' done' : '') + '" data-subj="' + x.s + '" style="' + pos(it.start, it.end) + '" data-action="sess-open" data-id="' + x.id + '" title="' + esc(U.hm(it.start) + ' ' + V.sessTitle(x)) + '"><b>' + esc(V.sessTitle(x).replace(/^[\d.]+ /, '')) + '</b>' + (tall ? '<span class="num">' + U.hm(it.start) + ' · ' + esc(RH.KIND[x.k].label.split(' ')[0]) + '</span>' : '') + '</button>';
        } else {
          col += '<span class="wb kind-' + it.kind + '"' + (it.subj ? ' data-subj="' + it.subj + '"' : '') + ' style="' + pos(it.start, it.end) + '" title="' + esc(U.hm(it.start) + '–' + U.hm(it.end) + ' ' + (it.label || 'Free time')) + '">' + (tall && it.kind !== 'travel' && it.kind !== 'rest' ? '<b>' + esc(it.type === 'free' ? 'Free' : it.label) + '</b>' : '') + '</span>';
        }
      });
      exams.filter((e) => e.date === d && !e.time).forEach((e) => { col += '<span class="wb kind-exam" style="top:0;height:20px" data-subj="' + e.subject + '"><b>' + esc(e.code) + '</b></span>'; });
      return col + '</div>';
    }).join('') + '</div></div>' +
      '<div class="wk-legend small">' + [['study', 'Revision'], ['school', 'School'], ['activity', 'Activities'], ['meal', 'Meals'], ['exam', 'Exams'], ['free', 'Free time'], ['sleep', 'Asleep']].map((k) => '<span><i class="lgd kind-' + k[0] + '"></i>' + k[1] + '</span>').join('') + '</div></section>';

    // Phone: one day at a time
    const sel = RH.ui.day && RH.ui.day >= ws && RH.ui.day <= days[6] ? RH.ui.day : (today >= ws && today <= days[6] ? today : ws);
    html += '<section class="card wk-phone"><div class="day-chips">' + days.map((d, i) => '<button type="button" class="day-chip' + (d === sel ? ' on' : '') + (d === today ? ' today' : '') + '" data-action="plan-day" data-v="' + d + '"><span>' + U.DAYS[i].slice(0, 1) + '</span><b class="num">' + U.parse(d).getDate() + '</b></button>').join('') + '</div>' +
      '<h2>' + esc(U.fmt(sel, { weekday: 'long', day: 'numeric', month: 'long' })) + '</h2>' + V.timeline(sel) + '</section>';

    html += '<section class="card"><div class="card-head"><h2>Add to your calendar</h2></div><p class="muted small">Exports your exams and every revision session with its time.</p><div class="row-actions"><button type="button" class="btn alt sm" data-action="export-ics">' + C.icon('download') + '.ics for Apple or Outlook</button><button type="button" class="btn alt sm" data-action="export-csv">' + C.icon('download') + '.csv for Google Calendar</button></div></section>';
    return html;
  };

  // ---------- Routine ----------
  const hrs = (m) => Math.round((Number(m) || 0) / 15) / 4;
  V.routine = function () {
    const s = st(), r = s.routine, S = s.plan.settings;
    const ws = U.weekStart(U.today());
    const tot = R.weekTotals(s, ws);
    const pd = RH.ui.rday != null ? RH.ui.rday : U.dow(U.today());
    let html = C.subnav('plan', 'routine');
    html += C.page({ eyebrow: 'Plan', title: 'Your routine', lede: 'Tell the planner when you’re at school, asleep and busy, how much you want to revise and how much free time to protect. Every session then gets a real time slot.',
      actions: '<button type="button" class="btn" data-action="routine-save">' + C.icon('rebuild') + 'Save and rebuild plan</button>' });

    // Weekly balance
    const parts = [['sleep', 'Sleep', tot.sleep], ['school', 'School & travel', tot.school], ['activity', 'Activities & meals', tot.activity], ['study', 'Revision', tot.study], ['free', 'Free time', tot.free]];
    const all = 7 * 1440;
    html += '<section class="card"><div class="card-head"><h2>Your week at a glance</h2><span class="muted small">Revision target ' + U.dur(tot.target) + ', ' + U.dur(tot.study) + ' fits</span></div>' +
      '<div class="balance" role="img" aria-label="How your week is split">' + parts.map((p) => '<span class="kind-' + p[0] + '" style="flex-grow:' + Math.max(1, p[2]) + '" title="' + p[1] + ' ' + U.dur(p[2]) + '"></span>').join('') + '<span class="kind-other" style="flex-grow:' + Math.max(0, all - parts.reduce((a, p) => a + p[2], 0)) + '"></span></div>' +
      '<ul class="balance-key">' + parts.map((p) => '<li><i class="lgd kind-' + p[0] + '"></i><span>' + p[1] + '</span><b class="num">' + U.dur(p[2]) + '</b></li>').join('') + '</ul>' +
      (tot.short.length ? '<div class="note small"><b>Not everything fits.</b> ' + tot.short.map((x) => esc(DAYNAMES[U.dow(x.d)]) + ': ' + U.dur(x.cap) + ' of ' + U.dur(x.target) + (x.freeTotal - x.freeWant < x.target ? ' (only ' + U.dur(Math.max(0, x.freeTotal)) + ' free, and you want ' + U.dur(x.freeWant) + ' of it kept free)' : '')).join('; ') + '.</div>' : '') + '</section>';

    // Days table
    html += '<section class="card"><div class="card-head"><h2>Each day</h2><button type="button" class="btn ghost sm" data-action="r-copy">Copy Monday to Tuesday–Friday</button></div>' +
      '<div class="table-wrap"><table class="tbl routine-tbl"><thead><tr><th>Day</th><th>School</th><th>Wake</th><th>Bed</th><th>Revise (h)</th><th>Free time (h)</th><th class="num">Fits</th></tr></thead><tbody>' +
      r.days.map(function (d, i) {
        const info = R.day(s, U.addDays(ws, i));
        return '<tr><th scope="row">' + DAYNAMES[i] + '</th><td><div class="school-cell"><label class="mini-toggle"><input type="checkbox" data-rday="' + i + '" data-f="school"' + (d.school ? ' checked' : '') + ' aria-label="School on ' + DAYNAMES[i] + '"><span></span></label>' +
          '<input type="time" data-rday="' + i + '" data-f="start" value="' + esc(d.start) + '" aria-label="School starts"' + (d.school ? '' : ' disabled') + '><span class="muted">–</span><input type="time" data-rday="' + i + '" data-f="end" value="' + esc(d.end) + '" aria-label="School ends"' + (d.school ? '' : ' disabled') + '></div></td>' +
          '<td><input type="time" data-rday="' + i + '" data-f="wake" value="' + esc(d.wake) + '" aria-label="Wake up"></td><td><input type="time" data-rday="' + i + '" data-f="bed" value="' + esc(d.bed) + '" aria-label="Bedtime"></td>' +
          '<td><input type="number" min="0" max="14" step="0.25" inputmode="decimal" data-rday="' + i + '" data-f="study" value="' + hrs(d.study) + '" aria-label="Hours of revision"></td>' +
          '<td><input type="number" min="0" max="14" step="0.25" inputmode="decimal" data-rday="' + i + '" data-f="free" value="' + hrs(d.free) + '" aria-label="Hours of free time"></td>' +
          '<td class="num ' + (info.short ? 'warn-t' : 'ok-t') + '">' + U.dur(info.cap) + '</td></tr>';
      }).join('') + '</tbody></table></div><p class="help">“Free time” is time you want kept for yourself: friends, hobbies, games, rest. The planner never books revision into it. “Fits” is how much revision actually fits once everything else is in.</p></section>';

    // Around school
    const num = (k, label, help, min, max, step) => '<label class="field"><span>' + label + '</span><input type="number" min="' + min + '" max="' + max + '" step="' + (step || 5) + '" data-rset="' + k + '" value="' + esc(r[k]) + '">' + (help ? '<span class="help">' + help + '</span>' : '') + '</label>';
    html += '<div class="grid-2"><section class="card"><div class="card-head"><h2>Around school and sleep</h2></div><div class="form-grid">' +
      num('travel', 'Travel each way (min)', '', 0, 120) + num('afterSchool', 'Break after school (min)', 'Before revision starts.', 0, 120) +
      num('prep', 'Getting ready after waking (min)', '', 0, 120) + num('windDown', 'Wind down before bed (min)', 'No revision this close to sleep.', 0, 120) +
      '<label class="field"><span>Earliest revision</span><input type="time" data-rset="earliest" value="' + esc(r.earliest) + '"></label><label class="field"><span>Latest finish</span><input type="time" data-rset="latest" value="' + esc(r.latest) + '"></label></div></section>';
    html += '<section class="card"><div class="card-head"><h2>Sessions</h2></div><div class="form-grid">' +
      '<label class="field"><span>Session length</span><select data-set="sessionLen" data-num="1">' + C.opts([[25, '25 min'], [30, '30 min'], [45, '45 min'], [60, '60 min'], [90, '90 min']], S.sessionLen) + '</select></label>' +
      '<label class="field"><span>Break between</span><select data-set="breakLen" data-num="1">' + C.opts([[5, '5 min'], [10, '10 min'], [15, '15 min']], S.breakLen) + '</select></label>' +
      num('stretch', 'Longest stretch (min)', 'Then a longer break.', 30, 300, 15) + num('longBreak', 'Longer break (min)', '', 10, 60) + '</div>' +
      '<div class="field"><span>When to revise in your free time</span>' + C.seg([['early', 'As early as possible'], ['late', 'As late as possible']], r.prefer, 'data-action="r-prefer"') + '</div></section></div>';

    // Activities
    html += '<section class="card"><div class="card-head"><h2>Regular commitments</h2><button type="button" class="btn alt sm" data-action="ract-add">' + C.icon('plus') + 'Add</button></div><p class="muted small">Clubs, sport, a job, lessons, family time, meals. The planner works around them.</p>' +
      (r.activities.length ? '<div class="act-list">' + r.activities.map((a) => '<div class="act">' +
        '<input class="act-name" data-ract="' + a.id + '" data-f="name" value="' + esc(a.name) + '" aria-label="Name">' +
        '<select data-ract="' + a.id + '" data-f="kind" aria-label="Kind">' + C.opts(Object.keys(RH.ACTIVITY_KINDS).map((k) => [k, RH.ACTIVITY_KINDS[k]]), a.kind) + '</select>' +
        '<div class="daypick" role="group" aria-label="Days">' + U.DAYS.map((d, i) => '<button type="button" class="' + ((a.days || []).indexOf(i) !== -1 ? 'on' : '') + '" data-action="ract-day" data-id="' + a.id + '" data-v="' + i + '" aria-pressed="' + ((a.days || []).indexOf(i) !== -1) + '">' + d.slice(0, 2) + '</button>').join('') + '</div>' +
        '<span class="act-time"><input type="time" data-ract="' + a.id + '" data-f="start" value="' + esc(a.start) + '" aria-label="Starts"><span class="muted">–</span><input type="time" data-ract="' + a.id + '" data-f="end" value="' + esc(a.end) + '" aria-label="Ends"></span>' +
        '<label class="mini-check"><input type="checkbox" data-ract="' + a.id + '" data-f="term"' + (a.term ? ' checked' : '') + '>Term time only</label>' +
        '<button type="button" class="icon-btn" data-action="ract-del" data-id="' + a.id + '" aria-label="Remove ' + esc(a.name) + '">' + C.icon('trash') + '</button></div>').join('') + '</div>' : '<p class="muted">Nothing yet.</p>') + '</section>';

    // One-off events
    html += '<section class="card"><div class="card-head"><h2>One-off plans</h2><button type="button" class="btn alt sm" data-action="rev-add">' + C.icon('plus') + 'Add</button></div><p class="muted small">A party, an appointment, a trip. Busy for the time you set.</p>' +
      (r.events.length ? '<div class="act-list">' + r.events.slice().sort((a, b) => a.date.localeCompare(b.date)).map((e) => '<div class="act">' +

        '<span class="act-time"><input type="time" data-rev="' + e.id + '" data-f="start" value="' + esc(e.start) + '" aria-label="Starts"><span class="muted">–</span><input type="time" data-rev="' + e.id + '" data-f="end" value="' + esc(e.end) + '" aria-label="Ends"></span>' +
        '<button type="button" class="icon-btn" data-action="rev-del" data-id="' + e.id + '" aria-label="Remove ' + esc(e.name) + '">' + C.icon('trash') + '</button></div>').join('') + '</div>' : '<p class="muted">Nothing planned.</p>') + '</section>';

    // Holidays

      '<div class="form-grid narrow"><label class="field"><span>Holiday wake-up</span><input type="time" data-rhol="wake" value="' + esc(r.holiday.wake) + '"></label><label class="field"><span>Holiday bedtime</span><input type="time" data-rhol="bed" value="' + esc(r.holiday.bed) + '"></label></div>' +
      '<div class="act-list">' + (S.holidays || []).map((h) => '<div class="act">' +
        '<input class="act-name" data-hol="' + h.id + '" data-f="name" value="' + esc(h.name) + '" aria-label="Name">' +
        '<span class="act-time"><input type="date" data-hol="' + h.id + '" data-f="from" value="' + esc(h.from) + '" aria-label="From"><span class="muted">–</span><input type="date" data-hol="' + h.id + '" data-f="to" value="' + esc(h.to) + '" aria-label="To"></span>' +
