        '<label class="mini-field">Free <input type="number" min="0" max="14" step="0.5" data-hol="' + h.id + '" data-f="free" value="' + hrs(h.free != null ? h.free : r.holiday.free) + '" aria-label="Hours of free time a day">h</label>' +
        '<button type="button" class="icon-btn" data-action="hol-del" data-id="' + h.id + '" aria-label="Remove ' + esc(h.name) + '">' + C.icon('trash') + '</button></div>').join('') + '</div></section>';

    // Preview a day
    html += '<section class="card"><div class="card-head"><h2>Preview a day</h2></div>' + C.seg(U.DAYS.map((d, i) => [i, d]), pd, 'data-action="r-day"') + V.timeline(U.addDays(ws, pd)) + '</section>';
    html += '<div class="row-actions"><button type="button" class="btn lg" data-action="routine-save">' + C.icon('rebuild') + 'Save and rebuild plan</button></div>';
    return html;
  };

  // ---------- Exams ----------
  V.exams = function () {
    const s = st(), today = U.today();
    let html = C.subnav('plan', 'exams') + C.page({ eyebrow: 'Plan', title: 'Exams and tests', lede: 'Official dates from the <a href="' + RH.EXAM_SOURCE.url + '" target="_blank" rel="noopener">Pearson Edexcel Summer 2027 final timetable</a>. Morning papers start at 9:00, afternoon papers at 1:30pm. Check with your exams officer.' });
    if (!s.profile.fmOptions) html += V.fmOptionsCard();
    let month = '';
    html += '<div class="exam-list">';
    M.officialFor(s).forEach(function (o) {
      const sub = M.subject[o.subject], p = sub.paper[o.paper], on = !s.exams.off[o.id];
      const m = U.fmt(o.date, { month: 'long', year: 'numeric' });
      if (m !== month) { html += '<h2 class="group-h">' + esc(m) + '</h2>'; month = m; }
      const topics = M.paperTopics(s, sub, o.paper), past = o.date < today;
      html += '<article class="card exam' + (on ? '' : ' off') + (past ? ' past' : '') + '" data-subj="' + o.subject + '"><div class="exam-date"><b class="num">' + U.parse(o.date).getDate() + '</b><span>' + esc(U.fmt(o.date, { weekday: 'short' })) + '</span></div>' +
        '<div class="exam-main"><p class="small">' + C.stag(o.subject) + '<span class="num">' + esc(p.code) + '</span> · ' + (o.session === 'AM' ? 'Morning, 9:00' : 'Afternoon, 1:30') + ' · ' + U.mins(p.dur) + ' · ' + p.marks + ' marks</p><h3>' + esc(sub.name) + ' ' + esc(p.name) + '</h3><p class="muted small">' + esc(p.what) + '</p>' +
        '<div class="exam-ready"><span class="small muted">Readiness ' + U.pct(M.readiness(s, topics)) + ' · ' + U.plural(topics.length, 'sub-topic') + '</span>' + C.stack(M.ragCounts(s, topics), p.code) + '</div></div>' +
        '<div class="exam-side">' + (past ? '<span class="muted small">Sat</span>' : C.countdownChip(o.date)) + C.toggle('data-action="exam-toggle" data-id="' + o.id + '"', 'Sitting', on) + '</div></article>';
    });
    html += '</div><section class="card"><div class="card-head"><h2>Mocks and class tests</h2></div>' +
      (s.exams.custom.length ? '<ul class="list">' + s.exams.custom.slice().sort((a, b) => a.date.localeCompare(b.date)).map(function (c) {
        const sub = M.subject[c.subject];
        const comps = c.comps && c.comps.length ? c.comps.map((id) => (sub.comps.find((x) => x.id === id) || {}).name).filter(Boolean).join(', ') : 'Whole subject';
        return '<li class="row" data-subj="' + c.subject + '">' + C.stag(c.subject) + '<span class="row-main"><b>' + esc(c.name) + '</b><span class="muted small">' + esc(U.fmt(c.date)) + (c.time ? ' · ' + esc(c.time) : '') + ' · ' + U.mins(c.dur || 60) + ' · ' + esc(comps) + '</span></span>' + (c.date >= today ? C.countdownChip(c.date) : '<span class="muted small">Done</span>') +

    html += '<div class="grid-2"><section class="card"><div class="card-head"><h2>What matters most</h2></div>' + range('wWeak', 'Weak topics', 'Red and not-started topics first.', 0, 3, 0.25) + range('wUrg', 'Exam urgency', 'Topics in sooner papers first.', 0, 3, 0.25) + range('wCov', 'Cover untouched topics', 'Reach every topic at least once.', 0, 3, 0.25) + range('ppWeeks', 'Past papers: weeks before each exam', 'Timed papers start this many weeks out. 0 turns them off.', 0, 12, 1) + '</section>' +
      '<section class="card"><div class="card-head"><h2>Share of time</h2></div>' + M.subjects.map((sub) => '<div class="field inline" data-subj="' + sub.id + '"><label for="f-subj-' + sub.id + '">' + C.stag(sub.id) + esc(sub.name) + '</label><input type="range" min="0" max="3" step="0.5" id="f-subj-' + sub.id + '" data-subjw="' + sub.id + '" value="' + (S.subj[sub.id] == null ? 1 : S.subj[sub.id]) + '"><output class="num" id="o-subj-' + sub.id + '">' + (S.subj[sub.id] == null ? 1 : S.subj[sub.id]) + '×</output></div>').join('') + '<p class="help">1× is an equal share. 0 leaves a subject out.</p>' +

  const touch = (s) => { s.plan.settingsAt = Date.now(); s.routine.setupAt = s.routine.setupAt || Date.now(); };

  const A = RH.actions;
  A['r-copy'] = () => store.update(function (s) { const m = s.routine.days[0]; for (let i = 1; i < 5; i++) Object.assign(s.routine.days[i], { school: m.school, start: m.start, end: m.end, wake: m.wake, bed: m.bed, study: m.study, free: m.free }); touch(s); });

  A['ract-del'] = (el) => store.update(function (s) { s.routine.activities = s.routine.activities.filter((x) => x.id !== el.dataset.id); touch(s); });

  A['rev-del'] = (el) => store.update(function (s) { s.routine.events = s.routine.events.filter((x) => x.id !== el.dataset.id); touch(s); });

<script>
/* Focus: Pomodoro, countdown, exam timer and stopwatch, plus a webcam focus tracker.
   The tracker runs face detection in the browser (nothing is recorded or uploaded). When you leave your desk
   the timer pauses and the time stops counting; it starts again when you sit back down.
   Focused minutes are logged and count towards your weekly deliverables. */
(function (RH) {
  'use strict';
  const U = RH.util, M = RH.model, C = RH.c, esc = U.esc, $ = RH.$;
  const st = () => RH.store.state;
  const store = RH.store;

  const T = RH.timer = {
    mode: 'pomo', phase: 'focus', cycle: 0, running: false,
    total: 25 * 60, left: 25 * 60, endsAt: 0, elapsed: 0, startedAt: 0, laps: [],
    session: null, examPaper: '', extra: 0, warned: {}, tick: null,
    acc: 0, lastTick: 0, away: 0, awayMs: 0, runStart: 0
  };
  const PHASE = { focus: 'Focus', short: 'Short break', long: 'Long break' };
  const fmt = (sec) => {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(s).padStart(2, '0');
  };
  T.fmt = fmt;
  const pomo = () => st().prefs.pomo;
  const phaseLen = (p) => (p === 'focus' ? pomo().focus : p === 'short' ? pomo().short : pomo().long) * 60;
  const counting = () => T.mode !== 'pomo' || T.phase === 'focus';

  function setTotal(sec) { T.running = false; T.total = T.left = Math.max(1, Math.round(sec)); T.warned = {}; }

  // Write the focused time from the current run to the log.
  function flush() {
    const mins = T.acc / 60;
    if (mins >= 1) {
      const entry = { id: U.uid(), date: U.today(), at: Date.now(), focused: Math.round(mins * 10) / 10, mode: T.mode, session: T.session || null, tracked: F.on, away: T.away, awayMins: Math.round(T.awayMs / 6000) / 10 };
      store.update(function (s) { s.focus.log.push(entry); if (s.focus.log.length > 600) s.focus.log = s.focus.log.slice(-600); s.activity[entry.date] = (s.activity[entry.date] || 0) + 1; }, { silent: true });
    }
    T.acc = 0; T.away = 0; T.awayMs = 0;
  }
  T.flush = flush;

  T.setMode = function (mode) {
    if (T.mode === mode) return;
    flush();
    T.mode = mode; T.running = false; T.elapsed = 0; T.laps = [];
    if (mode === 'pomo') { T.phase = 'focus'; setTotal(phaseLen('focus')); }
    else if (mode === 'exam') setTotal(examSeconds());
    else if (mode === 'countdown') setTotal(T.lastCountdown || 30 * 60);
    paint();
  };
  function examPapers() {
    const out = [];
    M.subjects.forEach((s) => s.papers.forEach((p) => out.push({ id: s.id + '-' + p.id, name: s.name + ' ' + p.code + ' ' + p.name.replace(/^Paper \w+: /, ''), dur: p.dur })));
    return out;
  }
  function examSeconds() {
    const p = examPapers().find((x) => x.id === T.examPaper);
    return Math.round((p ? p.dur : (T.examCustom || 120)) * 60 * (1 + (T.extra || 0) / 100));
  }

  T.start = function () {
    if (T.running) return;
    if (T.mode === 'stopwatch') T.startedAt = Date.now() - T.elapsed * 1000;
    else { if (T.left <= 0) T.left = T.total; T.endsAt = Date.now() + T.left * 1000; }
    T.running = true; T.lastTick = Date.now();
    if (!T.runStart) T.runStart = Date.now();
    loop(); paint();
  };
  T.pause = function () {
    if (!T.running) return;
    if (T.mode === 'stopwatch') T.elapsed = (Date.now() - T.startedAt) / 1000;
    else T.left = (T.endsAt - Date.now()) / 1000;
    T.running = false;
    paint();
  };
  T.reset = function () {
    flush();
    T.running = false; T.runStart = 0;
    if (T.mode === 'stopwatch') { T.elapsed = 0; T.laps = []; }
    else if (T.mode === 'pomo') setTotal(phaseLen(T.phase));
    else setTotal(T.total);
    T.warned = {};
    paint();
  };
  T.skip = function () { if (T.mode === 'pomo') nextPhase(false); };
  function nextPhase(finished) {
    if (T.phase === 'focus') { flush(); if (finished) T.cycle++; T.phase = T.cycle && T.cycle % pomo().cycles === 0 ? 'long' : 'short'; }
    else T.phase = 'focus';
    setTotal(phaseLen(T.phase));
    if (finished && pomo().auto) T.start(); else paint();
  }
  function finish() {
    T.running = false; T.left = 0;
    if (pomo().sound) C.chime('end');
    if (T.mode === 'pomo') {
      const was = T.phase;
      C.toast(was === 'focus' ? 'Focus block done. Take a ' + ((T.cycle + 1) % pomo().cycles === 0 ? 'long' : 'short') + ' break.' : 'Break over. Back to it.');
      nextPhase(true);
      return;
    }
    flush(); T.runStart = 0;
    const x = T.session && RH.findSession && RH.findSession(T.session);
    if (x && !x.done) C.toast('Time is up for "' + RH.views.sessTitle(x) + '".', { action: 'Mark done', fn: () => RH.actions['sess-done']({ dataset: { id: x.id } }) });
    else C.toast(T.mode === 'exam' ? 'Time is up. Pens down.' : 'Time is up.');
    paint();
  }
  function loop() {
    clearInterval(T.tick);
    T.tick = setInterval(function () {
      if (!T.running) return;
      const now = Date.now();
      const dt = (now - T.lastTick) / 1000;
      T.lastTick = now;
      if (counting() && !(F.on && F.status === 'away') && !(F.on && F.status === 'distracted' && st().focus.prefs.sideways)) T.acc += dt;
      if (T.mode === 'stopwatch') { T.elapsed = (now - T.startedAt) / 1000; paint(); return; }
      T.left = (T.endsAt - now) / 1000;
      if (T.mode === 'exam') [30, 10, 5].forEach(function (m) {
        if (T.left <= m * 60 && T.total > m * 60 && !T.warned[m]) { T.warned[m] = 1; if (pomo().sound) C.chime('warn'); C.toast(m + ' minutes left'); }
      });
      if (T.left <= 0) finish();
      paint();
    }, 250);
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && T.acc >= 60) flush(); });

  // ---------- Painting ----------
  function current() { return T.mode === 'stopwatch' ? T.elapsed : T.left; }
  function paint() {
    const pill = $('#timerBtn');
    if (pill) {
      const active = T.running || (T.mode === 'stopwatch' ? T.elapsed > 0 : T.left !== T.total);
      pill.classList.toggle('running', T.running);
      $('#timerLabel').textContent = active ? (T.mode === 'pomo' ? PHASE[T.phase] + ' ' : '') + fmt(current()) : 'Focus';
    }
    const clock = $('#fx-clock');
    if (!clock) return;
    clock.textContent = fmt(current());
    const ring = $('#fx-ring');
    if (ring) {
      const f = T.mode === 'stopwatch' ? (T.elapsed % 60) / 60 : 1 - T.left / T.total;
      const c = 2 * Math.PI * 46;
      ring.setAttribute('stroke-dasharray', (c * f).toFixed(1) + ' ' + c.toFixed(1));
    }
    const play = $('#fx-play');
    if (play) play.innerHTML = T.running ? C.icon('pause') + 'Pause' : C.icon('play') + ((T.mode === 'stopwatch' ? T.elapsed : T.total - T.left) > 0.5 ? 'Resume' : 'Start');
    const ph = $('#fx-phase');
    if (ph) ph.textContent = T.mode === 'pomo' ? PHASE[T.phase] + ' · block ' + (T.cycle % pomo().cycles + (T.phase === 'focus' ? 1 : 0)) + ' of ' + pomo().cycles : T.mode === 'exam' ? (!T.running && T.left === T.total ? 'Ready when you are' : !T.running ? 'Paused' : T.left < 300 ? 'Final minutes' : 'Exam in progress') : T.mode === 'countdown' ? (T.running ? 'Counting down' : 'Countdown') : 'Stopwatch';
    const acc = $('#fx-acc');
    if (acc) acc.textContent = U.dur(T.acc / 60);
    const laps = $('#fx-laps');
    if (laps) laps.innerHTML = T.laps.map((l, i) => '<li><span class="muted">Lap ' + (i + 1) + '</span><span class="num">' + fmt(l) + '</span></li>').join('');
  }
  T.paint = paint;

  T.forSession = function (x) {
    T.session = x.id;
    if (!T.running) { flush(); T.mode = 'countdown'; T.lastCountdown = x.m * 60; setTotal(x.m * 60); }
  };

  // ---------- Webcam focus tracker ----------
  const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21';
  const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite';
  const F = RH.face = { on: false, status: 'off', msg: '', lastSeen: 0, awayStart: 0, sideSince: 0, autoPaused: false, stream: null, detect: null, iv: null, engine: '', today: { away: 0 } };
  const STATUS = { off: ['Off', ''], loading: ['Starting camera…', ''], present: ['At your desk', 'ok'], distracted: ['Looking away', 'warn'], away: ['Away from desk', 'bad'], error: ['Not available', 'bad'] };

  async function mediapipe() {
    const vision = await import(MP + '/vision_bundle.mjs');
    const files = await vision.FilesetResolver.forVisionTasks(MP + '/wasm');
    const det = await vision.FaceDetector.createFromOptions(files, { baseOptions: { modelAssetPath: MODEL, delegate: 'CPU' }, runningMode: 'VIDEO', minDetectionConfidence: 0.6 });
    F.engine = 'MediaPipe face detection';
    return function (video) {
      const r = det.detectForVideo(video, performance.now());
      return (r.detections || []).map((d) => ({ score: d.categories && d.categories[0] ? d.categories[0].score : 1, kp: d.keypoints || [] }));
    };
  }
  async function nativeDetector() {
    if (!('FaceDetector' in window)) throw new Error('no detector');
    const fd = new window.FaceDetector({ fastMode: true, maxDetectedFaces: 1 });
    F.engine = 'Built-in face detection';
    return async (video) => (await fd.detect(video)).map(() => ({ score: 1, kp: [] }));
  }

  // How far the head is turned: 0 facing the screen, about 0.5 or more turned to the side.
  function yaw(kp) {
    if (!kp || kp.length < 3) return 0;
    const re = kp[0], le = kp[1], nose = kp[2];
    const span = Math.abs(re.x - le.x);
    return span > 0.01 ? Math.abs(nose.x - (re.x + le.x) / 2) / span : 0;
  }

  function setStatus(s, msg) {
    const was = F.status;
    F.status = s; F.msg = msg || '';
    const now = Date.now();
    if (was !== 'away' && s === 'away') {
      F.awayStart = now; T.away++; F.today.away++;
      const p = st().focus.prefs;
      if (p.chime) C.chime('away');
      if (p.pauseAway && T.running && T.mode !== 'exam' && counting()) { T.pause(); F.autoPaused = true; C.toast('Timer paused: you left your desk.'); }
    }
    if (was === 'away' && s !== 'away') {
      T.awayMs += now - F.awayStart;
      if (F.autoPaused) { F.autoPaused = false; T.start(); C.toast('Welcome back. Timer resumed.'); }
    }
    paintCam();
  }

  F.start = async function () {
    if (F.on) return;
    if (RH.ai.inClaude) { F.on = false; setStatus('error', 'The camera can’t be used inside claude.ai. Open preview.html in Chrome, Edge, Firefox or Safari to use the focus tracker.'); RH.render({ keepScroll: true }); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { setStatus('error', 'This browser can’t use a camera here.'); RH.render({ keepScroll: true }); return; }
    F.on = true; setStatus('loading');
    RH.render({ keepScroll: true });
    try {
      F.stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 320 }, height: { ideal: 240 }, facingMode: 'user' }, audio: false });
    } catch (e) {
      F.on = false; setStatus('error', e && e.name === 'NotAllowedError' ? 'Camera permission was refused. Allow the camera for this page in your browser settings.' : 'No camera was found.');
      RH.render({ keepScroll: true });
      return;
    }
    const video = $('#camVideo');
    video.srcObject = F.stream;
    try { await video.play(); } catch (e) { /* plays once metadata loads */ }
    try { F.detect = await mediapipe(); }
    catch (e) {
      try { F.detect = await nativeDetector(); }
      catch (e2) { F.stop(); setStatus('error', 'Face detection could not load. It needs an internet connection the first time.'); RH.render({ keepScroll: true }); return; }
    }
    F.lastSeen = Date.now();
    setStatus('present');
    F.iv = setInterval(tick, 400);
    RH.render({ keepScroll: true });
  };
  F.stop = function () {
    clearInterval(F.iv); F.iv = null;
    if (F.stream) F.stream.getTracks().forEach((t) => t.stop());
    F.stream = null; F.on = false; F.detect = null;
    const video = $('#camVideo'); if (video) video.srcObject = null;
    if (F.autoPaused) { F.autoPaused = false; }
    setStatus('off');
  };
  let busy = false;
  async function tick() {
    const video = $('#camVideo');
    if (!F.detect || busy || !video || video.readyState < 2) return;
    busy = true;
    try {
      const faces = await F.detect(video);
      const now = Date.now(), secs = (Number(st().focus.prefs.awaySecs) || 20) * 1000;
      const best = faces.filter((f) => f.score >= 0.7)[0];
      if (best) {
        F.lastSeen = now;
        const turned = yaw(best.kp) > 0.42;
        if (turned) { if (!F.sideSince) F.sideSince = now; } else F.sideSince = 0;
        setStatus(F.sideSince && now - F.sideSince > secs ? 'distracted' : 'present');
      } else if (now - F.lastSeen > secs) setStatus('away');
    } catch (e) { /* skip a frame */ }
    busy = false;
  }
  function paintCam() {
    const dock = $('#camDock');
    if (dock) {
      dock.hidden = !F.on;
      dock.dataset.status = F.status;
      const l = $('#camLabel'); if (l) l.textContent = STATUS[F.status][0];
    }
    const s = $('#fx-cam-status');
    if (s) { s.className = 'chip ' + STATUS[F.status][1]; s.textContent = STATUS[F.status][0]; }
  }
  F.paint = paintCam;

  // ---------- Page ----------
  function todayFocus() {
    const t = U.today();
    return st().focus.log.filter((x) => x.date === t).reduce((a, x) => a + (x.focused || 0), 0);
  }
  function weekFocus() {
    const ws = U.weekStart(U.today()), we = U.addDays(ws, 6);
    return st().focus.log.filter((x) => x.date >= ws && x.date <= we).reduce((a, x) => a + (x.focused || 0), 0);
  }

  RH.views.focus = function () {
    const mode = T.mode, p = pomo(), s = st(), fp = s.focus.prefs;
    const x = T.session && RH.findSession && RH.findSession(T.session);
    const w = RH.deliv.week();
    const fItem = w && w.items.find((it) => it.kind === 'focus');
    const wk = weekFocus();
    let html = C.page({ eyebrow: 'Focus', title: 'Focus', lede: 'Time a session, and turn on the focus tracker so only time at your desk counts.' });
    html += '<div class="fx">';
    // Timer
    html += '<section class="card fx-timer">' + C.seg([['pomo', 'Pomodoro'], ['countdown', 'Countdown'], ['exam', 'Exam timer'], ['stopwatch', 'Stopwatch']], mode, 'data-action="fx-mode"') +
      (x ? '<p class="fx-for">' + C.stag(x.s) + '<b>' + esc(RH.views.sessTitle(x)) + '</b><span class="muted">' + esc(RH.KIND[x.k].label) + ' · ' + U.mins(x.m) + '</span></p>' : '') +
      '<p class="fx-phase" id="fx-phase"></p>' +
      '<div class="fx-dial"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="fx-track" cx="50" cy="50" r="46"/><circle class="fx-arc" id="fx-ring" cx="50" cy="50" r="46" stroke-dasharray="0 289"/></svg><span class="fx-clock num" id="fx-clock">' + fmt(current()) + '</span></div>';
    if (mode === 'countdown') html += C.seg([10, 15, 20, 25, 30, 45, 60, 90].map((m) => [m, m + 'm']), T.total / 60, 'data-action="fx-len"');
    if (mode === 'exam') html += '<div class="form-grid fx-exam"><label class="field"><span>Paper</span><select data-timer="paper"><option value="">Custom length</option>' + C.opts(examPapers().map((q) => [q.id, q.name + ' (' + U.mins(q.dur) + ')']), T.examPaper) + '</select></label>' +
      '<label class="field"><span>Extra time</span><select data-timer="extra">' + C.opts([[0, 'None'], [10, '10%'], [25, '25%'], [50, '50%']], T.extra) + '</select></label>' +
      (T.examPaper ? '' : '<label class="field"><span>Minutes</span><input type="number" min="5" max="300" step="5" data-timer="custom" value="' + (T.examCustom || 120) + '"></label>') + '</div>';
    html += '<div class="row-actions center"><button type="button" class="btn lg" id="fx-play" data-action="timer-play"></button>' +
      (mode === 'stopwatch' ? '<button type="button" class="btn alt" data-action="timer-lap">' + C.icon('flag') + 'Lap</button>' : '') +
      (mode === 'pomo' ? '<button type="button" class="btn alt" data-action="timer-skip">' + C.icon('later') + 'Skip to ' + (T.phase === 'focus' ? 'break' : 'focus') + '</button>' : '') +
      '<button type="button" class="btn ghost" data-action="timer-reset">Reset</button>' +
      (x && !x.done ? '<button type="button" class="btn ghost" data-action="sess-done" data-id="' + x.id + '">' + C.icon('tick') + 'Mark session done</button>' : '') + '</div>' +
      '<p class="muted small center">Focused time this run: <b class="num" id="fx-acc">' + U.dur(T.acc / 60) + '</b></p>' +
      (mode === 'stopwatch' ? '<ol class="laps" id="fx-laps"></ol>' : '') + '</section>';

    // Tracker + stats
    html += '<div class="fx-side"><section class="card fx-cam"><div class="card-head"><h2>' + C.icon('camera') + 'Focus tracker</h2><span id="fx-cam-status" class="chip ' + STATUS[F.status][1] + '">' + STATUS[F.status][0] + '</span></div>' +
      '<p class="muted small">Uses your webcam to check you are at your desk. If you walk away for ' + (fp.awaySecs || 20) + ' seconds the timer pauses and the time stops counting. Video is analysed on this device and never saved or sent anywhere.</p>' +
      (F.status === 'error' && F.msg ? '<p class="note bad-n">' + esc(F.msg) + '</p>' : '') +
      (RH.ai.inClaude ? '<p class="note">The camera is blocked inside claude.ai. Download or open <b>preview.html</b> in your browser to use the tracker.</p>' : '') +
      '<div class="row-actions">' + (F.on ? '<button type="button" class="btn alt" data-action="cam-stop">' + C.icon('stop') + 'Turn off</button>' : '<button type="button" class="btn" data-action="cam-start"' + (RH.ai.inClaude ? ' disabled' : '') + '>' + C.icon('camera') + 'Turn on the tracker</button>') + (F.engine && F.on ? '<span class="muted small">' + esc(F.engine) + '</span>' : '') + '</div>' +
      '<div class="form-grid">' + '<label class="field"><span>Away after</span><select data-fpref="awaySecs">' + C.opts([[10, '10 seconds'], [20, '20 seconds'], [45, '45 seconds'], [90, '90 seconds']], fp.awaySecs) + '</select></label></div>' +
      C.toggle('data-fpref="pauseAway"', 'Pause the timer when I leave', fp.pauseAway, 'Exam timers keep running, like a real exam.') +
      C.toggle('data-fpref="sideways"', 'Don’t count time looking sideways', fp.sideways, 'For example at your phone. Looking down at paper is fine.') +
      C.toggle('data-fpref="chime"', 'Sound when I leave', fp.chime) + '</section>';

    html += '<section class="card"><div class="card-head"><h2>Your focus</h2></div><div class="stats"><div class="stat"><span class="stat-n num">' + U.dur(todayFocus()) + '</span><span class="stat-l">today</span></div><div class="stat"><span class="stat-n num">' + U.dur(wk) + '</span><span class="stat-l">this week' + (fItem ? ' of ' + U.dur(fItem.target) : '') + '</span></div><div class="stat"><span class="stat-n num">' + F.today.away + '</span><span class="stat-l">times away today</span></div></div>' +
      (fItem ? C.bar(wk / fItem.target, wk >= fItem.target ? 'ok' : '', 'Weekly focus target') + '<p class="muted small">Weekly deliverable: ' + esc(fItem.title) + '</p>' : '') +
      '<ul class="list compact">' + s.focus.log.slice(-6).reverse().map((e) => '<li class="row"><span class="row-main"><b class="num">' + U.dur(e.focused) + '</b><span class="muted small">' + esc(U.fmtShort(e.date)) + ' · ' + esc({ pomo: 'Pomodoro', countdown: 'Countdown', exam: 'Exam timer', stopwatch: 'Stopwatch' }[e.mode] || e.mode) + (e.tracked ? ' · tracked' + (e.away ? ', away ' + e.away + '×' : '') : '') + '</span></span></li>').join('') + '</ul>' +
      (s.focus.log.length ? '' : '<p class="muted small">Sessions you time appear here.</p>') + '</section>';
    if (mode === 'pomo') html += '<details class="card fold"><summary><h2>Pomodoro settings</h2></summary><div class="fold-body"><div class="form-grid">' +
      [['focus', 'Focus (min)', 5, 120], ['short', 'Short break', 1, 30], ['long', 'Long break', 5, 60], ['cycles', 'Blocks before a long break', 2, 8]].map((f) => '<label class="field"><span>' + f[1] + '</span><input type="number" min="' + f[2] + '" max="' + f[3] + '" data-pomo="' + f[0] + '" value="' + p[f[0]] + '"></label>').join('') + '</div>' +
      C.toggle('data-pomo="auto"', 'Start the next block automatically', p.auto) + C.toggle('data-pomo="sound"', 'Sound at the end', p.sound) + '</div></details>';
    html += '</div></div>';
    setTimeout(paint, 0);
    return html;
  };

  // ---------- Actions ----------
  RH.actions['fx-mode'] = (el) => { T.setMode(el.dataset.v); RH.render({ keepScroll: true }); };
  RH.actions['fx-len'] = function (el) { T.lastCountdown = Number(el.dataset.v) * 60; flush(); setTotal(T.lastCountdown); RH.render({ keepScroll: true }); };
  RH.actions['timer-play'] = () => { if (T.running) { T.pause(); F.autoPaused = false; } else { C.primeAudio(); T.start(); } };
  RH.actions['timer-reset'] = () => T.reset();
  RH.actions['timer-skip'] = () => T.skip();
  RH.actions['timer-lap'] = () => { if (T.mode === 'stopwatch') { const now = T.running ? (Date.now() - T.startedAt) / 1000 : T.elapsed; T.laps.push(now - T.laps.reduce((a, l) => a + l, 0)); paint(); } };
  RH.actions['timer-open'] = function (el) {
    const x = el.dataset && el.dataset.id && RH.findSession(el.dataset.id);
    if (x) T.forSession(x);
    if (location.hash === '#focus') RH.render({ keepScroll: true }); else location.hash = 'focus';
  };
  RH.actions['cam-start'] = () => { C.primeAudio(); F.start(); };
  RH.actions['cam-stop'] = () => { F.stop(); RH.render({ keepScroll: true }); };

  RH.onChange.push(function (el) {
    if (el.dataset.timer === 'paper') { T.examPaper = el.value; flush(); setTotal(examSeconds()); RH.render({ keepScroll: true }); return true; }
    if (el.dataset.timer === 'extra') { T.extra = Number(el.value); setTotal(examSeconds()); paint(); return true; }
    if (el.dataset.timer === 'custom') { T.examCustom = U.clamp(Number(el.value) || 120, 5, 300); setTotal(examSeconds()); paint(); return true; }
    if (el.dataset.pomo) {
      const k = el.dataset.pomo;
      store.update(function (s) { s.prefs.pomo[k] = el.type === 'checkbox' ? el.checked : U.clamp(Number(el.value) || 1, 1, 180); }, { silent: true });
      if (T.mode === 'pomo' && !T.running && k !== 'auto' && k !== 'sound') setTotal(phaseLen(T.phase));
      paint();
      return true;
    }
    if (el.dataset.fpref) {
      const k = el.dataset.fpref;
      store.update(function (s) { s.focus.prefs[k] = el.type === 'checkbox' ? el.checked : Number(el.value); }, { silent: true });
      return true;
    }
    return false;
  });
})(window.RH = window.RH || {});
</script>
<script>
/* Flashcard terminal: decks, importing from Quizlet / Gizmo / Anki / CSV, the Leitner system and study modes. */
(function (RH) {
  'use strict';
  const U = RH.util, M = RH.model, C = RH.c, esc = U.esc, $ = RH.$;
  const st = () => RH.store.state;
  const store = RH.store;

  // Leitner boxes: a card moved into box k comes back after BOX_DAYS[k] days. A miss sends it to box 1.
  const BOX_DAYS = [0, 1, 2, 4, 8, 16];
  const BOX_NAME = ['', 'Box 1 · daily', 'Box 2 · every 2 days', 'Box 3 · every 4 days', 'Box 4 · every 8 days', 'Box 5 · every 16 days'];
  const isDue = (c, today) => !c.due || c.due <= today;
  const decks = () => Object.keys(st().decks).map((id) => st().decks[id]).sort((a, b) => (a.subject || 'z').localeCompare(b.subject || 'z') || a.name.localeCompare(b.name));

  const K = RH.cards = {};
  K.dueCount = function (deck) { const t = U.today(); return deck.cards.filter((c) => isDue(c, t)).length; };
  K.totalDue = () => decks().reduce((a, d) => a + K.dueCount(d), 0);
  K.forTopic = (gid) => decks().filter((d) => d.topic === gid);
  K.forSubject = (sid) => decks().filter((d) => d.subject === sid && !d.topic);

  const newCard = (f, b) => ({ id: U.uid(), f: String(f).trim(), b: String(b).trim(), box: 1, due: '', n: 0, r: 0, w: 0 });
  function newDeck(name, subject, topic, cards, source) {
    const id = 'd' + U.uid();
    store.update(function (s) {
      s.decks[id] = { id: id, name: name || 'New deck', subject: subject || '', topic: topic || '', source: source || null, created: U.today(), cards: (cards || []).map((c) => newCard(c[0], c[1])) };
    }, { decks: [id], silent: true });
    return id;
  }
  K.newDeck = newDeck;

  // ---------- Import parsing ----------
  function splitCSVLine(line, sep) {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
      else if (ch === '"' && cur === '') q = true;
      else if (ch === sep) { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur);
    return out;
  }
  K.detectSep = function (text) {
    const lines = text.split(/\r?\n/).filter((l) => l.trim()).slice(0, 30);
    if (!lines.length) return '\t';
    const share = (needle) => lines.filter((l) => l.indexOf(needle) !== -1).length / lines.length;
    if (share('\t') > 0.6) return '\t';
    if (share(' - ') > 0.6) return ' - ';
    if (share(',') > 0.6) return ',';
    if (share(':') > 0.6) return ':';
    if (share(';') > 0.6) return ';';
    return '\t';
  };
  K.parse = function (text, termSep, cardSep) {
    text = String(text || '').replace(/\r\n/g, '\n').replace(/^﻿/, '');
    if (termSep === 'auto') termSep = K.detectSep(text);
    const rows = cardSep === 'blank' ? text.split(/\n\s*\n/) : cardSep === 'semi' ? text.split(';') : text.split('\n');
    const cards = [];
    rows.forEach(function (row) {
      if (!row.trim() || /^#/.test(row.trim())) return;
      let f, b;
      if (termSep === ',' || termSep === ';') {
        const parts = splitCSVLine(row, termSep);
        f = parts[0]; b = parts.slice(1).join(termSep === ',' ? ', ' : '; ');
      } else {
        const at = row.indexOf(termSep);
        if (at === -1) return;
        f = row.slice(0, at); b = row.slice(at + termSep.length);
      }
      f = (f || '').trim(); b = (b || '').trim();
      if (f && b) cards.push([f, b]);
    });
    return cards;
  };
  const sourceKind = (url) => /quizlet\.com/i.test(url) ? 'Quizlet' : /gizmo\.ai/i.test(url) ? 'Gizmo' : /ankiweb/i.test(url) ? 'AnkiWeb' : 'Link';

  function subjectOptions(sel) {
    return '<option value="">No subject</option>' + M.subjects.map((s) => '<option value="' + s.id + '"' + (sel === s.id ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('');
  }
  function topicOptions(sid, sel) {
    if (!sid) return '<option value="">Choose a subject first</option>';
    const s = M.subject[sid];
    return '<option value="">Whole subject</option>' + M.compsFor(st(), s, true).map((c) => '<optgroup label="' + esc(c.name) + '">' + c.topics.map((t) => '<option value="' + t.gid + '"' + (sel === t.gid ? ' selected' : '') + '>' + esc(t.name) + '</option>').join('') + '</optgroup>').join('');
  }
  K.topicOptions = topicOptions;

  // ---------- Import dialog ----------
  K.openImport = function (opts) {
    opts = opts || {};
    const t = opts.topic && M.topic[opts.topic];
    const sid = opts.subject || (t ? t.subject.id : '');
    const deckList = decks();
    const body = '<form id="importForm" class="import">' +
      '<details class="how" open><summary>How to get your cards out of Quizlet, Gizmo or Anki</summary><ul class="bullets">' +
      '<li><b>Quizlet:</b> open the set on quizlet.com, choose <i>⋯ → Export</i>, keep <i>Tab</i> between term and definition and <i>New line</i> between rows, then <i>Copy text</i> and paste below.</li>' +
      '<li><b>Gizmo:</b> if your deck came from Quizlet or Anki, export from there. Otherwise copy the cards out of Gizmo, one per line, with a tab, comma or " - " between the question and the answer.</li>' +
      '<li><b>Anki:</b> <i>File → Export → Notes in Plain Text</i>, then choose the file below.</li>' +
      '<li><b>Spreadsheet:</b> save two columns (front, back) as CSV.</li></ul></details>' +
      '<div class="field"><label for="im-text">Paste cards</label><textarea id="im-text" name="text" rows="7" placeholder="Term&#9;Definition&#10;Opportunity cost&#9;The value of the next best alternative forgone"></textarea></div>' +
      '<div class="row-actions"><label class="btn alt file-btn">' + C.icon('upload') + 'Or choose a file (.txt, .csv, .tsv)<input type="file" id="im-file" accept=".txt,.csv,.tsv,text/plain,text/csv"></label></div>' +
      '<div class="form-grid"><div class="field"><label for="im-term">Between term and definition</label><select id="im-term" name="term"><option value="auto">Detect automatically</option><option value="\t">Tab</option><option value=",">Comma (CSV)</option><option value=" - ">Dash ( - )</option><option value=":">Colon</option><option value=";">Semicolon</option></select></div>' +
      '<div class="field"><label for="im-card">Between cards</label><select id="im-card" name="card"><option value="line">New line</option><option value="semi">Semicolon</option><option value="blank">Blank line</option></select></div></div>' +
      '<div class="im-preview" id="im-preview"><p class="muted small">Paste or choose a file to see a preview.</p></div>' +
      '<fieldset class="field"><legend>Add to</legend><div class="form-grid"><div class="field"><label for="im-deck">Deck</label><select id="im-deck" name="deck"><option value="">A new deck</option>' + deckList.map((d) => '<option value="' + d.id + '"' + (opts.deck === d.id ? ' selected' : '') + '>' + esc(d.name) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label for="im-name">New deck name</label><input id="im-name" name="name" value="' + esc(t ? t.name : '') + '" placeholder="e.g. Physics definitions"></div></div>' +
      '<div class="form-grid"><div class="field"><label for="im-subj">Subject</label><select id="im-subj" name="subject" data-cards="subj">' + subjectOptions(sid) + '</select></div>' +
      '<div class="field"><label for="im-topic">Topic</label><select id="im-topic" name="topic">' + topicOptions(sid, opts.topic || '') + '</select></div></div>' +
      '<div class="field"><label for="im-url">Link to the original set (optional)</label><input id="im-url" name="url" type="url" placeholder="https://quizlet.com/… or https://gizmo.ai/…"></div></fieldset>' +
      '<div class="row-actions"><button type="submit" class="btn">' + C.icon('upload') + 'Import cards</button><button type="button" class="btn alt" data-action="modal-close">Cancel</button></div></form>';
    C.openModal('Import flashcards', body, { wide: true });
  };
  function importPreview() {
    const text = $('#im-text') ? $('#im-text').value : '';
    const box = $('#im-preview');
    if (!box) return;
    if (!text.trim()) { box.innerHTML = '<p class="muted small">Paste or choose a file to see a preview.</p>'; return; }
    const term = $('#im-term').value;
    const cards = K.parse(text, term, $('#im-card').value);
    const sepName = { '\t': 'tab', ',': 'comma', ' - ': 'dash', ':': 'colon', ';': 'semicolon' }[term === 'auto' ? K.detectSep(text) : term];
    box.innerHTML = cards.length
      ? '<p class="small"><b>' + U.plural(cards.length, 'card') + '</b> found' + (term === 'auto' ? ' (split on ' + sepName + ')' : '') + '. First few:</p><table class="tbl small"><tbody>' + cards.slice(0, 4).map((c) => '<tr><td>' + esc(c[0]) + '</td><td>' + esc(c[1]) + '</td></tr>').join('') + '</tbody></table>'
      : '<p class="small danger">No cards found. Try a different separator.</p>';
  }

  RH.onSubmit.importForm = function (f) {
    const d = new FormData(f);
    const cards = K.parse(String(d.get('text') || ''), String(d.get('term')), String(d.get('card')));
    if (!cards.length) { C.toast('No cards found to import. Check the separators.'); return; }
    const url = String(d.get('url') || '').trim();
    let id = String(d.get('deck') || '');
    if (id && st().decks[id]) {
      store.update(function (s) { cards.forEach((c) => s.decks[id].cards.push(newCard(c[0], c[1]))); if (url) s.decks[id].source = { kind: sourceKind(url), url: url }; }, { decks: [id], silent: true });
    } else {
      id = newDeck(String(d.get('name') || '').trim() || 'Imported deck', String(d.get('subject') || ''), String(d.get('topic') || ''), cards, url ? { kind: sourceKind(url), url: url } : null);
    }
    C.closeModal();
    C.toast('Imported ' + U.plural(cards.length, 'card'));
    location.hash = 'deck-' + id;
    RH.render();
  };
  RH.onInput.push(function (el) { if (el.id === 'im-text') { importPreview(); return true; } return false; });
  RH.onChange.push(function (el) {
    if (el.id === 'im-term' || el.id === 'im-card') { importPreview(); return true; }
    if (el.id === 'im-file' && el.files && el.files[0]) {
      const r = new FileReader();
      r.onload = () => { $('#im-text').value = String(r.result); importPreview(); };
      r.readAsText(el.files[0]);
      return true;
    }
    if (el.dataset.cards === 'subj') { const tsel = el.form && el.form.querySelector('[name="topic"]'); if (tsel) tsel.innerHTML = topicOptions(el.value, ''); return true; }
    if (el.dataset.deckField) {
      const id = el.dataset.deck, k = el.dataset.deckField;
      store.update(function (s) {
        const dk = s.decks[id]; if (!dk) return;
        if (k === 'url') dk.source = el.value.trim() ? { kind: sourceKind(el.value.trim()), url: el.value.trim() } : null;
        else dk[k] = el.value;
        if (k === 'subject') dk.topic = '';
      }, { decks: [id], silent: k !== 'subject' });
      return true;
    }
    return false;
  });

  // ---------- Pages ----------
  function boxBar(deck) {
    const n = [0, 0, 0, 0, 0, 0];
    deck.cards.forEach((c) => { n[c.box || 1]++; });
    const total = deck.cards.length || 1;
    return '<div class="boxbar" role="img" aria-label="Cards per Leitner box">' + [1, 2, 3, 4, 5].map((b) => n[b] ? '<span class="bx b' + b + '" style="flex-grow:' + n[b] + '" title="' + BOX_NAME[b] + ': ' + n[b] + '"></span>' : '').join('') + (deck.cards.length ? '' : '<span class="bx b0" style="flex-grow:' + total + '"></span>') + '</div>';
  }
  function deckRow(d) {
    const due = K.dueCount(d);
    const t = d.topic && M.topic[d.topic];
    return '<li class="deck-row"' + (d.subject ? ' data-subj="' + d.subject + '"' : '') + '>' + (d.subject ? C.stag(d.subject) : '<span class="tag stag-none">ALL</span>') +
      '<a class="deck-name" href="#deck-' + d.id + '"><b>' + esc(d.name) + '</b><span class="muted small">' + U.plural(d.cards.length, 'card') + (t ? ' · ' + esc(t.name) : '') + (d.source ? ' · from ' + esc(d.source.kind) : '') + '</span>' + boxBar(d) + '</a>' +
      '<span class="due' + (due ? ' on' : '') + '"><b class="num">' + due + '</b> due</span>' +
      '<button type="button" class="btn sm" data-action="study" data-deck="' + d.id + '" data-mode="leitner"' + (due ? '' : ' disabled') + '>Review</button></li>';
  }
  K.deckRow = deckRow;

  RH.views.cards = function () {

      '<p class="help">Get a card right and it moves up one box. Get it wrong and it goes back to box 1. Review the cards that are due every day, a little at a time, and use a Pomodoro block for longer sessions.</p></section>';

  RH.views.deck = function (id) {
    const d = st().decks[id];
    if (!d) return C.head('', 'Deck not found', 'It may have been deleted.') + '<a class="btn" href="#cards">Back to flashcards</a>';
    const due = K.dueCount(d);
    const n = [0, 0, 0, 0, 0, 0];
    d.cards.forEach((c) => { n[c.box || 1]++; });
    const t = d.topic && M.topic[d.topic];
    let html = C.subnav('study', 'cards') + C.crumbs([['Flashcards', 'cards'], [d.name]]);
    html += C.head(d.subject ? C.stag(d.subject) + ' ' + esc(M.subject[d.subject].name) : 'Deck', esc(d.name), U.plural(d.cards.length, 'card') + ' · ' + due + ' due today' + (t ? ' · <a href="#t-' + t.gid + '">' + esc(t.name) + '</a>' : ''),
      d.source ? '<a class="btn alt" href="' + esc(d.source.url) + '" target="_blank" rel="noopener">' + C.icon('ext') + 'Open in ' + esc(d.source.kind) + '</a>' : '');
    const modes = [['leitner', 'Review due cards', 'Leitner: flip, then say if you knew it', 'cards', due], ['all', 'Flip through all', 'Browse every card, no box changes', 'swap', d.cards.length], ['type', 'Type the answer', 'Recall it exactly; it is checked for you', 'pen', null], ['mcq', 'Multiple choice', 'Pick the right answer from four', 'list', null], ['match', 'Match game', 'Pair terms with definitions against the clock', 'grid', null]];
    html += '<div class="mode-grid">' + modes.map((m) => {
