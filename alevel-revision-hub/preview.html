.verdict.good { border-color: var(--c3); background: color-mix(in srgb, var(--c3) 10%, var(--surface)); }
.verdict.bad { border-color: var(--c1); background: color-mix(in srgb, var(--c1) 8%, var(--surface)); }
.mcq { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mcq-o { display: flex; gap: 10px; align-items: flex-start; text-align: left; padding: 12px 14px; border: 1.5px solid var(--line-2); border-radius: var(--r); background: var(--surface); color: var(--ink); font: inherit; font-size: 0.93rem; cursor: pointer; }
.mcq-o:hover:not(:disabled) { border-color: var(--ink-3); }
.mcq-o:disabled { cursor: default; }
.mcq-o.right { border-color: var(--c3); background: color-mix(in srgb, var(--c3) 12%, var(--surface)); }
.mcq-o.wrong { border-color: var(--c1); background: color-mix(in srgb, var(--c1) 10%, var(--surface)); }
.match-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.mtile { min-height: 86px; padding: 10px; border: 1.5px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); font: inherit; font-size: 0.88rem; cursor: pointer; overflow-wrap: anywhere; }
.mtile.term { font-weight: 600; background: var(--surface-2); }
.mtile.sel { border-color: var(--ink); box-shadow: 0 0 0 3px var(--accent-soft); }
.mtile.miss { border-color: var(--c1); }
.mtile.gone { border: 1.5px dashed var(--line); background: transparent; }
.study-done { align-items: center; text-align: center; padding: 28px; }
.big { font-size: 2.4rem; font-weight: 500; line-height: 1.1; }
.keys { padding-top: 4px; }

/* ---------- Past papers ---------- */
.upload-form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 12px; align-items: stretch; }
.upload-form .btn.lg { align-self: center; }
.paper-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.paper-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.paper-item:last-child { border-bottom: 0; }
.pi-main { flex: 1; min-width: 0; display: flex; flex-direction: column; text-decoration: none; color: var(--ink); }
.pi-main:hover b { text-decoration: underline; }
.cd { font-size: 0.78rem; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); white-space: nowrap; }
.num-in { width: 70px; text-align: right; padding: 4px 6px; }
.topic-sel { max-width: 230px; font-size: 0.84rem; padding: 4px 6px; }
.tbl td.row-actions { display: table-cell; white-space: nowrap; }
.tbl td.row-actions > * { vertical-align: middle; margin-right: 4px; }
.trend-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.trend { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
.tr-n { font-size: 1.6rem; }
.spark { width: 100%; height: 40px; margin-top: 6px; }
.sp-grid { stroke: var(--line); stroke-dasharray: 3 3; fill: none; }
.sp-line { stroke: var(--subj); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.sp-end { fill: var(--subj); }
.exam-mode { display: flex; flex-direction: column; gap: 12px; }
.exam-mode:fullscreen { background: var(--bg); overflow-y: auto; padding: 16px; }
.exam-bar { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 66px); z-index: 15; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--subj); border-radius: var(--r); box-shadow: var(--shadow); }
.eb-title { flex: 1; min-width: 160px; display: flex; flex-direction: column; }
.eb-clock { display: flex; flex-direction: column; align-items: center; min-width: 130px; }
.eb-clock .big { font-size: 1.9rem; }
#ex-left.low { color: var(--bad); }
.eb-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.exam-meter { margin-top: -4px; }
.exam-cols { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; align-items: start; }
.qnav { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 170px; max-height: calc(100vh - 190px); overflow-y: auto; padding: 2px; }
.qchip { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 7px 10px; border: 1.5px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); font: inherit; font-size: 0.88rem; cursor: pointer; flex: none; }
.qchip.seen { border-color: var(--ink-3); }
.qchip.done { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--surface)); }
.qchip.flag { box-shadow: inset 4px 0 0 var(--c2); }
.qchip.on { outline: 2px solid var(--ink); outline-offset: 1px; }
.qchip .or { font-size: 0.66rem; font-weight: 600; text-transform: uppercase; color: var(--ink-3); margin-left: 2px; }
.qnav-key { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 6px; }
.k { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 3px; }
.k.done { background: var(--ok); } .k.flag { background: var(--c2); } .k.seen { border: 1.5px solid var(--ink-3); }
.qpane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.q-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.qcrop { background: #fff; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: auto; min-height: 120px; display: flex; flex-direction: column; justify-content: center; }
.qcrop > p { padding: 16px; color: #46514b; }
.qslice { display: block; width: 100%; height: auto; }

    amsp:    { name: 'AMSP', short: 'AMSP', url: 'https://amsp.org.uk/resource/', blurb: 'Advanced Maths Support Programme: free Further Maths resources and enrichment.' },

    eonline: { name: 'Economics Online', short: 'Econ Online', url: 'https://www.economicsonline.co.uk/', blurb: 'Topic explanations and diagrams for micro and macro.' },
    seneca:  { name: 'Seneca', short: 'Seneca', url: 'https://senecalearning.com/en-gb/', blurb: 'Free bite-sized revision courses with built-in recall quizzes.' },

  };

  RH.link = {
    // A resource record: site key, kind, label, url.
    r: (s, k, t, u) => ({ s, k, t, u }),
    pmtFile: (path) => PMT_DL + enc(path),

    search: (site, q) => {
      if (site === 'ehelp') return 'https://www.economicshelp.org/?s=' + encodeURIComponent(q);
      return '';
    }
  };

/* Small helpers: local dates as YYYY-MM-DD strings, escaping, formatting. */
(function (RH) {
  'use strict';
  const pad = (n) => String(n).padStart(2, '0');
  const U = RH.util = {};

  U.iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  U.today = () => U.iso(new Date());
  U.parse = (s) => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  U.addDays = (s, n) => { const d = U.parse(s); d.setDate(d.getDate() + n); return U.iso(d); };
  // Whole days from a to b (negative if b is earlier).
  U.diff = (a, b) => {
    const x = a.split('-').map(Number), y = b.split('-').map(Number);
    return Math.round((Date.UTC(y[0], y[1] - 1, y[2]) - Date.UTC(x[0], x[1] - 1, x[2])) / 864e5);
  };
  U.dow = (s) => (U.parse(s).getDay() + 6) % 7; // Monday = 0
  U.weekStart = (s) => U.addDays(s, -U.dow(s));
  U.fmt = (s, opts) => U.parse(s).toLocaleDateString('en-GB', opts || { weekday: 'short', day: 'numeric', month: 'short' });
  U.fmtLong = (s) => U.fmt(s, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  U.fmtShort = (s) => U.fmt(s, { day: 'numeric', month: 'short' });
  U.DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  U.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  U.uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  U.plural = (n, word, many) => n + ' ' + (n === 1 ? word : (many || word + 's'));
  U.mins = (m) => {
    if (m < 60) return m + ' min';
    const h = Math.floor(m / 60), r = m % 60;
    return h + 'h' + (r ? ' ' + r + 'm' : '');
  };
  U.hours = (m) => (Math.round(m / 6) / 10) + 'h';
  U.pct = (x) => Math.round(x * 100) + '%';
  U.clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  // Stable 0..1 pseudo-random number from a string, used to break ties without reshuffling plans.
  U.hash01 = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; };
  // Clock times: "08:40" <-> minutes after midnight. Times past midnight (bed at 00:30) come back as 1470.
  U.tm = (s) => { if (typeof s === 'number') return s; const p = String(s || '0:0').split(':').map(Number); return (p[0] || 0) * 60 + (p[1] || 0); };
  U.hm = (m) => { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
  U.dur = (m) => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? h + 'h' + (r ? ' ' + pad(r) : '') : r + 'm'; };
  U.countdown = (days) => days === 0 ? 'today' : days === 1 ? 'tomorrow' : days < 0 ? U.plural(-days, 'day') + ' ago' : 'in ' + U.plural(days, 'day');
})(window.RH = window.RH || {});

  // Every non-video resource for a topic, grouped by kind: the topic's own, Mr Gale's, then the section's.
  M.resources = function (t, state) {
    const seen = {}, list = [];
    const add = (r) => { if (r && r.u && r.k !== 'video' && !seen[r.u]) { seen[r.u] = 1; list.push(r); } };
    const mine = state && state.topics[t.gid] && state.topics[t.gid].links;
    (mine || []).forEach((x) => add(L.r('mine', 'mine', x.t, x.u)));
    galeRes(RH.GALE[t.gid]).forEach(add);
    (t.res || []).forEach(add);
    galeRes(RH.GALE_COMP[t.comp.gid]).forEach(add);
    (t.comp.res || []).forEach(add);
    const order = Object.keys(RH.KINDS);
    return list.sort((a, b) => order.indexOf(a.k) - order.indexOf(b.k));
  };
  M.compResources = function (c) {
    const seen = {}, list = [];
    const add = (r) => { if (r && r.u && !seen[r.u]) { seen[r.u] = 1; list.push(r); } };
    galeRes(RH.GALE_COMP[c.gid]).forEach(add);
    (c.res || []).forEach(add);

  };
  M.compVideos = (c) => c.topics.reduce((a, t) => a + M.videos(t).length, 0);

  M.subjects.forEach((s) => s.comps.forEach((c) => { M.comp[c.gid] = c; }));

  // ---------- Courses ----------
  // Each subject is a course: numbered sections, each a run of numbered lessons, in specification order.
  M.STEPS = [['watch', 'Watch'], ['learn', 'Learn the key points'], ['recall', 'Test yourself'], ['exam', 'Exam questions'], ['finish', 'Finish the lesson']];
  // Names that carry their own number ("Topic 2: Mechanics", "1.2 How Markets Work", "3. Sequences") keep it as the label.
  const OWN = /^(?:Topic\s+)?(\d+(?:\.\d+)*)[.:]?\s+/;
  M.title = (name) => String(name).replace(OWN, '');
  M.sectionNum = function (state, c) {
    const m = OWN.exec(c.name);
    return m ? m[1] : String(M.compsFor(state, c.subject, true).indexOf(c) + 1);
  };
  M.lessonNum = function (state, t) {
    const m = OWN.exec(t.name);
    return m && m[1].indexOf('.') !== -1 ? m[1] : M.sectionNum(state, t.comp) + '.' + (t.index + 1);
  };
  M.course = (state, s) => M.compsFor(state, s, true).map((c) => ({ c: c, n: M.sectionNum(state, c), lessons: c.topics.map((t) => ({ t: t, num: M.lessonNum(state, t) })) }));
  // A lesson counts as done once it is completed, or revised in a planned session.
  M.lessonDone = (state, gid) => { const x = state.topics[gid]; return !!(x && (x.done || x.n)); };
  M.lessonSteps = function (state, gid) {
    const x = state.topics[gid] || {}, sd = x.sd || {};
    return M.STEPS.filter((st) => st[0] === 'finish' ? M.lessonDone(state, gid) : sd[st[0]]).length;
  };
  M.lessonStarted = (state, gid) => M.lessonSteps(state, gid) > 0 || ((state.topics[gid] || {}).p || []).length > 0;
  M.courseProgress = function (state, topics) {
    const done = topics.filter((t) => M.lessonDone(state, t.gid)).length;
    return { done: done, total: topics.length, frac: topics.length ? done / topics.length : 0 };
  };
  // The lesson to carry on with: the first one not done, skipping ones marked as not taught yet when possible.
  M.nextLesson = function (state, s, topics) {
    const list = topics || M.subjectTopics(state, s);
    const open = list.filter((t) => !M.lessonDone(state, t.gid));
    return open.find((t) => !(state.topics[t.gid] || {}).nt) || open[0] || null;
  };
  M.lessonAfter = function (state, t, step) {
    const flat = [];
    M.course(state, t.subject).forEach((u) => u.lessons.forEach((l) => flat.push(l.t)));
    return flat[flat.indexOf(t) + (step || 1)] || null;
  };

  M.paperTopics = (state, s, paperId) => M.subjectTopics(state, s).filter((t) => t.comp.papers.indexOf(paperId) !== -1);

  // All exams and tests the student is sitting, soonest first.
  M.exams = function (state) {
    const out = [];
    RH.OFFICIAL_EXAMS.forEach(function (e) {
      const s = M.subject[e.subject], p = s.paper[e.paper];
      if (p.option) {
        const opt = RH.FM_OPTIONS.find((o) => o.paper === e.paper);
        if (!state.profile.fmOptions || state.profile.fmOptions.indexOf(opt.id) === -1) return;
      }
      if (state.exams.off[e.id]) return;
      out.push({ id: e.id, official: true, subject: e.subject, code: p.code, title: s.name + ' ' + p.name.split(':')[0], full: p.name, date: e.date, time: e.time, dur: p.dur,
        topicIds: M.paperTopics(state, s, e.paper).map((t) => t.gid) });
    });
    state.exams.custom.forEach(function (c) {
      const s = M.subject[c.subject];
      if (!s) return;
      const comps = c.comps && c.comps.length ? c.comps : null;
      const topics = M.subjectTopics(state, s).filter((t) => !comps || comps.indexOf(t.comp.id) !== -1);
      out.push({ id: c.id, official: false, subject: c.subject, code: c.name, title: c.name, full: c.name, date: c.date, time: c.time || '', dur: c.dur || 60, topicIds: topics.map((t) => t.gid) });
    });
    return out.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  };
  M.upcomingExams = (state, from) => M.exams(state).filter((e) => e.date >= (from || U.today()));
  M.examById = (state, id) => M.exams(state).find((e) => e.id === id);

  // Officially timetabled exams the student could sit, including ones switched off.
  M.officialFor = function (state) {
    return RH.OFFICIAL_EXAMS.filter(function (e) {
      const p = M.subject[e.subject].paper[e.paper];
      if (!p.option) return true;
      const opt = RH.FM_OPTIONS.find((o) => o.paper === e.paper);
      return state.profile.fmOptions && state.profile.fmOptions.indexOf(opt.id) !== -1;
    });
  };

  M.search = function (state, q) {
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.length) return [];
    return M.activeTopics(state).map(function (t) {
      const hay = (t.name + ' ' + t.comp.name + ' ' + t.subject.name + ' ' + (t.pts || []).join(' ')).toLowerCase();
      if (!words.every((w) => hay.indexOf(w) !== -1)) return null;
      const name = t.name.toLowerCase();
      return { t: t, score: words.reduce((a, w) => a + (name.indexOf(w) !== -1 ? 2 : 0), 0) };
    }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 12).map((x) => x.t);
  };
})(window.RH = window.RH || {});

<script>
/* Your week as clock time: sleep, school, travel, activities, meals and protected free time.
   It works out the windows left for revision each day and gives every planned session a start time. */
(function (RH) {
  'use strict';
  const U = RH.util, M = RH.model, tm = U.tm;
  const R = RH.routine = {};

  RH.ACTIVITY_KINDS = { meal: 'Meal', sport: 'Sport', job: 'Work', club: 'Club or lesson', family: 'Family', other: 'Other' };

  RH.ROUTINE_DEFAULTS = function () {
    const day = (school, wake, bed, study, free) => ({ school: school, start: '08:40', end: '15:30', wake: wake, bed: bed, study: study, free: free });
    return {
      days: [
        day(true, '07:00', '22:45', 150, 90), day(true, '07:00', '22:45', 150, 90), day(true, '07:00', '22:45', 150, 90),
        day(true, '07:00', '22:45', 150, 90), day(true, '07:00', '23:15', 90, 150),
        day(false, '08:30', '23:30', 240, 240), day(false, '08:30', '22:45', 210, 180)
      ],
      travel: 30,        // minutes each way
      prep: 45,          // from waking to being ready to work
      windDown: 45,      // no revision this close to bed
      afterSchool: 30,   // a break before revising on school days
      earliest: '07:30', latest: '21:45',
      stretch: 120,      // longest run of sessions before a long break
      longBreak: 20,
      prefer: 'early',   // fill free time from the start of the day ('early') or the end ('late')
      activities: [{ id: 'a-dinner', name: 'Dinner', kind: 'meal', days: [0, 1, 2, 3, 4, 5, 6], start: '18:30', end: '19:15', term: false }],
      events: [],
      holiday: { wake: '08:30', bed: '23:00', free: 240 },
      setupAt: 0
    };
  };

  // Normalise an older or imported routine, keeping what the student set.
  R.normalise = function (raw, settings) {
    const d = RH.ROUTINE_DEFAULTS();
    if (!raw || typeof raw !== 'object') {
      // First run after an upgrade: carry the old hours-per-day over as study targets.
      if (settings && Array.isArray(settings.week)) settings.week.forEach((m, i) => { if (d.days[i]) d.days[i].study = Number(m) || 0; });
      return d;
    }
    const r = Object.assign(d, raw);
    r.days = (Array.isArray(raw.days) && raw.days.length === 7 ? raw.days : d.days).map((x, i) => Object.assign({}, RH.ROUTINE_DEFAULTS().days[i], x));
    r.activities = Array.isArray(raw.activities) ? raw.activities : d.activities;
    r.events = Array.isArray(raw.events) ? raw.events : [];
    r.holiday = Object.assign(RH.ROUTINE_DEFAULTS().holiday, raw.holiday || {});
    return r;
  };

  const holidayOn = (S, d) => (S.holidays || []).find((h) => h.from && h.to && d >= h.from && d <= h.to) || null;
  R.holidayOn = holidayOn;

  // Subtract busy blocks from a window, returning the free gaps.
  function gaps(from, to, busy) {
    const out = [];
    let c = from;
    busy.slice().sort((a, b) => a.start - b.start).forEach(function (b) {
      if (b.start >= to || b.end <= c) return;
      if (b.start > c) out.push({ start: c, end: Math.min(b.start, to) });
      c = Math.max(c, b.end);
    });
    if (c < to) out.push({ start: c, end: to });
    return out.filter((g) => g.end - g.start >= 15);
  }

  // Minutes of sessions (of length len, with breaks of brk) that fit into the windows.
  function packable(windows, len, brk) {
    let total = 0;
    windows.forEach(function (w) {
      const L = w.end - w.start;
      const n = Math.floor((L + brk) / (len + brk));
      const rem = L - n * (len + brk);
      total += n * len + (rem >= 25 ? rem : 0);
    });
    return total;
  }

  // Everything about one date: the blocks of the day and the revision time it leaves.
  R.day = function (state, d, opts) {
    const r = state.routine, S = state.plan.settings;
    const dow = U.dow(d);
    const base = r.days[dow];
    const hol = holidayOn(S, d);
    const exams = M.exams(state).filter((e) => e.date === d);
    const blocks = [];
    const wake = tm(hol ? r.holiday.wake : base.wake);
    let bed = tm(hol ? r.holiday.bed : base.bed);
    if (bed <= wake) bed += 1440;
    const add = (kind, start, end, label, extra) => { if (end > start) blocks.push(Object.assign({ kind: kind, start: start, end: end, label: label }, extra || {})); };

    add('morning', wake, wake + (Number(r.prep) || 0), 'Get ready');
    let school = null;
    if (!hol && base.school && !exams.length) {
      school = { start: tm(base.start), end: tm(base.end) };
      const tr = Number(r.travel) || 0;
      add('travel', school.start - tr, school.start, 'Travel');
      add('school', school.start, school.end, 'School');
      add('travel', school.end, school.end + tr, 'Travel');
      add('rest', school.end + tr, school.end + tr + (Number(r.afterSchool) || 0), 'Break after school');
    }
    exams.forEach(function (e) {
      const s = tm(e.time || '09:00');
      add('exam', s - 30, s + e.dur, e.code + ' exam', { subj: e.subject, exam: e.id });
    });
    (r.activities || []).forEach(function (a) {
      if ((a.days || []).indexOf(dow) === -1) return;
      if (a.term && hol) return;
      let s = tm(a.start), e = tm(a.end);
      if (e <= s) e += 1440;
      add(a.kind === 'meal' ? 'meal' : 'activity', s, e, a.name, { id: a.id, akind: a.kind });
    });
    (r.events || []).forEach(function (ev) {
      if (ev.date !== d) return;
      let s = tm(ev.start || '00:00'), e = tm(ev.end || '23:59');
      if (e <= s) e += 1440;
      add('event', s, e, ev.name || 'Busy', { id: ev.id });
    });
    add('winddown', bed - (Number(r.windDown) || 0), bed, 'Wind down');
    // Sessions already done today keep their slots.
    (opts && opts.keep || []).forEach((x) => { if (x.t0 != null) add('kept', x.t0, x.t0 + x.m, ''); });

    const from = Math.max(wake + (Number(r.prep) || 0), tm(r.earliest));
    const to = Math.min(bed - (Number(r.windDown) || 0), tm(r.latest) <= tm(r.earliest) ? tm(r.latest) + 1440 : tm(r.latest));
    const windows = from < to ? gaps(from, to, blocks) : [];
    const freeTotal = windows.reduce((a, w) => a + w.end - w.start, 0);
    const target = hol ? (Number(hol.mins) || 0) : (Number(base.study) || 0);
    const freeWant = hol ? (hol.free != null ? Number(hol.free) : Number(r.holiday.free) || 0) : (Number(base.free) || 0);
    const fits = packable(windows, S.sessionLen, S.breakLen);
    const cap = Math.max(0, Math.min(target, freeTotal - freeWant, fits));
    return {
      d: d, dow: dow, hol: hol, school: school, exams: exams, wake: wake, bed: bed,
      blocks: blocks.filter((b) => b.kind !== 'kept').sort((a, b) => a.start - b.start), windows: windows,
      freeTotal: freeTotal, target: target, freeWant: freeWant, cap: cap,
      maxWin: windows.reduce((a, w) => Math.max(a, w.end - w.start), 0),
      short: cap < target
    };
  };

  // Give each not-done session on a date a start time (t0, minutes after midnight). Returns the sessions it could not fit.
  R.placeDay = function (state, d, sessions) {
    const S = state.plan.settings, r = state.routine;
    const done = sessions.filter((x) => x.done && x.t0 != null);
    const todo = sessions.filter((x) => !(x.done && x.t0 != null));
    const info = R.day(state, d, { keep: done });
    const late = r.prefer === 'late';
    const wins = info.windows.map((w) => ({ start: w.start, end: w.end, cur: late ? w.end : w.start, run: 0 }));
    const brk = Number(S.breakLen) || 0, stretch = Number(r.stretch) || 120, lb = Number(r.longBreak) || 20;
    // Long sessions (timed papers) choose their window first.
    const order = todo.slice().sort((a, b) => (b.k === 'pp') - (a.k === 'pp') || (b.k === 'eve') - (a.k === 'eve'));
    const misses = [];
    order.forEach(function (x) {
      const m = x.m;
      let placed = false;
      const list = late ? wins.slice().reverse() : wins;
      for (const w of list) {
        if (late) {
          let end = w.cur;
          if (w.run && w.run + m > stretch) end -= lb - brk;
          const start = end - m;
          if (start >= w.start) { x.t0 = start; w.cur = start - brk; w.run = w.run + m > stretch ? m : w.run + m; placed = true; break; }
        } else {
          let start = w.cur;
          if (w.run && w.run + m > stretch) start += lb - brk;
          if (start + m <= w.end) { x.t0 = start; w.cur = start + m + brk; w.run = w.run + m > stretch ? m : w.run + m; placed = true; break; }
        }
      }
      if (!placed) { x.t0 = null; misses.push(x); }
    });
    return misses;
  };

  // Place every future day's sessions. Call after the plan is built or a session moves.
  R.placeAll = function (state, from) {
    from = from || U.today();
    const byDay = {};
    state.plan.sessions.forEach((x) => { if (x.d >= from) (byDay[x.d] = byDay[x.d] || []).push(x); });
    Object.keys(byDay).forEach((d) => R.placeDay(state, d, byDay[d]));
  };

  // Timeline for one day: routine blocks plus study sessions and the free time left over.
  R.timeline = function (state, d) {
    const info = R.day(state, d);
    const sess = state.plan.sessions.filter((x) => x.d === d && x.t0 != null);
    const items = info.blocks.map((b) => Object.assign({ type: 'block' }, b));
    sess.forEach((x) => items.push({ type: 'session', kind: 'study', start: x.t0, end: x.t0 + x.m, sess: x }));
    // Free time = windows minus sessions.
    const busy = sess.map((x) => ({ start: x.t0, end: x.t0 + x.m + (Number(state.plan.settings.breakLen) || 0) }));
    info.windows.forEach((w) => gaps(w.start, w.end, busy).forEach((g) => { if (g.end - g.start >= 20) items.push({ type: 'free', kind: 'free', start: g.start, end: g.end, label: 'Free time' }); }));
    items.sort((a, b) => a.start - b.start || (a.type === 'block' ? -1 : 1));
    return { info: info, items: items, unplaced: state.plan.sessions.filter((x) => x.d === d && x.t0 == null && !x.done) };
  };

  // Weekly totals for the routine page.
  R.weekTotals = function (state, ws) {
    const t = { school: 0, activity: 0, study: 0, target: 0, free: 0, sleep: 0, short: [] };
    for (let i = 0; i < 7; i++) {
      const d = U.addDays(ws, i), info = R.day(state, d);
      info.blocks.forEach((b) => { if (b.kind === 'school' || b.kind === 'travel') t.school += b.end - b.start; if (b.kind === 'activity' || b.kind === 'meal' || b.kind === 'event') t.activity += b.end - b.start; });
      t.study += info.cap; t.target += info.target;
      t.free += Math.max(0, info.freeTotal - info.cap);
      t.sleep += 1440 - (info.bed - info.wake);
      if (info.short) t.short.push({ d: d, cap: info.cap, target: info.target, freeTotal: info.freeTotal, freeWant: info.freeWant });
    }
    return t;
  };
})(window.RH = window.RH || {});
</script>
<script>
/* Builds a day-by-day revision plan from exams, availability, confidence ratings and the chosen criteria. */
(function (RH) {
  'use strict';
  const U = RH.util, M = RH.model;

  // What each kind of session asks you to do. Order: what a first pass through a topic looks like.
  RH.KIND = {
    learn:    { label: 'Learn & condense', how: 'Read the notes or cheat sheet, watch one video, then write a one-page summary and 5 flashcards.' },
    practice: { label: 'Exam questions', how: 'Do topic questions under time pressure, mark them with the mark scheme, and log every mistake.' },
    recall:   { label: 'Active recall', how: 'Blurt everything you remember, check the gaps, run your flashcards, then do 3 exam questions.' },
    pp:       { label: 'Timed past paper', how: 'Full paper under exam conditions, then mark it with the mark scheme and log the marks.' },
    eve:      { label: 'Exam-eve review', how: 'Light review only: formulae, definitions, your mistakes log, and a few quick questions. Sleep early.' }
  };

  // Days to wait before reviewing a topic again, by how many times it has been revised.
  const INTERVALS = [2, 5, 10, 21, 35];

  RH.PRESETS = {
    balanced: { label: 'Balanced', note: 'Even mix of weak topics, upcoming exams and full coverage.', wWeak: 1.5, wUrg: 1.5, wCov: 1, spacing: true, interleave: true, ppWeeks: 8, focusNext: false },
    weakest:  { label: 'Weakest first', note: 'Red and not-started topics come first, wherever they sit on the timetable.', wWeak: 3, wUrg: 0.75, wCov: 0.75, spacing: true, interleave: true, ppWeeks: 6, focusNext: false },
    countdown:{ label: 'Exam countdown', note: 'The sooner a paper is, the more its topics are revised. More past papers near each exam.', wWeak: 1, wUrg: 3, wCov: 0.75, spacing: true, interleave: true, ppWeeks: 10, focusNext: false },
    coverage: { label: 'Cover everything', note: 'Touch every topic once before repeating any. Good for a first pass after finishing the course.', wWeak: 1, wUrg: 0.5, wCov: 3, spacing: false, interleave: true, ppWeeks: 4, focusNext: false },
    nexttest: { label: 'Next test only', note: 'Only revise what is in your next exam or mock, weakest first.', wWeak: 2, wUrg: 1, wCov: 1, spacing: true, interleave: false, ppWeeks: 3, focusNext: true }
  };

  RH.PLAN_DEFAULTS = function () {
    return {
      preset: 'balanced',
      start: '', end: '',
      week: [90, 90, 90, 90, 60, 180, 150],
      holidays: [
        { id: 'h1', name: 'Christmas holidays', from: '2026-12-19', to: '2027-01-03', mins: 240 },
        { id: 'h2', name: 'February half term', from: '2027-02-13', to: '2027-02-21', mins: 240 },
        { id: 'h3', name: 'Easter holidays', from: '2027-03-27', to: '2027-04-11', mins: 300 },
        { id: 'h4', name: 'Study leave & exam season', from: '2027-05-08', to: '2027-06-21', mins: 300 }
      ],
      sessionLen: 45, breakLen: 10,
      wWeak: 1.5, wUrg: 1.5, wCov: 1, spacing: true, interleave: true, ppWeeks: 8, focusNext: false,
      eveReview: true, examDay: 'light', skipUntaught: true,
      subj: { physics: 1, maths: 1, further: 1, economics: 1 }
    };
  };

  // Minutes of revision a date can hold, from the routine (school, activities, sleep, protected free time).
  function capacity(state, d) { return RH.routine.day(state, d).cap; }

  function weakness(conf) {
    // 0 = not started, 3 = green. Fractions appear while simulating repeated sessions.
    return conf <= 0 ? 1 : 0.1 + 0.9 * (1 - conf / 3) * 0.8;
  }

  RH.planner = {
    capacity: capacity,

    generate: function (state, today) {
      const S = state.plan.settings;
      today = today || U.today();
      const start = S.start && S.start > today ? S.start : today;
      const weightOf = (sid) => (S.subj[sid] == null ? 1 : Number(S.subj[sid]));
      const exams = M.exams(state).filter((e) => e.date >= start && weightOf(e.subject) > 0);
      const end = S.end && S.end > start ? S.end : (exams.length ? exams[exams.length - 1].date : U.addDays(start, 56));

      // Work in whole day numbers; convert back to dates only when writing sessions.
      const day0 = start, num = (iso) => U.diff(day0, iso), dateOf = (n) => U.addDays(day0, n);
      const ex = exams.map((e) => Object.assign({}, e, { n: num(e.date) }));
      const last = num(end);

      // Done sessions and anything before the start date stay as history.
      const kept = state.plan.sessions.filter((s) => s.d < start || s.done);
      const keptMins = {};
      kept.forEach((s) => { if (s.d >= start) { const k = num(s.d); keptMins[k] = (keptMins[k] || 0) + s.m; } });

      const topicExams = {};
      ex.forEach((e) => e.topicIds.forEach((id) => { (topicExams[id] = topicExams[id] || []).push(e); }));
      let pool = M.activeTopics(state).filter((t) => weightOf(t.subject.id) > 0 && !(S.skipUntaught && state.topics[t.gid] && state.topics[t.gid].nt));
      if (ex.length) pool = pool.filter((t) => topicExams[t.gid]);

      const sim = {};
      pool.forEach(function (t) {
        const ts = state.topics[t.gid] || {};
        sim[t.gid] = { conf: ts.c || 0, n: ts.n || 0, last: ts.last ? num(ts.last) : null, planned: null };
      });

      // Target share of time per subject, from the priority sliders.
      const subjIds = Object.keys(M.subject).filter((id) => weightOf(id) > 0 && pool.some((t) => t.subject.id === id));
      const wSum = subjIds.reduce((a, id) => a + weightOf(id), 0) || 1;
      const spent = {};
      let spentAll = 0;

      const capOf = [], winOf = [];
      for (let n = 0; n <= last; n++) { const info = RH.routine.day(state, dateOf(n)); capOf[n] = info.cap; winOf[n] = info.maxWin; }

      const out = [];
      const lastPaper = {};
      for (let n = 0; n <= last; n++) {
        const upcoming = ex.filter((e) => e.n > n);
        if (ex.length && !upcoming.length) break;
        let cap = capOf[n] - (keptMins[n] || 0);
        const todays = ex.filter((e) => e.n === n);
        if (todays.length) {
          if (S.examDay === 'off') continue;
          if (S.examDay === 'light') cap = Math.floor(cap / 2);
        }
        if (cap < 20) continue;
        const d = dateOf(n);

        const tomorrow = ex.filter((e) => e.n === n + 1);
        let only = null;
        if (S.eveReview && tomorrow.length) {
          only = {};
          tomorrow.forEach(function (e) {
            e.topicIds.forEach((id) => { only[id] = 1; });
            if (cap < 20) return;
            const m = Math.min(S.sessionLen, cap);
            out.push({ id: U.uid(), d: d, k: 'eve', s: e.subject, e: e.id, m: m, why: e.title + ' is tomorrow' });
            cap -= m;
          });
        }
        if (S.focusNext && upcoming.length && !only) {
          only = {};
          upcoming[0].topicIds.forEach((id) => { only[id] = 1; });
        }

        // At most one timed past paper a day, more often as each exam gets closer.
        if (S.ppWeeks > 0 && !(tomorrow.length && S.eveReview)) {
          let best = null, bestScore = 0, bestLeft = 0;
          upcoming.forEach(function (e) {
            if (!e.official) return;
            const left = e.n - n;
            if (left < 2 || left > S.ppWeeks * 7) return;
            const gap = lastPaper[e.id] != null ? n - lastPaper[e.id] : 99;
            const need = left > 28 ? 10 : left > 14 ? 6 : 3;
            if (gap < need) return;
            const score = Math.min(gap / need, 3) + 3 / (left + 1);
            if (score > bestScore) { best = e; bestScore = score; bestLeft = left; }
          });
          if (best && cap >= best.dur + 30 && winOf[n] >= best.dur + 30) {
            const m = best.dur + 30;
            out.push({ id: U.uid(), d: d, k: 'pp', s: best.subject, e: best.id, m: m, why: best.title + ' ' + U.countdown(bestLeft) + ': paper + marking' });
            cap -= m;
            lastPaper[best.id] = n;
            spent[best.subject] = (spent[best.subject] || 0) + m; spentAll += m;
          }
        }

        const used = {};
        const daySubj = [];
        while (cap >= Math.min(25, S.sessionLen)) {
          const m = Math.min(S.sessionLen, cap);
          let best = null, bestScore = -1, bestInfo = null;
          for (let i = 0; i < pool.length; i++) {
            const t = pool[i];
            if (used[t.gid] || (only && !only[t.gid])) continue;
            const st = sim[t.gid];
            let next = null;
            const list = topicExams[t.gid];
            if (list) for (let j = 0; j < list.length; j++) { if (list[j].n > n) { next = list[j]; break; } }
            if (ex.length && !next) continue;
            const days = next ? next.n - n : 60;
            const weak = weakness(st.conf);
            const urg = 1 / (1 + days / 21);
            const cov = st.n === 0 ? 1 : 0;
            let due = 0;
            if (S.spacing && st.last != null) {
              const gap = n - st.last, want = INTERVALS[Math.min(st.n, INTERVALS.length - 1)];
              if (gap >= want) due = Math.min(1, 0.5 + 0.5 * (gap - want) / want);
            }
            let score = S.wWeak * weak + S.wUrg * urg + S.wCov * cov + due;
            const sid = t.subject.id;
            const target = weightOf(sid) / wSum * (spentAll + 240);
            score *= U.clamp(Math.pow(target / ((spent[sid] || 0) + 60), 0.6), 0.45, 1.8);
            if (st.planned != null) {
              const g = n - st.planned;
              if (g < 2) score *= 0.25; else if (g < 4) score *= 0.6;
            }
            if (S.interleave) {
              if (daySubj[daySubj.length - 1] === sid) score *= 0.5;
              else if (daySubj.indexOf(sid) !== -1) score *= 0.8;
            } else if (daySubj.length) {
              score *= daySubj[0] === sid ? 1.6 : 0.3;
            }
            score += U.hash01(t.gid + n) * 0.02;
            if (score > bestScore) { bestScore = score; best = t; bestInfo = { due: due, next: next, days: days }; }
          }
          if (!best) break;
          const st = sim[best.gid];
          const why = [st.conf <= 0 && st.n === 0 ? 'Not started' : st.conf < 1.5 ? 'Weak topic' : st.conf < 2.5 ? 'Amber topic' : 'Keep it fresh'];
          if (bestInfo.due > 0) why.push('due for review');
          if (bestInfo.next) why.push(bestInfo.next.code + ' ' + U.countdown(bestInfo.days));
          const kind = st.n === 0 ? (st.conf >= 2 ? 'practice' : 'learn') : (st.conf >= 2.5 ? 'recall' : (st.n % 2 ? 'practice' : 'recall'));
          out.push({ id: U.uid(), d: d, k: kind, s: best.subject.id, t: best.gid, m: m, why: why.join(' · ') });
          st.n++; st.planned = n; st.last = n; st.conf = Math.min(3, st.conf + (st.conf === 0 ? 1 : 0.5));
          used[best.gid] = 1; daySubj.push(best.subject.id);
          spent[best.subject.id] = (spent[best.subject.id] || 0) + m; spentAll += m;
          cap -= m;
        }
      }
      const all = kept.concat(out).sort((a, b) => a.d.localeCompare(b.d));
      const byDay = {};
      all.forEach((x) => { if (x.d >= start) (byDay[x.d] = byDay[x.d] || []).push(x); });
      Object.keys(byDay).forEach((d) => RH.routine.placeDay(state, d, byDay[d]));
      return all;
    },

    // Plan summary: minutes per subject, and how many topics get at least one session before their first exam.
    summary: function (state) {
      const today = U.today();
      const future = state.plan.sessions.filter((s) => s.d >= today && !s.done);
      const mins = {}, touched = {};
      future.forEach((s) => { mins[s.s] = (mins[s.s] || 0) + s.m; if (s.t) touched[s.t] = 1; });
      const topics = M.activeTopics(state);
      return { sessions: future.length, mins: mins, total: future.reduce((a, s) => a + s.m, 0), covered: topics.filter((t) => touched[t.gid]).length, topics: topics.length };
    }
  };
})(window.RH = window.RH || {});
</script>
<script>
/* Saved state. Always kept in this browser; when the page runs on claude.ai it also syncs to the
   signed-in person's private storage so progress follows them between devices.
   Cloud layout (one private folder per person): state, plan, and one document per flashcard deck. */
(function (RH) {
  'use strict';
  const KEY = 'alevel-revision-hub:v1';
  const MAX_DOC = 250000; // the cloud store caps each document at 256 KiB

  const S = RH.store = { state: null, sync: 'local', listeners: [] };

  function defaults() {
    return {
      v: 2, updatedAt: 0,
      profile: { name: '', fmOptions: null, theme: 'system', welcomed: false },
      topics: {},
      exams: { off: {}, custom: [] },
      plan: { settings: RH.PLAN_DEFAULTS(), sessions: [], builtAt: 0, settingsAt: 0 },
      papers: [],
      activity: {},
      decks: {},
      portal: { papers: {}, attempts: [] },
      prefs: { pomo: { focus: 25, short: 5, long: 15, cycles: 4, auto: true, sound: true }, cardsDaily: 50 },
      routine: RH.ROUTINE_DEFAULTS(),
      deliv: { settings: { day: 6, time: '20:00', count: 6, strict: true, carry: true, partner: '' }, weeks: {} },
      checks: [],
      focus: { log: [], prefs: { pauseAway: true, awaySecs: 20, sideways: true, chime: true } },
      cardLog: {},
      ratedAt: 0
    };
  }

  const obj = (x) => x && typeof x === 'object' && !Array.isArray(x);

  // Fill in anything missing from an older or imported save.
  function normalise(raw) {
    const d = defaults();
    if (!obj(raw)) return d;
    const s = Object.assign(d, raw);
    s.profile = Object.assign(defaults().profile, raw.profile || {});
    s.exams = Object.assign(defaults().exams, raw.exams || {});
    s.exams.off = obj(s.exams.off) ? s.exams.off : {};
    s.exams.custom = Array.isArray(s.exams.custom) ? s.exams.custom : [];
    const plan = raw.plan || {};
    s.plan = Object.assign(defaults().plan, plan);
    s.plan.settings = Object.assign(RH.PLAN_DEFAULTS(), plan.settings || {});
    s.plan.settings.subj = Object.assign(RH.PLAN_DEFAULTS().subj, (plan.settings || {}).subj || {});
    s.plan.sessions = Array.isArray(plan.sessions) ? plan.sessions : [];
    s.topics = obj(s.topics) ? s.topics : {};
    s.papers = Array.isArray(s.papers) ? s.papers : [];
    s.activity = obj(s.activity) ? s.activity : {};
    s.decks = obj(s.decks) ? s.decks : {};
    s.portal = Object.assign(defaults().portal, obj(raw.portal) ? raw.portal : {});
    s.portal.papers = obj(s.portal.papers) ? s.portal.papers : {};
    s.portal.attempts = Array.isArray(s.portal.attempts) ? s.portal.attempts : [];
    s.prefs = Object.assign(defaults().prefs, obj(raw.prefs) ? raw.prefs : {});
    s.prefs.pomo = Object.assign(defaults().prefs.pomo, (raw.prefs || {}).pomo || {});
    s.routine = RH.routine.normalise(raw.routine, (raw.plan || {}).settings);
    const dv = obj(raw.deliv) ? raw.deliv : {};
    s.deliv = { settings: Object.assign(defaults().deliv.settings, dv.settings || {}), weeks: obj(dv.weeks) ? dv.weeks : {} };
    s.checks = Array.isArray(raw.checks) ? raw.checks : [];
    const fc = obj(raw.focus) ? raw.focus : {};
    s.focus = { log: Array.isArray(fc.log) ? fc.log : [], prefs: Object.assign(defaults().focus.prefs, fc.prefs || {}) };
    s.cardLog = obj(raw.cardLog) ? raw.cardLog : {};
    s.v = 3;
    return s;
  }

  const clone = (x) => JSON.parse(JSON.stringify(x));

  function readLocal() {
    try { const t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; }
  }
  function writeLocal() {
    try { localStorage.setItem(KEY, JSON.stringify(S.state)); return true; } catch (e) { return false; }
  }

  function emit(why) { S.listeners.forEach((fn) => { try { fn(why); } catch (e) { console.error(e); } }); }
  S.on = (fn) => { S.listeners.push(fn); };

  S.load = function () {
    S.state = normalise(readLocal());
    S.isNew = !S.state.updatedAt;
    return S.state;
  };

  // Change state through here so every change is saved and the page re-renders.
  // opts.plan marks the plan dirty; opts.decks lists deck ids that changed (or were deleted); opts.checks marks AI checks dirty.
  S.update = function (fn, opts) {
    fn(S.state);
    S.state.updatedAt = Date.now();
    if (opts && opts.plan) planDirty = true;
    if (opts && opts.checks) checksDirty = true;
    if (opts && opts.decks) opts.decks.forEach((id) => { deckDirty[id] = 1; });
    writeLocal();
    schedulePush();
    if (!(opts && opts.silent)) emit('change');
  };

  // ---- Cloud sync (claude.ai only) ----
  let cloud = null, timer = null, inflight = false, again = false, planDirty = true, checksDirty = true;
  // The newest AI checks that fit in one cloud document.
  function checksDoc(st) {
    const list = [];
    let size = 200;
    for (const c of st.checks) { const n = JSON.stringify(c).length + 1; if (size + n > MAX_DOC) break; size += n; list.push(c); }
    return { checks: list, updatedAt: st.updatedAt };
  }
  let deckDirty = {};

  function stateDoc(st) {
    const body = clone(st);
    delete body.plan.sessions;
    body.deckIds = Object.keys(st.decks || {});
    delete body.decks;
    delete body.checks;
    return body;
  }

  function schedulePush() {
    if (!cloud) return;
    clearTimeout(timer);
    timer = setTimeout(push, 1500);
  }

  async function push() {
    if (!cloud) return;
    if (inflight) { again = true; return; }
    inflight = true;
    try {
      const st = S.state;
      const body = stateDoc(st);
      const planBody = { sessions: st.plan.sessions, builtAt: st.plan.builtAt, updatedAt: st.updatedAt };
      let full = JSON.stringify(body).length > MAX_DOC || (planDirty && JSON.stringify(planBody).length > MAX_DOC);
      if (!full) {
        await cloud.state.set(body);
        if (planDirty) { planDirty = false; await cloud.plan.set(planBody); }
        if (checksDirty) { checksDirty = false; await cloud.user.doc('checks').set(checksDoc(st)); }
        const ids = Object.keys(deckDirty);
        deckDirty = {};
        for (const id of ids) {
          const ref = cloud.user.doc('deck-' + id);
          const deck = st.decks[id];
          if (!deck) { await ref.delete(); continue; }
          const d = { deck: deck, updatedAt: st.updatedAt };
          if (JSON.stringify(d).length > MAX_DOC) { full = true; continue; }
          await ref.set(d);
        }
      }
      S.sync = full ? 'cloud-full' : 'cloud';
    } catch (e) {
      S.sync = e && e.code === 'quota_exceeded' ? 'cloud-full' : 'cloud-error';
    } finally {
      inflight = false;
      emit('sync');
      if (again) { again = false; schedulePush(); }
    }
  }

  S.connect = async function () {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    try {
      const both = await Promise.all([c.use('db'), c.use('user')]);
      const db = both[0], user = both[1];
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const folder = db.collection('data/users/' + id);
      const refs = { state: folder.doc('state'), plan: folder.doc('plan'), user: folder };
      const snaps = await Promise.all([refs.state.get(), refs.plan.get()]);
      cloud = refs;
      const remote = snaps[0].exists ? clone(snaps[0].data()) : null;
      if (remote && (remote.updatedAt || 0) > (S.state.updatedAt || 0)) {
        const plan = snaps[1].exists ? clone(snaps[1].data()) : {};
        remote.plan = Object.assign(remote.plan || {}, { sessions: plan.sessions || [], builtAt: plan.builtAt || 0 });
        remote.decks = {};
        const deckSnaps = await Promise.all((remote.deckIds || []).map((d) => folder.doc('deck-' + d).get()));
        deckSnaps.forEach((snap, i) => { if (snap.exists) remote.decks[remote.deckIds[i]] = clone(snap.data()).deck; });
        delete remote.deckIds;
        const ck = await folder.doc('checks').get();
        remote.checks = ck.exists ? (clone(ck.data()).checks || []) : [];
        S.state = normalise(remote);
        S.isNew = false;
        writeLocal();
        S.sync = 'cloud';
        emit('remote');
      } else {
        S.sync = 'cloud';
        if (S.state.updatedAt) {
          planDirty = true; checksDirty = true;
          Object.keys(S.state.decks).forEach((d) => { deckDirty[d] = 1; });
          push();
        } else emit('sync');
      }
    } catch (e) {
      cloud = null;
      S.sync = 'local';
    }
  };

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && cloud && timer) { clearTimeout(timer); timer = null; push(); }
  });

  // ---- Backup ----
  S.exportJSON = () => JSON.stringify(Object.assign({ app: 'alevel-revision-hub' }, S.state), null, 1);
  S.importJSON = function (text) {
    const raw = JSON.parse(text);
    if (!raw || typeof raw !== 'object' || !raw.profile || !raw.topics) throw new Error('That file is not a Revision Hub backup.');
    delete raw.app;
    const before = Object.keys(S.state.decks);
    S.state = normalise(raw);
    S.update(() => {}, { plan: true, checks: true, decks: before.concat(Object.keys(S.state.decks)) });
  };
  S.reset = function () {
    const before = Object.keys(S.state.decks);
    S.state = defaults();
    S.update(() => {}, { plan: true, checks: true, decks: before });
  };
  S.defaults = defaults;

  // ---- Uploaded files (exam PDFs) stay in this browser's IndexedDB ----
  const DB_NAME = 'alevel-revision-hub-files';
  function idb() {
    return new Promise(function (resolve, reject) {
      if (!window.indexedDB) { reject(new Error('This browser cannot store files.')); return; }
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore('files');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('File storage is blocked in this browser.'));
    });
  }
  // If the browser blocks IndexedDB (private windows, some embeds), files are kept for this visit only.
  const memFiles = {};
  RH.files = {
    put: async function (key, blob) {
      memFiles[key] = blob;
      try {
        const db = await idb();
        await new Promise((res, rej) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(blob, key); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
        delete memFiles[key];
        return true;
      } catch (e) { return false; }
    },
    get: async function (key) {
      if (memFiles[key]) return memFiles[key];
      try {
        const db = await idb();
        return await new Promise((res) => { const r = db.transaction('files').objectStore('files').get(key); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); });
      } catch (e) { return null; }
    },
    del: async function (key) {
      delete memFiles[key];
      try {
        const db = await idb();
        await new Promise((res) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').delete(key); tx.oncomplete = () => res(); tx.onerror = () => res(); });
      } catch (e) { /* nothing stored */ }
    }
  };
})(window.RH = window.RH || {});
</script>
<script>
/* One way to ask Claude, wherever the hub runs.
   Inside claude.ai the page uses the viewer's own Claude through the `sample` capability.
   Anywhere else (preview.html, a hosted copy) it uses an Anthropic API key the student pastes in Settings,
   through the official Anthropic SDK. The key stays in this browser and is never synced or backed up. */
(function (RH) {
  'use strict';
  const A = RH.ai = {};
  const LS = 'alevel-revision-hub:ai';
  const SDK = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.134.0/+esm';

  A.MODELS = [
    ['claude-opus-5-5', 'Claude Opus 5.5', 'Most careful marking'],
    ['claude-sonnet-5-5', 'Claude Sonnet 5.5', 'Faster, about half the cost'],
    ['claude-haiku-5-5', 'Claude Haiku 5.5', 'Cheapest, for quick checks']
  ];

  A.inClaude = !!(window.claude && typeof window.claude.use === 'function');
  A.cfg = function () { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } };
  A.saveCfg = function (c) { try { localStorage.setItem(LS, JSON.stringify(c)); return true; } catch (e) { return false; } };

  // What the page knows so far: 'claude' | 'api' | 'none', and whether the viewer said no to Claude this visit.
  A.known = { sample: A.inClaude ? 'pending' : 'absent', declined: false, images: null };
  let sampleP = null;
  A.sample = function () {
    if (!sampleP) {
      sampleP = A.inClaude ? Promise.resolve(window.claude.use('sample')).catch(() => null) : Promise.resolve(null);
      sampleP.then(function (s) {
        A.known.sample = s ? 'ready' : 'absent';
        if (s && s.limits) s.limits().then((l) => { A.known.images = !!(l && l.images); A.known.maxImages = l && l.images ? l.images.maxCount : 0; }).catch(() => { A.known.images = false; });
        if (RH.render) RH.render({ keepScroll: true });
      });
    }
    return sampleP;
  };
  A.status = function () {
    if (A.known.sample === 'ready' && !A.known.declined) return 'claude';
    if (A.cfg().key) return 'api';
    if (A.known.sample === 'pending') return 'pending';
    return 'none';
  };
  A.label = function () {
    const s = A.status();
    if (s === 'claude') return 'Marked by Claude in your claude.ai account';
    if (s === 'api') return 'Marked by ' + ((A.MODELS.find((m) => m[0] === A.cfg().model) || A.MODELS[0])[1]) + ' with your API key';
    if (s === 'pending') return 'Connecting to Claude…';
    return 'Not connected';
  };
  A.maxImages = () => A.status() === 'claude' ? (A.known.images ? (A.known.maxImages || 4) : 0) : 6;

  function err(code, message, text) { return { code: code, message: message, text: text }; }

  // The JSON object in a reply, read tolerantly: the whole reply, a fenced block, or the outermost braces.
  A.parseJSON = function (text) {
    const t = String(text || '').trim();
    try { return JSON.parse(t); } catch (e) { /* keep looking */ }
    const f = /```(?:json)?\s*([\s\S]*?)```/.exec(t);
    if (f) { try { return JSON.parse(f[1]); } catch (e) { /* keep looking */ } }
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a !== -1 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { /* fall through */ } }
    throw err('invalid_json', 'The reply could not be read.', t);
  };

  // Shrink an image for the API path (the claude.ai path resizes on its own).
  async function toBase64(blob) {
    let w, h, src;
    try { src = await createImageBitmap(blob); w = src.width; h = src.height; } catch (e) { src = null; }
    if (src) {
      const k = Math.min(1, 1568 / Math.max(w, h));
      const c = document.createElement('canvas');
      c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', 0.85);
      return { media_type: 'image/jpeg', data: url.split(',')[1] };
    }
    const buf = new Uint8Array(await blob.arrayBuffer());
    let bin = '';
    for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    return { media_type: blob.type || 'image/png', data: btoa(bin) };
  }

  let sdk = null;
  async function loadSDK() {
    if (!sdk) sdk = import(SDK).catch(function (e) { sdk = null; throw err('network', 'Could not load the Anthropic SDK. Check your internet connection.'); });
    return sdk;
  }

  // input: a prompt string, or turns [{role, content}] starting and ending with the student.

      if (e instanceof Anthropic.PermissionDeniedError) throw err('bad_key', 'This API key cannot use that model. Try another model in Settings.');
      if (e instanceof Anthropic.RateLimitError) throw err('rate_limited', 'Too many requests for this key right now. Wait a minute and try again.', text);
      if (e instanceof Anthropic.BadRequestError) throw err('invalid_request', e.message || 'The request was not accepted.');
      if (e instanceof Anthropic.APIConnectionError) throw err('network', 'Could not reach the Anthropic API. Check your connection.', text);
      if (e instanceof Anthropic.APIError) throw err('upstream_error', e.message || 'The Anthropic API had a problem. Try again.', text);

  C.toggle = (attrs, label, on, help) => '<label class="toggle"><input type="checkbox" ' + attrs + (on ? ' checked' : '') + '><span class="tg" aria-hidden="true"></span><span class="tg-t"><b>' + label + '</b>' + (help ? '<span class="help">' + help + '</span>' : '') + '</span></label>';
  C.opts = (list, val) => list.map((o) => '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(val) ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('');

  // Object URLs for images held in memory, made once per blob.
  const urls = new WeakMap();
  C.blobURL = function (b) { if (!urls.has(b)) urls.set(b, URL.createObjectURL(b)); return urls.get(b); };
  C.thumbs = function (blobs, group, removable) {
    if (!blobs || !blobs.length) return '';
    return '<div class="thumbs">' + blobs.map((b, i) => '<figure class="thumb"><img src="' + C.blobURL(b) + '" alt="Photo ' + (i + 1) + '">' +
      (removable ? '<button type="button" class="thumb-x" data-action="img-del" data-group="' + group + '" data-i="' + i + '" aria-label="Remove photo ' + (i + 1) + '">' + C.icon('x') + '</button>' : '') + '</figure>').join('') + '</div>';
  };

  // ---------- Toasts & dialogs ----------
  C.toast = function (msg, opt) {
    const root = $('#toasts');
    const el = document.createElement('div');
    el.className = 'toast';
    const span = document.createElement('span');
    span.textContent = msg;
    el.appendChild(span);
    if (opt && opt.action) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = opt.action;
      b.addEventListener('click', function () { el.remove(); opt.fn(); });
      el.appendChild(b);
    }
    root.appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, opt && opt.action ? 8000 : 3200);
  };
  RH.toast = C.toast;

  let modalCleanup = null, lastFocus = null;
  C.openModal = function (title, body, opts) {
    C.closeModal();
    lastFocus = document.activeElement;
    const root = $('#modal-root');
    root.innerHTML = '<div class="modal-bg" data-action="modal-close"></div><div class="modal' + (opts && opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="modal-title"' + (opts && opts.subj ? ' data-subj="' + opts.subj + '"' : '') + '>' +
      '<div class="modal-head"><h2 id="modal-title">' + title + '</h2><button type="button" class="icon-btn" data-action="modal-close" aria-label="Close">' + C.icon('x') + '</button></div><div class="modal-body">' + body + '</div></div>';

  };
  C.closeModal = function () {
    const root = $('#modal-root');

    root.innerHTML = '';

  };
  C.modalOpen = () => !$('#modal-root').hidden;
  let pendingConfirm = null;
  C.confirm = function (title, text, yesLabel, onYes) {
    pendingConfirm = onYes;
    C.openModal(esc(title), '<p>' + esc(text) + '</p><div class="row-actions"><button type="button" class="btn danger" data-action="confirm-yes">' + esc(yesLabel) + '</button><button type="button" class="btn alt" data-action="modal-close">Cancel</button></div>');
  };
  C.confirmYes = function () { const f = pendingConfirm; pendingConfirm = null; C.closeModal(); if (f) f(); };

  // ---------- Sound ----------
  C.primeAudio = function () {

      const Ctx = window.AudioContext || window.webkitAudioContext;

    } catch (e) { /* sound is optional */ }
  };
  C.chime = function (kind) {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;

      notes.forEach(function (f, i) {
        const t = i * 0.22, o = ctx.createOscillator(), g = ctx.createGain();

        g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.35);
        o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.4);
      });
    } catch (e) { /* sound is optional */ }
  };

  // ---------- Files ----------
  C.copyText = function (text, okMsg) {
    const done = () => C.toast(okMsg || 'Copied');
    function fallback() {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { C.toast('Copy failed. Select the text and copy it yourself.'); }
      ta.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  };
  C.saveFile = async function (name, text, mime) {
    const c = window.claude;
    const framed = window.top !== window;
    if (c && typeof c.use === 'function') {
      let dl = null;
      try { dl = await c.use('downloads'); } catch (e) { dl = null; }
      if (dl) {
        try { await dl.save({ filename: name, data: text }); C.toast('Saved ' + name); }
        catch (e) {
          if (e && e.code === 'declined') return;
          if (e && e.code === 'rate_limited') { C.toast('A save is already waiting for you to confirm.'); return; }
          C.copyText(text, 'This viewer cannot save ' + name.split('.').pop() + ' files, so the contents were copied. Paste them into a file named ' + name + '.');
        }
        return;
      }
      if (framed) { C.copyText(text, 'Copied. Paste into a file named ' + name + '.'); return; }
    }
    try {
      const blob = new Blob([text], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name; a.rel = 'noopener';
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
      C.toast('Downloading ' + name);
    } catch (e) {
      C.copyText(text, 'Download was blocked, so the file contents were copied. Paste them into a file named ' + name + '.');
    }
  };
  const loading = {};
  C.loadScript = function (src) {
    if (!loading[src]) {
      loading[src] = new Promise(function (resolve, reject) {
        const s = document.createElement('script');
        s.src = src; s.async = true; s.crossOrigin = 'anonymous';

<script>
/* Weekly deliverables: a short list of work you must hand in by the end of each week, made from your plan.
   Each one needs evidence (a photo of your work, a score, your written recall) or is measured automatically
   (focus hours, flashcard reviews, answers marked in Check). You commit to the list at the start of the week,
   and the week has to be closed before it stops nagging. Missed work carries over. */
(function (RH) {
  'use strict';
  const U = RH.util, M = RH.model, C = RH.c, esc = U.esc, $ = RH.$;
  const st = () => RH.store.state;
  const store = RH.store;
  const D = RH.deliv = {};

  D.KINDS = {
    paper: { label: 'Timed paper', icon: 'paper', ev: ['score', 'photo'] },
    questions: { label: 'Exam questions', icon: 'qs', ev: ['photo', 'score'] },
    summary: { label: 'Topic summary', icon: 'notes', ev: ['photo'] },
    blurt: { label: 'Blurt test', icon: 'pen', ev: ['text'] },
    checks: { label: 'Marked answers', icon: 'check', auto: true, unit: 'answers' },
    focus: { label: 'Focus time', icon: 'focus', auto: true, unit: 'min' },
    cards: { label: 'Flashcards', icon: 'cards', auto: true, unit: 'cards' },
    catchup: { label: 'Catch-up', icon: 'flag', ev: ['photo', 'score'] },
    custom: { label: 'Your own', icon: 'target', ev: ['photo', 'text'] }
  };
  const STATUS = {
    open: ['Due', ''], returned: ['Sent back', 'warn'], overdue: ['Overdue', 'bad'], submitted: ['Handed in', 'ok'], verified: ['Verified', 'ok'],
    late: ['Handed in late', 'warn'], done: ['Done', 'ok'], missed: ['Missed', 'bad'], excused: ['Excused', '']
  };
  const DONE = { done: 1, verified: 1, submitted: 1, late: 1 };
  D.isDone = (s) => !!DONE[s];

  const atTime = (d, t) => U.parse(d).getTime() + U.tm(t) * 60000;
  D.deadline = function (ws) { const s = st().deliv.settings; const d = U.addDays(ws, Number(s.day)); return { date: d, time: s.time, at: atTime(d, s.time) }; };
  D.currentWs = () => U.weekStart(U.today());
  D.passed = (ws) => Date.now() > D.deadline(ws).at;
  D.timeLeft = function (ws) {
    const ms = D.deadline(ws).at - Date.now();
    if (ms <= 0) return 'Deadline passed';
    const h = Math.floor(ms / 36e5), d = Math.floor(h / 24);
    return d ? d + 'd ' + (h % 24) + 'h left' : h ? h + 'h ' + Math.floor(ms % 36e5 / 6e4) + 'm left' : Math.floor(ms / 6e4) + 'm left';
  };

  // Automatic progress, counted from the logs for that week.
  D.progress = function (item, ws) {
    const s = st(), end = U.addDays(ws, 6), inWk = (d) => d >= ws && d <= end;
    if (item.kind === 'focus') return { val: Math.round(s.focus.log.filter((x) => inWk(x.date)).reduce((a, x) => a + (x.focused || 0), 0)), target: item.target };
    if (item.kind === 'cards') return { val: Object.keys(s.cardLog).filter(inWk).reduce((a, d) => a + s.cardLog[d], 0), target: item.target };
    if (item.kind === 'checks') return { val: s.checks.filter((c) => inWk(c.date) && c.result).length, target: item.target };
    return null;
  };
  D.statusOf = function (item, ws) {
    if (item.status === 'missed' || item.status === 'excused') return item.status;
    if (D.KINDS[item.kind] && D.KINDS[item.kind].auto) {
      const p = D.progress(item, ws);
      return p.val >= p.target ? 'done' : D.passed(ws) ? 'overdue' : 'open';
    }
    if (item.status === 'verified' || item.status === 'submitted') return item.late ? 'late' : item.status;
    if (D.passed(ws)) return 'overdue';
    return item.status === 'returned' ? 'returned' : 'open';
  };
  D.statusChip = (s) => C.chip(STATUS[s][0], STATUS[s][1]);

  // ---------- Making a week's list ----------
  function paperMarks(s, examId) {
    const e = M.examById(s, examId);
    if (!e || !e.official) return null;
    const p = M.subject[e.subject].papers.find((x) => x.code === e.code);
    return p ? p.marks : null;
  }
  D.generate = function (s, ws) {
    const we = U.addDays(ws, 6);
    const sess = s.plan.sessions.filter((x) => x.d >= ws && x.d <= we);
    const planned = sess.reduce((a, x) => a + x.m, 0);
    const mk = (o) => Object.assign({ id: 'v' + U.uid(), status: 'open', files: [] }, o);
    const topicName = (gid) => (M.topic[gid] || {}).name || 'a topic';
    const picks = [];
    const pp = sess.find((x) => x.k === 'pp');
    const topicSess = sess.filter((x) => x.t && M.topic[x.t]);
    const weakest = topicSess.slice().sort((a, b) => M.conf(s, a.t) - M.conf(s, b.t))[0];
    if (pp) {
      const e = M.examById(s, pp.e);
      picks.push(mk({ kind: 'paper', subject: pp.s, exam: pp.e, target: paperMarks(s, pp.e), title: 'Sit ' + (e ? e.title : 'a past paper') + ' as a timed paper', detail: 'Full paper in exam conditions, then mark it with the mark scheme. Sit it in Past papers, or do it on paper and enter your score with a photo of the front page.' }));
    } else if (weakest) {
      picks.push(mk({ kind: 'questions', subject: weakest.s, topic: weakest.t, target: 20, title: '20 marks of exam questions: ' + topicName(weakest.t), detail: 'Do at least 20 marks of past-paper questions on this topic, mark them with the mark scheme in a different colour, and upload a photo with your score.' }));
    }
    const learns = topicSess.filter((x) => x.k === 'learn').filter((x, i, a) => a.findIndex((y) => y.t === x.t) === i);
    if (learns[0]) picks.push(mk({ kind: 'summary', subject: learns[0].s, topic: learns[0].t, title: 'One-page summary: ' + topicName(learns[0].t), detail: 'Condense the topic onto one side of A4 from memory first, then fill gaps from your notes. Upload a photo.' }));
    picks.push(mk({ kind: 'checks', target: 3, title: 'Get 3 exam answers marked in Check', detail: 'Write full answers to real exam questions, let the AI checker mark them against the mark scheme, then fix what it flags.' }));
    const focusTarget = Math.max(60, Math.round(planned * 0.75 / 30) * 30);
    picks.push(mk({ kind: 'focus', target: focusTarget, title: 'Log ' + U.dur(focusTarget) + ' of focused revision', detail: 'Time your sessions on the Focus page. With the webcam tracker on, only time at your desk counts.' }));
    const hasDecks = Object.keys(s.decks).length > 0;
    picks.push(mk({ kind: 'cards', target: hasDecks ? 150 : 50, title: hasDecks ? 'Review 150 flashcards' : 'Add a flashcard deck and review 50 cards', detail: 'Leitner reviews count, a few each day rather than all on Sunday.' }));
    const rec = topicSess.find((x) => x.k === 'recall') || topicSess.find((x) => M.conf(s, x.t) === 1);
    if (rec) picks.push(mk({ kind: 'blurt', subject: rec.s, topic: rec.t, title: 'Blurt test: ' + topicName(rec.t), detail: 'Set a 10-minute timer and write down everything you know about this topic without notes. Paste or type what you wrote.' }));
    if (learns[1]) picks.push(mk({ kind: 'summary', subject: learns[1].s, topic: learns[1].t, title: 'One-page summary: ' + topicName(learns[1].t), detail: 'Condense the topic onto one side of A4. Upload a photo.' }));
    const count = U.clamp(Number(s.deliv.settings.count) || 6, 3, 8);
    return { ws: ws, createdAt: Date.now(), items: picks.slice(0, count), committedAt: 0, signature: '', reviewedAt: 0 };
  };

  // The record for a week, made the first time this week is looked at.
  D.week = function (ws) {
    ws = ws || D.currentWs();
    const s = st();
    if (!s.deliv.weeks[ws] && ws === D.currentWs()) {
      const rec = D.generate(s, ws);
      store.update(function (x) { x.deliv.weeks[ws] = rec; }, { silent: true });
    }
    return st().deliv.weeks[ws] || null;
  };
  // A finished week that has not been closed yet.
  D.needsReview = function () {
    const weeks = st().deliv.weeks, cur = D.currentWs();
    return Object.keys(weeks).filter((ws) => ws < cur && !weeks[ws].reviewedAt && D.passed(ws)).sort().pop() || null;
  };
  D.summary = function (ws) {
    ws = ws || D.currentWs();
    const w = D.week(ws);
    if (!w) return null;
    const statuses = w.items.map((it) => D.statusOf(it, ws));
    return { total: w.items.length, done: statuses.filter(D.isDone).length, overdue: statuses.filter((x) => x === 'overdue').length, returned: statuses.filter((x) => x === 'returned').length, left: D.timeLeft(ws), committed: !!w.committedAt };
  };
  D.streak = function () {
    const weeks = st().deliv.weeks;
    let n = 0;
    for (const ws of Object.keys(weeks).sort().reverse()) {
      const w = weeks[ws];
      if (!w.reviewedAt) continue;
      if (w.score === 1) n++; else break;
    }
    return n;
  };

  function findItem(id) {
    const weeks = st().deliv.weeks;
    for (const ws of Object.keys(weeks)) { const it = weeks[ws].items.find((x) => x.id === id); if (it) return { ws: ws, item: it }; }
    return null;
  }
  function updateItem(id, fn) {
    store.update(function (s) {
      Object.keys(s.deliv.weeks).forEach((ws) => s.deliv.weeks[ws].items.forEach((it) => { if (it.id === id) fn(it, ws); }));
    });
  }

  // ---------- Evidence photos (kept in this browser) ----------
  const blobCache = {};
  async function loadBlob(key) { if (!(key in blobCache)) blobCache[key] = await RH.files.get(key); return blobCache[key]; }
  RH.afterRender.push(function () {
    document.querySelectorAll('img[data-dvimg]').forEach(function (img) {
      loadBlob(img.dataset.dvimg).then(function (b) { if (b) img.src = C.blobURL(b); else img.closest('.thumb').classList.add('gone'); });
    });
  });
  const storedThumbs = (files) => files && files.length ? '<div class="thumbs">' + files.map((f) => '<figure class="thumb"><img data-dvimg="' + esc(f.key) + '" alt="' + esc(f.name || 'Evidence photo') + '"></figure>').join('') + '</div>' : '';

  // ---------- Page ----------
  function itemRow(it, ws, opts) {
    const k = D.KINDS[it.kind] || D.KINDS.custom;
    const status = D.statusOf(it, ws);
    const p = k.auto ? D.progress(it, ws) : null;
    const t = it.topic && M.topic[it.topic];
    let right = '';
    if (k.auto) right = '<div class="dv-prog"><span class="num">' + (it.kind === 'focus' ? U.dur(p.val) + ' / ' + U.dur(p.target) : p.val + ' / ' + p.target) + '</span>' + C.bar(p.val / p.target, D.isDone(status) ? 'ok' : '') + '</div>';
    else if (!opts || !opts.readonly) right = '<button type="button" class="btn sm' + (D.isDone(status) ? ' alt' : '') + '" data-action="dv-submit" data-id="' + it.id + '">' + (D.isDone(status) ? 'View' : status === 'returned' ? 'Resubmit' : 'Hand in') + '</button>';
    const go = it.kind === 'focus' ? '#focus' : it.kind === 'cards' ? '#cards' : it.kind === 'checks' ? '#check' : it.kind === 'paper' ? '#papers' : t ? '#t-' + t.gid : '';
    return '<li class="dv' + (D.isDone(status) ? ' is-done' : '') + (status === 'overdue' ? ' is-overdue' : '') + '"' + (it.subject ? ' data-subj="' + it.subject + '"' : '') + '>' +
      '<span class="dv-ic">' + C.icon(D.isDone(status) ? 'tick' : k.icon) + '</span>' +
      '<div class="dv-main"><div class="dv-top">' + (it.subject ? C.stag(it.subject) : '') + '<span class="label">' + esc(k.label) + '</span>' + D.statusChip(status) + (it.carried ? C.chip('Carried over', 'warn') : '') + '</div>' +
      '<p class="dv-title">' + esc(it.title) + '</p>' + (opts && opts.compact ? '' : '<p class="dv-detail">' + esc(it.detail || '') + '</p>') +
      (it.verdict && it.verdict.comment && !(opts && opts.compact) ? '<p class="dv-verdict ' + (it.verdict.verdict === 'reject' ? 'bad' : it.verdict.verdict === 'partial' ? 'warn' : 'ok') + '">' + C.icon('spark') + esc(it.verdict.comment) + '</p>' : '') +
      (go && !(opts && opts.compact) && !D.isDone(status) ? '<a class="dv-go small" href="' + go + '">Go to ' + (it.kind === 'focus' ? 'Focus' : it.kind === 'cards' ? 'Flashcards' : it.kind === 'checks' ? 'Check' : it.kind === 'paper' ? 'Past papers' : 'the topic') + C.icon('right') + '</a>' : '') +
      '</div><div class="dv-side">' + right + '</div></li>';
  }
  D.itemRow = itemRow;

  RH.views.deliverables = function () {
    const s = st(), ws = RH.ui.dvWeek || D.currentWs(), cur = D.currentWs();
    const w = D.week(ws);
    const dl = D.deadline(ws);
    const set = s.deliv.settings;
    const review = D.needsReview();
    let html = C.subnav('plan', 'deliverables');
    html += C.page({ eyebrow: 'Week of ' + esc(U.fmtShort(ws)), title: 'Deliverables', lede: 'Hand these in by <b>' + esc(U.fmt(dl.date, { weekday: 'long' })) + ' ' + esc(dl.time) + '</b>. Each one needs proof, or is measured for you.',
      actions: '<button type="button" class="icon-btn" data-action="dv-week" data-v="-7" aria-label="Previous week">' + C.icon('left') + '</button><button type="button" class="icon-btn" data-action="dv-week" data-v="7" aria-label="Next week"' + (ws >= cur ? ' disabled' : '') + '>' + C.icon('right') + '</button>' });

    if (review && ws === cur) html += reviewPanel(review);

    if (!w) return html + C.empty('No deliverables were set for this week.', 'Deliverables start from the week you first opened this page.');
    const sum = D.summary(ws);
    html += '<section class="card dv-head"><div class="dv-head-l">' + C.ring(sum.done / (sum.total || 1), '<b class="num">' + sum.done + '/' + sum.total + '</b>', 76, sum.overdue ? 'bad' : sum.done === sum.total ? 'ok' : '') +
      '<div><p class="h3">' + (sum.done === sum.total ? 'Everything handed in' : U.plural(sum.total - sum.done, 'deliverable') + ' to go') + '</p><p class="muted">' + esc(sum.left) + (sum.overdue ? ' · <b class="bad-t">' + sum.overdue + ' overdue</b>' : '') + '</p>' +
      '<p class="muted small">' + C.icon('flame', 'i-sm') + ' ' + U.plural(D.streak(), 'week') + ' in a row fully delivered</p></div></div>' +
      '<div class="row-actions"><button type="button" class="btn alt sm" data-action="dv-report" data-ws="' + ws + '">' + C.icon('copy') + 'Copy weekly report</button>' + (ws === cur ? '<button type="button" class="btn alt sm" data-action="dv-add">' + C.icon('plus') + 'Add your own</button>' : '') + '</div></section>';

    if (ws === cur && !w.committedAt) {
      html += '<section class="card commit"><div><h2>Commit to this week</h2><p class="muted">Sign up to the list below. Your signature and the time go on your weekly report, so a parent, tutor or friend can hold you to it.</p></div>' +
        '<form id="commitForm" class="commit-form"><label class="field"><span>Type your name to sign</span><input name="sig" id="commit-sig" required value="' + esc(s.profile.name || '') + '" autocomplete="name"></label><button type="submit" class="btn">' + C.icon('pen') + 'I commit to these</button>' +
        '<button type="button" class="btn ghost" data-action="dv-regen">Rebuild the list from my plan</button></form></section>';
    } else if (w.committedAt) {
      html += '<p class="signed small muted">' + C.icon('pen', 'i-sm') + ' Signed by <b>' + esc(w.signature) + '</b> on ' + esc(new Date(w.committedAt).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })) + '</p>';
    }
    html += '<ul class="dv-list">' + w.items.map((it) => itemRow(it, ws)).join('') + '</ul>';

    // Past weeks
    const past = Object.keys(s.deliv.weeks).filter((x) => x < cur && s.deliv.weeks[x].reviewedAt).sort().reverse();
    if (past.length) html += '<section class="card"><div class="card-head"><h2>Past weeks</h2></div><ul class="list">' + past.slice(0, 12).map(function (x) {
      const pw = s.deliv.weeks[x], done = pw.items.filter((it) => D.isDone(D.statusOf(it, x))).length;
      return '<li class="row"><span class="row-main"><b>Week of ' + esc(U.fmtShort(x)) + '</b><span class="muted small">' + done + ' of ' + pw.items.length + ' delivered</span></span>' + C.bar(done / (pw.items.length || 1), done === pw.items.length ? 'ok' : done / pw.items.length < 0.5 ? 'bad' : 'warn') + '<button type="button" class="btn ghost sm" data-action="dv-show" data-ws="' + x + '">Open</button></li>';
    }).join('') + '</ul></section>';

    html += '<details class="card fold"><summary><h2>Rules</h2><span class="muted small">Deadline, how many, what happens if you miss one</span></summary><div class="fold-body form-grid">' +
      '<label class="field"><span>Deadline day</span><select data-dvset="day">' + C.opts(U.DAYS.map((d, i) => [i, ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'][i]]), set.day) + '</select></label>' +
      '<label class="field"><span>Deadline time</span><input type="time" data-dvset="time" value="' + esc(set.time) + '"></label>' +
      '<label class="field"><span>Deliverables per week</span><select data-dvset="count">' + C.opts([[3, '3'], [4, '4'], [5, '5'], [6, '6'], [7, '7'], [8, '8']], set.count) + '</select></label>' +
      '<label class="field"><span>Report goes to (optional)</span><input data-dvset="partner" value="' + esc(set.partner || '') + '" placeholder="e.g. Mum, Mr Gale"></label>' +
      C.toggle('data-dvset="carry"', 'Missed work carries over', set.carry, 'Anything you miss is added to next week.') +
      C.toggle('data-dvset="strict"', 'Strict mode', set.strict, 'Missing anything adds a catch-up task, and Home stays locked until you close the week.') +
      '</div></details>';
    return html;
  };

  function reviewPanel(ws) {
    const w = st().deliv.weeks[ws];
    const open = w.items.filter((it) => !D.isDone(D.statusOf(it, ws)) && it.status !== 'missed' && it.status !== 'excused');
    return '<section class="card review" id="review"><div class="card-head"><h2>' + C.icon('lock') + 'Close the week of ' + esc(U.fmtShort(ws)) + '</h2><span class="chip bad">Deadline passed</span></div>' +
      '<p class="muted">Before you start this week, deal with what is left from last week. Hand it in late, or mark it missed' + (st().deliv.settings.carry ? ' (it carries over to this week)' : '') + '.</p>' +
      (open.length ? '<ul class="dv-list">' + open.map((it) => '<li class="dv is-overdue"><span class="dv-ic">' + C.icon((D.KINDS[it.kind] || D.KINDS.custom).icon) + '</span><div class="dv-main"><p class="dv-title">' + esc(it.title) + '</p></div><div class="dv-side row-actions">' +
        ((D.KINDS[it.kind] || {}).auto ? '' : '<button type="button" class="btn sm" data-action="dv-submit" data-id="' + it.id + '">Hand in late</button>') +
        '<button type="button" class="btn alt sm" data-action="dv-miss" data-id="' + it.id + '">Missed</button><button type="button" class="btn ghost sm" data-action="dv-excuse" data-id="' + it.id + '">Excuse</button></div></li>').join('') + '</ul>' : '<p>Everything is accounted for.</p>') +
      '<div class="row-actions"><button type="button" class="btn" data-action="dv-close" data-ws="' + ws + '"' + (open.length ? ' disabled' : '') + '>' + C.icon('tick') + 'Close the week</button></div></section>';
  }

  // ---------- Hand-in dialog ----------
  RH.ui.dvDraft = null;
  function openSubmit(id) {
    const f = findItem(id);
    if (!f) return;
    const it = f.item, k = D.KINDS[it.kind] || D.KINDS.custom;
    const ev = it.kind === 'custom' ? (it.ev || ['photo', 'text']) : k.ev;
    const t = it.topic && M.topic[it.topic];
    if (!RH.ui.dvDraft || RH.ui.dvDraft.id !== id) RH.ui.dvDraft = { id: id, photos: [] };
    const draft = RH.ui.dvDraft;
    const ai = RH.ai.status();
    let body = '<p class="muted">' + esc(it.detail || '') + '</p>' + (t && t.pts && (it.kind === 'summary' || it.kind === 'blurt') ? '<details class="fold-lite"><summary>Spec points it should cover</summary><ul class="bullets small">' + t.pts.map((p) => '<li>' + esc(p) + '</li>').join('') + '</ul></details>' : '');
