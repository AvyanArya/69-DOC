<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- page:start -->
<title>A-Level Revision Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Edexcel A-level Physics, Maths, Further Maths and Economics revision: a timed weekly plan around your routine, weekly deliverables, an AI answer checker, past-paper exams, flashcards and a webcam focus tracker.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lexend:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a course site. A white top menu with a bar of pages under it, one wide column per page,
   and each subject laid out as a course of numbered lessons you work down in order.
   Bright and friendly, with colour carrying the subject and progress. Bottom tab bar on phones. */
:root {
  --bg: #f5f6fb;
  --surface: #ffffff;
  --surface-2: #eff1f8;
  --surface-3: #e2e6f1;
  --ink: #15173d;
  --ink-2: #444869;
  --ink-3: #6f7493;
  --line: #e1e4ef;
  --line-2: #cbd0e1;
  --primary: #4734d6;
  --primary-2: #3524b4;
  --primary-fg: #ffffff;
  --accent: #4734d6;
  --accent-soft: rgba(71, 52, 214, 0.1);
  --go: #13915a;
  --go-2: #0c7346;
  --ok: #13915a;
  --warn: #b26a00;
  --bad: #d23b3b;
  --phy: #2a64e0;
  --mat: #0b8a6c;
  --fm: #7a45d8;
  --eco: #dc5a1e;
  --c0: #b4b9cc;
  --c1: #dc4545;
  --c2: #e09612;
  --c3: #18975c;
  --k-school: #8a93ad;
  --k-activity: #a07ed3;
  --k-meal: #d6a454;
  --k-free: #6cc394;
  --k-event: #d684a6;
  --shadow: 0 1px 2px rgba(21, 23, 61, 0.06), 0 8px 24px rgba(21, 23, 61, 0.06);
  --shadow-up: 0 16px 48px rgba(21, 23, 61, 0.2);
  --f-display: 'Lexend', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Lexend', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 16px;
  --r-sm: 10px;
  --wide: 1200px;
  --subj: var(--accent);
  --on-subj: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0f22; --surface: #171933; --surface-2: #1f2241; --surface-3: #2a2e52;
    --ink: #eceefb; --ink-2: #b6badb; --ink-3: #868bb0; --line: #2a2d4d; --line-2: #3b3f66;
    --primary: #8e80ff; --primary-2: #6c5ce6; --primary-fg: #0e0f22; --accent: #a49aff; --accent-soft: rgba(164, 154, 255, 0.14);
    --go: #3ec98a; --go-2: #24a26a; --on-subj: #0e0f22; --ok: #3ec98a; --warn: #f2b14a; --bad: #ff7c7c;
    --phy: #7aa6ff; --mat: #3fcca8; --fm: #b99bff; --eco: #ff9663;
    --c0: #565b80; --c1: #ff6f6f; --c2: #f4b443; --c3: #3ec98a;
    --k-school: #6b7493; --k-activity: #9b80cc; --k-meal: #b88f4c; --k-free: #3f9f6c; --k-event: #b5718e;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.25);
    --shadow-up: 0 16px 48px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0f22; --surface: #171933; --surface-2: #1f2241; --surface-3: #2a2e52;
  --ink: #eceefb; --ink-2: #b6badb; --ink-3: #868bb0; --line: #2a2d4d; --line-2: #3b3f66;
  --primary: #8e80ff; --primary-2: #6c5ce6; --primary-fg: #0e0f22; --accent: #a49aff; --accent-soft: rgba(164, 154, 255, 0.14);
  --go: #3ec98a; --go-2: #24a26a; --on-subj: #0e0f22; --ok: #3ec98a; --warn: #f2b14a; --bad: #ff7c7c;
  --phy: #7aa6ff; --mat: #3fcca8; --fm: #b99bff; --eco: #ff9663;
  --c0: #565b80; --c1: #ff6f6f; --c2: #f4b443; --c3: #3ec98a;
  --k-school: #6b7493; --k-activity: #9b80cc; --k-meal: #b88f4c; --k-free: #3f9f6c; --k-event: #b5718e;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.25);
  --shadow-up: 0 16px 48px rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}
[data-subj="physics"] { --subj: var(--phy); }
[data-subj="maths"] { --subj: var(--mat); }
[data-subj="further"] { --subj: var(--fm); }
[data-subj="economics"] { --subj: var(--eco); }

/* ---------- Base ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3, .h3 { font-family: var(--f-display); margin: 0; line-height: 1.22; text-wrap: balance; letter-spacing: -0.015em; color: var(--ink); }
h1 { font-size: clamp(1.7rem, 1.3rem + 1.4vw, 2.3rem); font-weight: 700; letter-spacing: -0.03em; }
h2 { font-size: 1.12rem; font-weight: 600; }
h3, .h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
b, strong { font-weight: 600; }
.muted { color: var(--ink-3); }
.small { font-size: 0.84rem; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.help { font-size: 0.8rem; color: var(--ink-3); }
.center { text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.i-sm { width: 14px; height: 14px; vertical-align: -2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ok-t { color: var(--ok); } .warn-t { color: var(--warn); } .bad-t { color: var(--bad); } .danger-t { color: var(--bad) !important; }
blockquote { margin: 4px 0; padding: 6px 12px; border-left: 3px solid var(--line-2); color: var(--ink-2); font-size: 0.9rem; background: var(--surface-2); border-radius: 0 6px 6px 0; overflow-wrap: anywhere; }

/* ---------- Shell ---------- */
.app { min-height: 100%; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: var(--wide); margin: 0 auto; display: flex; align-items: center; gap: 14px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex: none; }
.brand-mark { width: 36px; height: 36px; border-radius: 11px; background: var(--primary); color: var(--primary-fg); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 0.95rem; letter-spacing: -0.04em; flex: none; box-shadow: 0 3px 0 var(--primary-2); }
.brand-name { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; letter-spacing: -0.02em; }
.top-nav { display: flex; gap: 2px; }
.nav-item { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px; border-radius: 10px; text-decoration: none; color: var(--ink-2); font-weight: 500; font-size: 0.95rem; white-space: nowrap; }
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item.on { color: var(--primary); background: var(--accent-soft); font-weight: 600; }
.count { min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); font-size: 0.72rem; font-family: var(--f-mono); line-height: 1.6; text-align: center; }
.count.bad { background: var(--bad); color: #fff; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.search { position: relative; flex: 1; max-width: 340px; margin-left: auto; }
.search > .i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
.search input { width: 100%; padding: 9px 36px 9px 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: inherit; font-size: 0.9rem; }
.search input:focus { background: var(--surface); }
.search input::placeholder { color: var(--ink-3); }
.search kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-family: var(--f-mono); font-size: 0.72rem; color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 5px; padding: 0 6px; }
.search-results { position: absolute; top: calc(100% + 8px); left: 0; right: 0; min-width: min(380px, calc(100vw - 32px)); z-index: 40; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-up); padding: 6px; max-height: 60vh; overflow-y: auto; }
.qr { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: var(--r-sm); text-decoration: none; color: var(--ink); }
.qr > span { display: flex; flex-direction: column; min-width: 0; }
.qr.sel, .qr:hover { background: var(--surface-2); }
.qr-none { padding: 8px; }
.timer-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 500; font-size: 0.9rem; white-space: nowrap; flex: none; }
.timer-pill.running { border-color: var(--primary); color: var(--primary); font-family: var(--f-mono); }
.subbar { border-top: 1px solid var(--line); background: var(--surface); }
.subbar-in { max-width: var(--wide); margin: 0 auto; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.subbar-in::-webkit-scrollbar { display: none; }
.subbar a { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 11px 12px 10px; border-bottom: 3px solid transparent; text-decoration: none; color: var(--ink-2); font-weight: 500; font-size: 0.9rem; white-space: nowrap; }
.subbar a:hover { color: var(--ink); }
.subbar a.on { color: var(--ink); border-bottom-color: var(--subj, var(--primary)); font-weight: 600; }
.subbar a:not([data-subj]).on { border-bottom-color: var(--primary); }
.sdot { width: 9px; height: 9px; border-radius: 3px; background: var(--subj); flex: none; display: inline-block; }
.view { flex: 1; width: 100%; max-width: var(--wide); margin: 0 auto; outline: none; display: flex; flex-direction: column; gap: 18px; padding-block: 24px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view > * { min-width: 0; }
.foot { width: 100%; max-width: var(--wide); margin: 0 auto; display: flex; gap: 8px 20px; flex-wrap: wrap; padding-block: 18px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line); color: var(--ink-3); font-size: 0.82rem; }
.foot a { color: var(--ink-2); }
.tabbar { display: none; }
body.in-exam .subbar { display: none; }

/* ---------- Page furniture ---------- */
.page-head { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.ph-text { display: flex; flex-direction: column; gap: 8px; min-width: 0; max-width: 72ch; }
.eyebrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.84rem; color: var(--ink-3); font-weight: 500; }
.lede { color: var(--ink-2); font-size: 1.02rem; }
.ph-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.crumbs { display: flex; gap: 8px; flex-wrap: wrap; font-size: 0.85rem; color: var(--ink-3); }
.crumbs a { color: var(--ink-2); text-decoration: none; font-weight: 500; }
.crumbs a:hover { color: var(--ink); text-decoration: underline; }
.crumbs .sep { color: var(--line-2); }
.group-h, .after-h { margin-top: 12px; font-size: 1.15rem; }

/* ---------- Surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: 0 1px 2px rgba(21, 23, 61, 0.04); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.flush { padding: 0; overflow: hidden; }
.card.soft { background: var(--surface-2); border-color: transparent; }
.card.link { text-decoration: none; color: var(--ink); transition: border-color 0.12s, box-shadow 0.12s; }
.card.link:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-head h2 { display: flex; align-items: center; gap: 8px; }
.card-head > a { font-weight: 600; text-decoration: none; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
.col-main, .col-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.note { padding: 12px 14px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--ink-2); font-size: 0.9rem; }
.note b { color: var(--ink); }
.note.row-note { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: color-mix(in srgb, var(--warn) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); }
.note.bad-n { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); color: var(--ink); }
.note.ok-n { background: color-mix(in srgb, var(--ok) 10%, var(--surface)); }
.empty { padding: 24px; border: 1px dashed var(--line-2); border-radius: var(--r); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; background: var(--surface); }
.empty-t { font-weight: 600; }
.fold > summary, .fold-lite > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.fold > summary::-webkit-details-marker, .fold-lite > summary::-webkit-details-marker { display: none; }
.fold > summary::after { content: ""; margin-left: auto; width: 9px; height: 9px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(45deg) translateY(-3px); transition: transform 0.15s; }
.fold[open] > summary::after { transform: rotate(-135deg); }
.fold:not([open]) { gap: 0; }
.fold-body { display: flex; flex-direction: column; gap: 12px; }
.fold-lite > summary { color: var(--accent); font-weight: 600; font-size: 0.9rem; }
.fold-lite[open] > summary { margin-bottom: 8px; }
.fold-lite { display: flex; flex-direction: column; gap: 6px; }
.prose { max-width: 70ch; overflow-wrap: anywhere; }
.bullets { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); }
.defs { display: grid; grid-template-columns: minmax(140px, 220px) 1fr; gap: 8px 16px; margin: 0; }
.defs dt { font-weight: 600; } .defs dd { margin: 0; color: var(--ink-2); }

/* ---------- Controls ---------- */
.btn { font: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 16px; border-radius: 12px; border: 1px solid var(--primary); background: var(--primary); color: var(--primary-fg); font-weight: 600; font-size: 0.92rem; cursor: pointer; text-decoration: none; white-space: nowrap; box-shadow: 0 3px 0 var(--primary-2); transition: transform 0.06s, box-shadow 0.06s; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--primary-2); }
.btn.go { background: var(--go); border-color: var(--go); box-shadow: 0 3px 0 var(--go-2); color: var(--on-subj); }
.btn.go:active { box-shadow: 0 1px 0 var(--go-2); }
.btn.alt { background: var(--surface); color: var(--ink); border-color: var(--line-2); box-shadow: 0 2px 0 var(--line-2); }
.btn.alt:hover { border-color: var(--ink-3); filter: none; }
.btn.alt:active { box-shadow: 0 0 0 var(--line-2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); box-shadow: none; }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); filter: none; }
.btn.ghost:active { transform: none; }
.btn.link { background: none; border: 0; color: var(--accent); padding: 2px; box-shadow: none; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; box-shadow: 0 3px 0 color-mix(in srgb, var(--bad) 70%, #000); }
.btn.sm { padding: 6px 12px; font-size: 0.85rem; border-radius: 10px; }
.btn.lg { padding: 13px 24px; font-size: 1.02rem; border-radius: 14px; }
.btn.block { width: 100%; }
.btn:disabled, .icon-btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; transform: none; }
.btn .i { width: 17px; height: 17px; }
.btn.on { background: color-mix(in srgb, var(--c2) 16%, var(--surface)); border-color: var(--c2); color: var(--ink); }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--ink-2); cursor: pointer; flex: none; padding: 0; text-decoration: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row-actions.center { justify-content: center; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
input, select, textarea { font: inherit; font-size: 0.93rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 8px 10px; max-width: 100%; min-width: 0; }
textarea { width: 100%; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input:disabled { opacity: 0.45; }
input[type="range"] { padding: 0; border: 0; background: none; accent-color: var(--primary); width: 100%; box-shadow: none; }
input[type="checkbox"] { accent-color: var(--primary); width: 17px; height: 17px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; border: 0; padding: 0; margin: 0; }
.field > span:first-child, .field > label, .field legend { font-size: 0.86rem; font-weight: 600; color: var(--ink-2); }
.field.inline { flex-direction: row; align-items: center; gap: 10px; }
.field.inline label { flex: 0 0 150px; display: flex; align-items: center; gap: 6px; font-weight: 500; }
.field.inline output { flex: 0 0 36px; text-align: right; font-size: 0.85rem; }
.range-l { display: flex; justify-content: space-between; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.form-grid.narrow { max-width: 420px; }
.stack-form { display: flex; flex-direction: column; gap: 14px; }
.inline-form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto; gap: 8px; }
.toggle { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.tg { flex: none; width: 38px; height: 22px; border-radius: 999px; background: var(--line-2); position: relative; transition: background 0.15s; margin-top: 1px; }
.tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); transition: transform 0.15s; }
.toggle input:checked + .tg { background: var(--primary); }
.toggle input:checked + .tg::after { transform: translateX(16px); }
.toggle input:focus-visible + .tg { outline: 2px solid var(--accent); outline-offset: 2px; }
.tg-t { display: flex; flex-direction: column; font-size: 0.92rem; }
.toggles { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; border-radius: 11px; background: var(--surface-2); max-width: 100%; align-self: flex-start; }
.seg button { font: inherit; font-size: 0.86rem; font-weight: 600; border: 0; background: transparent; color: var(--ink-2); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1); }
.fx-timer .seg { align-self: center; justify-content: center; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; display: inline-flex; align-items: center; gap: 7px; padding: 10px 12px 9px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--ink-3); font: inherit; font-size: 0.92rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab .i { width: 16px; height: 16px; }
.tab.on { color: var(--ink); border-bottom-color: var(--subj); }
.tab { border-bottom-width: 3px; }
.tab.on .i { color: var(--subj); }
.tab-n { font-family: var(--f-mono); font-size: 0.72rem; padding: 0 6px; border-radius: 999px; background: var(--surface-2); color: var(--ink-3); line-height: 1.6; }
.tab-panel { display: flex; flex-direction: column; gap: 16px; }
.pick, .opt { display: inline-flex; gap: 8px; align-items: center; border: 1px solid var(--line-2); border-radius: 10px; padding: 6px 11px; font-size: 0.86rem; cursor: pointer; background: var(--surface); }
.pick:has(input:checked), .opt:has(input:checked) { border-color: var(--ink); background: var(--surface-2); }
.picks { display: flex; flex-wrap: wrap; gap: 6px; }
.opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.opt { align-items: flex-start; padding: 10px 12px; }
.opt span { display: flex; flex-direction: column; }

/* ---------- Data bits ---------- */
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; background: color-mix(in srgb, var(--subj) 14%, var(--surface)); color: var(--subj); font-family: var(--f-mono); font-size: 0.7rem; font-weight: 500; letter-spacing: 0.04em; flex: none; margin-right: 6px; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 0.76rem; font-weight: 600; white-space: nowrap; line-height: 1.7; }
.chip .i { width: 13px; height: 13px; }
.chip.ok { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); color: var(--ok); }
.chip.warn { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); color: var(--warn); }
.chip.bad { background: color-mix(in srgb, var(--bad) 13%, var(--surface)); color: var(--bad); }
.chip.info { background: var(--accent-soft); color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 3px; border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; font-size: 0.74rem; color: var(--ink-3); line-height: 1.7; }
.pill .i { width: 12px; height: 12px; }
.pill.warn { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border-color: transparent; color: var(--warn); }
.bar { height: 7px; border-radius: 999px; background: var(--surface-3); overflow: hidden; flex: 1; min-width: 60px; }
.bar span { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
.bar.ok span { background: var(--ok); } .bar.warn span { background: var(--warn); } .bar.bad span { background: var(--bad); }
.rag { display: flex; height: 7px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--surface-2); }
.rag span { display: block; min-width: 3px; }
.seg-0 { background: var(--c0); opacity: 0.5; } .seg-1 { background: var(--c1); } .seg-2 { background: var(--c2); } .seg-3 { background: var(--c3); }
.ring { --sz: 64px; position: relative; width: var(--sz); height: var(--sz); flex: none; display: inline-grid; place-items: center; }
.ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--surface-3); stroke-width: 3.4; }
.ring-fg { fill: none; stroke: var(--primary); stroke-width: 3.4; stroke-linecap: round; transition: stroke-dasharray 0.4s; }
.ring.ok .ring-fg { stroke: var(--ok); } .ring.warn .ring-fg { stroke: var(--warn); } .ring.bad .ring-fg { stroke: var(--bad); }
.ring-in { position: relative; display: flex; align-items: baseline; justify-content: center; font-size: calc(var(--sz) * 0.2); line-height: 1; }
.ring-in b { font-weight: 500; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 12px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat-n { font-size: 1.5rem; font-weight: 500; line-height: 1.1; }
.stat-l { font-size: 0.8rem; color: var(--ink-3); }
.score-pill { font-size: 0.8rem; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); flex: none; }
.score-pill.ok { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); color: var(--ok); }
.score-pill.warn { background: color-mix(in srgb, var(--warn) 15%, var(--surface)); color: var(--warn); }
.score-pill.bad { background: color-mix(in srgb, var(--bad) 13%, var(--surface)); color: var(--bad); }
.dots { display: inline-flex; gap: 5px; flex: none; }
.dot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line-2); background: var(--surface); cursor: pointer; padding: 0; color: var(--c0); }
.dot.c1 { color: var(--c1); } .dot.c2 { color: var(--c2); } .dot.c3 { color: var(--c3); }
.dot:hover { border-color: currentColor; }
.dot.on { border-color: currentColor; background: currentColor; box-shadow: inset 0 0 0 3px var(--surface); }
.conf { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.conf-b { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer; min-width: 0; }
.conf-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--c0); flex: none; }
.conf-b.c1 .conf-dot { background: var(--c1); } .conf-b.c2 .conf-dot { background: var(--c2); } .conf-b.c3 .conf-dot { background: var(--c3); }
.conf-b.on { border-color: var(--ink-3); background: var(--surface-2); }
.conf-b.on.c1 { border-color: var(--c1); background: color-mix(in srgb, var(--c1) 10%, var(--surface)); }
.conf-b.on.c2 { border-color: var(--c2); background: color-mix(in srgb, var(--c2) 12%, var(--surface)); }
.conf-b.on.c3 { border-color: var(--c3); background: color-mix(in srgb, var(--c3) 10%, var(--surface)); }

/* ---------- Lists ---------- */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list > li { border-bottom: 1px solid var(--line); }
.list > li:last-child { border-bottom: 0; }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 0; min-width: 0; }
.list.compact .row { padding: 8px 0; }
.row.link { text-decoration: none; color: var(--ink); border-radius: 8px; }
.row.link:hover .row-main b { text-decoration: underline; }
.row.col { flex-direction: column; align-items: stretch; gap: 6px; }
.row-top { display: flex; align-items: center; gap: 4px; }
.row-top b { flex: 1; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row-main b { font-weight: 600; overflow-wrap: anywhere; }
.res-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.res { display: flex; align-items: center; gap: 10px; padding: 8px 6px; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--line); font-size: 0.92rem; border-radius: 6px; }
.res:hover { background: var(--surface-2); }
.res-t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.site { flex: none; font-family: var(--f-mono); font-size: 0.68rem; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-3); white-space: nowrap; }
.i-ext { width: 14px; height: 14px; color: var(--ink-3); }
.res-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 4px 24px; }
.res-group { display: flex; flex-direction: column; gap: 4px; }
.res-group .label { padding-top: 10px; }
.my-link { display: flex; align-items: center; gap: 4px; }
.my-link .res { flex: 1; min-width: 0; }

/* ---------- Home ---------- */
.setup .card-head h2 { margin-right: auto; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.step { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--line); flex-wrap: wrap; }
.step:last-child { border-bottom: 0; }
.step-n { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; font-size: 0.82rem; font-weight: 600; flex: none; }
.step-n .i { width: 15px; height: 15px; }
.step.ok .step-n { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.step-t { flex: 1; min-width: 180px; display: flex; flex-direction: column; }
.step.ok .step-t b { color: var(--ink-3); }
.home-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 380px); gap: 24px; align-items: center; padding: 28px; border-radius: 22px; background: linear-gradient(120deg, var(--accent-soft), color-mix(in srgb, var(--go) 8%, var(--surface))); border: 1px solid var(--line); }
.hh-text { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.resume { display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--subj); box-shadow: var(--shadow); text-decoration: none; color: var(--ink); min-width: 0; transition: transform 0.12s; }
.resume:hover { transform: translateY(-2px); }
.resume b { font-size: 1.12rem; line-height: 1.3; }
.rs-sub { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rs-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.rs-go { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 8px 15px; border-radius: 12px; background: var(--go); color: var(--on-subj); font-weight: 600; font-size: 0.9rem; box-shadow: 0 3px 0 var(--go-2); }
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.tile { display: flex; flex-direction: row; align-items: center; gap: 14px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: var(--ink); min-width: 0; }
.tile:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.tile-t { display: flex; flex-direction: column; min-width: 0; }
.tile-t b { font-weight: 600; }
.course-mini { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.course-mini li { display: grid; grid-template-columns: minmax(150px, 1fr) 120px minmax(0, 1.6fr); gap: 6px 16px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
.course-mini li:first-child { border-top: 0; }
.cm-name { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
.cm-name b { font-weight: 600; }
.cm-name:hover b { text-decoration: underline; }
.cm-next { color: var(--ink-2); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cm-next:hover { color: var(--ink); text-decoration: underline; }
.course-mini .mini-bar { max-width: none; }
.next { border-top: 4px solid var(--subj); }
.next-main h3 { font-size: 1.3rem; }
.next-row { display: flex; gap: 18px; align-items: flex-start; }
.next-time { display: flex; flex-direction: column; font-size: 1.9rem; line-height: 1; font-weight: 500; flex: none; }
.next-time span { font-size: 0.8rem; color: var(--ink-3); margin-top: 6px; font-family: var(--f-body); }
.next-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.next-main h2 { font-size: 1.35rem; }
.next-main h2 a { color: var(--ink); text-decoration: none; }
.next-main h2 a:hover { text-decoration: underline; }
.next-tags { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.big-line { font-size: 0.95rem; }
.big-line b { font-size: 1.6rem; font-weight: 500; margin-right: 6px; }
.gate { flex-direction: row; gap: 18px; border: 1.5px solid color-mix(in srgb, var(--bad) 40%, transparent); background: color-mix(in srgb, var(--bad) 6%, var(--surface)); }
.gate-ic { width: 34px; height: 34px; color: var(--bad); }
.gate > div { display: flex; flex-direction: column; gap: 10px; }

/* Timeline */
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tl-i { display: grid; grid-template-columns: 56px 4px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 6px 0; min-height: 44px; }
.tl-t { display: flex; flex-direction: column; font-size: 0.86rem; line-height: 1.25; color: var(--ink-2); }
.tl-t span { font-size: 0.74rem; color: var(--ink-3); }
.tl-bar { align-self: stretch; border-radius: 3px; background: var(--line-2); }
.tl-body { display: flex; flex-direction: column; min-width: 0; }
.tl-title { font: inherit; font-weight: 600; text-align: left; border: 0; background: none; padding: 0; color: var(--ink); cursor: pointer; display: flex; align-items: center; flex-wrap: wrap; overflow-wrap: anywhere; }
.tl-title:hover { text-decoration: underline; }
.tl-title.plain { cursor: default; font-weight: 500; color: var(--ink-2); }
.tl-title.plain:hover { text-decoration: none; }
.tl-act { display: flex; gap: 2px; align-items: center; }
.kind-study .tl-bar { background: var(--subj); }
.kind-school .tl-bar { background: var(--k-school); }
.kind-activity .tl-bar { background: var(--k-activity); }
.kind-meal .tl-bar { background: var(--k-meal); }
.kind-event .tl-bar { background: var(--k-event); }
.kind-exam .tl-bar { background: var(--subj); }
.kind-exam .tl-title { color: var(--ink); font-weight: 700; }
.kind-free .tl-bar { background: repeating-linear-gradient(180deg, var(--k-free) 0 4px, transparent 4px 7px); }
.kind-travel .tl-bar, .kind-rest .tl-bar { background: var(--surface-3); }
.tl-i.kind-free .tl-title, .tl-i.kind-travel .tl-title, .tl-i.kind-rest .tl-title { color: var(--ink-3); }
.tl-i.past:not(.kind-study) { opacity: 0.55; }
.tl-i.done .tl-title { text-decoration: line-through; text-decoration-color: var(--ink-3); color: var(--ink-3); }
.tl-i.late .tl-t { color: var(--bad); }
.tl-now { position: relative; height: 0; margin: 4px 0; border-top: 2px solid var(--bad); }
.tl-now span { position: absolute; left: 0; top: -10px; background: var(--bad); color: var(--surface); font-family: var(--f-mono); font-size: 0.7rem; padding: 0 5px; border-radius: 4px; }
.tl-empty { padding: 4px 0; }
.check-b { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line-2); background: var(--surface); color: transparent; display: grid; place-items: center; cursor: pointer; padding: 0; }
.check-b .i { width: 16px; height: 16px; }
.check-b:hover { border-color: var(--ok); color: var(--ok); }
.check-b.on { background: var(--ok); border-color: var(--ok); color: var(--surface); }

/* ---------- Deliverables ---------- */
.dv-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.dv { display: flex; gap: 14px; align-items: flex-start; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.dv-ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: color-mix(in srgb, var(--subj) 12%, var(--surface)); color: var(--subj); flex: none; }
.dv.is-done .dv-ic { background: var(--ok); color: var(--surface); }
.dv.is-overdue { border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.dv-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.dv-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dv-title { font-weight: 600; font-size: 1rem; overflow-wrap: anywhere; }
.dv.is-done .dv-title { color: var(--ink-2); }
.dv-detail { color: var(--ink-2); font-size: 0.9rem; }
.dv-verdict { display: flex; gap: 6px; align-items: flex-start; font-size: 0.88rem; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.dv-verdict .i { width: 15px; height: 15px; margin-top: 3px; }
.dv-verdict.ok { background: color-mix(in srgb, var(--ok) 10%, var(--surface)); }
.dv-verdict.warn { background: color-mix(in srgb, var(--warn) 12%, var(--surface)); }
.dv-verdict.bad { background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }
.dv-go { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; text-decoration: none; align-self: flex-start; }
.dv-go .i { width: 14px; height: 14px; }
.dv-side { flex: none; display: flex; align-items: center; }
.dv-prog { display: flex; flex-direction: column; gap: 5px; width: 140px; font-size: 0.84rem; text-align: right; }
.dv-list.compact { gap: 0; }
.dv-list.compact .dv { padding: 10px 0; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; gap: 10px; }
.dv-list.compact .dv:last-child { border-bottom: 0; }
.dv-list.compact .dv-ic { width: 30px; height: 30px; border-radius: 9px; }
.dv-list.compact .dv-ic .i { width: 16px; height: 16px; }
.dv-list.compact .dv-title { font-size: 0.92rem; }
.dv-list.compact .label { display: none; }
.dv-list.compact .dv-prog { width: 92px; }
.dv-head { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.dv-head-l { display: flex; gap: 16px; align-items: center; }
.dv-head-l > div { display: flex; flex-direction: column; gap: 2px; }
.commit { flex-direction: row; gap: 20px; align-items: flex-end; flex-wrap: wrap; border: 1.5px solid var(--ink); }
.commit > div { flex: 1 1 280px; display: flex; flex-direction: column; gap: 4px; }
.commit-form { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.commit-form .field { flex: 1 1 200px; }
.signed { display: flex; align-items: center; gap: 6px; }
.review { border: 1.5px solid color-mix(in srgb, var(--bad) 45%, transparent); }
.review h2 .i { color: var(--bad); }
.score-in { display: flex; align-items: center; gap: 8px; }
.score-in input { width: 90px; }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumb { position: relative; margin: 0; width: 96px; height: 96px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.gone { display: none; }
.thumb-x { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, 0.6); color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
.thumb-x .i { width: 14px; height: 14px; }
.drop { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 18px; min-height: 110px; border: 2px dashed var(--line-2); border-radius: var(--r); background: var(--surface-2); text-align: center; cursor: pointer; }
.drop:hover, .drop:focus-within { border-color: var(--ink-3); }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.drop .i { width: 26px; height: 26px; color: var(--ink-2); }
.small-drop { min-height: 88px; padding: 12px; }

/* ---------- Learn ---------- */
.prog { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.prog-bar, .mini-bar { position: relative; height: 10px; border-radius: 999px; background: var(--surface-3); overflow: hidden; flex: 1 1 160px; max-width: 360px; }
.mini-bar { height: 6px; flex: 1 1 60px; max-width: 120px; }
.prog-bar span, .mini-bar span { position: absolute; inset: 0 auto 0 0; background: var(--subj); border-radius: 999px; }
.course-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.course-card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); min-width: 0; }
.cc-band { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 22px 22px 20px; background: var(--subj); color: var(--on-subj); text-decoration: none; overflow: hidden; }
.cc-band::after { content: ""; position: absolute; right: -40px; top: -50px; width: 180px; height: 180px; border-radius: 50%; background: rgba(255, 255, 255, 0.12); box-shadow: -60px 90px 0 -30px rgba(255, 255, 255, 0.08); }
.cc-band h2 { color: var(--on-subj); font-size: 1.55rem; font-weight: 700; letter-spacing: -0.025em; }
.cc-code { font-size: 0.78rem; opacity: 0.85; }
.cc-sub { font-size: 0.86rem; opacity: 0.9; }
.cc-body { display: flex; flex-direction: column; gap: 12px; padding: 18px 22px 22px; }
.cc-next { display: flex; flex-direction: column; gap: 2px; }
.cc-next a { color: var(--ink); font-weight: 600; text-decoration: none; }
.cc-next a:hover { text-decoration: underline; }
.cc-next .num { color: var(--subj); }

.course-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 24px; align-items: center; padding: 28px; border-radius: 22px; background: color-mix(in srgb, var(--subj) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--subj) 22%, transparent); }
.ch-text { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ch-text .eyebrow { color: var(--subj); font-weight: 600; }
.up-next { display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); text-decoration: none; color: var(--ink); min-width: 0; transition: transform 0.12s; }
a.up-next:hover { transform: translateY(-2px); }
.up-next b { font-size: 1.12rem; line-height: 1.3; }
.un-num { color: var(--subj); font-size: 0.86rem; }
.un-go { align-self: flex-start; margin-top: 6px; display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 12px; background: var(--go); color: var(--on-subj); font-weight: 600; font-size: 0.92rem; box-shadow: 0 3px 0 var(--go-2); }
.papers-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.paper-chip { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); font-size: 0.9rem; min-width: 0; }
.contents-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; }
.contents-head h2 { font-size: 1.35rem; }
.units { display: flex; flex-direction: column; gap: 10px; }
.unit-group { margin-top: 10px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.unit { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.unit[open] { box-shadow: var(--shadow); }
.unit > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 14px 18px; }
.unit > summary::-webkit-details-marker { display: none; }
.unit > summary::after { content: ""; width: 9px; height: 9px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(45deg) translateY(-3px); transition: transform 0.15s; flex: none; }
.unit[open] > summary::after { transform: rotate(-135deg); }
.unit > summary:hover { background: var(--surface-2); }
.unit-n { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: color-mix(in srgb, var(--subj) 13%, var(--surface)); color: var(--subj); font-weight: 600; flex: none; }
.unit.all-done .unit-n { background: var(--subj); color: var(--surface); }
.unit-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.unit-t b { font-size: 1rem; }
.unit-p { display: flex; align-items: center; gap: 10px; flex: none; }
.unit-p .mini-bar { width: 90px; flex: none; }
.unit-foot { padding: 10px 18px 14px; border-top: 1px solid var(--line); font-size: 0.86rem; }
.unit-foot a { font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.lessons { list-style: none; margin: 0; padding: 0; }
.lessons > li + li { border-top: 1px solid var(--line); }
.unit .lessons { border-top: 1px solid var(--line); }
.lesson-row { display: flex; align-items: center; gap: 14px; padding: 12px 18px; text-decoration: none; color: var(--ink); min-width: 0; }
.lesson-row:hover { background: var(--surface-2); }
.lesson-row:hover .ls-name { text-decoration: underline; }
.lesson-row.cur { background: color-mix(in srgb, var(--subj) 8%, var(--surface)); }
.ls-ic { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line-2); flex: none; display: grid; place-items: center; background: var(--surface); }
.ls-ic .i { width: 14px; height: 14px; stroke-width: 2.6; }
.ls-ic.done { background: var(--subj); border-color: var(--subj); color: var(--surface); }
.ls-ic.part { border-color: var(--subj); background: conic-gradient(var(--subj) 0 50%, var(--surface) 50% 100%); }
.ls-ic.nt { border-style: dashed; }
.ls-num { width: 40px; flex: none; color: var(--ink-3); font-size: 0.85rem; }
.ls-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.ls-name { font-weight: 500; overflow-wrap: anywhere; }
.is-done .ls-name { color: var(--ink-2); }
.ls-meta { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 0.8rem; color: var(--ink-3); }
.ls-meta .i { width: 14px; height: 14px; }
.ls-conf { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.ls-conf.c1 { background: var(--c1); } .ls-conf.c2 { background: var(--c2); } .ls-conf.c3 { background: var(--c3); }
.bar-tools { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* One lesson */
.lesson { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 28px; align-items: start; }
.lesson-side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 112px); max-height: calc(100vh - 130px); overflow-y: auto; min-width: 0; scrollbar-width: thin; }
.lesson-main { display: flex; flex-direction: column; gap: 18px; min-width: 0; max-width: 820px; }
.toc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.toc > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; }
.toc > summary::-webkit-details-marker { display: none; }
.toc-t { display: flex; flex-direction: column; }
.toc-t b { color: var(--subj); }
.toc-body { border-top: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; }
.toc-u > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 8px 10px; border-radius: 9px; font-size: 0.88rem; font-weight: 500; }
.toc-u > summary::-webkit-details-marker { display: none; }
.toc-u > summary:hover { background: var(--surface-2); }
.toc-u > summary > .num:first-child { color: var(--subj); }
.toc-un { overflow-wrap: anywhere; }
.toc-u ol { list-style: none; margin: 0 0 6px; padding: 0 0 0 4px; }
.toc-u li a { display: grid; grid-template-columns: 18px 32px minmax(0, 1fr); gap: 6px; align-items: start; padding: 6px 8px; border-radius: 8px; text-decoration: none; color: var(--ink-2); font-size: 0.84rem; line-height: 1.35; }
.toc-u li a:hover { background: var(--surface-2); color: var(--ink); }
.toc-u li a.cur { background: color-mix(in srgb, var(--subj) 12%, var(--surface)); color: var(--ink); font-weight: 600; }
.toc-u li a .num { color: var(--ink-3); font-size: 0.78rem; padding-top: 1px; }
.toc-u .ls-ic { width: 16px; height: 16px; border-width: 1.5px; margin-top: 1px; }
.toc-u .ls-ic .i { width: 10px; height: 10px; }
.lesson-head { display: flex; flex-direction: column; gap: 10px; }
.lesson-head .eyebrow .num { padding: 1px 8px; border-radius: 6px; background: var(--surface-2); font-size: 0.78rem; }
.lesson-head .eyebrow .lesson-num { background: var(--subj); color: var(--surface); font-weight: 600; }
.lesson-prog { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pips { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; }
.pips a { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line-2); color: var(--ink-3); text-decoration: none; font-size: 0.8rem; font-weight: 600; background: var(--surface); }
.pips li.on a { background: var(--subj); border-color: var(--subj); color: var(--surface); }
.lesson-acts { margin-left: auto; display: flex; gap: 6px; }

.flow { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.fstep { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 16px; scroll-margin-top: 130px; }
.fs-rail { position: relative; display: flex; justify-content: center; }
.fs-rail::after { content: ""; position: absolute; top: 46px; bottom: -6px; width: 3px; border-radius: 3px; background: var(--line); }
.fstep:last-child .fs-rail::after { display: none; }
.fstep.done .fs-rail::after { background: color-mix(in srgb, var(--subj) 45%, var(--line)); }
.fs-n { position: relative; z-index: 1; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2.5px solid color-mix(in srgb, var(--subj) 55%, var(--line)); color: var(--subj); font-weight: 700; font-size: 1.05rem; }
.fs-n .i { width: 20px; height: 20px; stroke-width: 2.6; }
.fstep.done .fs-n { background: var(--subj); border-color: var(--subj); color: var(--surface); }
.fs-main { display: flex; flex-direction: column; gap: 14px; padding: 20px 22px 22px; margin-bottom: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; min-width: 0; box-shadow: 0 1px 2px rgba(21, 23, 61, 0.04); }
.fs-head { display: flex; flex-direction: column; gap: 3px; }
.fs-head h2 { font-size: 1.25rem; }
.fs-body { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.fs-foot { display: flex; justify-content: flex-end; padding-top: 4px; border-top: 1px dashed var(--line); padding-top: 14px; }
.fstep.done .fs-foot .btn { color: var(--ok); }
.vfeat { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); text-decoration: none; color: var(--ink); background: var(--surface-2); }
.vfeat:hover { border-color: var(--subj); }
.vfeat .vthumb { aspect-ratio: 16 / 9; }
.vfeat .vplay { width: 58px; height: 58px; background: var(--subj); }
.vfeat .vplay .i { width: 26px; height: 26px; }
.vf-meta { display: flex; flex-direction: column; gap: 6px; padding: 18px; justify-content: center; min-width: 0; }
.vf-meta b { font-size: 1.08rem; line-height: 1.35; }
.vrows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.vrows a { display: flex; gap: 12px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: var(--ink); }
.vrows a:hover { background: var(--surface-2); }
.vrows .i { width: 22px; height: 22px; color: var(--subj); margin-top: 1px; }
.vrows a > span { display: flex; flex-direction: column; min-width: 0; }
.vrows b { font-weight: 500; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-link { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: 999px; padding: 6px 13px; font-size: 0.86rem; text-decoration: none; color: var(--ink-2); background: var(--surface); }
.chip-link:hover { border-color: var(--subj); color: var(--ink); }
.chip-link .i { width: 15px; height: 15px; }
.kp { display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: color-mix(in srgb, var(--subj) 6%, var(--surface)); border: 1px solid color-mix(in srgb, var(--subj) 18%, transparent); }
.kp-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 1.02rem; }
.checklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.checklist li { border-bottom: 1px solid color-mix(in srgb, var(--subj) 12%, var(--line)); }
.checklist li:last-child { border-bottom: 0; }
.checklist label { display: flex; gap: 12px; padding: 10px 0; cursor: pointer; align-items: flex-start; }
.checklist input { margin-top: 3px; flex: none; width: 19px; height: 19px; accent-color: var(--subj); }
.checklist input:checked + span { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--subj); text-decoration-thickness: 2px; }
.checklist.plain li { padding: 8px 0; }
.tip-box { padding: 14px 16px; border-radius: 12px; background: color-mix(in srgb, var(--c2) 12%, var(--surface)); display: flex; flex-direction: column; gap: 4px; }
.tip-box .label { display: flex; align-items: center; gap: 6px; color: var(--warn); }
.notes { min-height: 140px; line-height: 1.7; }
.my-links { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; }
.try-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.try { display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); min-width: 0; }
.try h3 { display: flex; align-items: center; gap: 8px; }
.try h3 .i { color: var(--subj); }
.try .btn { align-self: flex-start; }
.ai-cta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 16px; border-radius: 14px; background: var(--accent-soft); }
.ai-cta > div { flex: 1 1 260px; display: flex; flex-direction: column; gap: 2px; }
.ai-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--primary); color: var(--primary-fg); display: grid; place-items: center; flex: none; }
.fin-row { display: flex; gap: 12px; flex-wrap: wrap; }
.fin-done { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 14px; background: color-mix(in srgb, var(--ok) 10%, var(--surface)); }
.fin-done p { display: flex; align-items: center; gap: 8px; color: var(--ok); }
.fin-done .btn { white-space: normal; text-align: left; }
.btn.block { white-space: normal; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pg { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-decoration: none; color: var(--ink); min-width: 0; }
.pg:hover { border-color: var(--subj); }
.pg > span { display: flex; flex-direction: column; min-width: 0; }
.pg b { font-weight: 500; overflow-wrap: anywhere; }
.pg.next { justify-content: flex-end; text-align: right; }

/* Videos (course extras, session dialog) */
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.vcard { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; text-decoration: none; color: var(--ink); min-width: 0; }
.vcard:hover { border-color: var(--subj); box-shadow: var(--shadow); }
.vthumb { position: relative; aspect-ratio: 16 / 9; max-width: 100%; display: grid; place-items: center; background: linear-gradient(140deg, color-mix(in srgb, var(--subj) 30%, var(--surface)), color-mix(in srgb, var(--subj) 8%, var(--surface))); overflow: hidden; }
.vcard .vthumb:not(:has(img)) { aspect-ratio: 16 / 5; }
.vthumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.vplay { position: relative; width: 44px; height: 44px; border-radius: 50%; background: rgba(14, 15, 34, 0.75); color: #fff; display: grid; place-items: center; }
.vplay .i { fill: currentColor; stroke: none; width: 20px; height: 20px; margin-left: 2px; }
.vmeta { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px 12px; }
.vch { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--subj); }
.vt { font-size: 0.9rem; font-weight: 500; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.deck-list { list-style: none; margin: 0; padding: 0; }
.site-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.site-card { gap: 4px; padding: 14px; }
.site-card .site { align-self: flex-start; }
.tech-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.phases { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.phase { position: relative; padding: 0 0 18px 26px; border-left: 2px solid var(--line-2); margin-left: 6px; display: flex; flex-direction: column; gap: 3px; }
.phase:last-child { padding-bottom: 0; }
.phase::before { content: ""; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line-2); }
.phase.done::before { background: var(--ok); border-color: var(--ok); }
.phase.now::before { background: var(--primary); border-color: var(--primary); }
.phase p { color: var(--ink-2); font-size: 0.92rem; max-width: 70ch; }
.phase b { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ---------- Plan: week grid ---------- */
.wk-card { padding: 12px; }
.wk { --wk-h: 800px; overflow-x: auto; }
.wk-head, .wk-body { display: grid; grid-template-columns: 52px repeat(7, minmax(92px, 1fr)); gap: 6px; min-width: 760px; }
.wk-head { padding-bottom: 8px; }
.wk-day { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 4px 0; border-radius: 10px; }
.wk-day b { font-size: 1.25rem; font-weight: 500; line-height: 1.2; }
.wk-day.today { background: var(--surface-2); }
.wk-day.today b { color: var(--accent); }
.wk-day .chip { margin-top: 2px; font-size: 0.66rem; }
.wk-body { height: var(--wk-h); position: relative; }
.wk-hours { position: relative; }
.wk-hours span { position: absolute; right: 4px; transform: translateY(-50%); font-family: var(--f-mono); font-size: 0.68rem; color: var(--ink-3); }
.wk-hours span:first-child { transform: none; }
.wk-col { position: relative; border-radius: 10px; background: repeating-linear-gradient(180deg, transparent 0 47px, var(--line) 47px 48px); background-color: var(--surface); outline: 1px solid var(--line); overflow: hidden; }
.wk-col.today { outline: 2px solid var(--accent); }
.wk-col.past { opacity: 0.6; }
.wb { position: absolute; left: 3px; right: 3px; border-radius: 7px; padding: 3px 6px; font-size: 0.72rem; line-height: 1.25; overflow: hidden; display: flex; flex-direction: column; gap: 1px; border: 0; font-family: inherit; text-align: left; color: var(--ink); }
.wb b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.wb .num { font-size: 0.66rem; color: var(--ink-2); }
.wb.kind-sleep { left: 0; right: 0; border-radius: 0; background: repeating-linear-gradient(-45deg, var(--surface-2) 0 6px, var(--surface-3) 6px 7px); }
.wb.kind-school { background: color-mix(in srgb, var(--k-school) 22%, var(--surface)); }
.wb.kind-travel, .wb.kind-rest { background: color-mix(in srgb, var(--k-school) 9%, var(--surface)); }
.wb.kind-activity { background: color-mix(in srgb, var(--k-activity) 22%, var(--surface)); }
.wb.kind-meal { background: color-mix(in srgb, var(--k-meal) 22%, var(--surface)); }
.wb.kind-event { background: color-mix(in srgb, var(--k-event) 24%, var(--surface)); }
.wb.kind-exam { background: var(--subj); color: var(--surface); z-index: 2; }
.wb.kind-free { background: transparent; border: 1.5px dashed color-mix(in srgb, var(--k-free) 70%, transparent); color: var(--ink-3); }
.wb.kind-study { background: color-mix(in srgb, var(--subj) 17%, var(--surface)); border-left: 3px solid var(--subj); cursor: pointer; z-index: 1; }
.wb.kind-study:hover { background: color-mix(in srgb, var(--subj) 27%, var(--surface)); }
.wb.kind-study.done { opacity: 0.5; }
.wb.kind-study.done b { text-decoration: line-through; }
.wk-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 4px 2px; color: var(--ink-2); }
.wk-legend span { display: inline-flex; align-items: center; gap: 6px; }
.lgd { display: inline-block; width: 12px; height: 12px; border-radius: 3px; background: var(--surface-3); flex: none; }
.lgd.kind-study { background: var(--accent); } .lgd.kind-school { background: var(--k-school); } .lgd.kind-activity { background: var(--k-activity); }
.lgd.kind-meal { background: var(--k-meal); } .lgd.kind-exam { background: var(--ink); } .lgd.kind-free { border: 1.5px dashed var(--k-free); background: transparent; }
.lgd.kind-sleep { background: repeating-linear-gradient(-45deg, var(--surface-2) 0 3px, var(--line-2) 3px 4px); }
.wk-phone { display: none; }
.day-chips { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.day-chip { font: inherit; border: 0; background: transparent; border-radius: 10px; padding: 6px 0; display: flex; flex-direction: column; align-items: center; cursor: pointer; color: var(--ink-2); }
.day-chip span { font-size: 0.72rem; font-weight: 600; }
.day-chip b { font-size: 1.05rem; font-weight: 500; }
.day-chip.today b { color: var(--accent); }
.day-chip.on { background: var(--ink); color: var(--primary-fg); }
.day-chip.on b { color: var(--primary-fg); }

/* Routine */
.balance { display: flex; height: 16px; border-radius: 999px; overflow: hidden; gap: 2px; }
.balance span { display: block; min-width: 2px; }
.balance .kind-sleep, .balance-key .kind-sleep { background: var(--surface-3); }
.balance .kind-school { background: var(--k-school); } .balance .kind-activity { background: var(--k-activity); } .balance .kind-study { background: var(--ink); } .balance .kind-free { background: var(--k-free); } .balance .kind-other { background: var(--surface-2); }
.balance-key { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 0.88rem; }
.balance-key li { display: flex; align-items: center; gap: 7px; }
.balance-key .lgd.kind-study { background: var(--ink); }
.balance-key .lgd.kind-free { background: var(--k-free); border: 0; }
.balance-key b { font-weight: 500; }
.table-wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.tbl th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.tbl td, .tbl tbody th { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody th { text-transform: none; letter-spacing: 0; font-size: 0.92rem; color: var(--ink); }
.tbl .num { text-align: right; }
.routine-tbl input[type="time"] { width: 128px; }
.routine-tbl input[type="number"] { width: 76px; }
.school-cell { display: flex; align-items: center; gap: 6px; }
.mini-toggle { position: relative; display: inline-flex; cursor: pointer; }
.mini-toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.mini-toggle span { width: 34px; height: 20px; border-radius: 999px; background: var(--line-2); position: relative; transition: background 0.15s; }
.mini-toggle span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: transform 0.15s; }
.mini-toggle input:checked + span { background: var(--ink); }
.mini-toggle input:checked + span::after { transform: translateX(14px); }
.mini-toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.act-list { display: flex; flex-direction: column; gap: 8px; }
.act { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px; border: 1px solid var(--line); border-radius: var(--r-sm); }
.act-name { flex: 1 1 180px; font-weight: 600; }
.act-time { display: inline-flex; align-items: center; gap: 4px; }
.act-time input[type="time"] { width: 128px; }
.daypick { display: inline-flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--surface-2); }
.daypick button { font: inherit; font-size: 0.76rem; font-weight: 600; width: 32px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-3); cursor: pointer; }
.daypick button.on { background: var(--ink); color: var(--primary-fg); }
.mini-check, .mini-field { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--ink-2); }
.mini-field input { width: 70px; }
.presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.preset { text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
.preset b { font-size: 0.95rem; }
.preset span { font-size: 0.8rem; color: var(--ink-3); line-height: 1.4; }
.preset.on { border-color: var(--ink); background: var(--surface-2); }
.exam-list { display: flex; flex-direction: column; gap: 8px; }
.exam { flex-direction: row; align-items: flex-start; gap: 16px; border-left: 4px solid var(--subj); }
.exam.off { opacity: 0.55; }
.exam.past { opacity: 0.6; }
.exam-date { display: flex; flex-direction: column; align-items: center; width: 52px; flex: none; }
.exam-date b { font-size: 1.6rem; font-weight: 500; line-height: 1.1; }
.exam-date span { font-size: 0.74rem; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.exam-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.exam-ready { display: flex; flex-direction: column; gap: 4px; max-width: 420px; margin-top: 4px; }
.exam-side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; flex: none; }

/* ---------- Check ---------- */
.ck { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 16px; align-items: start; }
.ck-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.ck-form { gap: 14px; }
.ck-step { display: flex; align-items: center; gap: 10px; }
.ck-step:not(:first-child) { margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--line); }
.ck-subjects { display: flex; flex-wrap: wrap; gap: 6px; }
.pick-subj { font: inherit; font-size: 0.88rem; font-weight: 600; padding: 7px 13px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.pick-subj.on { border-color: var(--subj); background: color-mix(in srgb, var(--subj) 10%, var(--surface)); color: var(--ink); }
.img-field { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.ck-go { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-top: 6px; }
.ai-line { display: inline-flex; align-items: center; gap: 6px; font-size: 0.84rem; color: var(--ink-2); }
.ai-line .i { width: 15px; height: 15px; color: var(--accent); }
.ck-running { align-items: flex-start; border: 1.5px solid var(--ink); }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--surface-3); border-top-color: var(--ink); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ck-steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--ink-3); }
.ck-steps .done { color: var(--ok); }
.ck-steps .now { color: var(--ink); font-weight: 600; }
.ck-result { display: flex; flex-direction: column; gap: 16px; }
.ck-score { flex-direction: row; align-items: center; gap: 22px; border-top: 4px solid var(--subj); }
.ck-score .ring-in { font-size: 1.9rem; }
.ck-score .ring-in span { font-size: 1rem; color: var(--ink-3); }
.ck-score-t { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ck-score-t h2 { font-size: 1.3rem; }
.delta { font-weight: 600; }
.marks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.mk { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.mk:last-child { border-bottom: 0; }
.mk-ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-top: 1px; }
.mk-ic .i { width: 15px; height: 15px; stroke-width: 2.4; }
.mk.got .mk-ic { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); color: var(--ok); }
.mk.part .mk-ic { background: color-mix(in srgb, var(--warn) 18%, var(--surface)); color: var(--warn); }
.mk.miss .mk-ic { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); color: var(--bad); }
.mk-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.mk-label { display: inline-block; font-family: var(--f-mono); font-size: 0.76rem; font-weight: 500; padding: 0 6px; margin-right: 6px; border-radius: 5px; background: var(--surface-2); }
.mk-n { font-size: 0.8rem; color: var(--ink-3); margin-right: 6px; }
.improve { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; counter-reset: imp; }
.improve li { position: relative; padding-left: 36px; display: flex; flex-direction: column; gap: 6px; counter-increment: imp; }
.improve li::before { content: counter(imp); position: absolute; left: 0; top: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--primary-fg); display: grid; place-items: center; font-size: 0.8rem; font-weight: 700; }
.imp-issue { font-weight: 600; }
.imp-eg { padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--ok) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--ok) 22%, transparent); }
.imp-eg .label { color: var(--ok); }
.imp-eg p { white-space: pre-wrap; overflow-wrap: anywhere; }
.ck-actions { padding-top: 2px; }
.chat-log { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; font-size: 0.93rem; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--ink); color: var(--primary-fg); border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.chat-form { display: flex; gap: 8px; align-items: flex-end; }
.chat-form textarea { flex: 1; min-height: 44px; }
.chat-form .btn { padding: 11px 13px; }
.stat-tiles .tile { flex-direction: column; align-items: flex-start; gap: 4px; }
.ai-mark { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ai-mark p { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* ---------- Focus ---------- */
.fx { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
.fx-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.fx-timer { align-items: center; text-align: center; gap: 16px; padding: 24px 18px; }
.fx-for { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
.fx-phase { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); min-height: 1.2em; }
.fx-dial { position: relative; width: min(280px, 72vw); aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; }
.fx-dial svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.fx-track { fill: none; stroke: var(--surface-3); stroke-width: 4; }
.fx-arc { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; transition: stroke-dasharray 0.3s linear; }
.fx-clock { position: relative; font-size: clamp(2.6rem, 2rem + 2vw, 3.4rem); font-weight: 500; letter-spacing: -0.02em; }
.fx-exam { width: 100%; max-width: 520px; text-align: left; }
.laps { list-style: none; margin: 0; padding: 0; width: 100%; max-width: 320px; }
.laps li { display: flex; justify-content: space-between; padding: 5px 2px; border-bottom: 1px dashed var(--line); }
.fx-cam .card-head h2 .i { width: 20px; height: 20px; }
.cam-dock { position: fixed; z-index: 45; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 150px; border-radius: 14px; overflow: hidden; background: var(--surface); border: 2px solid var(--line-2); box-shadow: var(--shadow-up); }
.cam-dock video { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; transform: scaleX(-1); background: #000; }
.cam-status { display: flex; align-items: center; gap: 6px; padding: 5px 8px; font-size: 0.74rem; font-weight: 600; }
.cam-status i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.cam-dock[data-status="present"] { border-color: var(--ok); }
.cam-dock[data-status="present"] i { background: var(--ok); }
.cam-dock[data-status="distracted"] { border-color: var(--warn); }
.cam-dock[data-status="distracted"] i { background: var(--warn); }
.cam-dock[data-status="away"] { border-color: var(--bad); }
.cam-dock[data-status="away"] i { background: var(--bad); }

/* ---------- Flashcards ---------- */
.stat-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.stat-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.deck-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.deck-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.deck-row:last-child { border-bottom: 0; }
.deck-name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--ink); }
.deck-name:hover b { text-decoration: underline; }
.deck-name .boxbar { max-width: 280px; }
.stag-none { background: var(--surface-2); color: var(--ink-3); }
.due { font-size: 0.82rem; color: var(--ink-3); white-space: nowrap; }
.due.on b { color: var(--ink); }
.boxbar { display: flex; height: 6px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--surface-2); margin-top: 5px; }
.bx { display: block; min-width: 3px; background: var(--c0); }
.bx.b1 { background: var(--c1); } .bx.b2 { background: var(--c2); } .bx.b3 { background: color-mix(in srgb, var(--c2) 45%, var(--c3)); } .bx.b4 { background: var(--c3); } .bx.b5 { background: var(--accent); } .bx.b0 { opacity: 0.4; }
.leitner-explain .bx, .box-col .bx { display: inline-block; width: 14px; height: 14px; border-radius: 4px; flex: none; }
.leitner-explain { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.leitner-explain li { display: flex; align-items: center; gap: 8px; font-size: 0.88rem; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r-sm); flex-wrap: wrap; }
.boxes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.box-col { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 12px 4px; border: 1px solid var(--line); border-radius: var(--r-sm); text-align: center; }
.box-col b { font-size: 1.4rem; font-weight: 500; }
.starter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.starter { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding: 14px; border: 1px solid var(--line); border-top: 4px solid var(--subj); border-radius: var(--r); background: var(--surface); }
.mode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.mode { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left; padding: 14px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
.mode:hover:not(:disabled) { border-color: var(--ink-3); }
.mode:disabled { opacity: 0.5; cursor: not-allowed; }
.mode > .i { width: 24px; height: 24px; margin-bottom: 2px; }
.card-add { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 8px; }
.cards-tbl td { vertical-align: top; }
textarea.cell { min-width: 150px; resize: vertical; border-color: transparent; background: transparent; padding: 4px 6px; field-sizing: content; min-height: 0; }
textarea.cell:hover { border-color: var(--line-2); }
.import { display: flex; flex-direction: column; gap: 12px; }
.import fieldset { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.im-preview { border: 1px dashed var(--line-2); border-radius: var(--r-sm); padding: 10px 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 6px; }
.study { max-width: 720px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; padding-top: 8px; }
.study-bar { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.study-title { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
.meter { height: 7px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--ink); border-radius: 999px; }
.flash { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 290px; padding: 54px 24px 28px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); font: inherit; color: var(--ink); cursor: pointer; text-align: center; }
.flash.flipped { background: var(--surface-2); }
.flash.static { cursor: default; min-height: 200px; }
.fl-side { position: absolute; top: 16px; left: 20px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 600; }
.fl-text { font-family: var(--f-display); font-size: clamp(1.25rem, 1rem + 1vw, 1.7rem); font-weight: 700; line-height: 1.35; max-width: 36ch; overflow-wrap: anywhere; white-space: pre-wrap; }
.grade { display: flex; gap: 10px; justify-content: center; }
.btn-grade { flex: 1; display: flex; flex-direction: column; gap: 2px; align-items: center; padding: 12px; border-radius: var(--r); border: 1.5px solid var(--line-2); background: var(--surface); font: inherit; cursor: pointer; }
.btn-grade b { font-size: 1rem; }
.btn-grade span { font-size: 0.76rem; color: var(--ink-3); }
.btn-grade.bad { border-color: var(--c1); color: var(--c1); }
.btn-grade.good { border-color: var(--c3); color: var(--c3); }
.type-form { display: flex; gap: 8px; flex-wrap: wrap; }
.type-form input { flex: 1 1 240px; font-size: 1rem; padding: 10px 12px; }
.verdict { padding: 14px 16px; border-radius: var(--r); border: 1.5px solid var(--line-2); display: flex; flex-direction: column; gap: 4px; }
