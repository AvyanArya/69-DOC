<script>
/* Focus timers: Pomodoro with breaks, exam timer with warnings, countdown and stopwatch.
   One timer runs at a time and keeps going while you move around the site. */
(function (RH) {
  'use strict';
  const U = RH.util, M = RH.model, C = RH.c, esc = U.esc, $ = RH.$;
  const st = () => RH.store.state;

  const T = RH.timer = {
    mode: 'pomo', phase: 'focus', cycle: 0, running: false,
    total: 25 * 60, left: 25 * 60, endsAt: 0,
    elapsed: 0, startedAt: 0, laps: [],
    session: null, examPaper: '', extra: 0, warned: {}, tick: null
  };

  const PHASE = { focus: 'Focus', short: 'Short break', long: 'Long break' };
  const fmt = (sec) => {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(s).padStart(2, '0');
  };
  T.fmt = fmt;
  const pomo = () => st().prefs.pomo;
  const phaseLen = (p) => (p === 'focus' ? pomo().focus : p === 'short' ? pomo().short : pomo().long) * 60;

  function setTotal(sec) { T.running = false; T.total = T.left = Math.max(1, Math.round(sec)); T.warned = {}; }

  T.setMode = function (mode) {
    if (T.mode === mode) return;
    T.mode = mode; T.running = false; T.elapsed = 0; T.laps = [];
    if (mode === 'pomo') { T.phase = 'focus'; setTotal(phaseLen('focus')); }
    else if (mode === 'exam') setTotal(examSeconds());
    else if (mode === 'countdown') setTotal(T.lastCountdown || 30 * 60);
    paint();
  };

  function examSeconds() {
    const p = examPapers().find((x) => x.id === T.examPaper);
    const mins = p ? p.dur : (T.examCustom || 120);
    return Math.round(mins * 60 * (1 + (T.extra || 0) / 100));
  }
  function examPapers() {
    const out = [];
    M.subjects.forEach((s) => s.papers.forEach((p) => out.push({ id: s.id + '-' + p.id, name: s.name + ' ' + p.code + ' ' + p.name.replace(/^Paper \w+: /, ''), dur: p.dur })));
    return out;
  }

  T.start = function () {
    if (T.running) return;
    if (T.mode === 'stopwatch') { T.startedAt = Date.now() - T.elapsed * 1000; }
    else { if (T.left <= 0) T.left = T.total; T.endsAt = Date.now() + T.left * 1000; }
    T.running = true;
    loop();
    paint();
  };
  T.pause = function () {
    if (!T.running) return;
    if (T.mode === 'stopwatch') T.elapsed = (Date.now() - T.startedAt) / 1000;
    else T.left = (T.endsAt - Date.now()) / 1000;
    T.running = false;
    paint();
  };
  T.reset = function () {
    T.running = false;
    if (T.mode === 'stopwatch') { T.elapsed = 0; T.laps = []; }
    else if (T.mode === 'pomo') setTotal(phaseLen(T.phase));
    else setTotal(T.total);
    T.warned = {};
    paint();
  };
  T.skip = function () { if (T.mode === 'pomo') nextPhase(false); };

  function nextPhase(finished) {
    if (T.phase === 'focus') {
      if (finished) T.cycle++;
      T.phase = T.cycle && T.cycle % pomo().cycles === 0 ? 'long' : 'short';
    } else T.phase = 'focus';
    setTotal(phaseLen(T.phase));
    if (finished && pomo().auto) T.start(); else paint();
  }

  function finish() {
    T.running = false; T.left = 0;
    if (pomo().sound) C.chime('end');
    if (T.mode === 'pomo') {
      const was = T.phase;
      C.toast(was === 'focus' ? 'Focus block done. Time for a ' + (((T.cycle + 1) % pomo().cycles === 0) ? 'long' : 'short') + ' break.' : 'Break over. Back to it.');
      nextPhase(true);
      return;
    }
    if (T.mode === 'exam') C.toast('Time is up. Pens down.');
    else C.toast('Time is up.');
    const x = T.session && RH.findSession && RH.findSession(T.session);
    if (x && !x.done) C.toast('Mark "' + RH.views.sessTitle(x) + '" as done from Today.');
    paint();
  }

  function loop() {
    clearInterval(T.tick);
    T.tick = setInterval(function () {
      if (!T.running) return;
      if (T.mode === 'stopwatch') { T.elapsed = (Date.now() - T.startedAt) / 1000; paint(); return; }
      T.left = (T.endsAt - Date.now()) / 1000;
      if (T.mode === 'exam') {
        [30, 10, 5].forEach(function (m) {
          if (T.left <= m * 60 && T.total > m * 60 && !T.warned[m]) { T.warned[m] = 1; if (pomo().sound) C.chime('warn'); C.toast(m + ' minutes left'); }
        });
      }
      if (T.left <= 0) finish();
      paint();
    }, 250);
  }

  // Display bits: the top bar pill, and the big clock on the Timers page.
  function current() { return T.mode === 'stopwatch' ? T.elapsed : T.left; }
  function paint() {
    const btn = $('#timerBtn');
    if (btn) {
      const active = T.running || (T.mode === 'stopwatch' ? T.elapsed > 0 : T.left !== T.total);
      btn.classList.toggle('running', T.running);
      $('#timerLabel').textContent = active ? (T.mode === 'pomo' ? PHASE[T.phase] + ' ' : '') + fmt(current()) : 'Timers';
    }
    const clock = $('#tm-clock');
    if (!clock) return;
    clock.textContent = fmt(current());
    const ring = $('#tm-ring');
    if (ring) ring.style.setProperty('--p', T.mode === 'stopwatch' ? String((T.elapsed % 60) / 60) : String(1 - T.left / T.total));
    const play = $('#tm-play');
    if (play) play.innerHTML = T.running ? C.icon('pause') + 'Pause' : C.icon('play') + ((T.mode === 'stopwatch' ? T.elapsed : T.total - T.left) > 0.5 ? 'Resume' : 'Start');
    const ph = $('#tm-phase');
    if (ph) ph.textContent = T.mode === 'pomo' ? PHASE[T.phase] + ' · block ' + (T.cycle % pomo().cycles + (T.phase === 'focus' ? 1 : 0)) + ' of ' + pomo().cycles : T.mode === 'exam' ? (!T.running && T.left === T.total ? 'Ready when you are' : !T.running ? 'Paused' : T.left < 300 ? 'Final minutes' : 'Exam in progress') : '';
    const laps = $('#tm-laps');
    if (laps) laps.innerHTML = T.laps.map((l, i) => '<li><span class="muted">Lap ' + (i + 1) + '</span><span class="mono">' + fmt(l) + '</span></li>').join('');
  }
  T.paint = paint;

  T.forSession = function (x) {
    T.session = x.id;
    if (!T.running) { T.mode = 'countdown'; T.lastCountdown = x.m * 60; setTotal(x.m * 60); }
  };

  // ---------- Page ----------
  RH.views.timers = function () {
    const mode = T.mode;
    const p = pomo();
    const x = T.session && RH.findSession && RH.findSession(T.session);
    let html = C.head('Tools', 'Timers', 'Pomodoro for focus blocks, an exam timer for timed papers, plus a countdown and stopwatch. The timer keeps running while you use the rest of the site.');
    html += C.tabs('timer', [['pomo', 'Pomodoro', 'timer'], ['exam', 'Exam timer', 'exams'], ['countdown', 'Countdown', 'today'], ['stopwatch', 'Stopwatch', 'flag']], mode);
    html += '<div class="timer-layout"><section class="sheet timer-main">';
    if (x) html += '<p class="tm-for">' + C.stag(x.s) + esc(RH.views.sessTitle(x)) + '</p><p class="help center">' + esc(RH.KIND[x.k].how) + '</p>';
    html += '<p class="tm-phase mono" id="tm-phase"></p><div class="tm-ring" id="tm-ring"><span class="tm-clock mono" id="tm-clock">' + fmt(current()) + '</span></div>';
    if (mode === 'countdown') html += '<div class="seg-ctl tm-lens" role="group" aria-label="Length">' + [10, 15, 20, 25, 30, 45, 60, 90].map((m) => '<button type="button" data-action="timer-len" data-v="' + m + '" class="' + (T.total === m * 60 ? 'on' : '') + '">' + m + '</button>').join('') + '</div>';
    if (mode === 'exam') {
      html += '<div class="two exam-pick"><div class="field"><label for="tm-paper">Paper</label><select id="tm-paper" data-timer="paper"><option value="">Custom length</option>' + examPapers().map((q) => '<option value="' + q.id + '"' + (q.id === T.examPaper ? ' selected' : '') + '>' + esc(q.name) + ' (' + U.mins(q.dur) + ')</option>').join('') + '</select></div>' +
        '<div class="field"><label for="tm-extra">Extra time</label><select id="tm-extra" data-timer="extra">' + [[0, 'None'], [10, '10%'], [25, '25%'], [50, '50%']].map((o) => '<option value="' + o[0] + '"' + (Number(T.extra) === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div></div>' +
        (T.examPaper ? '' : '<div class="field narrow"><label for="tm-custom">Minutes</label><input type="number" id="tm-custom" min="5" max="300" step="5" data-timer="custom" value="' + (T.examCustom || 120) + '"></div>') +
        '<p class="help center">Warnings at 30, 10 and 5 minutes left. For a PDF paper with questions on screen, use the <a href="#portal">Exam portal</a>.</p>';
    }
    html += '<div class="row-actions center"><button type="button" class="btn btn-lg" id="tm-play" data-action="timer-play"></button>' +
      (mode === 'stopwatch' ? '<button type="button" class="btn-ghost" data-action="timer-lap">' + C.icon('flag') + 'Lap</button>' : '') +
      (mode === 'pomo' ? '<button type="button" class="btn-ghost" data-action="timer-skip">' + C.icon('later') + 'Skip to ' + (T.phase === 'focus' ? 'break' : 'focus') + '</button>' : '') +
      '<button type="button" class="btn-ghost" data-action="timer-reset">Reset</button>' +
      (x && !x.done ? '<button type="button" class="btn-ghost" data-action="sess-done" data-id="' + x.id + '">' + C.icon('check') + 'Mark session done</button>' : '') + '</div>';
    if (mode === 'stopwatch') html += '<ol class="laps" id="tm-laps"></ol>';
    html += '</section><aside class="timer-side">';
    if (mode === 'pomo') {
      html += '<section class="panel"><h2>Pomodoro settings</h2><div class="two">' +
        [['focus', 'Focus (min)', 5, 120], ['short', 'Short break', 1, 30], ['long', 'Long break', 5, 60], ['cycles', 'Blocks before long break', 2, 8]].map((f) =>
          '<div class="field"><label for="pm-' + f[0] + '">' + f[1] + '</label><input type="number" id="pm-' + f[0] + '" min="' + f[2] + '" max="' + f[3] + '" data-pomo="' + f[0] + '" value="' + p[f[0]] + '"></div>').join('') + '</div>' +
        '<label class="toggle"><input type="checkbox" data-pomo="auto"' + (p.auto ? ' checked' : '') + '><span class="tg-ui" aria-hidden="true"></span><span class="tg-text"><b>Start the next block automatically</b></span></label>' +
        '<label class="toggle"><input type="checkbox" data-pomo="sound"' + (p.sound ? ' checked' : '') + '><span class="tg-ui" aria-hidden="true"></span><span class="tg-text"><b>Sound at the end</b></span></label>' +
        '<p class="help">Completed focus blocks this visit: <b class="mono">' + T.cycle + '</b></p></section>';
    }
    html += '<section class="panel"><h2>Using timers well</h2><ul class="tips">' +
      '<li><b>Decide the task first.</b> "Do PMT capacitors questions 1–6" beats "revise physics".</li>' +
      '<li><b>Phone in another room.</b> Even face-down, it pulls your attention.</li>' +
      '<li><b>Breaks are off-screen.</b> Walk, stretch, drink water. Don\'t start a video.</li>' +
      '<li><b>Time your papers for real.</b> Use the exam timer with the real length so pacing becomes automatic.</li>' +
      '<li><b>Log what you finished</b> by marking the session done on Today.</li></ul></section>';
    html += '</aside></div>';
    setTimeout(paint, 0);
    return html;
  };

  RH.actions['timer-play'] = () => { if (T.running) T.pause(); else { C.primeAudio(); T.start(); } };
  RH.actions['timer-reset'] = () => T.reset();
  RH.actions['timer-skip'] = () => T.skip();
  RH.actions['timer-lap'] = () => { if (T.mode === 'stopwatch') { const now = T.running ? (Date.now() - T.startedAt) / 1000 : T.elapsed; const prev = T.laps.reduce((a, l) => a + l, 0); T.laps.push(now - prev); paint(); } };
  RH.actions['timer-len'] = function (el) {
    T.lastCountdown = Number(el.dataset.v) * 60;
    setTotal(T.lastCountdown);
    document.querySelectorAll('.tm-lens button').forEach((b) => b.classList.toggle('on', b === el));
    paint();
  };
  RH.actions['timer-open'] = function (el) {
    const x = el.dataset.id && RH.findSession(el.dataset.id);
    if (x) T.forSession(x);
    RH.ui.tabs.timer = T.mode;
    if (location.hash === '#timers') RH.render({ keepScroll: true }); else location.hash = 'timers';
  };
  RH.onTab.timer = (v) => T.setMode(v);

  RH.onChange.push(function (el) {
    if (el.dataset.timer === 'paper') { T.examPaper = el.value; setTotal(examSeconds()); RH.render({ keepScroll: true }); return true; }
    if (el.dataset.timer === 'extra') { T.extra = Number(el.value); setTotal(examSeconds()); paint(); return true; }
    if (el.dataset.timer === 'custom') { T.examCustom = U.clamp(Number(el.value) || 120, 5, 300); setTotal(examSeconds()); paint(); return true; }
    if (el.dataset.pomo) {
      const k = el.dataset.pomo;
      RH.store.update(function (s) { s.prefs.pomo[k] = el.type === 'checkbox' ? el.checked : U.clamp(Number(el.value) || 1, 1, 180); }, { silent: true });
      if (T.mode === 'pomo' && !T.running && k !== 'auto' && k !== 'sound') setTotal(phaseLen(T.phase));
      paint();
      return true;
    }
    return false;
  });
})(window.RH = window.RH || {});
</script>
<script>
/* Flashcard terminal: decks, importing from Quizlet / Gizmo / Anki / CSV, the Leitner system and study modes. */
(function (RH) {
  'use strict';
  const U = RH.util, M = RH.model, C = RH.c, esc = U.esc, $ = RH.$;
  const st = () => RH.store.state;
  const store = RH.store;

  // Leitner boxes: a card moved into box k comes back after BOX_DAYS[k] days. A miss sends it to box 1.
  const BOX_DAYS = [0, 1, 2, 4, 8, 16];
  const BOX_NAME = ['', 'Box 1 · daily', 'Box 2 · every 2 days', 'Box 3 · every 4 days', 'Box 4 · every 8 days', 'Box 5 · every 16 days'];
  const isDue = (c, today) => !c.due || c.due <= today;
  const decks = () => Object.keys(st().decks).map((id) => st().decks[id]).sort((a, b) => (a.subject || 'z').localeCompare(b.subject || 'z') || a.name.localeCompare(b.name));

  const K = RH.cards = {};
  K.dueCount = function (deck) { const t = U.today(); return deck.cards.filter((c) => isDue(c, t)).length; };
  K.totalDue = () => decks().reduce((a, d) => a + K.dueCount(d), 0);
  K.forTopic = (gid) => decks().filter((d) => d.topic === gid);
  K.forSubject = (sid) => decks().filter((d) => d.subject === sid && !d.topic);

  const newCard = (f, b) => ({ id: U.uid(), f: String(f).trim(), b: String(b).trim(), box: 1, due: '', n: 0, r: 0, w: 0 });
  function newDeck(name, subject, topic, cards, source) {
    const id = 'd' + U.uid();
    store.update(function (s) {
      s.decks[id] = { id: id, name: name || 'New deck', subject: subject || '', topic: topic || '', source: source || null, created: U.today(), cards: (cards || []).map((c) => newCard(c[0], c[1])) };
    }, { decks: [id], silent: true });
    return id;
  }
  K.newDeck = newDeck;

  // ---------- Import parsing ----------
  function splitCSVLine(line, sep) {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
      else if (ch === '"' && cur === '') q = true;
      else if (ch === sep) { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur);
    return out;
  }
  K.detectSep = function (text) {
    const lines = text.split(/\r?\n/).filter((l) => l.trim()).slice(0, 30);
    if (!lines.length) return '\t';
    const share = (needle) => lines.filter((l) => l.indexOf(needle) !== -1).length / lines.length;
    if (share('\t') > 0.6) return '\t';
    if (share(' - ') > 0.6) return ' - ';
    if (share(',') > 0.6) return ',';
    if (share(':') > 0.6) return ':';
    if (share(';') > 0.6) return ';';
    return '\t';
  };
  K.parse = function (text, termSep, cardSep) {
    text = String(text || '').replace(/\r\n/g, '\n').replace(/^﻿/, '');
    if (termSep === 'auto') termSep = K.detectSep(text);
    const rows = cardSep === 'blank' ? text.split(/\n\s*\n/) : cardSep === 'semi' ? text.split(';') : text.split('\n');
    const cards = [];
    rows.forEach(function (row) {
      if (!row.trim() || /^#/.test(row.trim())) return;
      let f, b;
      if (termSep === ',' || termSep === ';') {
        const parts = splitCSVLine(row, termSep);
        f = parts[0]; b = parts.slice(1).join(termSep === ',' ? ', ' : '; ');
      } else {
        const at = row.indexOf(termSep);
        if (at === -1) return;
        f = row.slice(0, at); b = row.slice(at + termSep.length);
      }
      f = (f || '').trim(); b = (b || '').trim();
      if (f && b) cards.push([f, b]);
    });
    return cards;
  };
  const sourceKind = (url) => /quizlet\.com/i.test(url) ? 'Quizlet' : /gizmo\.ai/i.test(url) ? 'Gizmo' : /ankiweb/i.test(url) ? 'AnkiWeb' : 'Link';

  function subjectOptions(sel) {
    return '<option value="">No subject</option>' + M.subjects.map((s) => '<option value="' + s.id + '"' + (sel === s.id ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('');
  }
  function topicOptions(sid, sel) {
    if (!sid) return '<option value="">Choose a subject first</option>';
    const s = M.subject[sid];
    return '<option value="">Whole subject</option>' + M.compsFor(st(), s, true).map((c) => '<optgroup label="' + esc(c.name) + '">' + c.topics.map((t) => '<option value="' + t.gid + '"' + (sel === t.gid ? ' selected' : '') + '>' + esc(t.name) + '</option>').join('') + '</optgroup>').join('');
  }
  K.topicOptions = topicOptions;

  // ---------- Import dialog ----------
  K.openImport = function (opts) {
    opts = opts || {};
    const t = opts.topic && M.topic[opts.topic];
    const sid = opts.subject || (t ? t.subject.id : '');
    const deckList = decks();
    const body = '<form id="importForm" class="import">' +
      '<details class="how" open><summary>How to get your cards out of Quizlet, Gizmo or Anki</summary><ul class="tips">' +
      '<li><b>Quizlet:</b> open the set on quizlet.com, choose <i>⋯ → Export</i>, keep <i>Tab</i> between term and definition and <i>New line</i> between rows, then <i>Copy text</i> and paste below.</li>' +
      '<li><b>Gizmo:</b> if your deck came from Quizlet or Anki, export from there. Otherwise copy the cards out of Gizmo, one per line, with a tab, comma or " - " between the question and the answer.</li>' +
      '<li><b>Anki:</b> <i>File → Export → Notes in Plain Text</i>, then choose the file below.</li>' +
      '<li><b>Spreadsheet:</b> save two columns (front, back) as CSV.</li></ul></details>' +
      '<div class="field"><label for="im-text">Paste cards</label><textarea id="im-text" name="text" rows="7" placeholder="Term&#9;Definition&#10;Opportunity cost&#9;The value of the next best alternative forgone"></textarea></div>' +
      '<div class="row-actions"><label class="btn-ghost file-btn">' + C.icon('upload') + 'Or choose a file (.txt, .csv, .tsv)<input type="file" id="im-file" accept=".txt,.csv,.tsv,text/plain,text/csv"></label></div>' +
      '<div class="two"><div class="field"><label for="im-term">Between term and definition</label><select id="im-term" name="term"><option value="auto">Detect automatically</option><option value="\t">Tab</option><option value=",">Comma (CSV)</option><option value=" - ">Dash ( - )</option><option value=":">Colon</option><option value=";">Semicolon</option></select></div>' +
      '<div class="field"><label for="im-card">Between cards</label><select id="im-card" name="card"><option value="line">New line</option><option value="semi">Semicolon</option><option value="blank">Blank line</option></select></div></div>' +
      '<div class="im-preview" id="im-preview"><p class="muted small">Paste or choose a file to see a preview.</p></div>' +
      '<fieldset class="field"><legend>Add to</legend><div class="two"><div class="field"><label for="im-deck">Deck</label><select id="im-deck" name="deck"><option value="">A new deck</option>' + deckList.map((d) => '<option value="' + d.id + '"' + (opts.deck === d.id ? ' selected' : '') + '>' + esc(d.name) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label for="im-name">New deck name</label><input id="im-name" name="name" value="' + esc(t ? t.name : '') + '" placeholder="e.g. Physics definitions"></div></div>' +
      '<div class="two"><div class="field"><label for="im-subj">Subject</label><select id="im-subj" name="subject" data-cards="subj">' + subjectOptions(sid) + '</select></div>' +
      '<div class="field"><label for="im-topic">Topic</label><select id="im-topic" name="topic">' + topicOptions(sid, opts.topic || '') + '</select></div></div>' +
      '<div class="field"><label for="im-url">Link to the original set (optional)</label><input id="im-url" name="url" type="url" placeholder="https://quizlet.com/… or https://gizmo.ai/…"></div></fieldset>' +
      '<div class="row-actions"><button type="submit" class="btn">' + C.icon('upload') + 'Import cards</button><button type="button" class="btn-ghost" data-action="modal-close">Cancel</button></div></form>';
    C.openModal('Import flashcards', body, { wide: true });
  };
  function importPreview() {
    const text = $('#im-text') ? $('#im-text').value : '';
    const box = $('#im-preview');
    if (!box) return;
    if (!text.trim()) { box.innerHTML = '<p class="muted small">Paste or choose a file to see a preview.</p>'; return; }
    const term = $('#im-term').value;
    const cards = K.parse(text, term, $('#im-card').value);
    const sepName = { '\t': 'tab', ',': 'comma', ' - ': 'dash', ':': 'colon', ';': 'semicolon' }[term === 'auto' ? K.detectSep(text) : term];
    box.innerHTML = cards.length
      ? '<p class="small"><b>' + U.plural(cards.length, 'card') + '</b> found' + (term === 'auto' ? ' (split on ' + sepName + ')' : '') + '. First few:</p><table class="tbl small"><tbody>' + cards.slice(0, 4).map((c) => '<tr><td>' + esc(c[0]) + '</td><td>' + esc(c[1]) + '</td></tr>').join('') + '</tbody></table>'
      : '<p class="small danger">No cards found. Try a different separator.</p>';
  }

  RH.onSubmit.importForm = function (f) {
    const d = new FormData(f);
    const cards = K.parse(String(d.get('text') || ''), String(d.get('term')), String(d.get('card')));
    if (!cards.length) { C.toast('No cards found to import. Check the separators.'); return; }
    const url = String(d.get('url') || '').trim();
    let id = String(d.get('deck') || '');
    if (id && st().decks[id]) {
      store.update(function (s) { cards.forEach((c) => s.decks[id].cards.push(newCard(c[0], c[1]))); if (url) s.decks[id].source = { kind: sourceKind(url), url: url }; }, { decks: [id], silent: true });
    } else {
      id = newDeck(String(d.get('name') || '').trim() || 'Imported deck', String(d.get('subject') || ''), String(d.get('topic') || ''), cards, url ? { kind: sourceKind(url), url: url } : null);
    }
    C.closeModal();
    C.toast('Imported ' + U.plural(cards.length, 'card'));
    location.hash = 'deck-' + id;
    RH.render();
  };
  RH.onInput.push(function (el) { if (el.id === 'im-text') { importPreview(); return true; } return false; });
  RH.onChange.push(function (el) {
    if (el.id === 'im-term' || el.id === 'im-card') { importPreview(); return true; }
    if (el.id === 'im-file' && el.files && el.files[0]) {
      const r = new FileReader();
      r.onload = () => { $('#im-text').value = String(r.result); importPreview(); };
      r.readAsText(el.files[0]);
      return true;
    }
    if (el.dataset.cards === 'subj') { const tsel = el.form && el.form.querySelector('[name="topic"]'); if (tsel) tsel.innerHTML = topicOptions(el.value, ''); return true; }
    if (el.dataset.deckField) {
      const id = el.dataset.deck, k = el.dataset.deckField;
      store.update(function (s) {
        const dk = s.decks[id]; if (!dk) return;
        if (k === 'url') dk.source = el.value.trim() ? { kind: sourceKind(el.value.trim()), url: el.value.trim() } : null;
        else dk[k] = el.value;
        if (k === 'subject') dk.topic = '';
      }, { decks: [id], silent: k !== 'subject' });
      return true;
    }
    return false;
  });

  // ---------- Pages ----------
  function boxBar(deck) {
    const n = [0, 0, 0, 0, 0, 0];
    deck.cards.forEach((c) => { n[c.box || 1]++; });
    const total = deck.cards.length || 1;
    return '<div class="boxbar" role="img" aria-label="Cards per Leitner box">' + [1, 2, 3, 4, 5].map((b) => n[b] ? '<span class="bx b' + b + '" style="flex-grow:' + n[b] + '" title="' + BOX_NAME[b] + ': ' + n[b] + '"></span>' : '').join('') + (deck.cards.length ? '' : '<span class="bx b0" style="flex-grow:' + total + '"></span>') + '</div>';
  }
  function deckRow(d) {
    const due = K.dueCount(d);
    const t = d.topic && M.topic[d.topic];
    return '<li class="deck-row"' + (d.subject ? ' data-subj="' + d.subject + '"' : '') + '>' + (d.subject ? C.stag(d.subject) : '<span class="stag stag-none">ALL</span>') +
      '<a class="deck-name" href="#deck-' + d.id + '"><b>' + esc(d.name) + '</b><span class="muted small">' + U.plural(d.cards.length, 'card') + (t ? ' · ' + esc(t.name) : '') + (d.source ? ' · from ' + esc(d.source.kind) : '') + '</span>' + boxBar(d) + '</a>' +
      '<span class="due' + (due ? ' on' : '') + '"><b class="mono">' + due + '</b> due</span>' +
      '<button type="button" class="btn btn-sm" data-action="study" data-deck="' + d.id + '" data-mode="leitner"' + (due ? '' : ' disabled') + '>Review</button></li>';
  }
  K.deckRow = deckRow;

  RH.views.cards = function () {
    const s = st();
    const all = decks();
    const cards = all.reduce((a, d) => a + d.cards.length, 0);
    const due = K.totalDue();
    const mastered = all.reduce((a, d) => a + d.cards.filter((c) => c.box === 5).length, 0);
    let html = C.head('Practise', 'Flashcard terminal', 'Leitner-system flashcards. Cards you know move up a box and come back less often; a miss sends a card back to box 1.',
      '<button type="button" class="btn" data-action="cards-import">' + C.icon('upload') + 'Import cards</button><button type="button" class="btn-ghost" data-action="deck-new">' + C.icon('plus') + 'New deck</button>');
    html += '<div class="stat-strip"><div class="stat-tile"><span class="stat-n mono">' + due + '</span><span class="muted small">cards due today</span>' + (due ? '<button type="button" class="btn btn-sm" data-action="study" data-mode="leitner" data-deck="all">Review all due</button>' : '') + '</div>' +
      '<div class="stat-tile"><span class="stat-n mono">' + cards + '</span><span class="muted small">cards in ' + U.plural(all.length, 'deck') + '</span></div>' +
      '<div class="stat-tile"><span class="stat-n mono">' + mastered + '</span><span class="muted small">in box 5 (mastered)</span></div>' +
      '<div class="stat-tile"><span class="stat-n mono">' + (s.prefs.cardsDaily || 50) + '</span><span class="muted small">max cards per review</span></div></div>';
    if (all.length) {
      html += '<section class="panel"><div class="sec-head"><h2>Your decks</h2></div><ul class="deck-list">' + all.map(deckRow).join('') + '</ul></section>';
    } else {
      html += C.empty('No decks yet.', 'Import a Quizlet or Gizmo set, add a starter deck below, or create a deck from any topic page.', '<button type="button" class="btn" data-action="cards-import">' + C.icon('upload') + 'Import cards</button>');
    }
    html += '<section class="panel"><div class="sec-head"><h2>Starter decks</h2><span class="muted small">Copy one into your decks, then edit it however you like</span></div><div class="starter-grid">' +
      RH.STARTER_DECKS.map(function (d) {
        const have = all.some((x) => x.starter === d.id);
        return '<div class="starter" data-subj="' + d.subject + '">' + C.stag(d.subject) + '<b>' + esc(d.name) + '</b><span class="muted small">' + d.cards.length + ' cards. ' + esc(d.note) + '</span>' +
          (have ? '<span class="small muted">Added</span>' : '<button type="button" class="btn-ghost btn-sm" data-action="starter-add" data-id="' + d.id + '">' + C.icon('plus') + 'Add deck</button>') + '</div>';
      }).join('') + '</div></section>';
    html += '<section class="panel"><h2>How the Leitner system works</h2><ol class="leitner-explain">' + [1, 2, 3, 4, 5].map((b) => '<li><span class="bx b' + b + '"></span><b>Box ' + b + '</b> <span class="muted">reviewed every ' + U.plural(BOX_DAYS[b], 'day') + '</span></li>').join('') + '</ol>' +
      '<p class="help">Get a card right and it moves up one box. Get it wrong and it goes back to box 1. Review the cards that are due every day, a little at a time, and use a Pomodoro block for longer sessions.</p></section>';
    return html;
  };

  RH.views.deck = function (id) {
    const d = st().decks[id];
    if (!d) return C.head('', 'Deck not found', 'It may have been deleted.') + '<a class="btn" href="#cards">Back to flashcards</a>';
    const due = K.dueCount(d);
    const n = [0, 0, 0, 0, 0, 0];
    d.cards.forEach((c) => { n[c.box || 1]++; });
    const t = d.topic && M.topic[d.topic];
    let html = C.crumbs([['Flashcards', 'cards'], [d.name]]);
    html += C.head(d.subject ? C.stag(d.subject) + ' ' + esc(M.subject[d.subject].name) : 'Deck', esc(d.name), U.plural(d.cards.length, 'card') + ' · ' + due + ' due today' + (t ? ' · <a href="#t-' + t.gid + '">' + esc(t.name) + '</a>' : ''),
      d.source ? '<a class="btn-ghost" href="' + esc(d.source.url) + '" target="_blank" rel="noopener">' + C.icon('ext') + 'Open in ' + esc(d.source.kind) + '</a>' : '');
    const modes = [['leitner', 'Review due cards', 'Leitner: flip, then say if you knew it', 'cards', due], ['all', 'Flip through all', 'Browse every card, no box changes', 'swap', d.cards.length], ['type', 'Type the answer', 'Recall it exactly; it is checked for you', 'pen', null], ['mcq', 'Multiple choice', 'Pick the right answer from four', 'list', null], ['match', 'Match game', 'Pair terms with definitions against the clock', 'grid', null]];
    html += '<div class="mode-grid">' + modes.map((m) => {
      const off = !d.cards.length || (m[0] === 'leitner' && !due) || (m[0] === 'mcq' && d.cards.length < 4) || (m[0] === 'match' && d.cards.length < 3);
      return '<button type="button" class="mode" data-action="study" data-deck="' + d.id + '" data-mode="' + m[0] + '"' + (off ? ' disabled' : '') + '>' + C.icon(m[3]) + '<b>' + m[1] + (m[4] != null ? ' <span class="mono muted">' + m[4] + '</span>' : '') + '</b><span class="muted small">' + m[2] + '</span></button>';
    }).join('') + '</div>';
    html += '<label class="toggle"><input type="checkbox" data-action="deck-reverse" data-id="' + d.id + '"' + (d.reverse ? ' checked' : '') + '><span class="tg-ui" aria-hidden="true"></span><span class="tg-text"><b>Show the definition first</b><span class="help">Answer with the term instead.</span></span></label>';
    html += '<section class="panel"><h2>Leitner boxes</h2><div class="boxes">' + [1, 2, 3, 4, 5].map((b) => '<div class="box-col"><span class="bx b' + b + '"></span><b class="mono">' + n[b] + '</b><span class="muted small">Box ' + b + ' · ' + BOX_DAYS[b] + 'd</span></div>').join('') + '</div></section>';

    html += '<section class="panel"><div class="sec-head"><h2>Cards</h2><div class="row-actions"><button type="button" class="btn-ghost btn-sm" data-action="cards-import" data-deck="' + d.id + '">' + C.icon('upload') + 'Import more</button><button type="button" class="btn-ghost btn-sm" data-action="deck-export" data-id="' + d.id + '">' + C.icon('download') + 'Export CSV</button></div></div>' +
      '<form id="cardForm" class="card-add" data-deck="' + d.id + '"><input name="f" required placeholder="Front (term or question)" aria-label="Front"><input name="b" required placeholder="Back (definition or answer)" aria-label="Back"><button type="submit" class="btn">' + C.icon('plus') + 'Add</button></form>' +
      (d.cards.length ? '<div class="table-wrap"><table class="tbl cards-tbl"><thead><tr><th>Front</th><th>Back</th><th class="num">Box</th><th class="num">Due</th><th></th></tr></thead><tbody>' + d.cards.map((c) =>
        '<tr><td><textarea class="cell" rows="1" data-card="' + c.id + '" data-deck="' + d.id + '" data-side="f" aria-label="Front">' + esc(c.f) + '</textarea></td><td><textarea class="cell" rows="1" data-card="' + c.id + '" data-deck="' + d.id + '" data-side="b" aria-label="Back">' + esc(c.b) + '</textarea></td>' +
        '<td class="num mono">' + (c.box || 1) + '</td><td class="num mono small">' + (isDue(c, U.today()) ? 'now' : esc(U.fmtShort(c.due))) + '</td>' +
        '<td><button type="button" class="btn-icon" data-action="card-del" data-deck="' + d.id + '" data-id="' + c.id + '" aria-label="Delete card">' + C.icon('trash') + '</button></td></tr>').join('') + '</tbody></table></div>' : '<p class="muted">No cards yet. Add one above or import a set.</p>') + '</section>';

    html += '<section class="panel"><h2>Deck settings</h2><div class="three">' +
      '<div class="field"><label for="dk-name">Name</label><input id="dk-name" data-deck-field="name" data-deck="' + d.id + '" value="' + esc(d.name) + '"></div>' +
      '<div class="field"><label for="dk-subj">Subject</label><select id="dk-subj" data-deck-field="subject" data-deck="' + d.id + '">' + subjectOptions(d.subject) + '</select></div>' +
      '<div class="field"><label for="dk-topic">Topic</label><select id="dk-topic" data-deck-field="topic" data-deck="' + d.id + '">' + topicOptions(d.subject, d.topic) + '</select></div></div>' +
      '<div class="field"><label for="dk-url">Linked Quizlet / Gizmo set</label><input id="dk-url" type="url" data-deck-field="url" data-deck="' + d.id + '" value="' + esc(d.source ? d.source.url : '') + '" placeholder="https://quizlet.com/…"></div>' +
      '<div class="row-actions"><button type="button" class="btn-ghost" data-action="deck-resetboxes" data-id="' + d.id + '">Reset all cards to box 1</button><button type="button" class="btn-ghost danger" data-action="deck-del" data-id="' + d.id + '">' + C.icon('trash') + 'Delete deck</button></div></section>';
    return html;
  };

  // Topic-page panel: decks for this topic and its subject.
  K.topicPanel = function (t) {
    const mine = K.forTopic(t.gid), subj = K.forSubject(t.subject.id);
    let html = '<div class="row-actions"><button type="button" class="btn" data-action="deck-new" data-topic="' + t.gid + '">' + C.icon('plus') + 'New deck for this topic</button><button type="button" class="btn-ghost" data-action="cards-import" data-topic="' + t.gid + '">' + C.icon('upload') + 'Import from Quizlet / Gizmo</button></div>';
    html += mine.length ? '<ul class="deck-list">' + mine.map(deckRow).join('') + '</ul>' : '<p class="muted">No decks linked to this topic yet.</p>';
    if (subj.length) html += '<h3 class="label">' + esc(t.subject.name) + ' decks</h3><ul class="deck-list">' + subj.map(deckRow).join('') + '</ul>';
    const starter = RH.STARTER_DECKS.filter((d) => d.subject === t.subject.id && !decks().some((x) => x.starter === d.id));
    if (starter.length) html += '<p class="help">Starter deck available: ' + starter.map((d) => '<button type="button" class="btn-link" data-action="starter-add" data-id="' + d.id + '">' + esc(d.name) + '</button>').join(', ') + '</p>';
    return html;
  };

  // ---------- Study session ----------
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  function findCard(ref) { const d = st().decks[ref[0]]; return d && d.cards.find((c) => c.id === ref[1]); }

  K.start = function (deckId, mode) {
    const today = U.today();
    const list = deckId === 'all' ? decks() : [st().decks[deckId]].filter(Boolean);
    let refs = [];
    list.forEach((d) => d.cards.forEach((c) => { if (mode !== 'leitner' || isDue(c, today)) refs.push([d.id, c.id]); }));
    refs = shuffle(refs);
    if (mode === 'leitner') refs = refs.slice(0, st().prefs.cardsDaily || 50);
    if (mode === 'match') refs = refs.slice(0, 6);
    if (!refs.length) { C.toast(mode === 'leitner' ? 'Nothing due. Come back tomorrow, or flip through all cards.' : 'This deck has no cards yet.'); return; }
    const reverse = deckId !== 'all' && !!(st().decks[deckId] || {}).reverse;
    RH.ui.study = { deckId: deckId, mode: mode, queue: refs, i: 0, flipped: false, right: 0, wrong: 0, retried: {}, reverse: reverse, answer: null, picked: null, started: Date.now(), total: refs.length };
    if (mode === 'mcq') makeOptions();
    if (mode === 'match') makeMatch();
    location.hash = 'study';
    RH.render();
  };

  function grade(ok) {
    const S = RH.ui.study, ref = S.queue[S.i];
    const today = U.today();
    store.update(function (s) {
      const c = s.decks[ref[0]] && s.decks[ref[0]].cards.find((x) => x.id === ref[1]);
      if (!c) return;
      c.n = (c.n || 0) + 1;
      // A card missed earlier in this session stays in box 1 even when the retry is right.
      if (ok) { c.r = (c.r || 0) + 1; c.box = S.retried[ref[1]] ? 1 : Math.min(5, (c.box || 1) + 1); }
      else { c.w = (c.w || 0) + 1; c.box = 1; }
      c.due = U.addDays(today, BOX_DAYS[c.box]);
      s.activity[today] = (s.activity[today] || 0) + (S.i === 0 ? 1 : 0);
    }, { decks: [ref[0]], silent: true });
    if (ok) S.right++; else { S.wrong++; if (!S.retried[ref[1]]) { S.retried[ref[1]] = 1; S.queue.push(ref); } }
    next();
  }
  function next() {
    const S = RH.ui.study;
    S.i++; S.flipped = false; S.answer = null; S.picked = null;
    if (S.mode === 'mcq' && S.i < S.queue.length) makeOptions();
    RH.render({ keepScroll: true });
  }
  function makeOptions() {
    const S = RH.ui.study, card = findCard(S.queue[S.i]);
    if (!card) return;
    const pool = [];
    (S.deckId === 'all' ? decks() : [st().decks[S.deckId]]).forEach((d) => d.cards.forEach((c) => { if (c.id !== card.id) pool.push(c); }));
    const side = S.reverse ? 'f' : 'b';
    const wrong = shuffle(pool.map((c) => c[side]).filter((v, i, a) => v !== card[side] && a.indexOf(v) === i)).slice(0, 3);
    S.options = shuffle([card[side]].concat(wrong));
  }
  function makeMatch() {
    const S = RH.ui.study;
    const tiles = [];
    S.queue.forEach((ref, i) => { const c = findCard(ref); if (c) { tiles.push({ k: i, side: 'f', text: c.f }); tiles.push({ k: i, side: 'b', text: c.b }); } });
    S.tiles = shuffle(tiles); S.sel = null; S.done = {}; S.misses = 0;
  }
  const norm = (s) => String(s).toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  function closeEnough(a, b) {
    a = norm(a); b = norm(b);
    if (a === b) return true;
    if (!a || !b) return false;
    const m = a.length, n = b.length, dp = [];
    for (let i = 0; i <= m; i++) { dp[i] = [i]; for (let j = 1; j <= n; j++) dp[i][j] = i ? 0 : j; }
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return dp[m][n] <= Math.max(1, Math.floor(Math.max(m, n) * 0.15));
  }

  RH.views.study = function () {
    const S = RH.ui.study;
    if (!S) return C.empty('No study session running.', '', '<a class="btn" href="#cards">Go to flashcards</a>');
    const deckName = S.deckId === 'all' ? 'All due cards' : (st().decks[S.deckId] || {}).name || 'Deck';
    const modeName = { leitner: 'Leitner review', all: 'Flip through', type: 'Type the answer', mcq: 'Multiple choice', match: 'Match game' }[S.mode];
    const done = S.mode === 'match' ? Object.keys(S.done).length === S.queue.length : S.i >= S.queue.length;
    let html = '<div class="study">' +
      '<div class="study-bar"><a class="btn-ghost btn-sm" href="' + (S.deckId === 'all' ? '#cards' : '#deck-' + S.deckId) + '">' + C.icon('left') + 'End session</a><span class="study-title"><b>' + esc(deckName) + '</b><span class="muted small">' + modeName + '</span></span>' +
      '<button type="button" class="btn-ghost btn-sm" data-action="study-pomo">' + C.icon('timer') + (RH.timer.running ? RH.timer.fmt(RH.timer.left) : 'Pomodoro') + '</button></div>';
    if (S.mode !== 'match') {
      const pct = Math.min(100, Math.round(100 * Math.min(S.i, S.queue.length) / S.queue.length));
      html += '<div class="meter study-meter"><span style="width:' + pct + '%"></span></div><p class="muted small center mono">' + Math.min(S.i + 1, S.queue.length) + ' / ' + S.queue.length + ' · ' + S.right + ' right · ' + S.wrong + ' wrong</p>';
    }
    if (done) {
      const secs = Math.round((Date.now() - S.started) / 1000);
      html += '<section class="sheet study-done"><h2>Session complete</h2>' +
        (S.mode === 'match' ? '<p class="big mono">' + RH.timer.fmt(secs) + '</p><p class="muted">' + U.plural(S.misses, 'wrong match', 'wrong matches') + '</p>'
          : '<p class="big mono">' + S.right + ' / ' + (S.right + S.wrong) + '</p><p class="muted">correct in ' + RH.timer.fmt(secs) + (S.mode === 'leitner' || S.mode === 'type' || S.mode === 'mcq' ? '. Cards you got right moved up a box.' : '.') + '</p>') +
        '<div class="row-actions center"><button type="button" class="btn" data-action="study" data-deck="' + S.deckId + '" data-mode="' + S.mode + '">Go again</button><a class="btn-ghost" href="' + (S.deckId === 'all' ? '#cards' : '#deck-' + S.deckId) + '">Back to deck</a></div></section></div>';
      return html;
    }
    if (S.mode === 'match') {
      html += '<p class="center small muted">Pick a term, then its definition. Timer: <span class="mono" id="match-clock">0:00</span></p><div class="match-grid">' + S.tiles.map((t, i) =>
        S.done[t.k] ? '<span class="mtile gone"></span>' : '<button type="button" class="mtile' + (S.sel === i ? ' sel' : '') + (t.side === 'f' ? ' term' : '') + '" data-action="match-pick" data-i="' + i + '">' + esc(t.text) + '</button>').join('') + '</div></div>';
      return html;
    }
    const card = findCard(S.queue[S.i]);
    if (!card) { setTimeout(next, 0); return html + '</div>'; }
    const front = S.reverse ? card.b : card.f, back = S.reverse ? card.f : card.b;
    if (S.mode === 'leitner' || S.mode === 'all') {
      html += '<button type="button" class="flash' + (S.flipped ? ' flipped' : '') + '" data-action="study-flip" aria-live="polite"><span class="fl-side">' + (S.flipped ? 'Answer' : 'Question') + ' · box ' + (card.box || 1) + '</span><span class="fl-text">' + esc(S.flipped ? back : front) + '</span>' + (S.flipped ? '<span class="fl-q muted small">' + esc(front) + '</span>' : '<span class="fl-hint muted small">Click or press Space to flip</span>') + '</button>';
      html += S.flipped
        ? (S.mode === 'leitner'
          ? '<div class="grade"><button type="button" class="btn-grade bad" data-action="study-grade" data-v="0"><b>Didn\'t know</b><span>back to box 1 · key 1</span></button><button type="button" class="btn-grade good" data-action="study-grade" data-v="1"><b>Knew it</b><span>' + (S.retried[card.id] ? 'stays in box 1 for tomorrow' : 'up to box ' + Math.min(5, (card.box || 1) + 1)) + ' · key 2</span></button></div>'
          : '<div class="grade"><button type="button" class="btn-grade bad" data-action="study-again"><b>Still learning</b><span>see it again · key 1</span></button><button type="button" class="btn-grade good" data-action="study-next"><b>Got it</b><span>next card · key 2</span></button></div>')
        : '<div class="grade"><button type="button" class="btn btn-lg" data-action="study-flip">Show answer</button></div>';
    } else if (S.mode === 'type') {
      html += '<div class="flash static"><span class="fl-side">Question · box ' + (card.box || 1) + '</span><span class="fl-text">' + esc(front) + '</span></div>';
      if (S.answer == null) {
        html += '<form id="typeForm" class="type-form"><input id="type-in" autocomplete="off" placeholder="Type your answer and press Enter" aria-label="Your answer"><button type="submit" class="btn">Check</button><button type="button" class="btn-ghost" data-action="type-skip">I don\'t know</button></form>';
        setTimeout(() => { const i = $('#type-in'); if (i) i.focus(); }, 0);
      } else {
        const ok = S.answer.ok;
        html += '<div class="verdict ' + (ok ? 'good' : 'bad') + '"><b>' + (ok ? 'Correct' : 'Not quite') + '</b>' + (S.answer.text ? '<p>You wrote: ' + esc(S.answer.text) + '</p>' : '') + '<p>Answer: <b>' + esc(back) + '</b></p></div>' +
          '<div class="grade">' + (ok ? '<button type="button" class="btn btn-lg" data-action="study-grade" data-v="1">Next · Enter</button>' : '<button type="button" class="btn-grade good" data-action="study-grade" data-v="1"><b>I was right</b><span>count it as correct</span></button><button type="button" class="btn-grade bad" data-action="study-grade" data-v="0"><b>Next</b><span>back to box 1 · Enter</span></button>') + '</div>';
      }
    } else if (S.mode === 'mcq') {
      html += '<div class="flash static"><span class="fl-side">Question</span><span class="fl-text">' + esc(front) + '</span></div><div class="mcq">' + S.options.map((o, i) => {
        let cls = '';
        if (S.picked != null) cls = o === back ? ' right' : (i === S.picked ? ' wrong' : '');
        return '<button type="button" class="mcq-o' + cls + '" data-action="mcq-pick" data-i="' + i + '"' + (S.picked != null ? ' disabled' : '') + '><span class="mono">' + (i + 1) + '</span>' + esc(o) + '</button>';
      }).join('') + '</div>' + (S.picked != null ? '<div class="grade"><button type="button" class="btn btn-lg" data-action="mcq-next">Next · Enter</button></div>' : '');
    }
    html += '<p class="muted small center keys">Keys: Space flip · 1 / ← didn\'t know · 2 / → knew it</p></div>';
    return html;
  };

  // ---------- Actions ----------
  RH.actions['cards-import'] = (el) => K.openImport({ topic: el.dataset.topic, deck: el.dataset.deck });
  RH.actions['deck-new'] = function (el) {
    const t = el.dataset.topic && M.topic[el.dataset.topic];
    const id = newDeck(t ? t.name : 'New deck', t ? t.subject.id : '', t ? t.gid : '', []);
    location.hash = 'deck-' + id;
  };
  RH.actions['starter-add'] = function (el) {
    const d = RH.STARTER_DECKS.find((x) => x.id === el.dataset.id);
    const id = newDeck(d.name, d.subject, '', d.cards);
    store.update(function (s) { s.decks[id].starter = d.id; }, { decks: [id] });
    C.toast('Added "' + d.name + '" (' + d.cards.length + ' cards)');
  };
  RH.actions['deck-del'] = function (el) {
    const d = st().decks[el.dataset.id];
    C.confirm('Delete "' + d.name + '"?', 'All ' + d.cards.length + ' cards and their progress will be deleted.', 'Delete deck', function () {
      store.update(function (s) { delete s.decks[d.id]; }, { decks: [d.id], silent: true });
      location.hash = 'cards';
      RH.render();
    });
  };
  RH.actions['deck-resetboxes'] = function (el) {
    store.update(function (s) { s.decks[el.dataset.id].cards.forEach((c) => { c.box = 1; c.due = ''; }); }, { decks: [el.dataset.id] });
    C.toast('All cards are back in box 1');
  };
  RH.actions['deck-reverse'] = function (el) { store.update(function (s) { s.decks[el.dataset.id].reverse = el.checked; }, { decks: [el.dataset.id], silent: true }); };
  RH.actions['deck-export'] = function (el) {
    const d = st().decks[el.dataset.id];
    const q = (t) => '"' + String(t).replace(/"/g, '""') + '"';
    C.saveFile(d.name.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').toLowerCase() + '.csv', d.cards.map((c) => q(c.f) + ',' + q(c.b)).join('\r\n'), 'text/csv');
  };
  RH.actions['card-del'] = function (el) {
    store.update(function (s) { const d = s.decks[el.dataset.deck]; d.cards = d.cards.filter((c) => c.id !== el.dataset.id); }, { decks: [el.dataset.deck] });
  };
  RH.actions.study = (el) => K.start(el.dataset.deck, el.dataset.mode);
  RH.actions['study-flip'] = () => { const S = RH.ui.study; if (S && !S.flipped) { S.flipped = true; RH.render({ keepScroll: true }); } };
  RH.actions['study-grade'] = (el) => grade(el.dataset.v === '1');
  RH.actions['study-next'] = () => { RH.ui.study.right++; next(); };
  RH.actions['study-again'] = () => { const S = RH.ui.study; S.wrong++; S.queue.push(S.queue[S.i]); next(); };
  RH.actions['study-pomo'] = () => { C.primeAudio(); if (RH.timer.running) RH.timer.pause(); else { RH.timer.setMode('pomo'); RH.timer.start(); } RH.render({ keepScroll: true }); };
  RH.actions['type-skip'] = () => { RH.ui.study.answer = { ok: false, text: '' }; RH.render({ keepScroll: true }); };
  RH.actions['mcq-pick'] = function (el) {
    const S = RH.ui.study, card = findCard(S.queue[S.i]);
    S.picked = Number(el.dataset.i);
    S.mcqOk = S.options[S.picked] === (S.reverse ? card.f : card.b);
    RH.render({ keepScroll: true });
  };
  RH.actions['mcq-next'] = () => grade(RH.ui.study.mcqOk);
  RH.actions['match-pick'] = function (el) {
    const S = RH.ui.study, i = Number(el.dataset.i);
    if (S.sel == null) { S.sel = i; RH.render({ keepScroll: true }); return; }
    const a = S.tiles[S.sel], b = S.tiles[i];
    if (S.sel === i) { S.sel = null; }
    else if (a.k === b.k && a.side !== b.side) { S.done[a.k] = 1; S.sel = null; }
    else { S.misses++; S.sel = i; el.classList.add('miss'); }
    RH.render({ keepScroll: true });
  };

  RH.onSubmit.typeForm = function () {
    const S = RH.ui.study, card = findCard(S.queue[S.i]);
    const text = $('#type-in').value;
    S.answer = { text: text, ok: closeEnough(text, S.reverse ? card.f : card.b) };
    RH.render({ keepScroll: true });
  };
  RH.onSubmit.cardForm = function (f) {
    const d = new FormData(f), id = f.dataset.deck;
    store.update(function (s) { s.decks[id].cards.unshift(newCard(d.get('f'), d.get('b'))); }, { decks: [id] });
    setTimeout(() => { const i = document.querySelector('#cardForm input'); if (i) i.focus(); }, 0);
  };
  let cellTimer = null;
  RH.onInput.push(function (el) {
    if (!el.dataset.card) return false;
    clearTimeout(cellTimer);
    const deck = el.dataset.deck, cid = el.dataset.card, side = el.dataset.side, val = el.value;
    cellTimer = setTimeout(() => store.update(function (s) { const c = s.decks[deck].cards.find((x) => x.id === cid); if (c) c[side] = val; }, { decks: [deck], silent: true }), 500);
    return true;
  });

  // Keyboard shortcuts in a study session.
  K.key = function (ev) {
    const S = RH.ui.study;
    if (location.hash !== '#study' || !S || C.modalOpen()) return false;
    const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    const k = ev.key;
    if (S.mode === 'leitner' || S.mode === 'all') {
      if ((k === ' ' || k === 'Enter') && !S.flipped) { ev.preventDefault(); RH.actions['study-flip'](); return true; }
      if (S.flipped && (k === '1' || k === 'ArrowLeft')) { ev.preventDefault(); S.mode === 'leitner' ? grade(false) : RH.actions['study-again'](); return true; }
      if (S.flipped && (k === '2' || k === 'ArrowRight')) { ev.preventDefault(); S.mode === 'leitner' ? grade(true) : RH.actions['study-next'](); return true; }
    }
    if (S.mode === 'mcq') {
      if (S.picked == null && /^[1-4]$/.test(k) && S.options[Number(k) - 1] != null) { RH.actions['mcq-pick']({ dataset: { i: String(Number(k) - 1) } }); return true; }
      if (S.picked != null && k === 'Enter') { ev.preventDefault(); grade(S.mcqOk); return true; }
    }
    if (S.mode === 'type' && S.answer && k === 'Enter' && !typing) { ev.preventDefault(); grade(S.answer.ok); return true; }
    return false;
  };

  // Match game clock.
  setInterval(function () {
    const el = $('#match-clock'), S = RH.ui.study;
    if (el && S) el.textContent = RH.timer.fmt((Date.now() - S.started) / 1000);
  }, 500);
})(window.RH = window.RH || {});

<script>
/* Exam portal: upload a past paper PDF, split it into questions, sit it against the clock, then mark it. */
(function (RH) {
  'use strict';
  const U = RH.util, M = RH.model, C = RH.c, esc = U.esc, $ = RH.$;
  const st = () => RH.store.state;
  const store = RH.store;

  const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  async function pdfjs() {
    await C.loadScript(PDFJS);
    // Loading the worker as a plain script lets pdf.js run in the page, so no separate worker file is needed.
    await C.loadScript(PDFJS_WORKER);
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    return window.pdfjsLib;
  }

  const P = RH.portal = {};
  const docs = {}; // paperId -> {qp, ms} pdf.js documents for this visit
  const pageCache = {}; // "paper|kind|page|width" -> canvas

  // ---------- Reading a PDF ----------
  async function readPdf(buffer) {
    const lib = await pdfjs();
    const doc = await lib.getDocument({ data: buffer }).promise;
    const pages = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p);
      const vp = page.getViewport({ scale: 1 });
      const tc = await page.getTextContent();
      const items = tc.items.filter((it) => it.str && it.str.trim()).map((it) => ({ s: it.str, x: it.transform[4], y: it.transform[5], h: Math.abs(it.transform[3]) || it.height || 10 }));
      items.sort((a, b) => b.y - a.y || a.x - b.x);
      const lines = [];
      items.forEach(function (it) {
        const line = lines.find((l) => Math.abs(l.y - it.y) < 2.5);
        if (line) { line.items.push(it); line.h = Math.max(line.h, it.h); }
        else lines.push({ y: it.y, h: it.h, items: [it] });
      });
      lines.forEach(function (l) {
        l.items.sort((a, b) => a.x - b.x);
        l.x = l.items[0].x;
        l.text = l.items.map((i) => i.s).join(' ').replace(/\s+/g, ' ').trim();
      });
      lines.sort((a, b) => b.y - a.y);
      pages.push({ w: vp.width, h: vp.height, lines: lines });
    }
    return { doc: doc, pages: pages };
  }

  const CODE = /\b(9PH0|9MA0|9FM0|9EC0)\s*\/?\s*(0[1-3]|3[A-D]|4[A-D])\b/i;
  const SUBJ = { '9PH0': 'physics', '9MA0': 'maths', '9FM0': 'further', '9EC0': 'economics' };
  function meta(pages) {
    const text = pages.slice(0, 2).map((p) => p.lines.map((l) => l.text).join('\n')).join('\n');
    const out = {};
    const code = CODE.exec(text.replace(/\s+/g, ' '));
    if (code) { out.code = code[1].toUpperCase() + '/' + code[2].toUpperCase(); out.subject = SUBJ[code[1].toUpperCase()]; }
    if (!out.subject) {
      if (/further\s+mathematics/i.test(text)) out.subject = 'further';
      else if (/mathematics/i.test(text)) out.subject = 'maths';
      else if (/physics/i.test(text)) out.subject = 'physics';
      else if (/economics/i.test(text)) out.subject = 'economics';
    }
    const t = /Time:?\s*(\d+)\s*hours?(?:\s*(?:and\s*)?(\d+)\s*minutes?)?/i.exec(text) || /Time:?\s*(\d+)\s*minutes/i.exec(text);
    if (t) out.dur = /minutes/i.test(t[0]) && !/hour/i.test(t[0]) ? Number(t[1]) : Number(t[1]) * 60 + Number(t[2] || 0);
    const mk = /total marks?\s+(?:for|on)\s+this\s+paper\s+is\s+(\d+)/i.exec(text);
    if (mk) out.marks = Number(mk[1]);
    const ser = /(January|February|May|June|October|November)\s+(20\d\d)/i.exec(text);
    if (ser) out.series = ser[1].charAt(0).toUpperCase() + ser[1].slice(1).toLowerCase() + ' ' + ser[2];
    return out;
  }

  const END = /\(?\s*Total\s+for\s+Question\s+(\d+)\s*(?:is|=|:)?\s*(\d+)\s*marks?\s*\)?/i;
  const isBlank = (pg) => pg.lines.some((l) => /^BLANK PAGE$/i.test(l.text)) || pg.lines.length < 3;
  const top = (pg) => pg.h * 0.94, bottom = (pg) => pg.h * 0.05;

  // Split into questions. Edexcel papers end each question with "(Total for Question N = M marks)".
  function detect(pages) {
    const ends = [];
    pages.forEach((pg, p) => pg.lines.forEach(function (l) {
      const m = END.exec(l.text);
      if (m) ends.push({ q: Number(m[1]), marks: Number(m[2]), p: p, y: l.y });
    }));
    if (ends.length >= 2) return byEndMarkers(pages, ends);
    const numbered = byNumbers(pages);
    if (numbered.length >= 2) return numbered;
    return byPages(pages);
  }

  function regionsBetween(pages, from, to) {
    // from = {p, y} just above where the question starts; to = {p, y} at the bottom of the question.
    const regs = [];
    for (let p = from.p; p <= to.p; p++) {
      const pg = pages[p];
      if (p !== from.p && p !== to.p && isBlank(pg)) continue;
      const t = p === from.p ? from.y : top(pg), b = p === to.p ? to.y : bottom(pg);
      if (t - b > 12) regs.push({ p: p, top: t, bottom: b });
    }
    return regs;
  }

  function firstQuestionStart(pages, untilPage) {
    for (let p = 1; p <= untilPage; p++) {
      const pg = pages[p];
      if (isBlank(pg)) continue;
      const l = pg.lines.find((ln) => /^1\b/.test(ln.text) && ln.x < pg.w * 0.2);
      if (l) return { p: p, y: l.y + l.h + 4 };
    }
    const p = Math.min(1, untilPage);
    return { p: p, y: top(pages[p]) };
  }

  function byEndMarkers(pages, ends) {
    ends.sort((a, b) => a.p - b.p || b.y - a.y);
    const qs = [];
    let from = firstQuestionStart(pages, ends[0].p);
    ends.forEach(function (e, i) {
      const to = { p: e.p, y: e.y - 6 };
      qs.push({ n: String(e.q), marks: e.marks, regions: regionsBetween(pages, from, to) });
      // The next question starts right under this marker, or at the top of the next page if the marker is low down.
      const pg = pages[e.p];
      from = e.y - 9 < pg.h * 0.12 && e.p + 1 < pages.length ? { p: e.p + 1, y: top(pages[e.p + 1]) } : { p: e.p, y: e.y - 9 };
      if (i + 1 < ends.length && ends[i + 1].p > from.p) {
        // skip blank pages between questions
        while (from.p < ends[i + 1].p && isBlank(pages[from.p])) from = { p: from.p + 1, y: top(pages[from.p + 1]) };
      }
    });
    return qs.filter((q) => q.regions.length);
  }

  function marksIn(pages, regs) {
    let sum = 0;
    regs.forEach((r) => pages[r.p].lines.forEach(function (l) {
      if (l.y > r.top || l.y < r.bottom) return;
      l.items.forEach((it) => { const m = /^\((\d{1,2})\)$/.exec(it.s.trim()); if (m && it.x > pages[r.p].w * 0.7) sum += Number(m[1]); });
    }));
    return sum || null;
  }

  function byNumbers(pages) {
    const starts = [];
    let want = 1;
    pages.forEach((pg, p) => {
      if (p === 0) return;
      pg.lines.forEach(function (l) {
        const m = /^(\d{1,2})\b/.exec(l.text);
        if (m && Number(m[1]) === want && l.x < pg.w * 0.15) { starts.push({ n: want, p: p, y: l.y + l.h + 4 }); want++; }
      });
    });
    const lastPage = pages.length - 1;
    return starts.map(function (s, i) {
      const nx = starts[i + 1];
      const to = nx ? { p: nx.p, y: nx.y + 2 } : { p: lastPage, y: bottom(pages[lastPage]) };
      if (nx && nx.y + 2 > top(pages[nx.p]) - 4 && nx.p > s.p) { to.p = nx.p - 1; to.y = bottom(pages[nx.p - 1]); }
      const regions = regionsBetween(pages, s, to);
      return { n: String(s.n), marks: marksIn(pages, regions), regions: regions };
    }).filter((q) => q.regions.length);
  }

  function byPages(pages) {
    return pages.map((pg, p) => ({ n: String(p + 1), marks: null, regions: [{ p: p, top: top(pg), bottom: bottom(pg) }] }))
      .filter((q, i) => i > 0 || pages.length === 1).filter((q) => !isBlank(pages[q.regions[0].p]));
  }

  // Economics Papers 1 and 2 end with an "answer ONE question" section (Q7 or Q8): when the questions add up to more
  // than the paper total, a run of equal-mark questions at the end that explains the difference is treated as a choice.
  function markChoices(qs, total) {
    const sum = qs.reduce((a, q) => a + (q.marks || 0), 0);
    if (!total || sum <= total || !qs.length) return;
    const last = qs[qs.length - 1].marks;
    let k = 0;
    for (let i = qs.length - 1; i >= 0 && qs[i].marks === last; i--) k++;
    if (k > 1 && (k - 1) * last === sum - total) qs.slice(-k).forEach((q) => { q.choice = 'c1'; });
  }

  // Marks available and scored for a set of questions. From a choice group only the best answer counts.
  function totals(p, idx, scores) {
    let max = 0, score = 0;
    const groups = {};
    idx.forEach(function (i) {
      const q = p.questions[i], m = q.marks || 0;
      const got = scores ? U.clamp(Number(scores[i]) || 0, 0, m || 999) : 0;
      if (q.choice) { const g = groups[q.choice] || (groups[q.choice] = { max: 0, score: 0 }); g.max = Math.max(g.max, m); g.score = Math.max(g.score, got); }
      else { max += m; score += got; }
    });
    Object.keys(groups).forEach((k) => { max += groups[k].max; score += groups[k].score; });
    return { max: max, score: score };
  }
  P.totals = totals;
  const choiceNote = (p, q) => q.choice ? 'Answer one of ' + p.questions.filter((x) => x.choice === q.choice).map((x) => 'Q' + x.n).join(' or ') + ', not both.' : '';

  // Find the mark scheme page for each question number.
  function msPages(pages, qs) {
    const out = {};
    let from = 1;
    qs.forEach(function (q) {
      const re = new RegExp('^' + q.n + '\\s*(\\(|[a-z]\\b|$|\\s)');
      for (let p = from; p < pages.length; p++) {
        if (pages[p].lines.some((l) => re.test(l.text) && l.x < pages[p].w * 0.25)) { out[q.n] = p; from = p; return; }
      }
    });
    return out;
  }

  // ---------- Upload ----------
  P.analyse = async function (qpFile, msFile) {
    const id = 'x' + U.uid();
    const qpBuf = await qpFile.arrayBuffer();
    const qp = await readPdf(qpBuf.slice(0));
    const info = meta(qp.pages);
    const qs = detect(qp.pages);
    markChoices(qs, info.marks);
    let ms = null, msMap = {};
    if (msFile) {
      const msBuf = await msFile.arrayBuffer();
      ms = await readPdf(msBuf.slice(0));
      msMap = msPages(ms.pages, qs);
      await RH.files.put(id + ':ms', new Blob([msBuf], { type: 'application/pdf' }));
    }
    await RH.files.put(id + ':qp', new Blob([qpBuf], { type: 'application/pdf' }));
    docs[id] = { qp: qp.doc, ms: ms && ms.doc };
    const subject = info.subject || '';
    const paperDef = subject && info.code ? (M.subject[subject].papers.find((p) => p.code === info.code)) : null;
    const total = info.marks || qs.reduce((a, q) => a + (q.marks || 0), 0) || null;
    const title = (subject ? M.subject[subject].name + ' ' : '') + (paperDef ? paperDef.name.split(':')[0] : (info.code || qpFile.name.replace(/\.pdf$/i, ''))) + (info.series ? ' · ' + info.series : '');
    const paper = {
      id: id, title: title, file: qpFile.name, msFile: msFile ? msFile.name : '', subject: subject, code: info.code || '', series: info.series || '',
      dur: info.dur || (paperDef && paperDef.dur) || 90, marks: total, pages: qp.pages.length, msPagesCount: ms ? ms.pages.length : 0,
      questions: qs.map((q) => ({ n: q.n, marks: q.marks, r: q.regions.map((g) => [g.p, Math.round(g.top), Math.round(g.bottom)]), ms: msMap[q.n] != null ? msMap[q.n] : null, topic: '', choice: q.choice || '' })),
      method: qs.length && qs[0].marks != null && qs.every((q) => q.marks != null) ? 'markers' : 'pages', added: U.today()
    };
    store.update(function (s) { s.portal.papers[id] = paper; });
    return paper;
  };

  async function getDoc(paper, kind) {
    const cache = docs[paper.id] || (docs[paper.id] = {});
    if (cache[kind]) return cache[kind];
    const blob = await RH.files.get(paper.id + ':' + kind);
    if (!blob) return null;
    const lib = await pdfjs();
    cache[kind] = await lib.getDocument({ data: await blob.arrayBuffer() }).promise;
    return cache[kind];
  }

  async function pageCanvas(paper, kind, doc, p, cssW) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const key = paper.id + '|' + kind + '|' + p + '|' + Math.round(cssW * dpr);
    if (pageCache[key]) return pageCache[key];
    const page = await doc.getPage(p + 1);
    const base = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: cssW * dpr / base.width });
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    pageCache[key] = { canvas: canvas, vp: vp, dpr: dpr };
    return pageCache[key];
  }

  // Draw one question (all its page slices) into a container.
  async function drawQuestion(box, paper, qi) {
    const q = paper.questions[qi];
    const doc = await getDoc(paper, 'qp');
    if (!doc) { box.innerHTML = '<div class="empty"><p><b>The PDF for this paper is not on this device.</b> Upload it again on the paper page to see the questions here.</p><a class="btn btn-sm" href="#paper-' + paper.id + '">Open paper</a></div>'; return; }
    const cssW = Math.min(box.clientWidth || 760, 900);
    const frag = document.createDocumentFragment();
    for (const r of q.r) {
      const pc = await pageCanvas(paper, 'qp', doc, r[0], cssW);
      const yA = pc.vp.convertToViewportPoint(0, r[1])[1], yB = pc.vp.convertToViewportPoint(0, r[2])[1];
      const pad = Math.abs(pc.vp.convertToViewportPoint(0, 0)[1] - pc.vp.convertToViewportPoint(0, 3)[1]); // 3pt, whatever the zoom
      const y0 = Math.max(0, Math.floor(Math.min(yA, yB) - pad)), y1 = Math.min(pc.canvas.height, Math.ceil(Math.max(yA, yB) + pad));
      const out = document.createElement('canvas');
      out.width = pc.canvas.width; out.height = Math.max(1, y1 - y0);
      out.getContext('2d').drawImage(pc.canvas, 0, y0, pc.canvas.width, y1 - y0, 0, 0, pc.canvas.width, y1 - y0);
      out.style.width = cssW + 'px'; out.style.maxWidth = '100%';
      out.className = 'qslice';
      out.setAttribute('role', 'img');
      out.setAttribute('aria-label', 'Question ' + q.n + ', page ' + (r[0] + 1));
      frag.appendChild(out);
    }
    box.innerHTML = '';
    box.appendChild(frag);
  }

  async function drawPage(box, paper, kind, p) {
    const doc = await getDoc(paper, kind);
    if (!doc) { box.innerHTML = '<p class="muted small">No ' + (kind === 'ms' ? 'mark scheme' : 'question paper') + ' PDF on this device.</p>'; return; }
    p = U.clamp(p, 0, doc.numPages - 1);
    const pc = await pageCanvas(paper, kind, doc, p, Math.min(box.clientWidth || 700, 900));
    const img = document.createElement('canvas');
    img.width = pc.canvas.width; img.height = pc.canvas.height;
    img.getContext('2d').drawImage(pc.canvas, 0, 0);
    img.style.width = '100%';
    img.className = 'qslice';
    box.innerHTML = '';
    box.appendChild(img);
  }

  // Fill any question or page placeholders after a page renders.
  RH.afterRender.push(function () {
    document.querySelectorAll('[data-qdraw]').forEach(function (box) {
      const paper = st().portal.papers[box.dataset.paper];
      if (!paper) return;
      box.innerHTML = '<p class="muted small">Loading question…</p>';
      drawQuestion(box, paper, Number(box.dataset.qdraw)).catch((e) => { box.innerHTML = '<p class="danger small">' + esc(e.message) + '</p>'; });
    });
    document.querySelectorAll('[data-pagedraw]').forEach(function (box) {
      const paper = st().portal.papers[box.dataset.paper];
      if (!paper) return;
      box.innerHTML = '<p class="muted small">Loading page…</p>';
      drawPage(box, paper, box.dataset.kind, Number(box.dataset.pagedraw)).catch((e) => { box.innerHTML = '<p class="danger small">' + esc(e.message) + '</p>'; });
    });
  });

  // ---------- Pages ----------
  const papers = () => Object.keys(st().portal.papers).map((k) => st().portal.papers[k]).sort((a, b) => (b.added || '').localeCompare(a.added || ''));
  const attemptsFor = (id) => st().portal.attempts.filter((a) => a.paper === id);
  const best = (id) => attemptsFor(id).reduce((m, a) => Math.max(m, a.max ? a.score / a.max : 0), -1);

  function findPapers(sid) {

    });
    return list;
  }

    html += list.length ? '<section class="panel"><h2>Your papers</h2><ul class="paper-list">' + list.map(function (p) {

        '<a class="pi-main" href="#paper-' + p.id + '"><b>' + esc(p.title) + '</b><span class="muted small">' + U.plural(p.questions.length, 'question') + (p.marks ? ' · ' + p.marks + ' marks' : '') + ' · ' + U.mins(p.dur) + (p.msFile ? ' · mark scheme added' : '') + '</span></a>' +
        (b >= 0 ? '<span class="cd mono">Best ' + U.pct(b) + '</span>' : '') +
        '<button type="button" class="btn btn-sm" data-action="exam-start" data-id="' + p.id + '">' + C.icon('timer') + 'Sit paper</button></li>';
    }).join('') + '</ul></section>' : C.empty('No papers yet.', 'Download one from the "Find papers" tab, then add it above.');
    return html;
  };

    const mpm = p.marks ? p.dur / p.marks : null;

    html += C.head((p.subject ? C.stag(p.subject) + ' ' : '') + esc(p.code || 'Uploaded paper'), esc(p.title), U.plural(p.questions.length, 'question') + (p.marks ? ' · ' + p.marks + ' marks' : '') + ' · ' + U.mins(p.dur) + (mpm ? ' · about ' + (Math.round(mpm * 10) / 10) + ' min per mark' : ''),
      '<button type="button" class="btn btn-lg" data-action="exam-start" data-id="' + p.id + '">' + C.icon('timer') + 'Sit full paper</button>');
    const qsum = totals(p, p.questions.map((q, i) => i)).max;

    if (p.method !== 'markers') html += '<div class="banner"><p><b>Check the questions.</b> The paper didn\'t have "Total for Question" lines, so it was split ' + (p.questions.length && p.questions[0].marks == null ? 'by page' : 'by question numbers') + '. Fix the marks below if they look wrong.</p></div>';
    html += '<section class="panel"><h2>Paper details</h2><div class="three">' +

      '<div class="field"><label for="pp-subj">Subject</label><select id="pp-subj" data-paper="' + id + '" data-pf="subject"><option value="">Other</option>' + M.subjects.map((s) => '<option value="' + s.id + '"' + (p.subject === s.id ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('') + '</select></div>' +
      '<div class="two"><div class="field"><label for="pp-dur">Minutes</label><input id="pp-dur" type="number" min="5" max="300" data-paper="' + id + '" data-pf="dur" value="' + p.dur + '"></div><div class="field"><label for="pp-marks">Marks</label><input id="pp-marks" type="number" min="1" max="400" data-paper="' + id + '" data-pf="marks" value="' + (p.marks || '') + '"></div></div></div>' +

      p.questions.map((q, i) => '<tr><td><button type="button" class="btn-link" data-action="q-preview" data-id="' + id + '" data-i="' + i + '"><b>Q' + esc(q.n) + '</b></button>' + (q.choice ? ' <span class="pill" title="' + esc(choiceNote(p, q)) + '">choice</span>' : '') + '</td>' +

        '<td class="row-actions"><button type="button" class="btn-ghost btn-sm" data-action="exam-start" data-id="' + id + '" data-q="' + i + '">Practise</button>' + (i ? '<button type="button" class="btn-icon" data-action="q-merge" data-id="' + id + '" data-i="' + i + '" title="Merge into previous question" aria-label="Merge into previous question">' + C.icon('x') + '</button>' : '') + '</td></tr>').join('') +
      '</tbody></table></div><p class="help">Linking questions to topics lets the portal add lost marks to that topic\'s mistakes log when you mark the paper.</p></section>';
    if (attempts.length) html += '<section class="panel"><h2>Your attempts</h2>' + attemptTable(attempts) + '</section>';

  };

  }

  // ---------- Exam mode ----------
  const live = () => st().portal.live;
  function elapsedOn(L, i) { return (L.timeOn[i] || 0) + (L.current === i && !L.paused ? (Date.now() - L.since) / 1000 : 0); }
  function leftSec(L) { return L.paused ? L.pausedLeft : Math.max(0, (L.endsAt - Date.now()) / 1000); }

  P.start = function (paperId, single, opts) {
    const p = st().portal.papers[paperId];
    const qIdx = single != null ? [Number(single)] : p.questions.map((q, i) => i);
    const marks = totals(p, qIdx).max;
    const mpm = p.marks ? p.dur / p.marks : 1.2;
    const extra = (opts && opts.extra) || 0;
    const dur = Math.round((single != null ? Math.max(3, Math.round((p.questions[single].marks || 5) * mpm)) : p.dur) * 60 * (1 + extra / 100));
    store.update(function (s) {
      s.portal.live = { paper: paperId, single: single != null ? p.questions[single].n : null, qs: qIdx, current: qIdx[0], since: Date.now(), endsAt: Date.now() + dur * 1000, dur: dur, paused: false, pausedLeft: 0,
        strict: !!(opts && opts.strict), timeOn: {}, flags: {}, visited: {}, done: {}, notes: {}, marks: marks, warned: {}, started: Date.now() };
      s.portal.live.visited[qIdx[0]] = 1;
    }, { silent: true });
    location.hash = 'exam';

  // Live clock for the exam.

    const left = leftSec(L);
    const el = $('#ex-left');
    if (el) {
      el.textContent = RH.timer.fmt(left);
      el.classList.toggle('low', left < 300);
      const used = L.dur - left;
      const meter = $('#ex-meter'); if (meter) meter.style.width = Math.min(100, 100 * used / L.dur) + '%';
      const qt = $('#ex-qtime'); if (qt) qt.textContent = RH.timer.fmt(elapsedOn(L, L.current));
      const p = st().portal.papers[L.paper];
      const pace = $('#ex-pace');
      if (pace && p && L.marks) {
        const doneMarks = L.qs.filter((i) => L.done[i]).reduce((a, i) => a + (p.questions[i].marks || 0), 0);
        const expected = L.dur * doneMarks / L.marks;
        const diff = Math.round((expected - used) / 60);
        pace.textContent = doneMarks ? (diff >= 0 ? (diff ? diff + ' min ahead' : 'On pace') : (-diff) + ' min behind') : 'Mark questions done to see your pace';
        pace.className = 'small ' + (doneMarks && diff < -2 ? 'pace-bad' : doneMarks ? 'pace-good' : 'muted');
      }
    }
    if (!L.paused) {
      [30, 10, 5].forEach(function (m) {
        if (left <= m * 60 && L.dur > m * 60 && !L.warned[m]) { L.warned[m] = 1; C.chime('warn'); C.toast(m + ' minutes left'); }
      });
      if (left <= 0 && !L.over) { L.over = true; C.chime('end'); C.toast('Time is up. Pens down.'); finish(); }

  // Results tab: portal attempts plus papers logged by hand.
  function spark(points) {
    if (points.length < 2) return '';
    const w = 160, h = 40, pad = 4;
    const xs = (i) => pad + i * (w - 2 * pad) / (points.length - 1);
    const ys = (v) => h - pad - v * (h - 2 * pad);
    const d = points.map((v, i) => (i ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(v).toFixed(1)).join(' ');
    const last = points.length - 1;
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Score trend"><path class="sp-grid" d="M' + pad + ' ' + ys(0.5) + 'H' + (w - pad) + '"/><path class="sp-line" d="' + d + '"/><circle class="sp-end" cx="' + xs(last) + '" cy="' + ys(points[last]) + '" r="3"/></svg>';
  }
