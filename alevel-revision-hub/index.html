<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- page:start -->
<title>A-Level Revision Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Topic-by-topic revision for Edexcel A-level Physics, Maths, Further Maths and Economics, with resources and an exam-aware study planner.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="src/styles.css">
<!-- head:end -->
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Main">
    <a class="brand" href="#today"><span class="brand-mark" aria-hidden="true">A*</span><span class="brand-text">Revision Hub<span>Edexcel · Summer 2027</span></span></a>
    <nav class="nav" id="nav"></nav>
    <p class="side-foot">Progress saves automatically.</p>
  </aside>
  <div class="main">
    <header class="top">
      <a class="brand-mark top-brand" href="#today" aria-label="Revision Hub home">A*</a>
      <div class="search" role="search">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        <input id="q" type="search" placeholder="Search topics, e.g. capacitors, PED, binomial" aria-label="Search topics" autocomplete="off" aria-controls="qres">
        <kbd>/</kbd>
        <div class="search-results" id="qres" role="listbox" hidden></div>
      </div>
      <button type="button" class="timer-btn" id="timerBtn" data-action="timer-open"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.5 1.5M9.5 2.5h5"/></svg><span id="timerLabel">Focus timer</span></button>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
</div>
<div id="modal-root" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="src/data/sites.js"></script>
<script src="src/data/physics.js"></script>
<script src="src/data/maths.js"></script>
<script src="src/data/further-maths.js"></script>
<script src="src/data/economics.js"></script>
<script src="src/data/exams.js"></script>
<script src="src/data/guide.js"></script>
<script src="src/app/util.js"></script>
<script src="src/app/model.js"></script>
<script src="src/app/planner.js"></script>
<script src="src/app/store.js"></script>
<script src="src/app/views.js"></script>
<script src="src/app/main.js"></script>
<!-- page:end -->
</body>
</html>
