<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- page:start -->
<title>A-Level Revision Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Edexcel A-level Physics, Maths, Further Maths and Economics revision: a timed weekly plan around your routine, weekly deliverables, an AI answer checker, past-paper exams, flashcards and a webcam focus tracker.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Lexend:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="src/styles.css">
<!-- head:end -->
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-in">
      <a class="brand" href="#home" aria-label="Revision Hub home"><span class="brand-mark" aria-hidden="true">A*</span><span class="brand-name">Revision Hub</span></a>
      <nav class="top-nav" id="nav" aria-label="Main"></nav>
      <div class="search" role="search">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        <input id="q" type="search" placeholder="Search lessons" aria-label="Search lessons, e.g. capacitors, PED, binomial" autocomplete="off" aria-controls="qres">
        <kbd>/</kbd>
        <div class="search-results" id="qres" role="listbox" hidden></div>
      </div>
      <a class="timer-pill" id="timerBtn" href="#focus"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.5 1.5M9.5 2.5h5"/></svg><span id="timerLabel">Focus</span></a>
      <a class="icon-btn top-gear" href="#preferences" aria-label="Settings"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg></a>
    </div>
    <nav class="subbar" id="subbar" aria-label="Pages in this area"></nav>
  </header>
  <main id="view" class="view" tabindex="-1"></main>
  <footer class="foot" id="foot"></footer>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
</div>
<div class="cam-dock" id="camDock" hidden><video id="camVideo" muted playsinline aria-label="Your webcam, used by the focus tracker"></video><span class="cam-status"><i></i><span id="camLabel">Off</span></span></div>
<div id="modal-root" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="src/data/sites.js"></script>
<script src="src/data/physics.js"></script>
<script src="src/data/maths.js"></script>
<script src="src/data/further-maths.js"></script>
<script src="src/data/economics.js"></script>
<script src="src/data/exams.js"></script>
<script src="src/data/guide.js"></script>
<script src="src/data/videos.js"></script>
<script src="src/data/decks.js"></script>
<script src="src/app/util.js"></script>
<script src="src/app/model.js"></script>
<script src="src/app/routine.js"></script>
<script src="src/app/planner.js"></script>
<script src="src/app/store.js"></script>
<script src="src/app/ai.js"></script>
<script src="src/app/ui.js"></script>
<script src="src/app/deliverables.js"></script>
<script src="src/app/views.js"></script>
<script src="src/app/home.js"></script>
<script src="src/app/study.js"></script>
<script src="src/app/plan.js"></script>
<script src="src/app/focus.js"></script>
<script src="src/app/cards.js"></script>
<script src="src/app/portal.js"></script>
<script src="src/app/checker.js"></script>
<script src="src/app/settings.js"></script>
<script src="src/app/main.js"></script>
<!-- page:end -->
</body>
</html>
